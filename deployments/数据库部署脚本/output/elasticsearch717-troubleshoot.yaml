---
schema_version: v1
meta:
  name: Elasticsearch 7.x三节点排障（五路采集-清洗Markdown-AI）
  id: elasticsearch717-troubleshoot
  description: >
    5分钟排障 Bot：预检 + 并行采集指标/运行状态/配置/日志/主机网络，
    清洗交叉对比后写出 summary.md。AI 为最后节点，异常则该节点失败。
    采集 ignore_error；AI 不 ignore_error。只诊断不变更、不注入。
    无共享盘时请作业平台拼接 ###ES_TS_ARTIFACT，或用 scripts/run_flow.sh 汇聚到清洗节点。
    超时禁止复用 Kafka 600–900s：预检30s 采集120s 清洗60s AI60s。
spec:
  nodes:
  - id: es-ts_start
    type: EmptyStartEvent
    next:
    - es-ts_precheck
  - id: es-ts_precheck
    type: ServiceActivity
    name: 快速执行脚本
    stage_name: 采集预检
    component:
      code: job_fast_execute_script
      version: v1.2
      data:
        biz_cc_id:
          name: 业务
          value: ''
          key: "${biz_cc_id}"
          version: v1.2
          source_tag: job_fast_execute_script.biz_cc_id
        job_account:
          value: root
        job_content:
          value: |
            #!/usr/bin/env bash
            mkdir -p /tmp/es-ts-lib
            cat > /tmp/es-ts-lib/es_lib.py <<'ES_TS_LIB_PY'
            #!/usr/bin/env python3
            """Parse ES 7.x collector JSON and run cleanse cross-compare.
            
            Used by bash collectors and cleanse_artifacts.sh. No HTTP. Diagnose only.
            """
            from __future__ import annotations
            
            import json
            import os
            import sys
            from collections import Counter
            from pathlib import Path
            from typing import Any
            
            
            def _load(text: str) -> Any:
                text = (text or "").strip()
                if not text:
                    return None
                try:
                    return json.loads(text)
                except json.JSONDecodeError:
                    return None
            
            
            def parse_cat_master(text: str) -> dict[str, Any]:
                data = _load(text)
                out = {
                    "http_ok": False,
                    "auth_fail": False,
                    "local_master": "",
                    "local_master_ip": "",
                    "local_master_id": "",
                    "is_elected": False,
                }
                if data is None:
                    return out
                out["http_ok"] = True
                row = None
                if isinstance(data, list) and data:
                    row = data[0] if isinstance(data[0], dict) else None
                elif isinstance(data, dict):
                    row = data
                if not row:
                    return out
                out["local_master"] = str(row.get("node") or row.get("name") or "")
                out["local_master_ip"] = str(row.get("ip") or row.get("host") or "")
                out["local_master_id"] = str(row.get("id") or "")
                return out
            
            
            def parse_cat_nodes(text: str, local_ip: str = "") -> dict[str, Any]:
                data = _load(text)
                out = {"nodes": [], "elected": "", "elected_ip": "", "self_elected": False}
                if not isinstance(data, list):
                    return out
                for row in data:
                    if not isinstance(row, dict):
                        continue
                    name = str(row.get("name") or row.get("node") or "")
                    ip = str(row.get("ip") or "")
                    master = str(row.get("master") or "")
                    roles = str(row.get("node.role") or row.get("nodeRole") or "")
                    out["nodes"].append({"name": name, "ip": ip, "master": master, "roles": roles})
                    if master == "*":
                        out["elected"] = name
                        out["elected_ip"] = ip
                        if local_ip and (ip == local_ip):
                            out["self_elected"] = True
                return out
            
            
            def parse_local_stats(text: str) -> dict[str, Any]:
                data = _load(text)
                out = {
                    "heap_pct": None,
                    "write_rejected": None,
                    "search_rejected": None,
                    "write_pool": "",
                    "breaker_parent_pct": None,
                    "breaker_tripped": 0,
                    "disk_total": None,
                    "disk_free": None,
                    "disk_used_pct": None,
                    "index_total": None,
                    "index_time_ms": None,
                    "query_total": None,
                    "query_time_ms": None,
                    "cpu_percent": None,
                    "gc_young_ms": None,
                    "gc_old_ms": None,
                    "node_name": "",
                }
                if not isinstance(data, dict):
                    return out
                nodes = data.get("nodes") or {}
                if not isinstance(nodes, dict) or not nodes:
                    return out
                n = next(iter(nodes.values()))
                if not isinstance(n, dict):
                    return out
                out["node_name"] = str(n.get("name") or "")
                jvm = n.get("jvm") or {}
                mem = jvm.get("mem") or {}
                if "heap_used_percent" in mem:
                    out["heap_pct"] = int(mem["heap_used_percent"])
                collectors = (jvm.get("gc") or {}).get("collectors") or {}
                young = collectors.get("young") or collectors.get("ParNew") or {}
                old = collectors.get("old") or collectors.get("ConcurrentMarkSweep") or collectors.get("G1 Old Generation") or {}
                if "collection_time_in_millis" in young:
                    out["gc_young_ms"] = int(young["collection_time_in_millis"])
                if "collection_time_in_millis" in old:
                    out["gc_old_ms"] = int(old["collection_time_in_millis"])
                tp = n.get("thread_pool") or {}
                write = tp.get("write") if isinstance(tp.get("write"), dict) else None
                if write is None and isinstance(tp.get("index"), dict):
                    write = tp["index"]
                    out["write_pool"] = "index_legacy"
                else:
                    out["write_pool"] = "write"
                if write:
                    out["write_rejected"] = int(write.get("rejected") or 0)
                search = tp.get("search") if isinstance(tp.get("search"), dict) else {}
                if search:
                    out["search_rejected"] = int(search.get("rejected") or 0)
                breakers = n.get("breakers") or {}
                parent = breakers.get("parent") or {}
                if parent.get("limit_size_in_bytes") and parent.get("estimated_size_in_bytes") is not None:
                    lim = int(parent["limit_size_in_bytes"]) or 1
                    out["breaker_parent_pct"] = int(int(parent["estimated_size_in_bytes"]) * 100 / lim)
                tripped = 0
                for b in breakers.values():
                    if isinstance(b, dict):
                        tripped += int(b.get("tripped") or 0)
                out["breaker_tripped"] = tripped
                fs = (n.get("fs") or {}).get("total") or {}
                if fs.get("total_in_bytes"):
                    total = int(fs["total_in_bytes"])
                    free = int(fs.get("available_in_bytes") or fs.get("free_in_bytes") or 0)
                    out["disk_total"] = total
                    out["disk_free"] = free
                    out["disk_used_pct"] = int((total - free) * 100 / total) if total else None
                idx = (n.get("indices") or {}).get("indexing") or {}
                if "index_total" in idx:
                    out["index_total"] = int(idx["index_total"])
                    out["index_time_ms"] = int(idx.get("index_time_in_millis") or 0)
                search_m = (n.get("indices") or {}).get("search") or {}
                if "query_total" in search_m:
                    out["query_total"] = int(search_m["query_total"])
                    out["query_time_ms"] = int(search_m.get("query_time_in_millis") or 0)
                cpu = (n.get("os") or {}).get("cpu") or {}
                if "percent" in cpu:
                    out["cpu_percent"] = int(cpu["percent"])
                return out
            
            
            def parse_cluster_health(text: str) -> dict[str, Any]:
                data = _load(text)
                if not isinstance(data, dict):
                    return {}
                keys = (
                    "status",
                    "number_of_nodes",
                    "number_of_data_nodes",
                    "active_primary_shards",
                    "active_shards",
                    "relocating_shards",
                    "initializing_shards",
                    "unassigned_shards",
                    "delayed_unassigned_shards",
                    "number_of_pending_tasks",
                    "task_max_waiting_in_queue_millis",
                    "active_shards_percent_as_number",
                    "timed_out",
                )
                out: dict[str, Any] = {}
                for k in keys:
                    if k in data:
                        out[k] = data[k]
                return out
            
            
            def merge_facts(path: str, updates: dict[str, Any]) -> dict[str, Any]:
                p = Path(path)
                cur: dict[str, Any] = {}
                if p.is_file():
                    try:
                        cur = json.loads(p.read_text(encoding="utf-8"))
                    except (OSError, json.JSONDecodeError):
                        cur = {}
                cur.update({k: v for k, v in updates.items() if v is not None})
                p.parent.mkdir(parents=True, exist_ok=True)
                p.write_text(json.dumps(cur, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
                return cur
            
            
            def _read_json(path: Path) -> dict[str, Any] | None:
                if not path.is_file():
                    return None
                try:
                    data = json.loads(path.read_text(encoding="utf-8"))
                except (OSError, json.JSONDecodeError):
                    return None
                return data if isinstance(data, dict) else None
            
            
            def _read_signals(base: Path) -> list[tuple[str, str, str]]:
                rows: list[tuple[str, str, str]] = []
                for p in sorted(base.glob("*.signals")):
                    try:
                        text = p.read_text(encoding="utf-8", errors="replace")
                    except OSError:
                        continue
                    for line in text.splitlines():
                        parts = line.split("\t", 2)
                        if len(parts) >= 3 and parts[0].startswith("ES"):
                            rows.append((parts[0], parts[1], parts[2]))
                return rows
            
            
            def _sev_rank(sev: str) -> int:
                return {"high": 3, "medium": 2, "low": 1, "warning": 2}.get(sev, 0)
            
            
            def _dedup(rows: list[tuple[str, str, str]]) -> list[tuple[str, str, str]]:
                best: dict[str, tuple[str, str, str]] = {}
                order: list[str] = []
                for sid, sev, note in rows:
                    if sid not in best:
                        order.append(sid)
                        best[sid] = (sid, sev, note)
                        continue
                    old = best[sid]
                    if _sev_rank(sev) > _sev_rank(old[1]):
                        best[sid] = (sid, sev, f"{old[2]} | {note}")
                    elif note not in old[2]:
                        best[sid] = (sid, old[1], f"{old[2]} | {note}")
                return [best[k] for k in order]
            
            
            def _add(signals: list[tuple[str, str, str]], sid: str, sev: str, note: str) -> None:
                signals.append((sid, sev, note))
            
            
            def cross_compare(
                facts: dict[str, dict[str, Any]],
                expected_nodes: int,
                expected_ips: list[str],
            ) -> tuple[list[tuple[str, str, str]], dict[str, Any]]:
                extra: list[tuple[str, str, str]] = []
                collected_ips = [ip for ip in expected_ips if ip in facts]
                n_col = len(collected_ips)
                meta: dict[str, Any] = {
                    "nodes_collected": n_col,
                    "expected_nodes": expected_nodes,
                    "majority_master": "",
                    "coverage": "ok",
                    "no_master": False,
                    "evidence_gap": [],
                }
                if n_col < expected_nodes:
                    meta["coverage"] = "degraded"
                    missing = [ip for ip in expected_ips if ip not in facts]
                    meta["evidence_gap"].append("missing_nodes=" + ",".join(missing))
                    _add(extra, "ES172", "high", "nodes missing: " + ",".join(missing))
                    if n_col == 0:
                        meta["coverage"] = "empty"
            
                masters = []
                auth_na = 0
                for ip in collected_ips:
                    f = facts[ip]
                    if f.get("auth_fail"):
                        auth_na += 1
                        continue
                    masters.append((ip, str(f.get("local_master") or "")))
            
                nonempty = [m for _, m in masters if m]
                empty = [ip for ip, m in masters if not m]
                maj = ""
                if nonempty:
                    maj, cnt = Counter(nonempty).most_common(1)[0]
                    if cnt >= 2 or (expected_nodes == 1 and cnt == 1):
                        maj_ok = maj
                    else:
                        maj_ok = maj if cnt == len(nonempty) else ""
                    maj = maj_ok
                meta["majority_master"] = maj
            
                all_collected = n_col == expected_nodes and expected_nodes >= 1
                all_empty = all_collected and not nonempty and auth_na == 0
                if all_empty:
                    _add(extra, "ES050", "high", "all %s nodes have empty local_master" % n_col)
                    _add(extra, "ES191", "high", "NO_MASTER")
                    meta["no_master"] = True
                    meta["majority_master"] = ""
                elif n_col < expected_nodes and nonempty == [] and empty:
                    meta["evidence_gap"].append("NO_MASTER_OBSERVED")
                    _add(extra, "ES173", "medium", "observed nodes have no master but collection incomplete")
                elif maj and empty:
                    _add(extra, "ES051", "high", "majority master=%s disagree/empty on %s" % (maj, ",".join(empty)))
                    _add(extra, "ES199", "high", "master view split")
                elif nonempty and len(set(nonempty)) > 1:
                    _add(extra, "ES051", "high", "local_master values disagree: " + ",".join(sorted(set(nonempty))))
                    _add(extra, "ES199", "high", "master view split")
            
                health = {}
                for ip in collected_ips:
                    h = facts[ip].get("cluster_health")
                    if isinstance(h, dict) and h.get("status"):
                        health = h
                        if maj and (facts[ip].get("is_elected") or facts[ip].get("local_master") == maj):
                            break
            
                nodes_in_health = int(health.get("number_of_nodes") or 0) if health else 0
                status = str(health.get("status") or "")
                unassigned = int(health.get("unassigned_shards") or 0) if health else 0
                delayed = int(health.get("delayed_unassigned_shards") or 0) if health else 0
                pending = int(health.get("number_of_pending_tasks") or 0) if health else 0
                reloc = int(health.get("relocating_shards") or 0) if health else 0
                init = int(health.get("initializing_shards") or 0) if health else 0
            
                if delayed > 0:
                    _add(extra, "ES055", "low", "delayed_unassigned=%s" % delayed)
                if pending >= 10:
                    _add(extra, "ES056", "high", "pending_tasks=%s" % pending)
                elif pending >= 1:
                    _add(extra, "ES056", "medium", "pending_tasks=%s" % pending)
                if reloc or init:
                    _add(extra, "ES057", "medium", "relocating=%s initializing=%s" % (reloc, init))
            
                down_ips = []
                for ip in expected_ips:
                    f = facts.get(ip) or {}
                    proc = f.get("process_up")
                    http = f.get("http_ok")
                    listen = f.get("listen_http")
                    if proc is False or listen is False or http is False:
                        down_ips.append(ip)
                    elif ip not in facts:
                        down_ips.append(ip)
            
                if not meta["no_master"]:
                    if nodes_in_health and nodes_in_health < expected_nodes:
                        missing_n = expected_nodes - nodes_in_health
                        if missing_n >= 2:
                            _add(extra, "ES053", "high", "health nodes=%s expected=%s" % (nodes_in_health, expected_nodes))
                        else:
                            _add(extra, "ES052", "medium", "health nodes=%s expected=%s" % (nodes_in_health, expected_nodes))
                        _add(extra, "ES190", "high", "NODE_DOWN health_nodes=%s down_ips=%s" % (nodes_in_health, ",".join(down_ips) or "unknown"))
                    elif n_col == expected_nodes and nodes_in_health == expected_nodes and status == "yellow" and unassigned > 0:
                        _add(extra, "ES192", "medium", "YELLOW_ALLOC_NOT_DOWN unassigned=%s" % unassigned)
                    if status == "red" and not meta["no_master"] and unassigned > 0:
                        _add(extra, "ES054", "high", "red with unassigned=%s" % unassigned)
            
                if meta["no_master"] and status == "red":
                    _add(extra, "ES053", "high", "red and NO_MASTER")
            
                if expected_nodes <= 1:
                    extra = [(s, v, n + " node_count=1") if s.startswith("ES19") else (s, v, n) for s, v, n in extra]
                    extra = [x for x in extra if not (x[0] in {"ES194", "ES196", "ES198"} and expected_nodes <= 1)]
            
                heaps = [(ip, facts[ip].get("heap_pct")) for ip in collected_ips if isinstance(facts[ip].get("heap_pct"), int)]
                high_heap = [ip for ip, h in heaps if h is not None and h >= 85]
                if len(high_heap) == 1 and len(heaps) >= 2:
                    _add(extra, "ES193", "high", "HEAP_ONE_OUTLIER %s heap=%s" % (high_heap[0], dict(heaps)[high_heap[0]]))
                    _add(extra, "ES034", "high", "%s heap=%s" % (high_heap[0], dict(heaps)[high_heap[0]]))
                elif len(high_heap) >= 2:
                    _add(extra, "ES194", "high", "HEAP_ALL_SIMILAR " + ",".join("%s=%s" % (ip, dict(heaps)[ip]) for ip in high_heap))
            
                rejects = [(ip, int(facts[ip].get("write_rejected_delta") or 0) + int(facts[ip].get("search_rejected_delta") or 0)) for ip in collected_ips]
                rej_pos = [ip for ip, r in rejects if r > 0]
                if len(rej_pos) == 1 and len(rejects) >= 2:
                    _add(extra, "ES195", "medium", "REJECT_ONE %s delta=%s" % (rej_pos[0], dict(rejects)[rej_pos[0]]))
                elif len(rej_pos) >= 2:
                    _add(extra, "ES196", "high", "REJECT_ALL " + ",".join(rej_pos))
            
                floods = [ip for ip in collected_ips if facts[ip].get("flood") or facts[ip].get("read_only_allow_delete")]
                if len(floods) == 1 and n_col >= 2:
                    _add(extra, "ES197", "high", "FLOOD_ONE %s" % floods[0])
                elif len(floods) >= 2:
                    _add(extra, "ES198", "high", "FLOOD_ALL " + ",".join(floods))
            
                for ip in collected_ips:
                    f = facts[ip]
                    if f.get("http_ok") and f.get("listen_http") and f.get("transport_ok") is False:
                        _add(extra, "ES091", "high", "9200 up 9300 down on %s" % ip)
                        _add(extra, "ES199", "high", "TRANSPORT_PARTITION %s" % ip)
                    peers = f.get("peer_transport") or {}
                    if isinstance(peers, dict):
                        for peer, ok in peers.items():
                            if ok is False and (f.get("peer_http") or {}).get(peer) is True:
                                _add(extra, "ES091", "high", "%s http ok transport fail to %s" % (ip, peer))
                                _add(extra, "ES199", "high", "TRANSPORT_PARTITION %s->%s" % (ip, peer))
            
                names = [str(facts[ip].get("cluster_name") or "") for ip in collected_ips if facts[ip].get("cluster_name")]
                if names and len(set(names)) > 1:
                    _add(extra, "ES060", "high", "cluster.name disagree: " + ",".join(sorted(set(names))))
            
                alloc = [str(facts[ip].get("allocation_enable") or "") for ip in collected_ips if facts[ip].get("allocation_enable")]
                if any(a and a != "all" for a in alloc):
                    _add(extra, "ES058", "high", "allocation.enable=" + ",".join(sorted(set(alloc))))
            
                explains = []
                for ip in collected_ips:
                    ex = facts[ip].get("explain_reasons") or []
                    if isinstance(ex, list):
                        explains.extend(str(x) for x in ex)
                joined = " ".join(explains).upper()
                if "NODE_LEFT" in joined or "NODE_RESTART" in joined:
                    _add(extra, "ES052", "medium", "explain NODE_LEFT")
                if "DECIDERS_NO" in joined and ("DISK" in joined or "WATERMARK" in joined):
                    _add(extra, "ES061", "high", "explain DECIDERS_NO disk")
                if "ALLOCATION_FAILED" in joined:
                    _add(extra, "ES063", "high", "explain ALLOCATION_FAILED")
            
                if expected_nodes <= 1:
                    extra = [x for x in extra if x[0] not in {"ES194", "ES196", "ES198"}]
            
                return extra, meta
            
            
            def render_summary(
                run_id: str,
                expected_ips: list[str],
                facts: dict[str, dict[str, Any]],
                signals: list[tuple[str, str, str]],
                meta: dict[str, Any],
                health: dict[str, Any],
            ) -> str:
                lines = [
                    "# ES 7.x 三节点排查摘要",
                    "",
                    f"- run_id: `{run_id}`",
                    f"- expected_nodes: {meta.get('expected_nodes')}",
                    f"- nodes_collected: {meta.get('nodes_collected')}",
                    f"- coverage: `{meta.get('coverage')}`",
                    f"- majority_master: `{meta.get('majority_master') or ('NO_MASTER' if meta.get('no_master') else 'UNKNOWN')}`",
                    "",
                    "## 集群健康",
                    "",
                ]
                if health:
                    lines += [
                        f"- status: `{health.get('status', '')}`",
                        f"- number_of_nodes: {health.get('number_of_nodes', '')}",
                        f"- unassigned_shards: {health.get('unassigned_shards', '')}",
                        f"- delayed_unassigned_shards: {health.get('delayed_unassigned_shards', '')}",
                        f"- pending_tasks: {health.get('number_of_pending_tasks', '')}",
                        "",
                    ]
                else:
                    lines += ["- （无权威 cluster health）", ""]
                lines += [
                    "## 各节点 master 视图",
                    "",
                    "| IP | local_master | 9200 | 9300 | heap% | write_rejected_delta | disk% |",
                    "|----|--------------|------|------|-------|----------------------|-------|",
                ]
                for ip in expected_ips:
                    f = facts.get(ip) or {}
                    http = "ok" if f.get("http_ok") else ("NA" if not f else "fail")
                    tp = f.get("listen_transport")
                    trans = "ok" if tp else ("fail" if tp is False else "NA")
                    lines.append(
                        "| {ip} | {lm} | {http} | {trans} | {heap} | {wr} | {disk} |".format(
                            ip=ip,
                            lm=f.get("local_master") or ("(empty)" if f else "(missing)"),
                            http=http,
                            trans=trans,
                            heap=f.get("heap_pct") if f.get("heap_pct") is not None else "",
                            wr=f.get("write_rejected_delta") if f.get("write_rejected_delta") is not None else "",
                            disk=f.get("disk_used_pct") if f.get("disk_used_pct") is not None else "",
                        )
                    )
                lines += ["", "## Top 信号", "", "| ID | 级别 | 说明 |", "|----|------|------|"]
                if signals:
                    for sid, sev, note in signals:
                        lines.append(f"| {sid} | {sev} | {note} |")
                else:
                    lines.append("| — | — | 无自动信号 |")
                lines += ["", "## 交叉对比结论", ""]
                ids = {s[0] for s in signals}
                bullets = []
                if "ES191" in ids:
                    bullets.append("- **ES191 NO_MASTER**：三台均无 elected master，先看发现/传输/进程，不要解释 unassigned。")
                if "ES190" in ids:
                    bullets.append("- **ES190 NODE_DOWN**：健康节点数少于期望，优先掉节点而不是业务 QPS。")
                if "ES192" in ids:
                    bullets.append("- **ES192 YELLOW_ALLOC_NOT_DOWN**：三台都在集群内，副本未分配是水位/allocation/max_shards。")
                if "ES193" in ids:
                    bullets.append("- **ES193 HEAP_ONE_OUTLIER**：单节点 JVM，不是全集群容量。")
                if "ES194" in ids:
                    bullets.append("- **ES194 HEAP_ALL_SIMILAR**：多节点堆压力。")
                if "ES195" in ids:
                    bullets.append("- **ES195 REJECT_ONE**：单节点线程池拒绝。")
                if "ES196" in ids:
                    bullets.append("- **ES196 REJECT_ALL**：多节点 reject。")
                if "ES197" in ids:
                    bullets.append("- **ES197 FLOOD_ONE**：单节点磁盘 flood / 只读块。")
                if "ES198" in ids:
                    bullets.append("- **ES198 FLOOD_ALL**：集群块。")
                if "ES199" in ids:
                    bullets.append("- **ES199 TRANSPORT_PARTITION**：9200/9300 分叉或 master 视图分裂。")
                if not bullets:
                    if meta.get("coverage") == "ok" and not ids:
                        bullets.append("- 倾向 **ES001 基线正常**，或故障未落入 P0 信号。")
                    else:
                        bullets.append("- 无组合结论；见证据缺口。")
                lines.extend(bullets)
                lines += ["", "## 证据缺口", ""]
                gaps = list(meta.get("evidence_gap") or [])
                if meta.get("no_master"):
                    gaps.append("unassigned explain 不可靠（NO_MASTER）")
                if not gaps:
                    lines.append("- 无")
                else:
                    for g in gaps:
                        lines.append(f"- {g}")
                lines.append("")
                return "\n".join(lines)
            
            
            def cleanse(base: str, run_id: str, expected_ips: list[str], profile: str = "v1") -> dict[str, Any]:
                root = Path(base)
                root.mkdir(parents=True, exist_ok=True)
                facts: dict[str, dict[str, Any]] = {}
                for ip in expected_ips:
                    data = _read_json(root / f"facts.{ip}.json")
                    if data:
                        facts[ip] = data
                    master = _read_json(root / f"master.{ip}.json")
                    if master:
                        facts.setdefault(ip, {})
                        for k in ("local_master", "local_master_ip", "http_ok", "auth_fail", "is_elected"):
                            if k in master and master[k] is not None:
                                facts[ip].setdefault(k, master[k])
            
                raw = _read_signals(root)
                extra, meta = cross_compare(facts, len(expected_ips), expected_ips)
                if profile.endswith("degraded") and meta["coverage"] == "ok":
                    meta["coverage"] = "degraded"
                    meta["evidence_gap"].append("forced_degraded_profile")
                merged = _dedup(raw + extra)
                health = {}
                for ip in expected_ips:
                    h = (facts.get(ip) or {}).get("cluster_health")
                    if isinstance(h, dict) and h:
                        health = h
                        if facts[ip].get("is_elected"):
                            break
            
                kinds = ("precheck", "metrics", "status", "config", "logs", "hostnet")
                found = sum(1 for k in kinds if any(root.glob(f"{k}.*.txt")))
                if found == 0 and meta["coverage"] == "ok":
                    meta["coverage"] = "empty"
                elif found < 3 and meta["coverage"] == "ok":
                    meta["coverage"] = "degraded"
            
                summary = render_summary(run_id, expected_ips, facts, merged, meta, health)
                (root / "summary.md").write_text(summary, encoding="utf-8")
                sig_txt = "".join(f"{a}\t{b}\t{c}\n" for a, b, c in merged)
                (root / "signals.txt").write_text(sig_txt, encoding="utf-8")
                (root / "signals.uniq.tsv").write_text(sig_txt, encoding="utf-8")
            
                cleaned_parts = [
                    f"===== ES_TS cleaned run_id={run_id} profile={profile} =====",
                    f"nodes={','.join(expected_ips)}",
                    f"coverage={meta['coverage']} majority_master={meta.get('majority_master')}",
                    "",
                    "----- SIGNALS -----",
                    sig_txt or "NO_SIGNALS",
                    "",
                ]
                for p in sorted(root.glob("*.txt")):
                    if p.name in {"cleaned.txt", "signals.txt"}:
                        continue
                    body = p.read_text(encoding="utf-8", errors="replace")
                    lines = body.splitlines()
                    keep = [ln for ln in lines if ln.startswith("SIGNAL ") or ln.startswith("CMD_FAIL") or "KEYWORD" in ln]
                    if not keep:
                        keep = lines[-40:]
                    cleaned_parts.append(f"### {p.name} ###")
                    cleaned_parts.extend(keep[:80])
                    cleaned_parts.append("")
                cleaned = "\n".join(cleaned_parts)
                if len(cleaned.encode()) > 64000:
                    cleaned = cleaned.encode()[:64000].decode("utf-8", errors="ignore")
                (root / "cleaned.txt").write_text(cleaned, encoding="utf-8")
                meta_out = {
                    "run_id": run_id,
                    "profile": profile,
                    "coverage_status": meta["coverage"],
                    "nodes_collected": meta["nodes_collected"],
                    "expected_nodes": meta["expected_nodes"],
                    "majority_master": meta.get("majority_master") or "",
                    "no_master": str(bool(meta.get("no_master"))).lower(),
                    "signal_count": len(merged),
                    "kinds_found": found,
                }
                meta_txt = "".join(f"{k}={v}\n" for k, v in meta_out.items())
                (root / "cleaned.meta").write_text(meta_txt, encoding="utf-8")
                return {"meta": meta_out, "signals": merged, "summary": summary}
            
            
            def _cli(argv: list[str]) -> int:
                if len(argv) < 2:
                    print("usage: es_lib.py parse-master|parse-stats|parse-health|merge-facts|cleanse ...", file=sys.stderr)
                    return 2
                cmd = argv[1]
                if cmd == "parse-master":
                    print(json.dumps(parse_cat_master(sys.stdin.read()), ensure_ascii=False))
                    return 0
                if cmd == "parse-stats":
                    print(json.dumps(parse_local_stats(sys.stdin.read()), ensure_ascii=False))
                    return 0
                if cmd == "parse-health":
                    print(json.dumps(parse_cluster_health(sys.stdin.read()), ensure_ascii=False))
                    return 0
                if cmd == "parse-nodes":
                    local_ip = argv[2] if len(argv) > 2 else ""
                    print(json.dumps(parse_cat_nodes(sys.stdin.read(), local_ip), ensure_ascii=False))
                    return 0
                if cmd == "merge-facts":
                    path = argv[2]
                    updates = json.loads(argv[3] if len(argv) > 3 else sys.stdin.read())
                    print(json.dumps(merge_facts(path, updates), ensure_ascii=False))
                    return 0
                if cmd == "cleanse":
                    base, run_id = argv[2], argv[3]
                    ips = argv[4:]
                    profile = os.environ.get("TS_PROFILE", "v1")
                    result = cleanse(base, run_id, ips, profile)
                    print(json.dumps(result["meta"], ensure_ascii=False))
                    return 0
                print("unknown command", cmd, file=sys.stderr)
                return 2
            
            
            if __name__ == "__main__":
                sys.exit(_cli(sys.argv))
            ES_TS_LIB_PY
            # Shared helpers for ES 7.x troubleshooting collectors. Sourced, not executed.
            # Collectors always exit 0. Do not mutate the cluster.
            
            umask 077
            
            json_escape() {
              local s=${1-}
              s=${s//\\/\\\\}
              s=${s//\"/\\\"}
              s=${s//$'\n'/\\n}
              s=${s//$'\r'/\\r}
              s=${s//$'\t'/\\t}
              printf '%s' "$s"
            }
            
            ts_now() { date -u +"%Y-%m-%dT%H:%M:%SZ"; }
            
            resolve_local_ip() {
              local node1=$1 node2=$2 node3=$3
              local local_ips target_ip=""
              local_ips=$(hostname -I 2>/dev/null || true)
              for ip in "$node1" "$node2" "$node3"; do
                [[ " ${local_ips} " == *" ${ip} "* ]] && target_ip=$ip && break
              done
              if [[ -z "$target_ip" ]]; then
                target_ip=$(hostname -I 2>/dev/null | awk '{print $1}')
              fi
              printf '%s' "${target_ip:-unknown}"
            }
            
            artifact_dir_for() {
              local run_id=$1
              local base=${TS_ARTIFACT_DIR:-/tmp/es-troubleshoot}
              printf '%s/%s' "$base" "$run_id"
            }
            
            es_lib_py() {
              local here=${SCRIPT_DIR:-}
              if [[ -n "$here" && -f "${here}/es_lib.py" ]]; then
                printf '%s' "${here}/es_lib.py"
                return 0
              fi
              if [[ -f /tmp/es-ts-lib/es_lib.py ]]; then
                printf '%s' /tmp/es-ts-lib/es_lib.py
                return 0
              fi
              return 1
            }
            
            begin_artifact() {
              local kind=$1 node=$2 run_id=$3
              ARTIFACT_KIND=$kind
              ARTIFACT_NODE=$node
              ARTIFACT_RUN_ID=$run_id
              ARTIFACT_DIR=$(artifact_dir_for "$run_id")
              mkdir -p "$ARTIFACT_DIR"
              ARTIFACT_FILE="${ARTIFACT_DIR}/${kind}.${node}.txt"
              SIGNAL_FILE="${ARTIFACT_DIR}/${kind}.${node}.signals"
              FACTS_FILE="${ARTIFACT_DIR}/facts.${node}.json"
              MASTER_FILE="${ARTIFACT_DIR}/master.${node}.json"
              : > "$ARTIFACT_FILE"
              : > "$SIGNAL_FILE"
              {
                echo "===== ES_TS artifact=${kind} node=${node} ts=$(ts_now) run_id=${run_id} ====="
                echo "hostname=$(hostname 2>/dev/null || echo unknown)"
              } >> "$ARTIFACT_FILE"
            }
            
            emit() {
              printf '%s\n' "$*" >> "$ARTIFACT_FILE"
            }
            
            emit_cmd() {
              local title=$1
              local rc=0
              shift
              emit "----- ${title} -----"
              "$@" >> "$ARTIFACT_FILE" 2>&1
              rc=$?
              if (( rc != 0 )); then
                emit "CMD_FAIL: ${title} rc=${rc}"
                return 1
              fi
              return 0
            }
            
            emit_cmd_timeout() {
              local seconds=$1 title=$2
              shift 2
              emit "----- ${title} (timeout ${seconds}s) -----"
              if command -v timeout >/dev/null 2>&1; then
                if ! timeout "$seconds" "$@" >> "$ARTIFACT_FILE" 2>&1; then
                  emit "CMD_FAIL_OR_TIMEOUT: ${title}"
                  signal ES174 low "timeout ${title}"
                  return 1
                fi
              else
                if ! "$@" >> "$ARTIFACT_FILE" 2>&1; then
                  emit "CMD_FAIL: ${title}"
                  return 1
                fi
              fi
              return 0
            }
            
            signal() {
              printf '%s\t%s\t%s\n' "$1" "$2" "$3" >> "$SIGNAL_FILE"
              emit "SIGNAL ${1} severity=${2} ${3}"
            }
            
            finish_artifact() {
              emit "===== END ES_TS artifact=${ARTIFACT_KIND} node=${ARTIFACT_NODE} ====="
              echo "###ES_TS_ARTIFACT kind=${ARTIFACT_KIND} node=${ARTIFACT_NODE} file=${ARTIFACT_FILE}###"
              cat "$ARTIFACT_FILE"
              echo "###ES_TS_SIGNALS kind=${ARTIFACT_KIND} node=${ARTIFACT_NODE}###"
              cat "$SIGNAL_FILE"
              echo "###END_ES_TS_ARTIFACT###"
            }
            
            es_curl() {
              # es_curl <seconds> <url> [curl extra...]
              local seconds=$1
              shift
              local url=$1
              shift
              local args=(-sS --max-time "$seconds" --connect-timeout 3 -H 'Accept: application/json')
              if [[ -n "${ES_USER:-}" ]]; then
                args+=(-u "${ES_USER}:${ES_PASS:-}")
              fi
              curl "${args[@]}" "$@" "$url" 2>/dev/null
            }
            
            es_base_url() {
              printf 'http://127.0.0.1:%s' "${ES_HTTP_PORT:-9200}"
            }
            
            facts_merge() {
              local json=$1
              local py
              py=$(es_lib_py) || return 0
              python3 "$py" merge-facts "$FACTS_FILE" "$json" >/dev/null 2>&1 || true
            }
            
            record_local_master() {
              local url
              url="$(es_base_url)/_cat/master?h=id,host,ip,node&format=json"
              local body rc=0
              body=$(es_curl 3 "$url" -w '\nHTTP_CODE:%{http_code}\n') || rc=$?
              local code
              code=$(printf '%s\n' "$body" | awk -F: '/HTTP_CODE:/{print $2}' | tail -n1)
              local json
              json=$(printf '%s\n' "$body" | sed '/HTTP_CODE:/d')
              emit "----- local _cat/master http=${code:-na} rc=${rc} -----"
              emit "$json"
            
              local parsed="{}"
              local py
              py=$(es_lib_py) || true
              if [[ -n "$py" ]]; then
                parsed=$(printf '%s' "$json" | python3 "$py" parse-master 2>/dev/null || echo '{}')
              fi
              local http_ok=false auth_fail=false local_master="" local_ip=""
              if [[ "$code" == "401" || "$code" == "403" ]]; then
                auth_fail=true
                signal ES032 high "local HTTP auth failed code=${code}"
              elif [[ "$code" == "200" ]]; then
                http_ok=true
              else
                signal ES032 medium "local _cat/master failed code=${code:-na} rc=${rc}"
              fi
              if [[ "$http_ok" == true ]]; then
                local_master=$(python3 -c 'import json,sys; d=json.loads(sys.argv[1]); print(d.get("local_master",""))' "$parsed" 2>/dev/null || true)
                local_ip=$(python3 -c 'import json,sys; d=json.loads(sys.argv[1]); print(d.get("local_master_ip",""))' "$parsed" 2>/dev/null || true)
              fi
              emit "local_master=${local_master}"
              emit "local_master_ip=${local_ip}"
            
              local nodes_json=""
              nodes_json=$(es_curl 3 "$(es_base_url)/_cat/nodes?h=id,name,ip,master,node.role&format=json" || true)
              emit "----- local _cat/nodes -----"
              emit "$nodes_json"
              local self_elected=false
              if [[ -n "$py" && -n "$nodes_json" ]]; then
                local nodes_parsed
                nodes_parsed=$(printf '%s' "$nodes_json" | python3 "$py" parse-nodes "$ARTIFACT_NODE" 2>/dev/null || echo '{}')
                if python3 -c 'import json,sys; raise SystemExit(0 if json.loads(sys.argv[1]).get("self_elected") else 1)' "$nodes_parsed" 2>/dev/null; then
                  self_elected=true
                fi
              fi
              if [[ "$self_elected" != true && -n "$local_ip" && "$local_ip" == "$ARTIFACT_NODE" ]]; then
                self_elected=true
              fi
              emit "is_elected=${self_elected}"
            
              mkdir -p "$ARTIFACT_DIR"
              python3 - "$MASTER_FILE" "$ARTIFACT_NODE" "$local_master" "$local_ip" "$http_ok" "$auth_fail" "$self_elected" <<'PY' 2>/dev/null || true
            import json,sys
            path, node, lm, lip, http_ok, auth, elected = sys.argv[1:8]
            doc = {
              "node": node,
              "local_master": lm,
              "local_master_ip": lip,
              "http_ok": http_ok == "true",
              "auth_fail": auth == "true",
              "is_elected": elected == "true",
            }
            open(path,"w",encoding="utf-8").write(json.dumps(doc, ensure_ascii=False, indent=2)+"\n")
            PY
              facts_merge "$(python3 -c 'import json,sys; print(json.dumps({"local_master":sys.argv[1],"local_master_ip":sys.argv[2],"http_ok":sys.argv[3]=="true","auth_fail":sys.argv[4]=="true","is_elected":sys.argv[5]=="true","node":sys.argv[6]}))' \
                "$local_master" "$local_ip" "$http_ok" "$auth_fail" "$self_elected" "$ARTIFACT_NODE")"
              if [[ "$self_elected" == true ]]; then
                IS_ELECTED=1
              else
                IS_ELECTED=0
              fi
            }
            
            listen_port() {
              local port=$1
              if command -v ss >/dev/null 2>&1; then
                ss -lnt 2>/dev/null | awk '{print $4}' | grep -q ":${port}$"
                return $?
              fi
              netstat -lnt 2>/dev/null | grep -q ":${port} "
            }
            
            tcp_probe() {
              local host=$1 port=$2
              if timeout 2 bash -c "echo >/dev/tcp/${host}/${port}" 2>/dev/null; then
                return 0
              fi
              if command -v nc >/dev/null 2>&1; then
                nc -z -w 2 "$host" "$port" >/dev/null 2>&1 && return 0
              fi
              return 1
            }
            
            es_process_up() {
              # Character class so pgrep does not match its own argv.
              pgrep -f '[o]rg.elasticsearch.bootstrap.Elasticsearch' >/dev/null 2>&1 && return 0
              pgrep -x elasticsearch >/dev/null 2>&1 && return 0
              return 1
            }
            # 采集预检：curl/进程/9200/工具。不阻断后续并行采集。
            set -uo pipefail
            
            node1=${1:-}
            node2=${2:-}
            node3=${3:-}
            ES_HTTP_PORT=${4:-9200}
            ES_TRANSPORT_PORT=${5:-9300}
            run_id=${6:-manual}
            ES_USER=${7:-${ES_USER:-}}
            ES_PASS=${8:-${ES_PASS:-}}
            export ES_HTTP_PORT ES_USER ES_PASS
            
            target_ip=$(resolve_local_ip "$node1" "$node2" "$node3")
            begin_artifact precheck "$target_ip" "$run_id"
            emit "collector=precheck"
            emit "http_port=${ES_HTTP_PORT} transport_port=${ES_TRANSPORT_PORT}"
            
            for c in bash curl python3; do
              if command -v "$c" >/dev/null 2>&1; then
                emit "HAS ${c}"
              else
                emit "MISS ${c}"
                signal ES171 high "missing ${c}"
              fi
            done
            for c in timeout iostat ss nc; do
              if command -v "$c" >/dev/null 2>&1; then
                emit "HAS ${c}"
              else
                emit "MISS_OPTIONAL ${c}"
                signal ES171 low "optional missing ${c}"
              fi
            done
            
            if es_process_up; then
              emit "PROCESS_UP"
              facts_merge '{"process_up": true}'
            else
              emit "PROCESS_DOWN"
              signal ES030 high "elasticsearch process down"
              facts_merge '{"process_up": false}'
            fi
            
            if listen_port "$ES_HTTP_PORT"; then
              emit "LISTEN ${ES_HTTP_PORT}"
              facts_merge '{"listen_http": true}'
            else
              emit "NOLISTEN ${ES_HTTP_PORT}"
              signal ES031 high "http port ${ES_HTTP_PORT} not listening"
              facts_merge '{"listen_http": false}'
            fi
            
            if listen_port "$ES_TRANSPORT_PORT"; then
              emit "LISTEN ${ES_TRANSPORT_PORT}"
              facts_merge '{"listen_transport": true}'
            else
              emit "NOLISTEN ${ES_TRANSPORT_PORT}"
              facts_merge '{"listen_transport": false}'
            fi
            
            record_local_master
            
            finish_artifact
            exit 0
        job_ip_list:
          value: "${es_node_ips}"
        job_rolling_config:
          value:
            job_rolling_execute: []
            job_rolling_expression: ''
            job_rolling_mode: 1
        job_script_list_general:
          value: ''
        job_script_list_public:
          value: ''
        job_script_param:
          value: "'${es_node1_ip}' '${es_node2_ip}' '${es_node3_ip}' '${es_http_port}' '${es_transport_port}' '${ts_run_id}' '${es_user}' '${es_pass}'"
        job_script_source:
          value: manual
        job_script_timeout:
          value: '30'
        job_script_type:
          value: '1'
        job_success_id:
          value: ''
    auto_retry:
      enable: false
      times: 1
      interval: 0
    ignore_error: true
    can_retry: true
    can_skip: false
    optional: false
    next:
    - es-ts_parallel
  - id: es-ts_parallel
    type: ParallelGateway
    name: 五路并行采集
    next:
    - es-ts_metrics
    - es-ts_status
    - es-ts_config
    - es-ts_logs
    - es-ts_hostnet
  - id: es-ts_metrics
    type: ServiceActivity
    name: 快速执行脚本
    stage_name: 采集ES指标(本地stats+主节点health)
    component:
      code: job_fast_execute_script
      version: v1.2
      data:
        biz_cc_id:
          name: 业务
          value: ''
          key: "${biz_cc_id}"
          version: v1.2
          source_tag: job_fast_execute_script.biz_cc_id
        job_account:
          value: root
        job_content:
          value: |
            #!/usr/bin/env bash
            mkdir -p /tmp/es-ts-lib
            cat > /tmp/es-ts-lib/es_lib.py <<'ES_TS_LIB_PY'
            #!/usr/bin/env python3
            """Parse ES 7.x collector JSON and run cleanse cross-compare.
            
            Used by bash collectors and cleanse_artifacts.sh. No HTTP. Diagnose only.
            """
            from __future__ import annotations
            
            import json
            import os
            import sys
            from collections import Counter
            from pathlib import Path
            from typing import Any
            
            
            def _load(text: str) -> Any:
                text = (text or "").strip()
                if not text:
                    return None
                try:
                    return json.loads(text)
                except json.JSONDecodeError:
                    return None
            
            
            def parse_cat_master(text: str) -> dict[str, Any]:
                data = _load(text)
                out = {
                    "http_ok": False,
                    "auth_fail": False,
                    "local_master": "",
                    "local_master_ip": "",
                    "local_master_id": "",
                    "is_elected": False,
                }
                if data is None:
                    return out
                out["http_ok"] = True
                row = None
                if isinstance(data, list) and data:
                    row = data[0] if isinstance(data[0], dict) else None
                elif isinstance(data, dict):
                    row = data
                if not row:
                    return out
                out["local_master"] = str(row.get("node") or row.get("name") or "")
                out["local_master_ip"] = str(row.get("ip") or row.get("host") or "")
                out["local_master_id"] = str(row.get("id") or "")
                return out
            
            
            def parse_cat_nodes(text: str, local_ip: str = "") -> dict[str, Any]:
                data = _load(text)
                out = {"nodes": [], "elected": "", "elected_ip": "", "self_elected": False}
                if not isinstance(data, list):
                    return out
                for row in data:
                    if not isinstance(row, dict):
                        continue
                    name = str(row.get("name") or row.get("node") or "")
                    ip = str(row.get("ip") or "")
                    master = str(row.get("master") or "")
                    roles = str(row.get("node.role") or row.get("nodeRole") or "")
                    out["nodes"].append({"name": name, "ip": ip, "master": master, "roles": roles})
                    if master == "*":
                        out["elected"] = name
                        out["elected_ip"] = ip
                        if local_ip and (ip == local_ip):
                            out["self_elected"] = True
                return out
            
            
            def parse_local_stats(text: str) -> dict[str, Any]:
                data = _load(text)
                out = {
                    "heap_pct": None,
                    "write_rejected": None,
                    "search_rejected": None,
                    "write_pool": "",
                    "breaker_parent_pct": None,
                    "breaker_tripped": 0,
                    "disk_total": None,
                    "disk_free": None,
                    "disk_used_pct": None,
                    "index_total": None,
                    "index_time_ms": None,
                    "query_total": None,
                    "query_time_ms": None,
                    "cpu_percent": None,
                    "gc_young_ms": None,
                    "gc_old_ms": None,
                    "node_name": "",
                }
                if not isinstance(data, dict):
                    return out
                nodes = data.get("nodes") or {}
                if not isinstance(nodes, dict) or not nodes:
                    return out
                n = next(iter(nodes.values()))
                if not isinstance(n, dict):
                    return out
                out["node_name"] = str(n.get("name") or "")
                jvm = n.get("jvm") or {}
                mem = jvm.get("mem") or {}
                if "heap_used_percent" in mem:
                    out["heap_pct"] = int(mem["heap_used_percent"])
                collectors = (jvm.get("gc") or {}).get("collectors") or {}
                young = collectors.get("young") or collectors.get("ParNew") or {}
                old = collectors.get("old") or collectors.get("ConcurrentMarkSweep") or collectors.get("G1 Old Generation") or {}
                if "collection_time_in_millis" in young:
                    out["gc_young_ms"] = int(young["collection_time_in_millis"])
                if "collection_time_in_millis" in old:
                    out["gc_old_ms"] = int(old["collection_time_in_millis"])
                tp = n.get("thread_pool") or {}
                write = tp.get("write") if isinstance(tp.get("write"), dict) else None
                if write is None and isinstance(tp.get("index"), dict):
                    write = tp["index"]
                    out["write_pool"] = "index_legacy"
                else:
                    out["write_pool"] = "write"
                if write:
                    out["write_rejected"] = int(write.get("rejected") or 0)
                search = tp.get("search") if isinstance(tp.get("search"), dict) else {}
                if search:
                    out["search_rejected"] = int(search.get("rejected") or 0)
                breakers = n.get("breakers") or {}
                parent = breakers.get("parent") or {}
                if parent.get("limit_size_in_bytes") and parent.get("estimated_size_in_bytes") is not None:
                    lim = int(parent["limit_size_in_bytes"]) or 1
                    out["breaker_parent_pct"] = int(int(parent["estimated_size_in_bytes"]) * 100 / lim)
                tripped = 0
                for b in breakers.values():
                    if isinstance(b, dict):
                        tripped += int(b.get("tripped") or 0)
                out["breaker_tripped"] = tripped
                fs = (n.get("fs") or {}).get("total") or {}
                if fs.get("total_in_bytes"):
                    total = int(fs["total_in_bytes"])
                    free = int(fs.get("available_in_bytes") or fs.get("free_in_bytes") or 0)
                    out["disk_total"] = total
                    out["disk_free"] = free
                    out["disk_used_pct"] = int((total - free) * 100 / total) if total else None
                idx = (n.get("indices") or {}).get("indexing") or {}
                if "index_total" in idx:
                    out["index_total"] = int(idx["index_total"])
                    out["index_time_ms"] = int(idx.get("index_time_in_millis") or 0)
                search_m = (n.get("indices") or {}).get("search") or {}
                if "query_total" in search_m:
                    out["query_total"] = int(search_m["query_total"])
                    out["query_time_ms"] = int(search_m.get("query_time_in_millis") or 0)
                cpu = (n.get("os") or {}).get("cpu") or {}
                if "percent" in cpu:
                    out["cpu_percent"] = int(cpu["percent"])
                return out
            
            
            def parse_cluster_health(text: str) -> dict[str, Any]:
                data = _load(text)
                if not isinstance(data, dict):
                    return {}
                keys = (
                    "status",
                    "number_of_nodes",
                    "number_of_data_nodes",
                    "active_primary_shards",
                    "active_shards",
                    "relocating_shards",
                    "initializing_shards",
                    "unassigned_shards",
                    "delayed_unassigned_shards",
                    "number_of_pending_tasks",
                    "task_max_waiting_in_queue_millis",
                    "active_shards_percent_as_number",
                    "timed_out",
                )
                out: dict[str, Any] = {}
                for k in keys:
                    if k in data:
                        out[k] = data[k]
                return out
            
            
            def merge_facts(path: str, updates: dict[str, Any]) -> dict[str, Any]:
                p = Path(path)
                cur: dict[str, Any] = {}
                if p.is_file():
                    try:
                        cur = json.loads(p.read_text(encoding="utf-8"))
                    except (OSError, json.JSONDecodeError):
                        cur = {}
                cur.update({k: v for k, v in updates.items() if v is not None})
                p.parent.mkdir(parents=True, exist_ok=True)
                p.write_text(json.dumps(cur, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
                return cur
            
            
            def _read_json(path: Path) -> dict[str, Any] | None:
                if not path.is_file():
                    return None
                try:
                    data = json.loads(path.read_text(encoding="utf-8"))
                except (OSError, json.JSONDecodeError):
                    return None
                return data if isinstance(data, dict) else None
            
            
            def _read_signals(base: Path) -> list[tuple[str, str, str]]:
                rows: list[tuple[str, str, str]] = []
                for p in sorted(base.glob("*.signals")):
                    try:
                        text = p.read_text(encoding="utf-8", errors="replace")
                    except OSError:
                        continue
                    for line in text.splitlines():
                        parts = line.split("\t", 2)
                        if len(parts) >= 3 and parts[0].startswith("ES"):
                            rows.append((parts[0], parts[1], parts[2]))
                return rows
            
            
            def _sev_rank(sev: str) -> int:
                return {"high": 3, "medium": 2, "low": 1, "warning": 2}.get(sev, 0)
            
            
            def _dedup(rows: list[tuple[str, str, str]]) -> list[tuple[str, str, str]]:
                best: dict[str, tuple[str, str, str]] = {}
                order: list[str] = []
                for sid, sev, note in rows:
                    if sid not in best:
                        order.append(sid)
                        best[sid] = (sid, sev, note)
                        continue
                    old = best[sid]
                    if _sev_rank(sev) > _sev_rank(old[1]):
                        best[sid] = (sid, sev, f"{old[2]} | {note}")
                    elif note not in old[2]:
                        best[sid] = (sid, old[1], f"{old[2]} | {note}")
                return [best[k] for k in order]
            
            
            def _add(signals: list[tuple[str, str, str]], sid: str, sev: str, note: str) -> None:
                signals.append((sid, sev, note))
            
            
            def cross_compare(
                facts: dict[str, dict[str, Any]],
                expected_nodes: int,
                expected_ips: list[str],
            ) -> tuple[list[tuple[str, str, str]], dict[str, Any]]:
                extra: list[tuple[str, str, str]] = []
                collected_ips = [ip for ip in expected_ips if ip in facts]
                n_col = len(collected_ips)
                meta: dict[str, Any] = {
                    "nodes_collected": n_col,
                    "expected_nodes": expected_nodes,
                    "majority_master": "",
                    "coverage": "ok",
                    "no_master": False,
                    "evidence_gap": [],
                }
                if n_col < expected_nodes:
                    meta["coverage"] = "degraded"
                    missing = [ip for ip in expected_ips if ip not in facts]
                    meta["evidence_gap"].append("missing_nodes=" + ",".join(missing))
                    _add(extra, "ES172", "high", "nodes missing: " + ",".join(missing))
                    if n_col == 0:
                        meta["coverage"] = "empty"
            
                masters = []
                auth_na = 0
                for ip in collected_ips:
                    f = facts[ip]
                    if f.get("auth_fail"):
                        auth_na += 1
                        continue
                    masters.append((ip, str(f.get("local_master") or "")))
            
                nonempty = [m for _, m in masters if m]
                empty = [ip for ip, m in masters if not m]
                maj = ""
                if nonempty:
                    maj, cnt = Counter(nonempty).most_common(1)[0]
                    if cnt >= 2 or (expected_nodes == 1 and cnt == 1):
                        maj_ok = maj
                    else:
                        maj_ok = maj if cnt == len(nonempty) else ""
                    maj = maj_ok
                meta["majority_master"] = maj
            
                all_collected = n_col == expected_nodes and expected_nodes >= 1
                all_empty = all_collected and not nonempty and auth_na == 0
                if all_empty:
                    _add(extra, "ES050", "high", "all %s nodes have empty local_master" % n_col)
                    _add(extra, "ES191", "high", "NO_MASTER")
                    meta["no_master"] = True
                    meta["majority_master"] = ""
                elif n_col < expected_nodes and nonempty == [] and empty:
                    meta["evidence_gap"].append("NO_MASTER_OBSERVED")
                    _add(extra, "ES173", "medium", "observed nodes have no master but collection incomplete")
                elif maj and empty:
                    _add(extra, "ES051", "high", "majority master=%s disagree/empty on %s" % (maj, ",".join(empty)))
                    _add(extra, "ES199", "high", "master view split")
                elif nonempty and len(set(nonempty)) > 1:
                    _add(extra, "ES051", "high", "local_master values disagree: " + ",".join(sorted(set(nonempty))))
                    _add(extra, "ES199", "high", "master view split")
            
                health = {}
                for ip in collected_ips:
                    h = facts[ip].get("cluster_health")
                    if isinstance(h, dict) and h.get("status"):
                        health = h
                        if maj and (facts[ip].get("is_elected") or facts[ip].get("local_master") == maj):
                            break
            
                nodes_in_health = int(health.get("number_of_nodes") or 0) if health else 0
                status = str(health.get("status") or "")
                unassigned = int(health.get("unassigned_shards") or 0) if health else 0
                delayed = int(health.get("delayed_unassigned_shards") or 0) if health else 0
                pending = int(health.get("number_of_pending_tasks") or 0) if health else 0
                reloc = int(health.get("relocating_shards") or 0) if health else 0
                init = int(health.get("initializing_shards") or 0) if health else 0
            
                if delayed > 0:
                    _add(extra, "ES055", "low", "delayed_unassigned=%s" % delayed)
                if pending >= 10:
                    _add(extra, "ES056", "high", "pending_tasks=%s" % pending)
                elif pending >= 1:
                    _add(extra, "ES056", "medium", "pending_tasks=%s" % pending)
                if reloc or init:
                    _add(extra, "ES057", "medium", "relocating=%s initializing=%s" % (reloc, init))
            
                down_ips = []
                for ip in expected_ips:
                    f = facts.get(ip) or {}
                    proc = f.get("process_up")
                    http = f.get("http_ok")
                    listen = f.get("listen_http")
                    if proc is False or listen is False or http is False:
                        down_ips.append(ip)
                    elif ip not in facts:
                        down_ips.append(ip)
            
                if not meta["no_master"]:
                    if nodes_in_health and nodes_in_health < expected_nodes:
                        missing_n = expected_nodes - nodes_in_health
                        if missing_n >= 2:
                            _add(extra, "ES053", "high", "health nodes=%s expected=%s" % (nodes_in_health, expected_nodes))
                        else:
                            _add(extra, "ES052", "medium", "health nodes=%s expected=%s" % (nodes_in_health, expected_nodes))
                        _add(extra, "ES190", "high", "NODE_DOWN health_nodes=%s down_ips=%s" % (nodes_in_health, ",".join(down_ips) or "unknown"))
                    elif n_col == expected_nodes and nodes_in_health == expected_nodes and status == "yellow" and unassigned > 0:
                        _add(extra, "ES192", "medium", "YELLOW_ALLOC_NOT_DOWN unassigned=%s" % unassigned)
                    if status == "red" and not meta["no_master"] and unassigned > 0:
                        _add(extra, "ES054", "high", "red with unassigned=%s" % unassigned)
            
                if meta["no_master"] and status == "red":
                    _add(extra, "ES053", "high", "red and NO_MASTER")
            
                if expected_nodes <= 1:
                    extra = [(s, v, n + " node_count=1") if s.startswith("ES19") else (s, v, n) for s, v, n in extra]
                    extra = [x for x in extra if not (x[0] in {"ES194", "ES196", "ES198"} and expected_nodes <= 1)]
            
                heaps = [(ip, facts[ip].get("heap_pct")) for ip in collected_ips if isinstance(facts[ip].get("heap_pct"), int)]
                high_heap = [ip for ip, h in heaps if h is not None and h >= 85]
                if len(high_heap) == 1 and len(heaps) >= 2:
                    _add(extra, "ES193", "high", "HEAP_ONE_OUTLIER %s heap=%s" % (high_heap[0], dict(heaps)[high_heap[0]]))
                    _add(extra, "ES034", "high", "%s heap=%s" % (high_heap[0], dict(heaps)[high_heap[0]]))
                elif len(high_heap) >= 2:
                    _add(extra, "ES194", "high", "HEAP_ALL_SIMILAR " + ",".join("%s=%s" % (ip, dict(heaps)[ip]) for ip in high_heap))
            
                rejects = [(ip, int(facts[ip].get("write_rejected_delta") or 0) + int(facts[ip].get("search_rejected_delta") or 0)) for ip in collected_ips]
                rej_pos = [ip for ip, r in rejects if r > 0]
                if len(rej_pos) == 1 and len(rejects) >= 2:
                    _add(extra, "ES195", "medium", "REJECT_ONE %s delta=%s" % (rej_pos[0], dict(rejects)[rej_pos[0]]))
                elif len(rej_pos) >= 2:
                    _add(extra, "ES196", "high", "REJECT_ALL " + ",".join(rej_pos))
            
                floods = [ip for ip in collected_ips if facts[ip].get("flood") or facts[ip].get("read_only_allow_delete")]
                if len(floods) == 1 and n_col >= 2:
                    _add(extra, "ES197", "high", "FLOOD_ONE %s" % floods[0])
                elif len(floods) >= 2:
                    _add(extra, "ES198", "high", "FLOOD_ALL " + ",".join(floods))
            
                for ip in collected_ips:
                    f = facts[ip]
                    if f.get("http_ok") and f.get("listen_http") and f.get("transport_ok") is False:
                        _add(extra, "ES091", "high", "9200 up 9300 down on %s" % ip)
                        _add(extra, "ES199", "high", "TRANSPORT_PARTITION %s" % ip)
                    peers = f.get("peer_transport") or {}
                    if isinstance(peers, dict):
                        for peer, ok in peers.items():
                            if ok is False and (f.get("peer_http") or {}).get(peer) is True:
                                _add(extra, "ES091", "high", "%s http ok transport fail to %s" % (ip, peer))
                                _add(extra, "ES199", "high", "TRANSPORT_PARTITION %s->%s" % (ip, peer))
            
                names = [str(facts[ip].get("cluster_name") or "") for ip in collected_ips if facts[ip].get("cluster_name")]
                if names and len(set(names)) > 1:
                    _add(extra, "ES060", "high", "cluster.name disagree: " + ",".join(sorted(set(names))))
            
                alloc = [str(facts[ip].get("allocation_enable") or "") for ip in collected_ips if facts[ip].get("allocation_enable")]
                if any(a and a != "all" for a in alloc):
                    _add(extra, "ES058", "high", "allocation.enable=" + ",".join(sorted(set(alloc))))
            
                explains = []
                for ip in collected_ips:
                    ex = facts[ip].get("explain_reasons") or []
                    if isinstance(ex, list):
                        explains.extend(str(x) for x in ex)
                joined = " ".join(explains).upper()
                if "NODE_LEFT" in joined or "NODE_RESTART" in joined:
                    _add(extra, "ES052", "medium", "explain NODE_LEFT")
                if "DECIDERS_NO" in joined and ("DISK" in joined or "WATERMARK" in joined):
                    _add(extra, "ES061", "high", "explain DECIDERS_NO disk")
                if "ALLOCATION_FAILED" in joined:
                    _add(extra, "ES063", "high", "explain ALLOCATION_FAILED")
            
                if expected_nodes <= 1:
                    extra = [x for x in extra if x[0] not in {"ES194", "ES196", "ES198"}]
            
                return extra, meta
            
            
            def render_summary(
                run_id: str,
                expected_ips: list[str],
                facts: dict[str, dict[str, Any]],
                signals: list[tuple[str, str, str]],
                meta: dict[str, Any],
                health: dict[str, Any],
            ) -> str:
                lines = [
                    "# ES 7.x 三节点排查摘要",
                    "",
                    f"- run_id: `{run_id}`",
                    f"- expected_nodes: {meta.get('expected_nodes')}",
                    f"- nodes_collected: {meta.get('nodes_collected')}",
                    f"- coverage: `{meta.get('coverage')}`",
                    f"- majority_master: `{meta.get('majority_master') or ('NO_MASTER' if meta.get('no_master') else 'UNKNOWN')}`",
                    "",
                    "## 集群健康",
                    "",
                ]
                if health:
                    lines += [
                        f"- status: `{health.get('status', '')}`",
                        f"- number_of_nodes: {health.get('number_of_nodes', '')}",
                        f"- unassigned_shards: {health.get('unassigned_shards', '')}",
                        f"- delayed_unassigned_shards: {health.get('delayed_unassigned_shards', '')}",
                        f"- pending_tasks: {health.get('number_of_pending_tasks', '')}",
                        "",
                    ]
                else:
                    lines += ["- （无权威 cluster health）", ""]
                lines += [
                    "## 各节点 master 视图",
                    "",
                    "| IP | local_master | 9200 | 9300 | heap% | write_rejected_delta | disk% |",
                    "|----|--------------|------|------|-------|----------------------|-------|",
                ]
                for ip in expected_ips:
                    f = facts.get(ip) or {}
                    http = "ok" if f.get("http_ok") else ("NA" if not f else "fail")
                    tp = f.get("listen_transport")
                    trans = "ok" if tp else ("fail" if tp is False else "NA")
                    lines.append(
                        "| {ip} | {lm} | {http} | {trans} | {heap} | {wr} | {disk} |".format(
                            ip=ip,
                            lm=f.get("local_master") or ("(empty)" if f else "(missing)"),
                            http=http,
                            trans=trans,
                            heap=f.get("heap_pct") if f.get("heap_pct") is not None else "",
                            wr=f.get("write_rejected_delta") if f.get("write_rejected_delta") is not None else "",
                            disk=f.get("disk_used_pct") if f.get("disk_used_pct") is not None else "",
                        )
                    )
                lines += ["", "## Top 信号", "", "| ID | 级别 | 说明 |", "|----|------|------|"]
                if signals:
                    for sid, sev, note in signals:
                        lines.append(f"| {sid} | {sev} | {note} |")
                else:
                    lines.append("| — | — | 无自动信号 |")
                lines += ["", "## 交叉对比结论", ""]
                ids = {s[0] for s in signals}
                bullets = []
                if "ES191" in ids:
                    bullets.append("- **ES191 NO_MASTER**：三台均无 elected master，先看发现/传输/进程，不要解释 unassigned。")
                if "ES190" in ids:
                    bullets.append("- **ES190 NODE_DOWN**：健康节点数少于期望，优先掉节点而不是业务 QPS。")
                if "ES192" in ids:
                    bullets.append("- **ES192 YELLOW_ALLOC_NOT_DOWN**：三台都在集群内，副本未分配是水位/allocation/max_shards。")
                if "ES193" in ids:
                    bullets.append("- **ES193 HEAP_ONE_OUTLIER**：单节点 JVM，不是全集群容量。")
                if "ES194" in ids:
                    bullets.append("- **ES194 HEAP_ALL_SIMILAR**：多节点堆压力。")
                if "ES195" in ids:
                    bullets.append("- **ES195 REJECT_ONE**：单节点线程池拒绝。")
                if "ES196" in ids:
                    bullets.append("- **ES196 REJECT_ALL**：多节点 reject。")
                if "ES197" in ids:
                    bullets.append("- **ES197 FLOOD_ONE**：单节点磁盘 flood / 只读块。")
                if "ES198" in ids:
                    bullets.append("- **ES198 FLOOD_ALL**：集群块。")
                if "ES199" in ids:
                    bullets.append("- **ES199 TRANSPORT_PARTITION**：9200/9300 分叉或 master 视图分裂。")
                if not bullets:
                    if meta.get("coverage") == "ok" and not ids:
                        bullets.append("- 倾向 **ES001 基线正常**，或故障未落入 P0 信号。")
                    else:
                        bullets.append("- 无组合结论；见证据缺口。")
                lines.extend(bullets)
                lines += ["", "## 证据缺口", ""]
                gaps = list(meta.get("evidence_gap") or [])
                if meta.get("no_master"):
                    gaps.append("unassigned explain 不可靠（NO_MASTER）")
                if not gaps:
                    lines.append("- 无")
                else:
                    for g in gaps:
                        lines.append(f"- {g}")
                lines.append("")
                return "\n".join(lines)
            
            
            def cleanse(base: str, run_id: str, expected_ips: list[str], profile: str = "v1") -> dict[str, Any]:
                root = Path(base)
                root.mkdir(parents=True, exist_ok=True)
                facts: dict[str, dict[str, Any]] = {}
                for ip in expected_ips:
                    data = _read_json(root / f"facts.{ip}.json")
                    if data:
                        facts[ip] = data
                    master = _read_json(root / f"master.{ip}.json")
                    if master:
                        facts.setdefault(ip, {})
                        for k in ("local_master", "local_master_ip", "http_ok", "auth_fail", "is_elected"):
                            if k in master and master[k] is not None:
                                facts[ip].setdefault(k, master[k])
            
                raw = _read_signals(root)
                extra, meta = cross_compare(facts, len(expected_ips), expected_ips)
                if profile.endswith("degraded") and meta["coverage"] == "ok":
                    meta["coverage"] = "degraded"
                    meta["evidence_gap"].append("forced_degraded_profile")
                merged = _dedup(raw + extra)
                health = {}
                for ip in expected_ips:
                    h = (facts.get(ip) or {}).get("cluster_health")
                    if isinstance(h, dict) and h:
                        health = h
                        if facts[ip].get("is_elected"):
                            break
            
                kinds = ("precheck", "metrics", "status", "config", "logs", "hostnet")
                found = sum(1 for k in kinds if any(root.glob(f"{k}.*.txt")))
                if found == 0 and meta["coverage"] == "ok":
                    meta["coverage"] = "empty"
                elif found < 3 and meta["coverage"] == "ok":
                    meta["coverage"] = "degraded"
            
                summary = render_summary(run_id, expected_ips, facts, merged, meta, health)
                (root / "summary.md").write_text(summary, encoding="utf-8")
                sig_txt = "".join(f"{a}\t{b}\t{c}\n" for a, b, c in merged)
                (root / "signals.txt").write_text(sig_txt, encoding="utf-8")
                (root / "signals.uniq.tsv").write_text(sig_txt, encoding="utf-8")
            
                cleaned_parts = [
                    f"===== ES_TS cleaned run_id={run_id} profile={profile} =====",
                    f"nodes={','.join(expected_ips)}",
                    f"coverage={meta['coverage']} majority_master={meta.get('majority_master')}",
                    "",
                    "----- SIGNALS -----",
                    sig_txt or "NO_SIGNALS",
                    "",
                ]
                for p in sorted(root.glob("*.txt")):
                    if p.name in {"cleaned.txt", "signals.txt"}:
                        continue
                    body = p.read_text(encoding="utf-8", errors="replace")
                    lines = body.splitlines()
                    keep = [ln for ln in lines if ln.startswith("SIGNAL ") or ln.startswith("CMD_FAIL") or "KEYWORD" in ln]
                    if not keep:
                        keep = lines[-40:]
                    cleaned_parts.append(f"### {p.name} ###")
                    cleaned_parts.extend(keep[:80])
                    cleaned_parts.append("")
                cleaned = "\n".join(cleaned_parts)
                if len(cleaned.encode()) > 64000:
                    cleaned = cleaned.encode()[:64000].decode("utf-8", errors="ignore")
                (root / "cleaned.txt").write_text(cleaned, encoding="utf-8")
                meta_out = {
                    "run_id": run_id,
                    "profile": profile,
                    "coverage_status": meta["coverage"],
                    "nodes_collected": meta["nodes_collected"],
                    "expected_nodes": meta["expected_nodes"],
                    "majority_master": meta.get("majority_master") or "",
                    "no_master": str(bool(meta.get("no_master"))).lower(),
                    "signal_count": len(merged),
                    "kinds_found": found,
                }
                meta_txt = "".join(f"{k}={v}\n" for k, v in meta_out.items())
                (root / "cleaned.meta").write_text(meta_txt, encoding="utf-8")
                return {"meta": meta_out, "signals": merged, "summary": summary}
            
            
            def _cli(argv: list[str]) -> int:
                if len(argv) < 2:
                    print("usage: es_lib.py parse-master|parse-stats|parse-health|merge-facts|cleanse ...", file=sys.stderr)
                    return 2
                cmd = argv[1]
                if cmd == "parse-master":
                    print(json.dumps(parse_cat_master(sys.stdin.read()), ensure_ascii=False))
                    return 0
                if cmd == "parse-stats":
                    print(json.dumps(parse_local_stats(sys.stdin.read()), ensure_ascii=False))
                    return 0
                if cmd == "parse-health":
                    print(json.dumps(parse_cluster_health(sys.stdin.read()), ensure_ascii=False))
                    return 0
                if cmd == "parse-nodes":
                    local_ip = argv[2] if len(argv) > 2 else ""
                    print(json.dumps(parse_cat_nodes(sys.stdin.read(), local_ip), ensure_ascii=False))
                    return 0
                if cmd == "merge-facts":
                    path = argv[2]
                    updates = json.loads(argv[3] if len(argv) > 3 else sys.stdin.read())
                    print(json.dumps(merge_facts(path, updates), ensure_ascii=False))
                    return 0
                if cmd == "cleanse":
                    base, run_id = argv[2], argv[3]
                    ips = argv[4:]
                    profile = os.environ.get("TS_PROFILE", "v1")
                    result = cleanse(base, run_id, ips, profile)
                    print(json.dumps(result["meta"], ensure_ascii=False))
                    return 0
                print("unknown command", cmd, file=sys.stderr)
                return 2
            
            
            if __name__ == "__main__":
                sys.exit(_cli(sys.argv))
            ES_TS_LIB_PY
            # Shared helpers for ES 7.x troubleshooting collectors. Sourced, not executed.
            # Collectors always exit 0. Do not mutate the cluster.
            
            umask 077
            
            json_escape() {
              local s=${1-}
              s=${s//\\/\\\\}
              s=${s//\"/\\\"}
              s=${s//$'\n'/\\n}
              s=${s//$'\r'/\\r}
              s=${s//$'\t'/\\t}
              printf '%s' "$s"
            }
            
            ts_now() { date -u +"%Y-%m-%dT%H:%M:%SZ"; }
            
            resolve_local_ip() {
              local node1=$1 node2=$2 node3=$3
              local local_ips target_ip=""
              local_ips=$(hostname -I 2>/dev/null || true)
              for ip in "$node1" "$node2" "$node3"; do
                [[ " ${local_ips} " == *" ${ip} "* ]] && target_ip=$ip && break
              done
              if [[ -z "$target_ip" ]]; then
                target_ip=$(hostname -I 2>/dev/null | awk '{print $1}')
              fi
              printf '%s' "${target_ip:-unknown}"
            }
            
            artifact_dir_for() {
              local run_id=$1
              local base=${TS_ARTIFACT_DIR:-/tmp/es-troubleshoot}
              printf '%s/%s' "$base" "$run_id"
            }
            
            es_lib_py() {
              local here=${SCRIPT_DIR:-}
              if [[ -n "$here" && -f "${here}/es_lib.py" ]]; then
                printf '%s' "${here}/es_lib.py"
                return 0
              fi
              if [[ -f /tmp/es-ts-lib/es_lib.py ]]; then
                printf '%s' /tmp/es-ts-lib/es_lib.py
                return 0
              fi
              return 1
            }
            
            begin_artifact() {
              local kind=$1 node=$2 run_id=$3
              ARTIFACT_KIND=$kind
              ARTIFACT_NODE=$node
              ARTIFACT_RUN_ID=$run_id
              ARTIFACT_DIR=$(artifact_dir_for "$run_id")
              mkdir -p "$ARTIFACT_DIR"
              ARTIFACT_FILE="${ARTIFACT_DIR}/${kind}.${node}.txt"
              SIGNAL_FILE="${ARTIFACT_DIR}/${kind}.${node}.signals"
              FACTS_FILE="${ARTIFACT_DIR}/facts.${node}.json"
              MASTER_FILE="${ARTIFACT_DIR}/master.${node}.json"
              : > "$ARTIFACT_FILE"
              : > "$SIGNAL_FILE"
              {
                echo "===== ES_TS artifact=${kind} node=${node} ts=$(ts_now) run_id=${run_id} ====="
                echo "hostname=$(hostname 2>/dev/null || echo unknown)"
              } >> "$ARTIFACT_FILE"
            }
            
            emit() {
              printf '%s\n' "$*" >> "$ARTIFACT_FILE"
            }
            
            emit_cmd() {
              local title=$1
              local rc=0
              shift
              emit "----- ${title} -----"
              "$@" >> "$ARTIFACT_FILE" 2>&1
              rc=$?
              if (( rc != 0 )); then
                emit "CMD_FAIL: ${title} rc=${rc}"
                return 1
              fi
              return 0
            }
            
            emit_cmd_timeout() {
              local seconds=$1 title=$2
              shift 2
              emit "----- ${title} (timeout ${seconds}s) -----"
              if command -v timeout >/dev/null 2>&1; then
                if ! timeout "$seconds" "$@" >> "$ARTIFACT_FILE" 2>&1; then
                  emit "CMD_FAIL_OR_TIMEOUT: ${title}"
                  signal ES174 low "timeout ${title}"
                  return 1
                fi
              else
                if ! "$@" >> "$ARTIFACT_FILE" 2>&1; then
                  emit "CMD_FAIL: ${title}"
                  return 1
                fi
              fi
              return 0
            }
            
            signal() {
              printf '%s\t%s\t%s\n' "$1" "$2" "$3" >> "$SIGNAL_FILE"
              emit "SIGNAL ${1} severity=${2} ${3}"
            }
            
            finish_artifact() {
              emit "===== END ES_TS artifact=${ARTIFACT_KIND} node=${ARTIFACT_NODE} ====="
              echo "###ES_TS_ARTIFACT kind=${ARTIFACT_KIND} node=${ARTIFACT_NODE} file=${ARTIFACT_FILE}###"
              cat "$ARTIFACT_FILE"
              echo "###ES_TS_SIGNALS kind=${ARTIFACT_KIND} node=${ARTIFACT_NODE}###"
              cat "$SIGNAL_FILE"
              echo "###END_ES_TS_ARTIFACT###"
            }
            
            es_curl() {
              # es_curl <seconds> <url> [curl extra...]
              local seconds=$1
              shift
              local url=$1
              shift
              local args=(-sS --max-time "$seconds" --connect-timeout 3 -H 'Accept: application/json')
              if [[ -n "${ES_USER:-}" ]]; then
                args+=(-u "${ES_USER}:${ES_PASS:-}")
              fi
              curl "${args[@]}" "$@" "$url" 2>/dev/null
            }
            
            es_base_url() {
              printf 'http://127.0.0.1:%s' "${ES_HTTP_PORT:-9200}"
            }
            
            facts_merge() {
              local json=$1
              local py
              py=$(es_lib_py) || return 0
              python3 "$py" merge-facts "$FACTS_FILE" "$json" >/dev/null 2>&1 || true
            }
            
            record_local_master() {
              local url
              url="$(es_base_url)/_cat/master?h=id,host,ip,node&format=json"
              local body rc=0
              body=$(es_curl 3 "$url" -w '\nHTTP_CODE:%{http_code}\n') || rc=$?
              local code
              code=$(printf '%s\n' "$body" | awk -F: '/HTTP_CODE:/{print $2}' | tail -n1)
              local json
              json=$(printf '%s\n' "$body" | sed '/HTTP_CODE:/d')
              emit "----- local _cat/master http=${code:-na} rc=${rc} -----"
              emit "$json"
            
              local parsed="{}"
              local py
              py=$(es_lib_py) || true
              if [[ -n "$py" ]]; then
                parsed=$(printf '%s' "$json" | python3 "$py" parse-master 2>/dev/null || echo '{}')
              fi
              local http_ok=false auth_fail=false local_master="" local_ip=""
              if [[ "$code" == "401" || "$code" == "403" ]]; then
                auth_fail=true
                signal ES032 high "local HTTP auth failed code=${code}"
              elif [[ "$code" == "200" ]]; then
                http_ok=true
              else
                signal ES032 medium "local _cat/master failed code=${code:-na} rc=${rc}"
              fi
              if [[ "$http_ok" == true ]]; then
                local_master=$(python3 -c 'import json,sys; d=json.loads(sys.argv[1]); print(d.get("local_master",""))' "$parsed" 2>/dev/null || true)
                local_ip=$(python3 -c 'import json,sys; d=json.loads(sys.argv[1]); print(d.get("local_master_ip",""))' "$parsed" 2>/dev/null || true)
              fi
              emit "local_master=${local_master}"
              emit "local_master_ip=${local_ip}"
            
              local nodes_json=""
              nodes_json=$(es_curl 3 "$(es_base_url)/_cat/nodes?h=id,name,ip,master,node.role&format=json" || true)
              emit "----- local _cat/nodes -----"
              emit "$nodes_json"
              local self_elected=false
              if [[ -n "$py" && -n "$nodes_json" ]]; then
                local nodes_parsed
                nodes_parsed=$(printf '%s' "$nodes_json" | python3 "$py" parse-nodes "$ARTIFACT_NODE" 2>/dev/null || echo '{}')
                if python3 -c 'import json,sys; raise SystemExit(0 if json.loads(sys.argv[1]).get("self_elected") else 1)' "$nodes_parsed" 2>/dev/null; then
                  self_elected=true
                fi
              fi
              if [[ "$self_elected" != true && -n "$local_ip" && "$local_ip" == "$ARTIFACT_NODE" ]]; then
                self_elected=true
              fi
              emit "is_elected=${self_elected}"
            
              mkdir -p "$ARTIFACT_DIR"
              python3 - "$MASTER_FILE" "$ARTIFACT_NODE" "$local_master" "$local_ip" "$http_ok" "$auth_fail" "$self_elected" <<'PY' 2>/dev/null || true
            import json,sys
            path, node, lm, lip, http_ok, auth, elected = sys.argv[1:8]
            doc = {
              "node": node,
              "local_master": lm,
              "local_master_ip": lip,
              "http_ok": http_ok == "true",
              "auth_fail": auth == "true",
              "is_elected": elected == "true",
            }
            open(path,"w",encoding="utf-8").write(json.dumps(doc, ensure_ascii=False, indent=2)+"\n")
            PY
              facts_merge "$(python3 -c 'import json,sys; print(json.dumps({"local_master":sys.argv[1],"local_master_ip":sys.argv[2],"http_ok":sys.argv[3]=="true","auth_fail":sys.argv[4]=="true","is_elected":sys.argv[5]=="true","node":sys.argv[6]}))' \
                "$local_master" "$local_ip" "$http_ok" "$auth_fail" "$self_elected" "$ARTIFACT_NODE")"
              if [[ "$self_elected" == true ]]; then
                IS_ELECTED=1
              else
                IS_ELECTED=0
              fi
            }
            
            listen_port() {
              local port=$1
              if command -v ss >/dev/null 2>&1; then
                ss -lnt 2>/dev/null | awk '{print $4}' | grep -q ":${port}$"
                return $?
              fi
              netstat -lnt 2>/dev/null | grep -q ":${port} "
            }
            
            tcp_probe() {
              local host=$1 port=$2
              if timeout 2 bash -c "echo >/dev/tcp/${host}/${port}" 2>/dev/null; then
                return 0
              fi
              if command -v nc >/dev/null 2>&1; then
                nc -z -w 2 "$host" "$port" >/dev/null 2>&1 && return 0
              fi
              return 1
            }
            
            es_process_up() {
              # Character class so pgrep does not match its own argv.
              pgrep -f '[o]rg.elasticsearch.bootstrap.Elasticsearch' >/dev/null 2>&1 && return 0
              pgrep -x elasticsearch >/dev/null 2>&1 && return 0
              return 1
            }
            # M 指标：本地 _nodes/_local/stats + 若本机为 elected master 则打一次 cluster health。
            set -uo pipefail
            
            node1=${1:-}
            node2=${2:-}
            node3=${3:-}
            ES_HTTP_PORT=${4:-9200}
            ES_TRANSPORT_PORT=${5:-9300}
            run_id=${6:-manual}
            ES_USER=${7:-${ES_USER:-}}
            ES_PASS=${8:-${ES_PASS:-}}
            export ES_HTTP_PORT ES_USER ES_PASS
            
            target_ip=$(resolve_local_ip "$node1" "$node2" "$node3")
            begin_artifact metrics "$target_ip" "$run_id"
            emit "collector=metrics"
            
            record_local_master
            
            FILTER='filter_path=nodes.*.name,nodes.*.jvm.mem.heap_used_percent,nodes.*.jvm.gc.collectors,nodes.*.thread_pool.write,nodes.*.thread_pool.index,nodes.*.thread_pool.search,nodes.*.breakers.parent,nodes.*.breakers.request,nodes.*.breakers.fielddata,nodes.*.fs.total,nodes.*.indices.indexing.index_total,nodes.*.indices.indexing.index_time_in_millis,nodes.*.indices.search.query_total,nodes.*.indices.search.query_time_in_millis,nodes.*.os.cpu'
            URL="$(es_base_url)/_nodes/_local/stats?${FILTER}"
            
            stats1=$(es_curl 8 "$URL" || true)
            emit "----- _nodes/_local/stats sample1 -----"
            emit "$stats1"
            sleep 1
            stats2=$(es_curl 8 "$URL" || true)
            emit "----- _nodes/_local/stats sample2 -----"
            emit "$stats2"
            
            py=$(es_lib_py || true)
            if [[ -n "$py" && -n "$stats2" ]]; then
              p1=$(printf '%s' "$stats1" | python3 "$py" parse-stats 2>/dev/null || echo '{}')
              p2=$(printf '%s' "$stats2" | python3 "$py" parse-stats 2>/dev/null || echo '{}')
              emit "PARSED_STATS1 ${p1}"
              emit "PARSED_STATS2 ${p2}"
              python3 - "$p1" "$p2" "$FACTS_FILE" <<'PY' 2>/dev/null || true
            import json,sys
            a=json.loads(sys.argv[1]); b=json.loads(sys.argv[2]); path=sys.argv[3]
            def d(k):
                x,y=a.get(k),b.get(k)
                if isinstance(x,int) and isinstance(y,int):
                    return max(0, y-x)
                return 0
            heap=b.get("heap_pct")
            wr=d("write_rejected")
            sr=d("search_rejected")
            upd={
              "heap_pct": heap,
              "write_rejected": b.get("write_rejected"),
              "search_rejected": b.get("search_rejected"),
              "write_rejected_delta": wr,
              "search_rejected_delta": sr,
              "write_pool": b.get("write_pool") or "",
              "breaker_parent_pct": b.get("breaker_parent_pct"),
              "breaker_tripped": b.get("breaker_tripped"),
              "disk_used_pct": b.get("disk_used_pct"),
              "gc_young_delta_ms": d("gc_young_ms"),
              "gc_old_delta_ms": d("gc_old_ms"),
            }
            try:
                cur=json.loads(open(path,encoding="utf-8").read())
            except Exception:
                cur={}
            cur.update({k:v for k,v in upd.items() if v is not None})
            open(path,"w",encoding="utf-8").write(json.dumps(cur,ensure_ascii=False,indent=2)+"\n")
            open(path+".env","w",encoding="utf-8").write(
                "HEAP=%s\nWR=%s\nSR=%s\nBRK=%s\nDISK=%s\nGC=%s\nPOOL=%s\n" % (
                    heap if heap is not None else "",
                    wr, sr,
                    b.get("breaker_tripped") or 0,
                    b.get("disk_used_pct") if b.get("disk_used_pct") is not None else "",
                    d("gc_old_ms")+d("gc_young_ms"),
                    b.get("write_pool") or "",
                )
            )
            PY
              if [[ -f "${FACTS_FILE}.env" ]]; then
                source "${FACTS_FILE}.env"
                rm -f "${FACTS_FILE}.env"
                if [[ "${HEAP:-}" =~ ^[0-9]+$ ]] && (( HEAP >= 95 )); then
                  signal ES034 high "heap_used_percent=${HEAP}"
                elif [[ "${HEAP:-}" =~ ^[0-9]+$ ]] && (( HEAP >= 85 )); then
                  signal ES034 medium "heap_used_percent=${HEAP}"
                fi
                if [[ "${WR:-0}" =~ ^[0-9]+$ ]] && (( WR > 0 )); then
                  signal ES036 high "write rejected delta=${WR} pool=${POOL:-write}"
                fi
                if [[ "${SR:-0}" =~ ^[0-9]+$ ]] && (( SR > 0 )); then
                  signal ES037 medium "search rejected delta=${SR}"
                fi
                if [[ "${BRK:-0}" =~ ^[0-9]+$ ]] && (( BRK > 0 )); then
                  signal ES038 high "circuit breaker tripped=${BRK}"
                fi
                if [[ "${DISK:-}" =~ ^[0-9]+$ ]] && (( DISK >= 95 )); then
                  signal ES070 high "fs used_pct=${DISK} flood-stage likely"
                  facts_merge '{"flood": true}'
                elif [[ "${DISK:-}" =~ ^[0-9]+$ ]] && (( DISK >= 90 )); then
                  signal ES072 medium "fs used_pct=${DISK} high watermark likely"
                fi
                if [[ "${GC:-0}" =~ ^[0-9]+$ ]] && (( GC > 2000 )); then
                  signal ES035 medium "gc time delta_ms=${GC} in ~1s window"
                fi
              fi
            else
              signal ES174 medium "local stats parse skipped"
            fi
            
            if [[ "${IS_ELECTED:-0}" == "1" ]]; then
              emit "cluster_health=local_elected"
              HF='filter_path=status,number_of_nodes,number_of_data_nodes,active_primary_shards,active_shards,relocating_shards,initializing_shards,unassigned_shards,delayed_unassigned_shards,number_of_pending_tasks,task_max_waiting_in_queue_millis,active_shards_percent_as_number,timed_out'
              health=$(es_curl 5 "$(es_base_url)/_cluster/health?${HF}" || true)
              emit "----- _cluster/health -----"
              emit "$health"
              if [[ -n "$py" && -n "$health" ]]; then
                hp=$(printf '%s' "$health" | python3 "$py" parse-health 2>/dev/null || echo '{}')
                emit "PARSED_HEALTH ${hp}"
                facts_merge "$(python3 -c 'import json,sys; print(json.dumps({"cluster_health": json.loads(sys.argv[1])}))' "$hp")"
              fi
            else
              emit "cluster_health=delegated"
            fi
            
            finish_artifact
            exit 0
        job_ip_list:
          value: "${es_node_ips}"
        job_rolling_config:
          value:
            job_rolling_execute: []
            job_rolling_expression: ''
            job_rolling_mode: 1
        job_script_list_general:
          value: ''
        job_script_list_public:
          value: ''
        job_script_param:
          value: "'${es_node1_ip}' '${es_node2_ip}' '${es_node3_ip}' '${es_http_port}' '${es_transport_port}' '${ts_run_id}' '${es_user}' '${es_pass}'"
        job_script_source:
          value: manual
        job_script_timeout:
          value: '120'
        job_script_type:
          value: '1'
        job_success_id:
          value: ''
    auto_retry:
      enable: false
      times: 1
      interval: 0
    ignore_error: true
    can_retry: true
    can_skip: false
    optional: false
    next:
    - es-ts_converge
  - id: es-ts_status
    type: ServiceActivity
    name: 快速执行脚本
    stage_name: 采集运行状态(本地master+explain抽样)
    component:
      code: job_fast_execute_script
      version: v1.2
      data:
        biz_cc_id:
          name: 业务
          value: ''
          key: "${biz_cc_id}"
          version: v1.2
          source_tag: job_fast_execute_script.biz_cc_id
        job_account:
          value: root
        job_content:
          value: |
            #!/usr/bin/env bash
            mkdir -p /tmp/es-ts-lib
            cat > /tmp/es-ts-lib/es_lib.py <<'ES_TS_LIB_PY'
            #!/usr/bin/env python3
            """Parse ES 7.x collector JSON and run cleanse cross-compare.
            
            Used by bash collectors and cleanse_artifacts.sh. No HTTP. Diagnose only.
            """
            from __future__ import annotations
            
            import json
            import os
            import sys
            from collections import Counter
            from pathlib import Path
            from typing import Any
            
            
            def _load(text: str) -> Any:
                text = (text or "").strip()
                if not text:
                    return None
                try:
                    return json.loads(text)
                except json.JSONDecodeError:
                    return None
            
            
            def parse_cat_master(text: str) -> dict[str, Any]:
                data = _load(text)
                out = {
                    "http_ok": False,
                    "auth_fail": False,
                    "local_master": "",
                    "local_master_ip": "",
                    "local_master_id": "",
                    "is_elected": False,
                }
                if data is None:
                    return out
                out["http_ok"] = True
                row = None
                if isinstance(data, list) and data:
                    row = data[0] if isinstance(data[0], dict) else None
                elif isinstance(data, dict):
                    row = data
                if not row:
                    return out
                out["local_master"] = str(row.get("node") or row.get("name") or "")
                out["local_master_ip"] = str(row.get("ip") or row.get("host") or "")
                out["local_master_id"] = str(row.get("id") or "")
                return out
            
            
            def parse_cat_nodes(text: str, local_ip: str = "") -> dict[str, Any]:
                data = _load(text)
                out = {"nodes": [], "elected": "", "elected_ip": "", "self_elected": False}
                if not isinstance(data, list):
                    return out
                for row in data:
                    if not isinstance(row, dict):
                        continue
                    name = str(row.get("name") or row.get("node") or "")
                    ip = str(row.get("ip") or "")
                    master = str(row.get("master") or "")
                    roles = str(row.get("node.role") or row.get("nodeRole") or "")
                    out["nodes"].append({"name": name, "ip": ip, "master": master, "roles": roles})
                    if master == "*":
                        out["elected"] = name
                        out["elected_ip"] = ip
                        if local_ip and (ip == local_ip):
                            out["self_elected"] = True
                return out
            
            
            def parse_local_stats(text: str) -> dict[str, Any]:
                data = _load(text)
                out = {
                    "heap_pct": None,
                    "write_rejected": None,
                    "search_rejected": None,
                    "write_pool": "",
                    "breaker_parent_pct": None,
                    "breaker_tripped": 0,
                    "disk_total": None,
                    "disk_free": None,
                    "disk_used_pct": None,
                    "index_total": None,
                    "index_time_ms": None,
                    "query_total": None,
                    "query_time_ms": None,
                    "cpu_percent": None,
                    "gc_young_ms": None,
                    "gc_old_ms": None,
                    "node_name": "",
                }
                if not isinstance(data, dict):
                    return out
                nodes = data.get("nodes") or {}
                if not isinstance(nodes, dict) or not nodes:
                    return out
                n = next(iter(nodes.values()))
                if not isinstance(n, dict):
                    return out
                out["node_name"] = str(n.get("name") or "")
                jvm = n.get("jvm") or {}
                mem = jvm.get("mem") or {}
                if "heap_used_percent" in mem:
                    out["heap_pct"] = int(mem["heap_used_percent"])
                collectors = (jvm.get("gc") or {}).get("collectors") or {}
                young = collectors.get("young") or collectors.get("ParNew") or {}
                old = collectors.get("old") or collectors.get("ConcurrentMarkSweep") or collectors.get("G1 Old Generation") or {}
                if "collection_time_in_millis" in young:
                    out["gc_young_ms"] = int(young["collection_time_in_millis"])
                if "collection_time_in_millis" in old:
                    out["gc_old_ms"] = int(old["collection_time_in_millis"])
                tp = n.get("thread_pool") or {}
                write = tp.get("write") if isinstance(tp.get("write"), dict) else None
                if write is None and isinstance(tp.get("index"), dict):
                    write = tp["index"]
                    out["write_pool"] = "index_legacy"
                else:
                    out["write_pool"] = "write"
                if write:
                    out["write_rejected"] = int(write.get("rejected") or 0)
                search = tp.get("search") if isinstance(tp.get("search"), dict) else {}
                if search:
                    out["search_rejected"] = int(search.get("rejected") or 0)
                breakers = n.get("breakers") or {}
                parent = breakers.get("parent") or {}
                if parent.get("limit_size_in_bytes") and parent.get("estimated_size_in_bytes") is not None:
                    lim = int(parent["limit_size_in_bytes"]) or 1
                    out["breaker_parent_pct"] = int(int(parent["estimated_size_in_bytes"]) * 100 / lim)
                tripped = 0
                for b in breakers.values():
                    if isinstance(b, dict):
                        tripped += int(b.get("tripped") or 0)
                out["breaker_tripped"] = tripped
                fs = (n.get("fs") or {}).get("total") or {}
                if fs.get("total_in_bytes"):
                    total = int(fs["total_in_bytes"])
                    free = int(fs.get("available_in_bytes") or fs.get("free_in_bytes") or 0)
                    out["disk_total"] = total
                    out["disk_free"] = free
                    out["disk_used_pct"] = int((total - free) * 100 / total) if total else None
                idx = (n.get("indices") or {}).get("indexing") or {}
                if "index_total" in idx:
                    out["index_total"] = int(idx["index_total"])
                    out["index_time_ms"] = int(idx.get("index_time_in_millis") or 0)
                search_m = (n.get("indices") or {}).get("search") or {}
                if "query_total" in search_m:
                    out["query_total"] = int(search_m["query_total"])
                    out["query_time_ms"] = int(search_m.get("query_time_in_millis") or 0)
                cpu = (n.get("os") or {}).get("cpu") or {}
                if "percent" in cpu:
                    out["cpu_percent"] = int(cpu["percent"])
                return out
            
            
            def parse_cluster_health(text: str) -> dict[str, Any]:
                data = _load(text)
                if not isinstance(data, dict):
                    return {}
                keys = (
                    "status",
                    "number_of_nodes",
                    "number_of_data_nodes",
                    "active_primary_shards",
                    "active_shards",
                    "relocating_shards",
                    "initializing_shards",
                    "unassigned_shards",
                    "delayed_unassigned_shards",
                    "number_of_pending_tasks",
                    "task_max_waiting_in_queue_millis",
                    "active_shards_percent_as_number",
                    "timed_out",
                )
                out: dict[str, Any] = {}
                for k in keys:
                    if k in data:
                        out[k] = data[k]
                return out
            
            
            def merge_facts(path: str, updates: dict[str, Any]) -> dict[str, Any]:
                p = Path(path)
                cur: dict[str, Any] = {}
                if p.is_file():
                    try:
                        cur = json.loads(p.read_text(encoding="utf-8"))
                    except (OSError, json.JSONDecodeError):
                        cur = {}
                cur.update({k: v for k, v in updates.items() if v is not None})
                p.parent.mkdir(parents=True, exist_ok=True)
                p.write_text(json.dumps(cur, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
                return cur
            
            
            def _read_json(path: Path) -> dict[str, Any] | None:
                if not path.is_file():
                    return None
                try:
                    data = json.loads(path.read_text(encoding="utf-8"))
                except (OSError, json.JSONDecodeError):
                    return None
                return data if isinstance(data, dict) else None
            
            
            def _read_signals(base: Path) -> list[tuple[str, str, str]]:
                rows: list[tuple[str, str, str]] = []
                for p in sorted(base.glob("*.signals")):
                    try:
                        text = p.read_text(encoding="utf-8", errors="replace")
                    except OSError:
                        continue
                    for line in text.splitlines():
                        parts = line.split("\t", 2)
                        if len(parts) >= 3 and parts[0].startswith("ES"):
                            rows.append((parts[0], parts[1], parts[2]))
                return rows
            
            
            def _sev_rank(sev: str) -> int:
                return {"high": 3, "medium": 2, "low": 1, "warning": 2}.get(sev, 0)
            
            
            def _dedup(rows: list[tuple[str, str, str]]) -> list[tuple[str, str, str]]:
                best: dict[str, tuple[str, str, str]] = {}
                order: list[str] = []
                for sid, sev, note in rows:
                    if sid not in best:
                        order.append(sid)
                        best[sid] = (sid, sev, note)
                        continue
                    old = best[sid]
                    if _sev_rank(sev) > _sev_rank(old[1]):
                        best[sid] = (sid, sev, f"{old[2]} | {note}")
                    elif note not in old[2]:
                        best[sid] = (sid, old[1], f"{old[2]} | {note}")
                return [best[k] for k in order]
            
            
            def _add(signals: list[tuple[str, str, str]], sid: str, sev: str, note: str) -> None:
                signals.append((sid, sev, note))
            
            
            def cross_compare(
                facts: dict[str, dict[str, Any]],
                expected_nodes: int,
                expected_ips: list[str],
            ) -> tuple[list[tuple[str, str, str]], dict[str, Any]]:
                extra: list[tuple[str, str, str]] = []
                collected_ips = [ip for ip in expected_ips if ip in facts]
                n_col = len(collected_ips)
                meta: dict[str, Any] = {
                    "nodes_collected": n_col,
                    "expected_nodes": expected_nodes,
                    "majority_master": "",
                    "coverage": "ok",
                    "no_master": False,
                    "evidence_gap": [],
                }
                if n_col < expected_nodes:
                    meta["coverage"] = "degraded"
                    missing = [ip for ip in expected_ips if ip not in facts]
                    meta["evidence_gap"].append("missing_nodes=" + ",".join(missing))
                    _add(extra, "ES172", "high", "nodes missing: " + ",".join(missing))
                    if n_col == 0:
                        meta["coverage"] = "empty"
            
                masters = []
                auth_na = 0
                for ip in collected_ips:
                    f = facts[ip]
                    if f.get("auth_fail"):
                        auth_na += 1
                        continue
                    masters.append((ip, str(f.get("local_master") or "")))
            
                nonempty = [m for _, m in masters if m]
                empty = [ip for ip, m in masters if not m]
                maj = ""
                if nonempty:
                    maj, cnt = Counter(nonempty).most_common(1)[0]
                    if cnt >= 2 or (expected_nodes == 1 and cnt == 1):
                        maj_ok = maj
                    else:
                        maj_ok = maj if cnt == len(nonempty) else ""
                    maj = maj_ok
                meta["majority_master"] = maj
            
                all_collected = n_col == expected_nodes and expected_nodes >= 1
                all_empty = all_collected and not nonempty and auth_na == 0
                if all_empty:
                    _add(extra, "ES050", "high", "all %s nodes have empty local_master" % n_col)
                    _add(extra, "ES191", "high", "NO_MASTER")
                    meta["no_master"] = True
                    meta["majority_master"] = ""
                elif n_col < expected_nodes and nonempty == [] and empty:
                    meta["evidence_gap"].append("NO_MASTER_OBSERVED")
                    _add(extra, "ES173", "medium", "observed nodes have no master but collection incomplete")
                elif maj and empty:
                    _add(extra, "ES051", "high", "majority master=%s disagree/empty on %s" % (maj, ",".join(empty)))
                    _add(extra, "ES199", "high", "master view split")
                elif nonempty and len(set(nonempty)) > 1:
                    _add(extra, "ES051", "high", "local_master values disagree: " + ",".join(sorted(set(nonempty))))
                    _add(extra, "ES199", "high", "master view split")
            
                health = {}
                for ip in collected_ips:
                    h = facts[ip].get("cluster_health")
                    if isinstance(h, dict) and h.get("status"):
                        health = h
                        if maj and (facts[ip].get("is_elected") or facts[ip].get("local_master") == maj):
                            break
            
                nodes_in_health = int(health.get("number_of_nodes") or 0) if health else 0
                status = str(health.get("status") or "")
                unassigned = int(health.get("unassigned_shards") or 0) if health else 0
                delayed = int(health.get("delayed_unassigned_shards") or 0) if health else 0
                pending = int(health.get("number_of_pending_tasks") or 0) if health else 0
                reloc = int(health.get("relocating_shards") or 0) if health else 0
                init = int(health.get("initializing_shards") or 0) if health else 0
            
                if delayed > 0:
                    _add(extra, "ES055", "low", "delayed_unassigned=%s" % delayed)
                if pending >= 10:
                    _add(extra, "ES056", "high", "pending_tasks=%s" % pending)
                elif pending >= 1:
                    _add(extra, "ES056", "medium", "pending_tasks=%s" % pending)
                if reloc or init:
                    _add(extra, "ES057", "medium", "relocating=%s initializing=%s" % (reloc, init))
            
                down_ips = []
                for ip in expected_ips:
                    f = facts.get(ip) or {}
                    proc = f.get("process_up")
                    http = f.get("http_ok")
                    listen = f.get("listen_http")
                    if proc is False or listen is False or http is False:
                        down_ips.append(ip)
                    elif ip not in facts:
                        down_ips.append(ip)
            
                if not meta["no_master"]:
                    if nodes_in_health and nodes_in_health < expected_nodes:
                        missing_n = expected_nodes - nodes_in_health
                        if missing_n >= 2:
                            _add(extra, "ES053", "high", "health nodes=%s expected=%s" % (nodes_in_health, expected_nodes))
                        else:
                            _add(extra, "ES052", "medium", "health nodes=%s expected=%s" % (nodes_in_health, expected_nodes))
                        _add(extra, "ES190", "high", "NODE_DOWN health_nodes=%s down_ips=%s" % (nodes_in_health, ",".join(down_ips) or "unknown"))
                    elif n_col == expected_nodes and nodes_in_health == expected_nodes and status == "yellow" and unassigned > 0:
                        _add(extra, "ES192", "medium", "YELLOW_ALLOC_NOT_DOWN unassigned=%s" % unassigned)
                    if status == "red" and not meta["no_master"] and unassigned > 0:
                        _add(extra, "ES054", "high", "red with unassigned=%s" % unassigned)
            
                if meta["no_master"] and status == "red":
                    _add(extra, "ES053", "high", "red and NO_MASTER")
            
                if expected_nodes <= 1:
                    extra = [(s, v, n + " node_count=1") if s.startswith("ES19") else (s, v, n) for s, v, n in extra]
                    extra = [x for x in extra if not (x[0] in {"ES194", "ES196", "ES198"} and expected_nodes <= 1)]
            
                heaps = [(ip, facts[ip].get("heap_pct")) for ip in collected_ips if isinstance(facts[ip].get("heap_pct"), int)]
                high_heap = [ip for ip, h in heaps if h is not None and h >= 85]
                if len(high_heap) == 1 and len(heaps) >= 2:
                    _add(extra, "ES193", "high", "HEAP_ONE_OUTLIER %s heap=%s" % (high_heap[0], dict(heaps)[high_heap[0]]))
                    _add(extra, "ES034", "high", "%s heap=%s" % (high_heap[0], dict(heaps)[high_heap[0]]))
                elif len(high_heap) >= 2:
                    _add(extra, "ES194", "high", "HEAP_ALL_SIMILAR " + ",".join("%s=%s" % (ip, dict(heaps)[ip]) for ip in high_heap))
            
                rejects = [(ip, int(facts[ip].get("write_rejected_delta") or 0) + int(facts[ip].get("search_rejected_delta") or 0)) for ip in collected_ips]
                rej_pos = [ip for ip, r in rejects if r > 0]
                if len(rej_pos) == 1 and len(rejects) >= 2:
                    _add(extra, "ES195", "medium", "REJECT_ONE %s delta=%s" % (rej_pos[0], dict(rejects)[rej_pos[0]]))
                elif len(rej_pos) >= 2:
                    _add(extra, "ES196", "high", "REJECT_ALL " + ",".join(rej_pos))
            
                floods = [ip for ip in collected_ips if facts[ip].get("flood") or facts[ip].get("read_only_allow_delete")]
                if len(floods) == 1 and n_col >= 2:
                    _add(extra, "ES197", "high", "FLOOD_ONE %s" % floods[0])
                elif len(floods) >= 2:
                    _add(extra, "ES198", "high", "FLOOD_ALL " + ",".join(floods))
            
                for ip in collected_ips:
                    f = facts[ip]
                    if f.get("http_ok") and f.get("listen_http") and f.get("transport_ok") is False:
                        _add(extra, "ES091", "high", "9200 up 9300 down on %s" % ip)
                        _add(extra, "ES199", "high", "TRANSPORT_PARTITION %s" % ip)
                    peers = f.get("peer_transport") or {}
                    if isinstance(peers, dict):
                        for peer, ok in peers.items():
                            if ok is False and (f.get("peer_http") or {}).get(peer) is True:
                                _add(extra, "ES091", "high", "%s http ok transport fail to %s" % (ip, peer))
                                _add(extra, "ES199", "high", "TRANSPORT_PARTITION %s->%s" % (ip, peer))
            
                names = [str(facts[ip].get("cluster_name") or "") for ip in collected_ips if facts[ip].get("cluster_name")]
                if names and len(set(names)) > 1:
                    _add(extra, "ES060", "high", "cluster.name disagree: " + ",".join(sorted(set(names))))
            
                alloc = [str(facts[ip].get("allocation_enable") or "") for ip in collected_ips if facts[ip].get("allocation_enable")]
                if any(a and a != "all" for a in alloc):
                    _add(extra, "ES058", "high", "allocation.enable=" + ",".join(sorted(set(alloc))))
            
                explains = []
                for ip in collected_ips:
                    ex = facts[ip].get("explain_reasons") or []
                    if isinstance(ex, list):
                        explains.extend(str(x) for x in ex)
                joined = " ".join(explains).upper()
                if "NODE_LEFT" in joined or "NODE_RESTART" in joined:
                    _add(extra, "ES052", "medium", "explain NODE_LEFT")
                if "DECIDERS_NO" in joined and ("DISK" in joined or "WATERMARK" in joined):
                    _add(extra, "ES061", "high", "explain DECIDERS_NO disk")
                if "ALLOCATION_FAILED" in joined:
                    _add(extra, "ES063", "high", "explain ALLOCATION_FAILED")
            
                if expected_nodes <= 1:
                    extra = [x for x in extra if x[0] not in {"ES194", "ES196", "ES198"}]
            
                return extra, meta
            
            
            def render_summary(
                run_id: str,
                expected_ips: list[str],
                facts: dict[str, dict[str, Any]],
                signals: list[tuple[str, str, str]],
                meta: dict[str, Any],
                health: dict[str, Any],
            ) -> str:
                lines = [
                    "# ES 7.x 三节点排查摘要",
                    "",
                    f"- run_id: `{run_id}`",
                    f"- expected_nodes: {meta.get('expected_nodes')}",
                    f"- nodes_collected: {meta.get('nodes_collected')}",
                    f"- coverage: `{meta.get('coverage')}`",
                    f"- majority_master: `{meta.get('majority_master') or ('NO_MASTER' if meta.get('no_master') else 'UNKNOWN')}`",
                    "",
                    "## 集群健康",
                    "",
                ]
                if health:
                    lines += [
                        f"- status: `{health.get('status', '')}`",
                        f"- number_of_nodes: {health.get('number_of_nodes', '')}",
                        f"- unassigned_shards: {health.get('unassigned_shards', '')}",
                        f"- delayed_unassigned_shards: {health.get('delayed_unassigned_shards', '')}",
                        f"- pending_tasks: {health.get('number_of_pending_tasks', '')}",
                        "",
                    ]
                else:
                    lines += ["- （无权威 cluster health）", ""]
                lines += [
                    "## 各节点 master 视图",
                    "",
                    "| IP | local_master | 9200 | 9300 | heap% | write_rejected_delta | disk% |",
                    "|----|--------------|------|------|-------|----------------------|-------|",
                ]
                for ip in expected_ips:
                    f = facts.get(ip) or {}
                    http = "ok" if f.get("http_ok") else ("NA" if not f else "fail")
                    tp = f.get("listen_transport")
                    trans = "ok" if tp else ("fail" if tp is False else "NA")
                    lines.append(
                        "| {ip} | {lm} | {http} | {trans} | {heap} | {wr} | {disk} |".format(
                            ip=ip,
                            lm=f.get("local_master") or ("(empty)" if f else "(missing)"),
                            http=http,
                            trans=trans,
                            heap=f.get("heap_pct") if f.get("heap_pct") is not None else "",
                            wr=f.get("write_rejected_delta") if f.get("write_rejected_delta") is not None else "",
                            disk=f.get("disk_used_pct") if f.get("disk_used_pct") is not None else "",
                        )
                    )
                lines += ["", "## Top 信号", "", "| ID | 级别 | 说明 |", "|----|------|------|"]
                if signals:
                    for sid, sev, note in signals:
                        lines.append(f"| {sid} | {sev} | {note} |")
                else:
                    lines.append("| — | — | 无自动信号 |")
                lines += ["", "## 交叉对比结论", ""]
                ids = {s[0] for s in signals}
                bullets = []
                if "ES191" in ids:
                    bullets.append("- **ES191 NO_MASTER**：三台均无 elected master，先看发现/传输/进程，不要解释 unassigned。")
                if "ES190" in ids:
                    bullets.append("- **ES190 NODE_DOWN**：健康节点数少于期望，优先掉节点而不是业务 QPS。")
                if "ES192" in ids:
                    bullets.append("- **ES192 YELLOW_ALLOC_NOT_DOWN**：三台都在集群内，副本未分配是水位/allocation/max_shards。")
                if "ES193" in ids:
                    bullets.append("- **ES193 HEAP_ONE_OUTLIER**：单节点 JVM，不是全集群容量。")
                if "ES194" in ids:
                    bullets.append("- **ES194 HEAP_ALL_SIMILAR**：多节点堆压力。")
                if "ES195" in ids:
                    bullets.append("- **ES195 REJECT_ONE**：单节点线程池拒绝。")
                if "ES196" in ids:
                    bullets.append("- **ES196 REJECT_ALL**：多节点 reject。")
                if "ES197" in ids:
                    bullets.append("- **ES197 FLOOD_ONE**：单节点磁盘 flood / 只读块。")
                if "ES198" in ids:
                    bullets.append("- **ES198 FLOOD_ALL**：集群块。")
                if "ES199" in ids:
                    bullets.append("- **ES199 TRANSPORT_PARTITION**：9200/9300 分叉或 master 视图分裂。")
                if not bullets:
                    if meta.get("coverage") == "ok" and not ids:
                        bullets.append("- 倾向 **ES001 基线正常**，或故障未落入 P0 信号。")
                    else:
                        bullets.append("- 无组合结论；见证据缺口。")
                lines.extend(bullets)
                lines += ["", "## 证据缺口", ""]
                gaps = list(meta.get("evidence_gap") or [])
                if meta.get("no_master"):
                    gaps.append("unassigned explain 不可靠（NO_MASTER）")
                if not gaps:
                    lines.append("- 无")
                else:
                    for g in gaps:
                        lines.append(f"- {g}")
                lines.append("")
                return "\n".join(lines)
            
            
            def cleanse(base: str, run_id: str, expected_ips: list[str], profile: str = "v1") -> dict[str, Any]:
                root = Path(base)
                root.mkdir(parents=True, exist_ok=True)
                facts: dict[str, dict[str, Any]] = {}
                for ip in expected_ips:
                    data = _read_json(root / f"facts.{ip}.json")
                    if data:
                        facts[ip] = data
                    master = _read_json(root / f"master.{ip}.json")
                    if master:
                        facts.setdefault(ip, {})
                        for k in ("local_master", "local_master_ip", "http_ok", "auth_fail", "is_elected"):
                            if k in master and master[k] is not None:
                                facts[ip].setdefault(k, master[k])
            
                raw = _read_signals(root)
                extra, meta = cross_compare(facts, len(expected_ips), expected_ips)
                if profile.endswith("degraded") and meta["coverage"] == "ok":
                    meta["coverage"] = "degraded"
                    meta["evidence_gap"].append("forced_degraded_profile")
                merged = _dedup(raw + extra)
                health = {}
                for ip in expected_ips:
                    h = (facts.get(ip) or {}).get("cluster_health")
                    if isinstance(h, dict) and h:
                        health = h
                        if facts[ip].get("is_elected"):
                            break
            
                kinds = ("precheck", "metrics", "status", "config", "logs", "hostnet")
                found = sum(1 for k in kinds if any(root.glob(f"{k}.*.txt")))
                if found == 0 and meta["coverage"] == "ok":
                    meta["coverage"] = "empty"
                elif found < 3 and meta["coverage"] == "ok":
                    meta["coverage"] = "degraded"
            
                summary = render_summary(run_id, expected_ips, facts, merged, meta, health)
                (root / "summary.md").write_text(summary, encoding="utf-8")
                sig_txt = "".join(f"{a}\t{b}\t{c}\n" for a, b, c in merged)
                (root / "signals.txt").write_text(sig_txt, encoding="utf-8")
                (root / "signals.uniq.tsv").write_text(sig_txt, encoding="utf-8")
            
                cleaned_parts = [
                    f"===== ES_TS cleaned run_id={run_id} profile={profile} =====",
                    f"nodes={','.join(expected_ips)}",
                    f"coverage={meta['coverage']} majority_master={meta.get('majority_master')}",
                    "",
                    "----- SIGNALS -----",
                    sig_txt or "NO_SIGNALS",
                    "",
                ]
                for p in sorted(root.glob("*.txt")):
                    if p.name in {"cleaned.txt", "signals.txt"}:
                        continue
                    body = p.read_text(encoding="utf-8", errors="replace")
                    lines = body.splitlines()
                    keep = [ln for ln in lines if ln.startswith("SIGNAL ") or ln.startswith("CMD_FAIL") or "KEYWORD" in ln]
                    if not keep:
                        keep = lines[-40:]
                    cleaned_parts.append(f"### {p.name} ###")
                    cleaned_parts.extend(keep[:80])
                    cleaned_parts.append("")
                cleaned = "\n".join(cleaned_parts)
                if len(cleaned.encode()) > 64000:
                    cleaned = cleaned.encode()[:64000].decode("utf-8", errors="ignore")
                (root / "cleaned.txt").write_text(cleaned, encoding="utf-8")
                meta_out = {
                    "run_id": run_id,
                    "profile": profile,
                    "coverage_status": meta["coverage"],
                    "nodes_collected": meta["nodes_collected"],
                    "expected_nodes": meta["expected_nodes"],
                    "majority_master": meta.get("majority_master") or "",
                    "no_master": str(bool(meta.get("no_master"))).lower(),
                    "signal_count": len(merged),
                    "kinds_found": found,
                }
                meta_txt = "".join(f"{k}={v}\n" for k, v in meta_out.items())
                (root / "cleaned.meta").write_text(meta_txt, encoding="utf-8")
                return {"meta": meta_out, "signals": merged, "summary": summary}
            
            
            def _cli(argv: list[str]) -> int:
                if len(argv) < 2:
                    print("usage: es_lib.py parse-master|parse-stats|parse-health|merge-facts|cleanse ...", file=sys.stderr)
                    return 2
                cmd = argv[1]
                if cmd == "parse-master":
                    print(json.dumps(parse_cat_master(sys.stdin.read()), ensure_ascii=False))
                    return 0
                if cmd == "parse-stats":
                    print(json.dumps(parse_local_stats(sys.stdin.read()), ensure_ascii=False))
                    return 0
                if cmd == "parse-health":
                    print(json.dumps(parse_cluster_health(sys.stdin.read()), ensure_ascii=False))
                    return 0
                if cmd == "parse-nodes":
                    local_ip = argv[2] if len(argv) > 2 else ""
                    print(json.dumps(parse_cat_nodes(sys.stdin.read(), local_ip), ensure_ascii=False))
                    return 0
                if cmd == "merge-facts":
                    path = argv[2]
                    updates = json.loads(argv[3] if len(argv) > 3 else sys.stdin.read())
                    print(json.dumps(merge_facts(path, updates), ensure_ascii=False))
                    return 0
                if cmd == "cleanse":
                    base, run_id = argv[2], argv[3]
                    ips = argv[4:]
                    profile = os.environ.get("TS_PROFILE", "v1")
                    result = cleanse(base, run_id, ips, profile)
                    print(json.dumps(result["meta"], ensure_ascii=False))
                    return 0
                print("unknown command", cmd, file=sys.stderr)
                return 2
            
            
            if __name__ == "__main__":
                sys.exit(_cli(sys.argv))
            ES_TS_LIB_PY
            # Shared helpers for ES 7.x troubleshooting collectors. Sourced, not executed.
            # Collectors always exit 0. Do not mutate the cluster.
            
            umask 077
            
            json_escape() {
              local s=${1-}
              s=${s//\\/\\\\}
              s=${s//\"/\\\"}
              s=${s//$'\n'/\\n}
              s=${s//$'\r'/\\r}
              s=${s//$'\t'/\\t}
              printf '%s' "$s"
            }
            
            ts_now() { date -u +"%Y-%m-%dT%H:%M:%SZ"; }
            
            resolve_local_ip() {
              local node1=$1 node2=$2 node3=$3
              local local_ips target_ip=""
              local_ips=$(hostname -I 2>/dev/null || true)
              for ip in "$node1" "$node2" "$node3"; do
                [[ " ${local_ips} " == *" ${ip} "* ]] && target_ip=$ip && break
              done
              if [[ -z "$target_ip" ]]; then
                target_ip=$(hostname -I 2>/dev/null | awk '{print $1}')
              fi
              printf '%s' "${target_ip:-unknown}"
            }
            
            artifact_dir_for() {
              local run_id=$1
              local base=${TS_ARTIFACT_DIR:-/tmp/es-troubleshoot}
              printf '%s/%s' "$base" "$run_id"
            }
            
            es_lib_py() {
              local here=${SCRIPT_DIR:-}
              if [[ -n "$here" && -f "${here}/es_lib.py" ]]; then
                printf '%s' "${here}/es_lib.py"
                return 0
              fi
              if [[ -f /tmp/es-ts-lib/es_lib.py ]]; then
                printf '%s' /tmp/es-ts-lib/es_lib.py
                return 0
              fi
              return 1
            }
            
            begin_artifact() {
              local kind=$1 node=$2 run_id=$3
              ARTIFACT_KIND=$kind
              ARTIFACT_NODE=$node
              ARTIFACT_RUN_ID=$run_id
              ARTIFACT_DIR=$(artifact_dir_for "$run_id")
              mkdir -p "$ARTIFACT_DIR"
              ARTIFACT_FILE="${ARTIFACT_DIR}/${kind}.${node}.txt"
              SIGNAL_FILE="${ARTIFACT_DIR}/${kind}.${node}.signals"
              FACTS_FILE="${ARTIFACT_DIR}/facts.${node}.json"
              MASTER_FILE="${ARTIFACT_DIR}/master.${node}.json"
              : > "$ARTIFACT_FILE"
              : > "$SIGNAL_FILE"
              {
                echo "===== ES_TS artifact=${kind} node=${node} ts=$(ts_now) run_id=${run_id} ====="
                echo "hostname=$(hostname 2>/dev/null || echo unknown)"
              } >> "$ARTIFACT_FILE"
            }
            
            emit() {
              printf '%s\n' "$*" >> "$ARTIFACT_FILE"
            }
            
            emit_cmd() {
              local title=$1
              local rc=0
              shift
              emit "----- ${title} -----"
              "$@" >> "$ARTIFACT_FILE" 2>&1
              rc=$?
              if (( rc != 0 )); then
                emit "CMD_FAIL: ${title} rc=${rc}"
                return 1
              fi
              return 0
            }
            
            emit_cmd_timeout() {
              local seconds=$1 title=$2
              shift 2
              emit "----- ${title} (timeout ${seconds}s) -----"
              if command -v timeout >/dev/null 2>&1; then
                if ! timeout "$seconds" "$@" >> "$ARTIFACT_FILE" 2>&1; then
                  emit "CMD_FAIL_OR_TIMEOUT: ${title}"
                  signal ES174 low "timeout ${title}"
                  return 1
                fi
              else
                if ! "$@" >> "$ARTIFACT_FILE" 2>&1; then
                  emit "CMD_FAIL: ${title}"
                  return 1
                fi
              fi
              return 0
            }
            
            signal() {
              printf '%s\t%s\t%s\n' "$1" "$2" "$3" >> "$SIGNAL_FILE"
              emit "SIGNAL ${1} severity=${2} ${3}"
            }
            
            finish_artifact() {
              emit "===== END ES_TS artifact=${ARTIFACT_KIND} node=${ARTIFACT_NODE} ====="
              echo "###ES_TS_ARTIFACT kind=${ARTIFACT_KIND} node=${ARTIFACT_NODE} file=${ARTIFACT_FILE}###"
              cat "$ARTIFACT_FILE"
              echo "###ES_TS_SIGNALS kind=${ARTIFACT_KIND} node=${ARTIFACT_NODE}###"
              cat "$SIGNAL_FILE"
              echo "###END_ES_TS_ARTIFACT###"
            }
            
            es_curl() {
              # es_curl <seconds> <url> [curl extra...]
              local seconds=$1
              shift
              local url=$1
              shift
              local args=(-sS --max-time "$seconds" --connect-timeout 3 -H 'Accept: application/json')
              if [[ -n "${ES_USER:-}" ]]; then
                args+=(-u "${ES_USER}:${ES_PASS:-}")
              fi
              curl "${args[@]}" "$@" "$url" 2>/dev/null
            }
            
            es_base_url() {
              printf 'http://127.0.0.1:%s' "${ES_HTTP_PORT:-9200}"
            }
            
            facts_merge() {
              local json=$1
              local py
              py=$(es_lib_py) || return 0
              python3 "$py" merge-facts "$FACTS_FILE" "$json" >/dev/null 2>&1 || true
            }
            
            record_local_master() {
              local url
              url="$(es_base_url)/_cat/master?h=id,host,ip,node&format=json"
              local body rc=0
              body=$(es_curl 3 "$url" -w '\nHTTP_CODE:%{http_code}\n') || rc=$?
              local code
              code=$(printf '%s\n' "$body" | awk -F: '/HTTP_CODE:/{print $2}' | tail -n1)
              local json
              json=$(printf '%s\n' "$body" | sed '/HTTP_CODE:/d')
              emit "----- local _cat/master http=${code:-na} rc=${rc} -----"
              emit "$json"
            
              local parsed="{}"
              local py
              py=$(es_lib_py) || true
              if [[ -n "$py" ]]; then
                parsed=$(printf '%s' "$json" | python3 "$py" parse-master 2>/dev/null || echo '{}')
              fi
              local http_ok=false auth_fail=false local_master="" local_ip=""
              if [[ "$code" == "401" || "$code" == "403" ]]; then
                auth_fail=true
                signal ES032 high "local HTTP auth failed code=${code}"
              elif [[ "$code" == "200" ]]; then
                http_ok=true
              else
                signal ES032 medium "local _cat/master failed code=${code:-na} rc=${rc}"
              fi
              if [[ "$http_ok" == true ]]; then
                local_master=$(python3 -c 'import json,sys; d=json.loads(sys.argv[1]); print(d.get("local_master",""))' "$parsed" 2>/dev/null || true)
                local_ip=$(python3 -c 'import json,sys; d=json.loads(sys.argv[1]); print(d.get("local_master_ip",""))' "$parsed" 2>/dev/null || true)
              fi
              emit "local_master=${local_master}"
              emit "local_master_ip=${local_ip}"
            
              local nodes_json=""
              nodes_json=$(es_curl 3 "$(es_base_url)/_cat/nodes?h=id,name,ip,master,node.role&format=json" || true)
              emit "----- local _cat/nodes -----"
              emit "$nodes_json"
              local self_elected=false
              if [[ -n "$py" && -n "$nodes_json" ]]; then
                local nodes_parsed
                nodes_parsed=$(printf '%s' "$nodes_json" | python3 "$py" parse-nodes "$ARTIFACT_NODE" 2>/dev/null || echo '{}')
                if python3 -c 'import json,sys; raise SystemExit(0 if json.loads(sys.argv[1]).get("self_elected") else 1)' "$nodes_parsed" 2>/dev/null; then
                  self_elected=true
                fi
              fi
              if [[ "$self_elected" != true && -n "$local_ip" && "$local_ip" == "$ARTIFACT_NODE" ]]; then
                self_elected=true
              fi
              emit "is_elected=${self_elected}"
            
              mkdir -p "$ARTIFACT_DIR"
              python3 - "$MASTER_FILE" "$ARTIFACT_NODE" "$local_master" "$local_ip" "$http_ok" "$auth_fail" "$self_elected" <<'PY' 2>/dev/null || true
            import json,sys
            path, node, lm, lip, http_ok, auth, elected = sys.argv[1:8]
            doc = {
              "node": node,
              "local_master": lm,
              "local_master_ip": lip,
              "http_ok": http_ok == "true",
              "auth_fail": auth == "true",
              "is_elected": elected == "true",
            }
            open(path,"w",encoding="utf-8").write(json.dumps(doc, ensure_ascii=False, indent=2)+"\n")
            PY
              facts_merge "$(python3 -c 'import json,sys; print(json.dumps({"local_master":sys.argv[1],"local_master_ip":sys.argv[2],"http_ok":sys.argv[3]=="true","auth_fail":sys.argv[4]=="true","is_elected":sys.argv[5]=="true","node":sys.argv[6]}))' \
                "$local_master" "$local_ip" "$http_ok" "$auth_fail" "$self_elected" "$ARTIFACT_NODE")"
              if [[ "$self_elected" == true ]]; then
                IS_ELECTED=1
              else
                IS_ELECTED=0
              fi
            }
            
            listen_port() {
              local port=$1
              if command -v ss >/dev/null 2>&1; then
                ss -lnt 2>/dev/null | awk '{print $4}' | grep -q ":${port}$"
                return $?
              fi
              netstat -lnt 2>/dev/null | grep -q ":${port} "
            }
            
            tcp_probe() {
              local host=$1 port=$2
              if timeout 2 bash -c "echo >/dev/tcp/${host}/${port}" 2>/dev/null; then
                return 0
              fi
              if command -v nc >/dev/null 2>&1; then
                nc -z -w 2 "$host" "$port" >/dev/null 2>&1 && return 0
              fi
              return 1
            }
            
            es_process_up() {
              # Character class so pgrep does not match its own argv.
              pgrep -f '[o]rg.elasticsearch.bootstrap.Elasticsearch' >/dev/null 2>&1 && return 0
              pgrep -x elasticsearch >/dev/null 2>&1 && return 0
              return 1
            }
            # S 运行状态：每台本地 master 视图；仅 elected master 抽样 shards + allocation/explain。
            set -uo pipefail
            
            node1=${1:-}
            node2=${2:-}
            node3=${3:-}
            ES_HTTP_PORT=${4:-9200}
            ES_TRANSPORT_PORT=${5:-9300}
            run_id=${6:-manual}
            ES_USER=${7:-${ES_USER:-}}
            ES_PASS=${8:-${ES_PASS:-}}
            export ES_HTTP_PORT ES_USER ES_PASS
            
            target_ip=$(resolve_local_ip "$node1" "$node2" "$node3")
            begin_artifact status "$target_ip" "$run_id"
            emit "collector=status"
            
            record_local_master
            
            if [[ "${IS_ELECTED:-0}" != "1" ]]; then
              emit "EXPLAIN_SKIPPED=not_elected"
              finish_artifact
              exit 0
            fi
            
            shards=$(es_curl 10 "$(es_base_url)/_cat/shards?h=index,shard,prirep,state,unassigned.reason,node&format=json" || true)
            printf '%s' "$shards" > "${ARTIFACT_DIR}/shards.raw.json"
            emit "----- _cat/shards filtered -----"
            python3 - "$FACTS_FILE" "${ARTIFACT_DIR}/shards.raw.json" "${ARTIFACT_DIR}/shards.keep.json" <<'PY' >> "$ARTIFACT_FILE" 2>&1 || true
            import json, sys
            path, rawp, keepp = sys.argv[1], sys.argv[2], sys.argv[3]
            try:
                rows = json.loads(open(rawp, encoding="utf-8").read() or "[]")
            except Exception:
                rows = []
            keep = []
            if isinstance(rows, list):
                for r in rows:
                    st = str(r.get("state") or "").upper()
                    if st in {"UNASSIGNED", "RELOCATING", "INITIALIZING"}:
                        keep.append(r)
            keep = keep[:200]
            open(keepp, "w", encoding="utf-8").write(json.dumps(keep, ensure_ascii=False))
            print(json.dumps(keep[:20], ensure_ascii=False, indent=2))
            reasons = []
            for r in keep:
                u = str(r.get("unassigned.reason") or "")
                if u:
                    reasons.append(u)
            try:
                cur = json.loads(open(path, encoding="utf-8").read())
            except Exception:
                cur = {}
            if reasons:
                cur["explain_reasons"] = list(dict.fromkeys((cur.get("explain_reasons") or []) + reasons))
            cur["unassigned_sample_n"] = len(keep)
            open(path, "w", encoding="utf-8").write(json.dumps(cur, ensure_ascii=False, indent=2) + "\n")
            PY
            
            n=0
            if [[ -s "${ARTIFACT_DIR}/shards.keep.json" ]]; then
              mapfile -t EXPLAIN_ROWS < <(python3 - "${ARTIFACT_DIR}/shards.keep.json" <<'PY'
            import json, sys
            try:
                keep = json.loads(open(sys.argv[1], encoding="utf-8").read())
            except Exception:
                keep = []
            for r in keep[:5]:
                print("%s\t%s\t%s" % (r.get("index", ""), r.get("shard", "0"), r.get("prirep", "p")))
            PY
            )
              for row in "${EXPLAIN_ROWS[@]:-}"; do
                [[ -z "${row:-}" ]] && continue
                IFS=$'\t' read -r idx shard pri <<<"$row"
                [[ -z "$idx" ]] && continue
                n=$((n + 1))
                body=$(python3 -c 'import json,sys; print(json.dumps({"index":sys.argv[1],"shard":int(float(sys.argv[2])),"primary": sys.argv[3].lower().startswith("p")}))' "$idx" "$shard" "$pri")
                expl=$(es_curl 5 "$(es_base_url)/_cluster/allocation/explain?include_yes_decisions=false" \
                  -H 'Content-Type: application/json' -X GET -d "$body" || true)
                if [[ -z "$expl" ]] || printf '%s' "$expl" | grep -q '"error"'; then
                  expl=$(es_curl 5 "$(es_base_url)/_cluster/allocation/explain?include_yes_decisions=false" \
                    -H 'Content-Type: application/json' -X POST -d "$body" || true)
                fi
                emit "----- allocation/explain ${idx} ${shard} ${pri} -----"
                printf '%s\n' "$expl" | head -c 4000 >> "$ARTIFACT_FILE"
                echo >> "$ARTIFACT_FILE"
                if printf '%s' "$expl" | grep -qiE 'NODE_LEFT|NODE_RESTART'; then
                  signal ES052 medium "explain NODE_LEFT ${idx}"
                fi
                if printf '%s' "$expl" | grep -qi 'DECIDERS_NO'; then
                  if printf '%s' "$expl" | grep -qiE 'disk|watermark'; then
                    signal ES061 high "explain DECIDERS_NO disk ${idx}"
                  else
                    signal ES062 medium "explain DECIDERS_NO ${idx}"
                  fi
                fi
                if printf '%s' "$expl" | grep -qi 'ALLOCATION_FAILED'; then
                  signal ES063 high "explain ALLOCATION_FAILED ${idx}"
                fi
              done
            fi
            
            if (( n == 0 )); then
              expl=$(es_curl 5 "$(es_base_url)/_cluster/allocation/explain?include_yes_decisions=false" || true)
              emit "----- allocation/explain first-unassigned -----"
              printf '%s\n' "$expl" | head -c 4000 >> "$ARTIFACT_FILE"
              echo >> "$ARTIFACT_FILE"
            fi
            
            settings=$(es_curl 8 "$(es_base_url)/_all/_settings?flat_settings=true&filter_path=**.index.blocks*" || true)
            emit "----- index.blocks (truncated) -----"
            printf '%s\n' "$settings" | head -c 8000 >> "$ARTIFACT_FILE"
            echo >> "$ARTIFACT_FILE"
            if printf '%s' "$settings" | grep -q 'read_only_allow_delete'; then
              signal ES071 high "index.blocks.read_only_allow_delete present"
              facts_merge '{"read_only_allow_delete": true}'
            fi
            
            finish_artifact
            exit 0
        job_ip_list:
          value: "${es_node_ips}"
        job_rolling_config:
          value:
            job_rolling_execute: []
            job_rolling_expression: ''
            job_rolling_mode: 1
        job_script_list_general:
          value: ''
        job_script_list_public:
          value: ''
        job_script_param:
          value: "'${es_node1_ip}' '${es_node2_ip}' '${es_node3_ip}' '${es_http_port}' '${es_transport_port}' '${ts_run_id}' '${es_user}' '${es_pass}'"
        job_script_source:
          value: manual
        job_script_timeout:
          value: '120'
        job_script_type:
          value: '1'
        job_success_id:
          value: ''
    auto_retry:
      enable: false
      times: 1
      interval: 0
    ignore_error: true
    can_retry: true
    can_skip: false
    optional: false
    next:
    - es-ts_converge
  - id: es-ts_config
    type: ServiceActivity
    name: 快速执行脚本
    stage_name: 采集配置关键项
    component:
      code: job_fast_execute_script
      version: v1.2
      data:
        biz_cc_id:
          name: 业务
          value: ''
          key: "${biz_cc_id}"
          version: v1.2
          source_tag: job_fast_execute_script.biz_cc_id
        job_account:
          value: root
        job_content:
          value: |
            #!/usr/bin/env bash
            mkdir -p /tmp/es-ts-lib
            cat > /tmp/es-ts-lib/es_lib.py <<'ES_TS_LIB_PY'
            #!/usr/bin/env python3
            """Parse ES 7.x collector JSON and run cleanse cross-compare.
            
            Used by bash collectors and cleanse_artifacts.sh. No HTTP. Diagnose only.
            """
            from __future__ import annotations
            
            import json
            import os
            import sys
            from collections import Counter
            from pathlib import Path
            from typing import Any
            
            
            def _load(text: str) -> Any:
                text = (text or "").strip()
                if not text:
                    return None
                try:
                    return json.loads(text)
                except json.JSONDecodeError:
                    return None
            
            
            def parse_cat_master(text: str) -> dict[str, Any]:
                data = _load(text)
                out = {
                    "http_ok": False,
                    "auth_fail": False,
                    "local_master": "",
                    "local_master_ip": "",
                    "local_master_id": "",
                    "is_elected": False,
                }
                if data is None:
                    return out
                out["http_ok"] = True
                row = None
                if isinstance(data, list) and data:
                    row = data[0] if isinstance(data[0], dict) else None
                elif isinstance(data, dict):
                    row = data
                if not row:
                    return out
                out["local_master"] = str(row.get("node") or row.get("name") or "")
                out["local_master_ip"] = str(row.get("ip") or row.get("host") or "")
                out["local_master_id"] = str(row.get("id") or "")
                return out
            
            
            def parse_cat_nodes(text: str, local_ip: str = "") -> dict[str, Any]:
                data = _load(text)
                out = {"nodes": [], "elected": "", "elected_ip": "", "self_elected": False}
                if not isinstance(data, list):
                    return out
                for row in data:
                    if not isinstance(row, dict):
                        continue
                    name = str(row.get("name") or row.get("node") or "")
                    ip = str(row.get("ip") or "")
                    master = str(row.get("master") or "")
                    roles = str(row.get("node.role") or row.get("nodeRole") or "")
                    out["nodes"].append({"name": name, "ip": ip, "master": master, "roles": roles})
                    if master == "*":
                        out["elected"] = name
                        out["elected_ip"] = ip
                        if local_ip and (ip == local_ip):
                            out["self_elected"] = True
                return out
            
            
            def parse_local_stats(text: str) -> dict[str, Any]:
                data = _load(text)
                out = {
                    "heap_pct": None,
                    "write_rejected": None,
                    "search_rejected": None,
                    "write_pool": "",
                    "breaker_parent_pct": None,
                    "breaker_tripped": 0,
                    "disk_total": None,
                    "disk_free": None,
                    "disk_used_pct": None,
                    "index_total": None,
                    "index_time_ms": None,
                    "query_total": None,
                    "query_time_ms": None,
                    "cpu_percent": None,
                    "gc_young_ms": None,
                    "gc_old_ms": None,
                    "node_name": "",
                }
                if not isinstance(data, dict):
                    return out
                nodes = data.get("nodes") or {}
                if not isinstance(nodes, dict) or not nodes:
                    return out
                n = next(iter(nodes.values()))
                if not isinstance(n, dict):
                    return out
                out["node_name"] = str(n.get("name") or "")
                jvm = n.get("jvm") or {}
                mem = jvm.get("mem") or {}
                if "heap_used_percent" in mem:
                    out["heap_pct"] = int(mem["heap_used_percent"])
                collectors = (jvm.get("gc") or {}).get("collectors") or {}
                young = collectors.get("young") or collectors.get("ParNew") or {}
                old = collectors.get("old") or collectors.get("ConcurrentMarkSweep") or collectors.get("G1 Old Generation") or {}
                if "collection_time_in_millis" in young:
                    out["gc_young_ms"] = int(young["collection_time_in_millis"])
                if "collection_time_in_millis" in old:
                    out["gc_old_ms"] = int(old["collection_time_in_millis"])
                tp = n.get("thread_pool") or {}
                write = tp.get("write") if isinstance(tp.get("write"), dict) else None
                if write is None and isinstance(tp.get("index"), dict):
                    write = tp["index"]
                    out["write_pool"] = "index_legacy"
                else:
                    out["write_pool"] = "write"
                if write:
                    out["write_rejected"] = int(write.get("rejected") or 0)
                search = tp.get("search") if isinstance(tp.get("search"), dict) else {}
                if search:
                    out["search_rejected"] = int(search.get("rejected") or 0)
                breakers = n.get("breakers") or {}
                parent = breakers.get("parent") or {}
                if parent.get("limit_size_in_bytes") and parent.get("estimated_size_in_bytes") is not None:
                    lim = int(parent["limit_size_in_bytes"]) or 1
                    out["breaker_parent_pct"] = int(int(parent["estimated_size_in_bytes"]) * 100 / lim)
                tripped = 0
                for b in breakers.values():
                    if isinstance(b, dict):
                        tripped += int(b.get("tripped") or 0)
                out["breaker_tripped"] = tripped
                fs = (n.get("fs") or {}).get("total") or {}
                if fs.get("total_in_bytes"):
                    total = int(fs["total_in_bytes"])
                    free = int(fs.get("available_in_bytes") or fs.get("free_in_bytes") or 0)
                    out["disk_total"] = total
                    out["disk_free"] = free
                    out["disk_used_pct"] = int((total - free) * 100 / total) if total else None
                idx = (n.get("indices") or {}).get("indexing") or {}
                if "index_total" in idx:
                    out["index_total"] = int(idx["index_total"])
                    out["index_time_ms"] = int(idx.get("index_time_in_millis") or 0)
                search_m = (n.get("indices") or {}).get("search") or {}
                if "query_total" in search_m:
                    out["query_total"] = int(search_m["query_total"])
                    out["query_time_ms"] = int(search_m.get("query_time_in_millis") or 0)
                cpu = (n.get("os") or {}).get("cpu") or {}
                if "percent" in cpu:
                    out["cpu_percent"] = int(cpu["percent"])
                return out
            
            
            def parse_cluster_health(text: str) -> dict[str, Any]:
                data = _load(text)
                if not isinstance(data, dict):
                    return {}
                keys = (
                    "status",
                    "number_of_nodes",
                    "number_of_data_nodes",
                    "active_primary_shards",
                    "active_shards",
                    "relocating_shards",
                    "initializing_shards",
                    "unassigned_shards",
                    "delayed_unassigned_shards",
                    "number_of_pending_tasks",
                    "task_max_waiting_in_queue_millis",
                    "active_shards_percent_as_number",
                    "timed_out",
                )
                out: dict[str, Any] = {}
                for k in keys:
                    if k in data:
                        out[k] = data[k]
                return out
            
            
            def merge_facts(path: str, updates: dict[str, Any]) -> dict[str, Any]:
                p = Path(path)
                cur: dict[str, Any] = {}
                if p.is_file():
                    try:
                        cur = json.loads(p.read_text(encoding="utf-8"))
                    except (OSError, json.JSONDecodeError):
                        cur = {}
                cur.update({k: v for k, v in updates.items() if v is not None})
                p.parent.mkdir(parents=True, exist_ok=True)
                p.write_text(json.dumps(cur, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
                return cur
            
            
            def _read_json(path: Path) -> dict[str, Any] | None:
                if not path.is_file():
                    return None
                try:
                    data = json.loads(path.read_text(encoding="utf-8"))
                except (OSError, json.JSONDecodeError):
                    return None
                return data if isinstance(data, dict) else None
            
            
            def _read_signals(base: Path) -> list[tuple[str, str, str]]:
                rows: list[tuple[str, str, str]] = []
                for p in sorted(base.glob("*.signals")):
                    try:
                        text = p.read_text(encoding="utf-8", errors="replace")
                    except OSError:
                        continue
                    for line in text.splitlines():
                        parts = line.split("\t", 2)
                        if len(parts) >= 3 and parts[0].startswith("ES"):
                            rows.append((parts[0], parts[1], parts[2]))
                return rows
            
            
            def _sev_rank(sev: str) -> int:
                return {"high": 3, "medium": 2, "low": 1, "warning": 2}.get(sev, 0)
            
            
            def _dedup(rows: list[tuple[str, str, str]]) -> list[tuple[str, str, str]]:
                best: dict[str, tuple[str, str, str]] = {}
                order: list[str] = []
                for sid, sev, note in rows:
                    if sid not in best:
                        order.append(sid)
                        best[sid] = (sid, sev, note)
                        continue
                    old = best[sid]
                    if _sev_rank(sev) > _sev_rank(old[1]):
                        best[sid] = (sid, sev, f"{old[2]} | {note}")
                    elif note not in old[2]:
                        best[sid] = (sid, old[1], f"{old[2]} | {note}")
                return [best[k] for k in order]
            
            
            def _add(signals: list[tuple[str, str, str]], sid: str, sev: str, note: str) -> None:
                signals.append((sid, sev, note))
            
            
            def cross_compare(
                facts: dict[str, dict[str, Any]],
                expected_nodes: int,
                expected_ips: list[str],
            ) -> tuple[list[tuple[str, str, str]], dict[str, Any]]:
                extra: list[tuple[str, str, str]] = []
                collected_ips = [ip for ip in expected_ips if ip in facts]
                n_col = len(collected_ips)
                meta: dict[str, Any] = {
                    "nodes_collected": n_col,
                    "expected_nodes": expected_nodes,
                    "majority_master": "",
                    "coverage": "ok",
                    "no_master": False,
                    "evidence_gap": [],
                }
                if n_col < expected_nodes:
                    meta["coverage"] = "degraded"
                    missing = [ip for ip in expected_ips if ip not in facts]
                    meta["evidence_gap"].append("missing_nodes=" + ",".join(missing))
                    _add(extra, "ES172", "high", "nodes missing: " + ",".join(missing))
                    if n_col == 0:
                        meta["coverage"] = "empty"
            
                masters = []
                auth_na = 0
                for ip in collected_ips:
                    f = facts[ip]
                    if f.get("auth_fail"):
                        auth_na += 1
                        continue
                    masters.append((ip, str(f.get("local_master") or "")))
            
                nonempty = [m for _, m in masters if m]
                empty = [ip for ip, m in masters if not m]
                maj = ""
                if nonempty:
                    maj, cnt = Counter(nonempty).most_common(1)[0]
                    if cnt >= 2 or (expected_nodes == 1 and cnt == 1):
                        maj_ok = maj
                    else:
                        maj_ok = maj if cnt == len(nonempty) else ""
                    maj = maj_ok
                meta["majority_master"] = maj
            
                all_collected = n_col == expected_nodes and expected_nodes >= 1
                all_empty = all_collected and not nonempty and auth_na == 0
                if all_empty:
                    _add(extra, "ES050", "high", "all %s nodes have empty local_master" % n_col)
                    _add(extra, "ES191", "high", "NO_MASTER")
                    meta["no_master"] = True
                    meta["majority_master"] = ""
                elif n_col < expected_nodes and nonempty == [] and empty:
                    meta["evidence_gap"].append("NO_MASTER_OBSERVED")
                    _add(extra, "ES173", "medium", "observed nodes have no master but collection incomplete")
                elif maj and empty:
                    _add(extra, "ES051", "high", "majority master=%s disagree/empty on %s" % (maj, ",".join(empty)))
                    _add(extra, "ES199", "high", "master view split")
                elif nonempty and len(set(nonempty)) > 1:
                    _add(extra, "ES051", "high", "local_master values disagree: " + ",".join(sorted(set(nonempty))))
                    _add(extra, "ES199", "high", "master view split")
            
                health = {}
                for ip in collected_ips:
                    h = facts[ip].get("cluster_health")
                    if isinstance(h, dict) and h.get("status"):
                        health = h
                        if maj and (facts[ip].get("is_elected") or facts[ip].get("local_master") == maj):
                            break
            
                nodes_in_health = int(health.get("number_of_nodes") or 0) if health else 0
                status = str(health.get("status") or "")
                unassigned = int(health.get("unassigned_shards") or 0) if health else 0
                delayed = int(health.get("delayed_unassigned_shards") or 0) if health else 0
                pending = int(health.get("number_of_pending_tasks") or 0) if health else 0
                reloc = int(health.get("relocating_shards") or 0) if health else 0
                init = int(health.get("initializing_shards") or 0) if health else 0
            
                if delayed > 0:
                    _add(extra, "ES055", "low", "delayed_unassigned=%s" % delayed)
                if pending >= 10:
                    _add(extra, "ES056", "high", "pending_tasks=%s" % pending)
                elif pending >= 1:
                    _add(extra, "ES056", "medium", "pending_tasks=%s" % pending)
                if reloc or init:
                    _add(extra, "ES057", "medium", "relocating=%s initializing=%s" % (reloc, init))
            
                down_ips = []
                for ip in expected_ips:
                    f = facts.get(ip) or {}
                    proc = f.get("process_up")
                    http = f.get("http_ok")
                    listen = f.get("listen_http")
                    if proc is False or listen is False or http is False:
                        down_ips.append(ip)
                    elif ip not in facts:
                        down_ips.append(ip)
            
                if not meta["no_master"]:
                    if nodes_in_health and nodes_in_health < expected_nodes:
                        missing_n = expected_nodes - nodes_in_health
                        if missing_n >= 2:
                            _add(extra, "ES053", "high", "health nodes=%s expected=%s" % (nodes_in_health, expected_nodes))
                        else:
                            _add(extra, "ES052", "medium", "health nodes=%s expected=%s" % (nodes_in_health, expected_nodes))
                        _add(extra, "ES190", "high", "NODE_DOWN health_nodes=%s down_ips=%s" % (nodes_in_health, ",".join(down_ips) or "unknown"))
                    elif n_col == expected_nodes and nodes_in_health == expected_nodes and status == "yellow" and unassigned > 0:
                        _add(extra, "ES192", "medium", "YELLOW_ALLOC_NOT_DOWN unassigned=%s" % unassigned)
                    if status == "red" and not meta["no_master"] and unassigned > 0:
                        _add(extra, "ES054", "high", "red with unassigned=%s" % unassigned)
            
                if meta["no_master"] and status == "red":
                    _add(extra, "ES053", "high", "red and NO_MASTER")
            
                if expected_nodes <= 1:
                    extra = [(s, v, n + " node_count=1") if s.startswith("ES19") else (s, v, n) for s, v, n in extra]
                    extra = [x for x in extra if not (x[0] in {"ES194", "ES196", "ES198"} and expected_nodes <= 1)]
            
                heaps = [(ip, facts[ip].get("heap_pct")) for ip in collected_ips if isinstance(facts[ip].get("heap_pct"), int)]
                high_heap = [ip for ip, h in heaps if h is not None and h >= 85]
                if len(high_heap) == 1 and len(heaps) >= 2:
                    _add(extra, "ES193", "high", "HEAP_ONE_OUTLIER %s heap=%s" % (high_heap[0], dict(heaps)[high_heap[0]]))
                    _add(extra, "ES034", "high", "%s heap=%s" % (high_heap[0], dict(heaps)[high_heap[0]]))
                elif len(high_heap) >= 2:
                    _add(extra, "ES194", "high", "HEAP_ALL_SIMILAR " + ",".join("%s=%s" % (ip, dict(heaps)[ip]) for ip in high_heap))
            
                rejects = [(ip, int(facts[ip].get("write_rejected_delta") or 0) + int(facts[ip].get("search_rejected_delta") or 0)) for ip in collected_ips]
                rej_pos = [ip for ip, r in rejects if r > 0]
                if len(rej_pos) == 1 and len(rejects) >= 2:
                    _add(extra, "ES195", "medium", "REJECT_ONE %s delta=%s" % (rej_pos[0], dict(rejects)[rej_pos[0]]))
                elif len(rej_pos) >= 2:
                    _add(extra, "ES196", "high", "REJECT_ALL " + ",".join(rej_pos))
            
                floods = [ip for ip in collected_ips if facts[ip].get("flood") or facts[ip].get("read_only_allow_delete")]
                if len(floods) == 1 and n_col >= 2:
                    _add(extra, "ES197", "high", "FLOOD_ONE %s" % floods[0])
                elif len(floods) >= 2:
                    _add(extra, "ES198", "high", "FLOOD_ALL " + ",".join(floods))
            
                for ip in collected_ips:
                    f = facts[ip]
                    if f.get("http_ok") and f.get("listen_http") and f.get("transport_ok") is False:
                        _add(extra, "ES091", "high", "9200 up 9300 down on %s" % ip)
                        _add(extra, "ES199", "high", "TRANSPORT_PARTITION %s" % ip)
                    peers = f.get("peer_transport") or {}
                    if isinstance(peers, dict):
                        for peer, ok in peers.items():
                            if ok is False and (f.get("peer_http") or {}).get(peer) is True:
                                _add(extra, "ES091", "high", "%s http ok transport fail to %s" % (ip, peer))
                                _add(extra, "ES199", "high", "TRANSPORT_PARTITION %s->%s" % (ip, peer))
            
                names = [str(facts[ip].get("cluster_name") or "") for ip in collected_ips if facts[ip].get("cluster_name")]
                if names and len(set(names)) > 1:
                    _add(extra, "ES060", "high", "cluster.name disagree: " + ",".join(sorted(set(names))))
            
                alloc = [str(facts[ip].get("allocation_enable") or "") for ip in collected_ips if facts[ip].get("allocation_enable")]
                if any(a and a != "all" for a in alloc):
                    _add(extra, "ES058", "high", "allocation.enable=" + ",".join(sorted(set(alloc))))
            
                explains = []
                for ip in collected_ips:
                    ex = facts[ip].get("explain_reasons") or []
                    if isinstance(ex, list):
                        explains.extend(str(x) for x in ex)
                joined = " ".join(explains).upper()
                if "NODE_LEFT" in joined or "NODE_RESTART" in joined:
                    _add(extra, "ES052", "medium", "explain NODE_LEFT")
                if "DECIDERS_NO" in joined and ("DISK" in joined or "WATERMARK" in joined):
                    _add(extra, "ES061", "high", "explain DECIDERS_NO disk")
                if "ALLOCATION_FAILED" in joined:
                    _add(extra, "ES063", "high", "explain ALLOCATION_FAILED")
            
                if expected_nodes <= 1:
                    extra = [x for x in extra if x[0] not in {"ES194", "ES196", "ES198"}]
            
                return extra, meta
            
            
            def render_summary(
                run_id: str,
                expected_ips: list[str],
                facts: dict[str, dict[str, Any]],
                signals: list[tuple[str, str, str]],
                meta: dict[str, Any],
                health: dict[str, Any],
            ) -> str:
                lines = [
                    "# ES 7.x 三节点排查摘要",
                    "",
                    f"- run_id: `{run_id}`",
                    f"- expected_nodes: {meta.get('expected_nodes')}",
                    f"- nodes_collected: {meta.get('nodes_collected')}",
                    f"- coverage: `{meta.get('coverage')}`",
                    f"- majority_master: `{meta.get('majority_master') or ('NO_MASTER' if meta.get('no_master') else 'UNKNOWN')}`",
                    "",
                    "## 集群健康",
                    "",
                ]
                if health:
                    lines += [
                        f"- status: `{health.get('status', '')}`",
                        f"- number_of_nodes: {health.get('number_of_nodes', '')}",
                        f"- unassigned_shards: {health.get('unassigned_shards', '')}",
                        f"- delayed_unassigned_shards: {health.get('delayed_unassigned_shards', '')}",
                        f"- pending_tasks: {health.get('number_of_pending_tasks', '')}",
                        "",
                    ]
                else:
                    lines += ["- （无权威 cluster health）", ""]
                lines += [
                    "## 各节点 master 视图",
                    "",
                    "| IP | local_master | 9200 | 9300 | heap% | write_rejected_delta | disk% |",
                    "|----|--------------|------|------|-------|----------------------|-------|",
                ]
                for ip in expected_ips:
                    f = facts.get(ip) or {}
                    http = "ok" if f.get("http_ok") else ("NA" if not f else "fail")
                    tp = f.get("listen_transport")
                    trans = "ok" if tp else ("fail" if tp is False else "NA")
                    lines.append(
                        "| {ip} | {lm} | {http} | {trans} | {heap} | {wr} | {disk} |".format(
                            ip=ip,
                            lm=f.get("local_master") or ("(empty)" if f else "(missing)"),
                            http=http,
                            trans=trans,
                            heap=f.get("heap_pct") if f.get("heap_pct") is not None else "",
                            wr=f.get("write_rejected_delta") if f.get("write_rejected_delta") is not None else "",
                            disk=f.get("disk_used_pct") if f.get("disk_used_pct") is not None else "",
                        )
                    )
                lines += ["", "## Top 信号", "", "| ID | 级别 | 说明 |", "|----|------|------|"]
                if signals:
                    for sid, sev, note in signals:
                        lines.append(f"| {sid} | {sev} | {note} |")
                else:
                    lines.append("| — | — | 无自动信号 |")
                lines += ["", "## 交叉对比结论", ""]
                ids = {s[0] for s in signals}
                bullets = []
                if "ES191" in ids:
                    bullets.append("- **ES191 NO_MASTER**：三台均无 elected master，先看发现/传输/进程，不要解释 unassigned。")
                if "ES190" in ids:
                    bullets.append("- **ES190 NODE_DOWN**：健康节点数少于期望，优先掉节点而不是业务 QPS。")
                if "ES192" in ids:
                    bullets.append("- **ES192 YELLOW_ALLOC_NOT_DOWN**：三台都在集群内，副本未分配是水位/allocation/max_shards。")
                if "ES193" in ids:
                    bullets.append("- **ES193 HEAP_ONE_OUTLIER**：单节点 JVM，不是全集群容量。")
                if "ES194" in ids:
                    bullets.append("- **ES194 HEAP_ALL_SIMILAR**：多节点堆压力。")
                if "ES195" in ids:
                    bullets.append("- **ES195 REJECT_ONE**：单节点线程池拒绝。")
                if "ES196" in ids:
                    bullets.append("- **ES196 REJECT_ALL**：多节点 reject。")
                if "ES197" in ids:
                    bullets.append("- **ES197 FLOOD_ONE**：单节点磁盘 flood / 只读块。")
                if "ES198" in ids:
                    bullets.append("- **ES198 FLOOD_ALL**：集群块。")
                if "ES199" in ids:
                    bullets.append("- **ES199 TRANSPORT_PARTITION**：9200/9300 分叉或 master 视图分裂。")
                if not bullets:
                    if meta.get("coverage") == "ok" and not ids:
                        bullets.append("- 倾向 **ES001 基线正常**，或故障未落入 P0 信号。")
                    else:
                        bullets.append("- 无组合结论；见证据缺口。")
                lines.extend(bullets)
                lines += ["", "## 证据缺口", ""]
                gaps = list(meta.get("evidence_gap") or [])
                if meta.get("no_master"):
                    gaps.append("unassigned explain 不可靠（NO_MASTER）")
                if not gaps:
                    lines.append("- 无")
                else:
                    for g in gaps:
                        lines.append(f"- {g}")
                lines.append("")
                return "\n".join(lines)
            
            
            def cleanse(base: str, run_id: str, expected_ips: list[str], profile: str = "v1") -> dict[str, Any]:
                root = Path(base)
                root.mkdir(parents=True, exist_ok=True)
                facts: dict[str, dict[str, Any]] = {}
                for ip in expected_ips:
                    data = _read_json(root / f"facts.{ip}.json")
                    if data:
                        facts[ip] = data
                    master = _read_json(root / f"master.{ip}.json")
                    if master:
                        facts.setdefault(ip, {})
                        for k in ("local_master", "local_master_ip", "http_ok", "auth_fail", "is_elected"):
                            if k in master and master[k] is not None:
                                facts[ip].setdefault(k, master[k])
            
                raw = _read_signals(root)
                extra, meta = cross_compare(facts, len(expected_ips), expected_ips)
                if profile.endswith("degraded") and meta["coverage"] == "ok":
                    meta["coverage"] = "degraded"
                    meta["evidence_gap"].append("forced_degraded_profile")
                merged = _dedup(raw + extra)
                health = {}
                for ip in expected_ips:
                    h = (facts.get(ip) or {}).get("cluster_health")
                    if isinstance(h, dict) and h:
                        health = h
                        if facts[ip].get("is_elected"):
                            break
            
                kinds = ("precheck", "metrics", "status", "config", "logs", "hostnet")
                found = sum(1 for k in kinds if any(root.glob(f"{k}.*.txt")))
                if found == 0 and meta["coverage"] == "ok":
                    meta["coverage"] = "empty"
                elif found < 3 and meta["coverage"] == "ok":
                    meta["coverage"] = "degraded"
            
                summary = render_summary(run_id, expected_ips, facts, merged, meta, health)
                (root / "summary.md").write_text(summary, encoding="utf-8")
                sig_txt = "".join(f"{a}\t{b}\t{c}\n" for a, b, c in merged)
                (root / "signals.txt").write_text(sig_txt, encoding="utf-8")
                (root / "signals.uniq.tsv").write_text(sig_txt, encoding="utf-8")
            
                cleaned_parts = [
                    f"===== ES_TS cleaned run_id={run_id} profile={profile} =====",
                    f"nodes={','.join(expected_ips)}",
                    f"coverage={meta['coverage']} majority_master={meta.get('majority_master')}",
                    "",
                    "----- SIGNALS -----",
                    sig_txt or "NO_SIGNALS",
                    "",
                ]
                for p in sorted(root.glob("*.txt")):
                    if p.name in {"cleaned.txt", "signals.txt"}:
                        continue
                    body = p.read_text(encoding="utf-8", errors="replace")
                    lines = body.splitlines()
                    keep = [ln for ln in lines if ln.startswith("SIGNAL ") or ln.startswith("CMD_FAIL") or "KEYWORD" in ln]
                    if not keep:
                        keep = lines[-40:]
                    cleaned_parts.append(f"### {p.name} ###")
                    cleaned_parts.extend(keep[:80])
                    cleaned_parts.append("")
                cleaned = "\n".join(cleaned_parts)
                if len(cleaned.encode()) > 64000:
                    cleaned = cleaned.encode()[:64000].decode("utf-8", errors="ignore")
                (root / "cleaned.txt").write_text(cleaned, encoding="utf-8")
                meta_out = {
                    "run_id": run_id,
                    "profile": profile,
                    "coverage_status": meta["coverage"],
                    "nodes_collected": meta["nodes_collected"],
                    "expected_nodes": meta["expected_nodes"],
                    "majority_master": meta.get("majority_master") or "",
                    "no_master": str(bool(meta.get("no_master"))).lower(),
                    "signal_count": len(merged),
                    "kinds_found": found,
                }
                meta_txt = "".join(f"{k}={v}\n" for k, v in meta_out.items())
                (root / "cleaned.meta").write_text(meta_txt, encoding="utf-8")
                return {"meta": meta_out, "signals": merged, "summary": summary}
            
            
            def _cli(argv: list[str]) -> int:
                if len(argv) < 2:
                    print("usage: es_lib.py parse-master|parse-stats|parse-health|merge-facts|cleanse ...", file=sys.stderr)
                    return 2
                cmd = argv[1]
                if cmd == "parse-master":
                    print(json.dumps(parse_cat_master(sys.stdin.read()), ensure_ascii=False))
                    return 0
                if cmd == "parse-stats":
                    print(json.dumps(parse_local_stats(sys.stdin.read()), ensure_ascii=False))
                    return 0
                if cmd == "parse-health":
                    print(json.dumps(parse_cluster_health(sys.stdin.read()), ensure_ascii=False))
                    return 0
                if cmd == "parse-nodes":
                    local_ip = argv[2] if len(argv) > 2 else ""
                    print(json.dumps(parse_cat_nodes(sys.stdin.read(), local_ip), ensure_ascii=False))
                    return 0
                if cmd == "merge-facts":
                    path = argv[2]
                    updates = json.loads(argv[3] if len(argv) > 3 else sys.stdin.read())
                    print(json.dumps(merge_facts(path, updates), ensure_ascii=False))
                    return 0
                if cmd == "cleanse":
                    base, run_id = argv[2], argv[3]
                    ips = argv[4:]
                    profile = os.environ.get("TS_PROFILE", "v1")
                    result = cleanse(base, run_id, ips, profile)
                    print(json.dumps(result["meta"], ensure_ascii=False))
                    return 0
                print("unknown command", cmd, file=sys.stderr)
                return 2
            
            
            if __name__ == "__main__":
                sys.exit(_cli(sys.argv))
            ES_TS_LIB_PY
            # Shared helpers for ES 7.x troubleshooting collectors. Sourced, not executed.
            # Collectors always exit 0. Do not mutate the cluster.
            
            umask 077
            
            json_escape() {
              local s=${1-}
              s=${s//\\/\\\\}
              s=${s//\"/\\\"}
              s=${s//$'\n'/\\n}
              s=${s//$'\r'/\\r}
              s=${s//$'\t'/\\t}
              printf '%s' "$s"
            }
            
            ts_now() { date -u +"%Y-%m-%dT%H:%M:%SZ"; }
            
            resolve_local_ip() {
              local node1=$1 node2=$2 node3=$3
              local local_ips target_ip=""
              local_ips=$(hostname -I 2>/dev/null || true)
              for ip in "$node1" "$node2" "$node3"; do
                [[ " ${local_ips} " == *" ${ip} "* ]] && target_ip=$ip && break
              done
              if [[ -z "$target_ip" ]]; then
                target_ip=$(hostname -I 2>/dev/null | awk '{print $1}')
              fi
              printf '%s' "${target_ip:-unknown}"
            }
            
            artifact_dir_for() {
              local run_id=$1
              local base=${TS_ARTIFACT_DIR:-/tmp/es-troubleshoot}
              printf '%s/%s' "$base" "$run_id"
            }
            
            es_lib_py() {
              local here=${SCRIPT_DIR:-}
              if [[ -n "$here" && -f "${here}/es_lib.py" ]]; then
                printf '%s' "${here}/es_lib.py"
                return 0
              fi
              if [[ -f /tmp/es-ts-lib/es_lib.py ]]; then
                printf '%s' /tmp/es-ts-lib/es_lib.py
                return 0
              fi
              return 1
            }
            
            begin_artifact() {
              local kind=$1 node=$2 run_id=$3
              ARTIFACT_KIND=$kind
              ARTIFACT_NODE=$node
              ARTIFACT_RUN_ID=$run_id
              ARTIFACT_DIR=$(artifact_dir_for "$run_id")
              mkdir -p "$ARTIFACT_DIR"
              ARTIFACT_FILE="${ARTIFACT_DIR}/${kind}.${node}.txt"
              SIGNAL_FILE="${ARTIFACT_DIR}/${kind}.${node}.signals"
              FACTS_FILE="${ARTIFACT_DIR}/facts.${node}.json"
              MASTER_FILE="${ARTIFACT_DIR}/master.${node}.json"
              : > "$ARTIFACT_FILE"
              : > "$SIGNAL_FILE"
              {
                echo "===== ES_TS artifact=${kind} node=${node} ts=$(ts_now) run_id=${run_id} ====="
                echo "hostname=$(hostname 2>/dev/null || echo unknown)"
              } >> "$ARTIFACT_FILE"
            }
            
            emit() {
              printf '%s\n' "$*" >> "$ARTIFACT_FILE"
            }
            
            emit_cmd() {
              local title=$1
              local rc=0
              shift
              emit "----- ${title} -----"
              "$@" >> "$ARTIFACT_FILE" 2>&1
              rc=$?
              if (( rc != 0 )); then
                emit "CMD_FAIL: ${title} rc=${rc}"
                return 1
              fi
              return 0
            }
            
            emit_cmd_timeout() {
              local seconds=$1 title=$2
              shift 2
              emit "----- ${title} (timeout ${seconds}s) -----"
              if command -v timeout >/dev/null 2>&1; then
                if ! timeout "$seconds" "$@" >> "$ARTIFACT_FILE" 2>&1; then
                  emit "CMD_FAIL_OR_TIMEOUT: ${title}"
                  signal ES174 low "timeout ${title}"
                  return 1
                fi
              else
                if ! "$@" >> "$ARTIFACT_FILE" 2>&1; then
                  emit "CMD_FAIL: ${title}"
                  return 1
                fi
              fi
              return 0
            }
            
            signal() {
              printf '%s\t%s\t%s\n' "$1" "$2" "$3" >> "$SIGNAL_FILE"
              emit "SIGNAL ${1} severity=${2} ${3}"
            }
            
            finish_artifact() {
              emit "===== END ES_TS artifact=${ARTIFACT_KIND} node=${ARTIFACT_NODE} ====="
              echo "###ES_TS_ARTIFACT kind=${ARTIFACT_KIND} node=${ARTIFACT_NODE} file=${ARTIFACT_FILE}###"
              cat "$ARTIFACT_FILE"
              echo "###ES_TS_SIGNALS kind=${ARTIFACT_KIND} node=${ARTIFACT_NODE}###"
              cat "$SIGNAL_FILE"
              echo "###END_ES_TS_ARTIFACT###"
            }
            
            es_curl() {
              # es_curl <seconds> <url> [curl extra...]
              local seconds=$1
              shift
              local url=$1
              shift
              local args=(-sS --max-time "$seconds" --connect-timeout 3 -H 'Accept: application/json')
              if [[ -n "${ES_USER:-}" ]]; then
                args+=(-u "${ES_USER}:${ES_PASS:-}")
              fi
              curl "${args[@]}" "$@" "$url" 2>/dev/null
            }
            
            es_base_url() {
              printf 'http://127.0.0.1:%s' "${ES_HTTP_PORT:-9200}"
            }
            
            facts_merge() {
              local json=$1
              local py
              py=$(es_lib_py) || return 0
              python3 "$py" merge-facts "$FACTS_FILE" "$json" >/dev/null 2>&1 || true
            }
            
            record_local_master() {
              local url
              url="$(es_base_url)/_cat/master?h=id,host,ip,node&format=json"
              local body rc=0
              body=$(es_curl 3 "$url" -w '\nHTTP_CODE:%{http_code}\n') || rc=$?
              local code
              code=$(printf '%s\n' "$body" | awk -F: '/HTTP_CODE:/{print $2}' | tail -n1)
              local json
              json=$(printf '%s\n' "$body" | sed '/HTTP_CODE:/d')
              emit "----- local _cat/master http=${code:-na} rc=${rc} -----"
              emit "$json"
            
              local parsed="{}"
              local py
              py=$(es_lib_py) || true
              if [[ -n "$py" ]]; then
                parsed=$(printf '%s' "$json" | python3 "$py" parse-master 2>/dev/null || echo '{}')
              fi
              local http_ok=false auth_fail=false local_master="" local_ip=""
              if [[ "$code" == "401" || "$code" == "403" ]]; then
                auth_fail=true
                signal ES032 high "local HTTP auth failed code=${code}"
              elif [[ "$code" == "200" ]]; then
                http_ok=true
              else
                signal ES032 medium "local _cat/master failed code=${code:-na} rc=${rc}"
              fi
              if [[ "$http_ok" == true ]]; then
                local_master=$(python3 -c 'import json,sys; d=json.loads(sys.argv[1]); print(d.get("local_master",""))' "$parsed" 2>/dev/null || true)
                local_ip=$(python3 -c 'import json,sys; d=json.loads(sys.argv[1]); print(d.get("local_master_ip",""))' "$parsed" 2>/dev/null || true)
              fi
              emit "local_master=${local_master}"
              emit "local_master_ip=${local_ip}"
            
              local nodes_json=""
              nodes_json=$(es_curl 3 "$(es_base_url)/_cat/nodes?h=id,name,ip,master,node.role&format=json" || true)
              emit "----- local _cat/nodes -----"
              emit "$nodes_json"
              local self_elected=false
              if [[ -n "$py" && -n "$nodes_json" ]]; then
                local nodes_parsed
                nodes_parsed=$(printf '%s' "$nodes_json" | python3 "$py" parse-nodes "$ARTIFACT_NODE" 2>/dev/null || echo '{}')
                if python3 -c 'import json,sys; raise SystemExit(0 if json.loads(sys.argv[1]).get("self_elected") else 1)' "$nodes_parsed" 2>/dev/null; then
                  self_elected=true
                fi
              fi
              if [[ "$self_elected" != true && -n "$local_ip" && "$local_ip" == "$ARTIFACT_NODE" ]]; then
                self_elected=true
              fi
              emit "is_elected=${self_elected}"
            
              mkdir -p "$ARTIFACT_DIR"
              python3 - "$MASTER_FILE" "$ARTIFACT_NODE" "$local_master" "$local_ip" "$http_ok" "$auth_fail" "$self_elected" <<'PY' 2>/dev/null || true
            import json,sys
            path, node, lm, lip, http_ok, auth, elected = sys.argv[1:8]
            doc = {
              "node": node,
              "local_master": lm,
              "local_master_ip": lip,
              "http_ok": http_ok == "true",
              "auth_fail": auth == "true",
              "is_elected": elected == "true",
            }
            open(path,"w",encoding="utf-8").write(json.dumps(doc, ensure_ascii=False, indent=2)+"\n")
            PY
              facts_merge "$(python3 -c 'import json,sys; print(json.dumps({"local_master":sys.argv[1],"local_master_ip":sys.argv[2],"http_ok":sys.argv[3]=="true","auth_fail":sys.argv[4]=="true","is_elected":sys.argv[5]=="true","node":sys.argv[6]}))' \
                "$local_master" "$local_ip" "$http_ok" "$auth_fail" "$self_elected" "$ARTIFACT_NODE")"
              if [[ "$self_elected" == true ]]; then
                IS_ELECTED=1
              else
                IS_ELECTED=0
              fi
            }
            
            listen_port() {
              local port=$1
              if command -v ss >/dev/null 2>&1; then
                ss -lnt 2>/dev/null | awk '{print $4}' | grep -q ":${port}$"
                return $?
              fi
              netstat -lnt 2>/dev/null | grep -q ":${port} "
            }
            
            tcp_probe() {
              local host=$1 port=$2
              if timeout 2 bash -c "echo >/dev/tcp/${host}/${port}" 2>/dev/null; then
                return 0
              fi
              if command -v nc >/dev/null 2>&1; then
                nc -z -w 2 "$host" "$port" >/dev/null 2>&1 && return 0
              fi
              return 1
            }
            
            es_process_up() {
              # Character class so pgrep does not match its own argv.
              pgrep -f '[o]rg.elasticsearch.bootstrap.Elasticsearch' >/dev/null 2>&1 && return 0
              pgrep -x elasticsearch >/dev/null 2>&1 && return 0
              return 1
            }
            # C 配置：解析 elasticsearch.yml / jvm.options 关键项；elected master 再拉 cluster settings。
            set -uo pipefail
            
            node1=${1:-}
            node2=${2:-}
            node3=${3:-}
            ES_HTTP_PORT=${4:-9200}
            ES_TRANSPORT_PORT=${5:-9300}
            run_id=${6:-manual}
            ES_USER=${7:-${ES_USER:-}}
            ES_PASS=${8:-${ES_PASS:-}}
            conf_hint=${9:-}
            export ES_HTTP_PORT ES_USER ES_PASS
            
            target_ip=$(resolve_local_ip "$node1" "$node2" "$node3")
            begin_artifact config "$target_ip" "$run_id"
            emit "collector=config"
            
            record_local_master
            
            yml=""
            for cand in \
              "$conf_hint" \
              /etc/elasticsearch/elasticsearch.yml \
              /opt/elasticsearch/config/elasticsearch.yml \
              /usr/share/elasticsearch/config/elasticsearch.yml \
              "$HOME/elasticsearch/config/elasticsearch.yml"; do
              [[ -n "$cand" && -f "$cand" ]] && yml=$cand && break
            done
            emit "elasticsearch_yml=${yml:-MISSING}"
            
            parse_yml_key() {
              local file=$1 key=$2
              awk -F: -v k="$key" '
                $0 ~ "^[[:space:]]*#" {next}
                index($1,k)==1 {
                  v=$0
                  sub(/^[^:]+:[[:space:]]*/,"",v)
                  gsub(/[[:space:]]+#.*/,"",v)
                  gsub(/[[:space:]"'\'']/, "", v)
                  print v
                  exit
                }
              ' "$file" 2>/dev/null
            }
            
            if [[ -n "$yml" ]]; then
              emit "----- parsed ${yml} -----"
              cluster_name=$(parse_yml_key "$yml" "cluster.name")
              node_name=$(parse_yml_key "$yml" "node.name")
              seed=$(parse_yml_key "$yml" "discovery.seed_hosts")
              zen_hosts=$(parse_yml_key "$yml" "discovery.zen.ping.unicast.hosts")
              zen_mmn=$(parse_yml_key "$yml" "discovery.zen.minimum_master_nodes")
              initial=$(parse_yml_key "$yml" "cluster.initial_master_nodes")
              path_data=$(parse_yml_key "$yml" "path.data")
              http_port=$(parse_yml_key "$yml" "http.port")
              trans_port=$(parse_yml_key "$yml" "transport.port")
              emit "PARSED cluster.name=${cluster_name}"
              emit "PARSED node.name=${node_name}"
              emit "PARSED discovery.seed_hosts=${seed}"
              emit "PARSED discovery.zen.ping.unicast.hosts=${zen_hosts}"
              emit "PARSED discovery.zen.minimum_master_nodes=${zen_mmn}"
              emit "PARSED cluster.initial_master_nodes=${initial}"
              emit "PARSED path.data=${path_data}"
              emit "PARSED http.port=${http_port}"
              emit "PARSED transport.port=${trans_port}"
              facts_merge "$(python3 -c 'import json,sys; print(json.dumps({"cluster_name":sys.argv[1],"path_data":sys.argv[2]}))' "${cluster_name:-}" "${path_data:-}")"
              if [[ -n "$zen_mmn" ]]; then
                signal ES110 low "legacy discovery.zen.minimum_master_nodes=${zen_mmn}"
              fi
              if [[ -n "$http_port" && "$http_port" != "$ES_HTTP_PORT" ]]; then
                signal ES114 medium "yml http.port=${http_port} probe=${ES_HTTP_PORT}"
              fi
            else
              signal ES171 low "elasticsearch.yml not found"
            fi
            
            jvm=""
            for cand in \
              /etc/elasticsearch/jvm.options \
              /opt/elasticsearch/config/jvm.options \
              /usr/share/elasticsearch/config/jvm.options; do
              [[ -f "$cand" ]] && jvm=$cand && break
            done
            emit "jvm_options=${jvm:-MISSING}"
            if [[ -n "$jvm" ]]; then
              xms=$(grep -E '^-Xms' "$jvm" | tail -n1 || true)
              xmx=$(grep -E '^-Xmx' "$jvm" | tail -n1 || true)
              emit "PARSED ${xms}"
              emit "PARSED ${xmx}"
              if [[ -n "$xms" && -n "$xmx" && "$xms" != "$xmx" ]]; then
                # compare numeric-ish suffix after -Xms/-Xmx
                a=${xms#-Xms}; b=${xmx#-Xmx}
                if [[ "$a" != "$b" ]]; then
                  signal ES112 low "Xms=${a} Xmx=${b}"
                fi
              fi
            fi
            
            if [[ "${IS_ELECTED:-0}" == "1" ]]; then
              cs=$(es_curl 8 "$(es_base_url)/_cluster/settings?include_defaults=false&flat_settings=true&filter_path=transient.cluster.routing.allocation.*,persistent.cluster.routing.allocation.*,transient.cluster.max_shards_per_node,persistent.cluster.max_shards_per_node,transient.cluster.blocks.*,persistent.cluster.blocks.*" || true)
              emit "----- _cluster/settings (overrides) -----"
              emit "$cs"
              enable=$(printf '%s' "$cs" | python3 -c 'import json,sys,re
            try:
                d=json.load(sys.stdin)
            except Exception:
                d={}
            flat={}
            for k in ("persistent","transient"):
                v=d.get(k) or {}
                if isinstance(v,dict):
                    flat.update(v)
            s=json.dumps(flat)
            m=re.search(r"cluster.routing.allocation.enable["'\'':" ]+([a-z_]+)", s)
            print(m.group(1) if m else "")
            ' 2>/dev/null || true)
              # simpler grep
              if printf '%s' "$cs" | grep -q 'cluster.routing.allocation.enable'; then
                val=$(printf '%s' "$cs" | tr ',' '\n' | grep 'cluster.routing.allocation.enable' | head -n1)
                emit "PARSED ${val}"
                if printf '%s' "$val" | grep -Eq '"none"|"primaries"|"new_primaries"'; then
                  signal ES058 high "allocation.enable overridden"
                  facts_merge '{"allocation_enable":"not_all"}'
                fi
              fi
              if printf '%s' "$cs" | grep -q 'max_shards_per_node'; then
                signal ES059 medium "cluster.max_shards_per_node overridden"
              fi
              if printf '%s' "$cs" | grep -qi 'watermark'; then
                signal ES113 low "disk watermark overridden"
              fi
            else
              emit "cluster_settings=delegated"
            fi
            
            finish_artifact
            exit 0
        job_ip_list:
          value: "${es_node_ips}"
        job_rolling_config:
          value:
            job_rolling_execute: []
            job_rolling_expression: ''
            job_rolling_mode: 1
        job_script_list_general:
          value: ''
        job_script_list_public:
          value: ''
        job_script_param:
          value: "'${es_node1_ip}' '${es_node2_ip}' '${es_node3_ip}' '${es_http_port}' '${es_transport_port}' '${ts_run_id}' '${es_user}' '${es_pass}'"
        job_script_source:
          value: manual
        job_script_timeout:
          value: '120'
        job_script_type:
          value: '1'
        job_success_id:
          value: ''
    auto_retry:
      enable: false
      times: 1
      interval: 0
    ignore_error: true
    can_retry: true
    can_skip: false
    optional: false
    next:
    - es-ts_converge
  - id: es-ts_logs
    type: ServiceActivity
    name: 快速执行脚本
    stage_name: 过滤日志(关键字映射)
    component:
      code: job_fast_execute_script
      version: v1.2
      data:
        biz_cc_id:
          name: 业务
          value: ''
          key: "${biz_cc_id}"
          version: v1.2
          source_tag: job_fast_execute_script.biz_cc_id
        job_account:
          value: root
        job_content:
          value: |
            #!/usr/bin/env bash
            mkdir -p /tmp/es-ts-lib
            cat > /tmp/es-ts-lib/es_lib.py <<'ES_TS_LIB_PY'
            #!/usr/bin/env python3
            """Parse ES 7.x collector JSON and run cleanse cross-compare.
            
            Used by bash collectors and cleanse_artifacts.sh. No HTTP. Diagnose only.
            """
            from __future__ import annotations
            
            import json
            import os
            import sys
            from collections import Counter
            from pathlib import Path
            from typing import Any
            
            
            def _load(text: str) -> Any:
                text = (text or "").strip()
                if not text:
                    return None
                try:
                    return json.loads(text)
                except json.JSONDecodeError:
                    return None
            
            
            def parse_cat_master(text: str) -> dict[str, Any]:
                data = _load(text)
                out = {
                    "http_ok": False,
                    "auth_fail": False,
                    "local_master": "",
                    "local_master_ip": "",
                    "local_master_id": "",
                    "is_elected": False,
                }
                if data is None:
                    return out
                out["http_ok"] = True
                row = None
                if isinstance(data, list) and data:
                    row = data[0] if isinstance(data[0], dict) else None
                elif isinstance(data, dict):
                    row = data
                if not row:
                    return out
                out["local_master"] = str(row.get("node") or row.get("name") or "")
                out["local_master_ip"] = str(row.get("ip") or row.get("host") or "")
                out["local_master_id"] = str(row.get("id") or "")
                return out
            
            
            def parse_cat_nodes(text: str, local_ip: str = "") -> dict[str, Any]:
                data = _load(text)
                out = {"nodes": [], "elected": "", "elected_ip": "", "self_elected": False}
                if not isinstance(data, list):
                    return out
                for row in data:
                    if not isinstance(row, dict):
                        continue
                    name = str(row.get("name") or row.get("node") or "")
                    ip = str(row.get("ip") or "")
                    master = str(row.get("master") or "")
                    roles = str(row.get("node.role") or row.get("nodeRole") or "")
                    out["nodes"].append({"name": name, "ip": ip, "master": master, "roles": roles})
                    if master == "*":
                        out["elected"] = name
                        out["elected_ip"] = ip
                        if local_ip and (ip == local_ip):
                            out["self_elected"] = True
                return out
            
            
            def parse_local_stats(text: str) -> dict[str, Any]:
                data = _load(text)
                out = {
                    "heap_pct": None,
                    "write_rejected": None,
                    "search_rejected": None,
                    "write_pool": "",
                    "breaker_parent_pct": None,
                    "breaker_tripped": 0,
                    "disk_total": None,
                    "disk_free": None,
                    "disk_used_pct": None,
                    "index_total": None,
                    "index_time_ms": None,
                    "query_total": None,
                    "query_time_ms": None,
                    "cpu_percent": None,
                    "gc_young_ms": None,
                    "gc_old_ms": None,
                    "node_name": "",
                }
                if not isinstance(data, dict):
                    return out
                nodes = data.get("nodes") or {}
                if not isinstance(nodes, dict) or not nodes:
                    return out
                n = next(iter(nodes.values()))
                if not isinstance(n, dict):
                    return out
                out["node_name"] = str(n.get("name") or "")
                jvm = n.get("jvm") or {}
                mem = jvm.get("mem") or {}
                if "heap_used_percent" in mem:
                    out["heap_pct"] = int(mem["heap_used_percent"])
                collectors = (jvm.get("gc") or {}).get("collectors") or {}
                young = collectors.get("young") or collectors.get("ParNew") or {}
                old = collectors.get("old") or collectors.get("ConcurrentMarkSweep") or collectors.get("G1 Old Generation") or {}
                if "collection_time_in_millis" in young:
                    out["gc_young_ms"] = int(young["collection_time_in_millis"])
                if "collection_time_in_millis" in old:
                    out["gc_old_ms"] = int(old["collection_time_in_millis"])
                tp = n.get("thread_pool") or {}
                write = tp.get("write") if isinstance(tp.get("write"), dict) else None
                if write is None and isinstance(tp.get("index"), dict):
                    write = tp["index"]
                    out["write_pool"] = "index_legacy"
                else:
                    out["write_pool"] = "write"
                if write:
                    out["write_rejected"] = int(write.get("rejected") or 0)
                search = tp.get("search") if isinstance(tp.get("search"), dict) else {}
                if search:
                    out["search_rejected"] = int(search.get("rejected") or 0)
                breakers = n.get("breakers") or {}
                parent = breakers.get("parent") or {}
                if parent.get("limit_size_in_bytes") and parent.get("estimated_size_in_bytes") is not None:
                    lim = int(parent["limit_size_in_bytes"]) or 1
                    out["breaker_parent_pct"] = int(int(parent["estimated_size_in_bytes"]) * 100 / lim)
                tripped = 0
                for b in breakers.values():
                    if isinstance(b, dict):
                        tripped += int(b.get("tripped") or 0)
                out["breaker_tripped"] = tripped
                fs = (n.get("fs") or {}).get("total") or {}
                if fs.get("total_in_bytes"):
                    total = int(fs["total_in_bytes"])
                    free = int(fs.get("available_in_bytes") or fs.get("free_in_bytes") or 0)
                    out["disk_total"] = total
                    out["disk_free"] = free
                    out["disk_used_pct"] = int((total - free) * 100 / total) if total else None
                idx = (n.get("indices") or {}).get("indexing") or {}
                if "index_total" in idx:
                    out["index_total"] = int(idx["index_total"])
                    out["index_time_ms"] = int(idx.get("index_time_in_millis") or 0)
                search_m = (n.get("indices") or {}).get("search") or {}
                if "query_total" in search_m:
                    out["query_total"] = int(search_m["query_total"])
                    out["query_time_ms"] = int(search_m.get("query_time_in_millis") or 0)
                cpu = (n.get("os") or {}).get("cpu") or {}
                if "percent" in cpu:
                    out["cpu_percent"] = int(cpu["percent"])
                return out
            
            
            def parse_cluster_health(text: str) -> dict[str, Any]:
                data = _load(text)
                if not isinstance(data, dict):
                    return {}
                keys = (
                    "status",
                    "number_of_nodes",
                    "number_of_data_nodes",
                    "active_primary_shards",
                    "active_shards",
                    "relocating_shards",
                    "initializing_shards",
                    "unassigned_shards",
                    "delayed_unassigned_shards",
                    "number_of_pending_tasks",
                    "task_max_waiting_in_queue_millis",
                    "active_shards_percent_as_number",
                    "timed_out",
                )
                out: dict[str, Any] = {}
                for k in keys:
                    if k in data:
                        out[k] = data[k]
                return out
            
            
            def merge_facts(path: str, updates: dict[str, Any]) -> dict[str, Any]:
                p = Path(path)
                cur: dict[str, Any] = {}
                if p.is_file():
                    try:
                        cur = json.loads(p.read_text(encoding="utf-8"))
                    except (OSError, json.JSONDecodeError):
                        cur = {}
                cur.update({k: v for k, v in updates.items() if v is not None})
                p.parent.mkdir(parents=True, exist_ok=True)
                p.write_text(json.dumps(cur, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
                return cur
            
            
            def _read_json(path: Path) -> dict[str, Any] | None:
                if not path.is_file():
                    return None
                try:
                    data = json.loads(path.read_text(encoding="utf-8"))
                except (OSError, json.JSONDecodeError):
                    return None
                return data if isinstance(data, dict) else None
            
            
            def _read_signals(base: Path) -> list[tuple[str, str, str]]:
                rows: list[tuple[str, str, str]] = []
                for p in sorted(base.glob("*.signals")):
                    try:
                        text = p.read_text(encoding="utf-8", errors="replace")
                    except OSError:
                        continue
                    for line in text.splitlines():
                        parts = line.split("\t", 2)
                        if len(parts) >= 3 and parts[0].startswith("ES"):
                            rows.append((parts[0], parts[1], parts[2]))
                return rows
            
            
            def _sev_rank(sev: str) -> int:
                return {"high": 3, "medium": 2, "low": 1, "warning": 2}.get(sev, 0)
            
            
            def _dedup(rows: list[tuple[str, str, str]]) -> list[tuple[str, str, str]]:
                best: dict[str, tuple[str, str, str]] = {}
                order: list[str] = []
                for sid, sev, note in rows:
                    if sid not in best:
                        order.append(sid)
                        best[sid] = (sid, sev, note)
                        continue
                    old = best[sid]
                    if _sev_rank(sev) > _sev_rank(old[1]):
                        best[sid] = (sid, sev, f"{old[2]} | {note}")
                    elif note not in old[2]:
                        best[sid] = (sid, old[1], f"{old[2]} | {note}")
                return [best[k] for k in order]
            
            
            def _add(signals: list[tuple[str, str, str]], sid: str, sev: str, note: str) -> None:
                signals.append((sid, sev, note))
            
            
            def cross_compare(
                facts: dict[str, dict[str, Any]],
                expected_nodes: int,
                expected_ips: list[str],
            ) -> tuple[list[tuple[str, str, str]], dict[str, Any]]:
                extra: list[tuple[str, str, str]] = []
                collected_ips = [ip for ip in expected_ips if ip in facts]
                n_col = len(collected_ips)
                meta: dict[str, Any] = {
                    "nodes_collected": n_col,
                    "expected_nodes": expected_nodes,
                    "majority_master": "",
                    "coverage": "ok",
                    "no_master": False,
                    "evidence_gap": [],
                }
                if n_col < expected_nodes:
                    meta["coverage"] = "degraded"
                    missing = [ip for ip in expected_ips if ip not in facts]
                    meta["evidence_gap"].append("missing_nodes=" + ",".join(missing))
                    _add(extra, "ES172", "high", "nodes missing: " + ",".join(missing))
                    if n_col == 0:
                        meta["coverage"] = "empty"
            
                masters = []
                auth_na = 0
                for ip in collected_ips:
                    f = facts[ip]
                    if f.get("auth_fail"):
                        auth_na += 1
                        continue
                    masters.append((ip, str(f.get("local_master") or "")))
            
                nonempty = [m for _, m in masters if m]
                empty = [ip for ip, m in masters if not m]
                maj = ""
                if nonempty:
                    maj, cnt = Counter(nonempty).most_common(1)[0]
                    if cnt >= 2 or (expected_nodes == 1 and cnt == 1):
                        maj_ok = maj
                    else:
                        maj_ok = maj if cnt == len(nonempty) else ""
                    maj = maj_ok
                meta["majority_master"] = maj
            
                all_collected = n_col == expected_nodes and expected_nodes >= 1
                all_empty = all_collected and not nonempty and auth_na == 0
                if all_empty:
                    _add(extra, "ES050", "high", "all %s nodes have empty local_master" % n_col)
                    _add(extra, "ES191", "high", "NO_MASTER")
                    meta["no_master"] = True
                    meta["majority_master"] = ""
                elif n_col < expected_nodes and nonempty == [] and empty:
                    meta["evidence_gap"].append("NO_MASTER_OBSERVED")
                    _add(extra, "ES173", "medium", "observed nodes have no master but collection incomplete")
                elif maj and empty:
                    _add(extra, "ES051", "high", "majority master=%s disagree/empty on %s" % (maj, ",".join(empty)))
                    _add(extra, "ES199", "high", "master view split")
                elif nonempty and len(set(nonempty)) > 1:
                    _add(extra, "ES051", "high", "local_master values disagree: " + ",".join(sorted(set(nonempty))))
                    _add(extra, "ES199", "high", "master view split")
            
                health = {}
                for ip in collected_ips:
                    h = facts[ip].get("cluster_health")
                    if isinstance(h, dict) and h.get("status"):
                        health = h
                        if maj and (facts[ip].get("is_elected") or facts[ip].get("local_master") == maj):
                            break
            
                nodes_in_health = int(health.get("number_of_nodes") or 0) if health else 0
                status = str(health.get("status") or "")
                unassigned = int(health.get("unassigned_shards") or 0) if health else 0
                delayed = int(health.get("delayed_unassigned_shards") or 0) if health else 0
                pending = int(health.get("number_of_pending_tasks") or 0) if health else 0
                reloc = int(health.get("relocating_shards") or 0) if health else 0
                init = int(health.get("initializing_shards") or 0) if health else 0
            
                if delayed > 0:
                    _add(extra, "ES055", "low", "delayed_unassigned=%s" % delayed)
                if pending >= 10:
                    _add(extra, "ES056", "high", "pending_tasks=%s" % pending)
                elif pending >= 1:
                    _add(extra, "ES056", "medium", "pending_tasks=%s" % pending)
                if reloc or init:
                    _add(extra, "ES057", "medium", "relocating=%s initializing=%s" % (reloc, init))
            
                down_ips = []
                for ip in expected_ips:
                    f = facts.get(ip) or {}
                    proc = f.get("process_up")
                    http = f.get("http_ok")
                    listen = f.get("listen_http")
                    if proc is False or listen is False or http is False:
                        down_ips.append(ip)
                    elif ip not in facts:
                        down_ips.append(ip)
            
                if not meta["no_master"]:
                    if nodes_in_health and nodes_in_health < expected_nodes:
                        missing_n = expected_nodes - nodes_in_health
                        if missing_n >= 2:
                            _add(extra, "ES053", "high", "health nodes=%s expected=%s" % (nodes_in_health, expected_nodes))
                        else:
                            _add(extra, "ES052", "medium", "health nodes=%s expected=%s" % (nodes_in_health, expected_nodes))
                        _add(extra, "ES190", "high", "NODE_DOWN health_nodes=%s down_ips=%s" % (nodes_in_health, ",".join(down_ips) or "unknown"))
                    elif n_col == expected_nodes and nodes_in_health == expected_nodes and status == "yellow" and unassigned > 0:
                        _add(extra, "ES192", "medium", "YELLOW_ALLOC_NOT_DOWN unassigned=%s" % unassigned)
                    if status == "red" and not meta["no_master"] and unassigned > 0:
                        _add(extra, "ES054", "high", "red with unassigned=%s" % unassigned)
            
                if meta["no_master"] and status == "red":
                    _add(extra, "ES053", "high", "red and NO_MASTER")
            
                if expected_nodes <= 1:
                    extra = [(s, v, n + " node_count=1") if s.startswith("ES19") else (s, v, n) for s, v, n in extra]
                    extra = [x for x in extra if not (x[0] in {"ES194", "ES196", "ES198"} and expected_nodes <= 1)]
            
                heaps = [(ip, facts[ip].get("heap_pct")) for ip in collected_ips if isinstance(facts[ip].get("heap_pct"), int)]
                high_heap = [ip for ip, h in heaps if h is not None and h >= 85]
                if len(high_heap) == 1 and len(heaps) >= 2:
                    _add(extra, "ES193", "high", "HEAP_ONE_OUTLIER %s heap=%s" % (high_heap[0], dict(heaps)[high_heap[0]]))
                    _add(extra, "ES034", "high", "%s heap=%s" % (high_heap[0], dict(heaps)[high_heap[0]]))
                elif len(high_heap) >= 2:
                    _add(extra, "ES194", "high", "HEAP_ALL_SIMILAR " + ",".join("%s=%s" % (ip, dict(heaps)[ip]) for ip in high_heap))
            
                rejects = [(ip, int(facts[ip].get("write_rejected_delta") or 0) + int(facts[ip].get("search_rejected_delta") or 0)) for ip in collected_ips]
                rej_pos = [ip for ip, r in rejects if r > 0]
                if len(rej_pos) == 1 and len(rejects) >= 2:
                    _add(extra, "ES195", "medium", "REJECT_ONE %s delta=%s" % (rej_pos[0], dict(rejects)[rej_pos[0]]))
                elif len(rej_pos) >= 2:
                    _add(extra, "ES196", "high", "REJECT_ALL " + ",".join(rej_pos))
            
                floods = [ip for ip in collected_ips if facts[ip].get("flood") or facts[ip].get("read_only_allow_delete")]
                if len(floods) == 1 and n_col >= 2:
                    _add(extra, "ES197", "high", "FLOOD_ONE %s" % floods[0])
                elif len(floods) >= 2:
                    _add(extra, "ES198", "high", "FLOOD_ALL " + ",".join(floods))
            
                for ip in collected_ips:
                    f = facts[ip]
                    if f.get("http_ok") and f.get("listen_http") and f.get("transport_ok") is False:
                        _add(extra, "ES091", "high", "9200 up 9300 down on %s" % ip)
                        _add(extra, "ES199", "high", "TRANSPORT_PARTITION %s" % ip)
                    peers = f.get("peer_transport") or {}
                    if isinstance(peers, dict):
                        for peer, ok in peers.items():
                            if ok is False and (f.get("peer_http") or {}).get(peer) is True:
                                _add(extra, "ES091", "high", "%s http ok transport fail to %s" % (ip, peer))
                                _add(extra, "ES199", "high", "TRANSPORT_PARTITION %s->%s" % (ip, peer))
            
                names = [str(facts[ip].get("cluster_name") or "") for ip in collected_ips if facts[ip].get("cluster_name")]
                if names and len(set(names)) > 1:
                    _add(extra, "ES060", "high", "cluster.name disagree: " + ",".join(sorted(set(names))))
            
                alloc = [str(facts[ip].get("allocation_enable") or "") for ip in collected_ips if facts[ip].get("allocation_enable")]
                if any(a and a != "all" for a in alloc):
                    _add(extra, "ES058", "high", "allocation.enable=" + ",".join(sorted(set(alloc))))
            
                explains = []
                for ip in collected_ips:
                    ex = facts[ip].get("explain_reasons") or []
                    if isinstance(ex, list):
                        explains.extend(str(x) for x in ex)
                joined = " ".join(explains).upper()
                if "NODE_LEFT" in joined or "NODE_RESTART" in joined:
                    _add(extra, "ES052", "medium", "explain NODE_LEFT")
                if "DECIDERS_NO" in joined and ("DISK" in joined or "WATERMARK" in joined):
                    _add(extra, "ES061", "high", "explain DECIDERS_NO disk")
                if "ALLOCATION_FAILED" in joined:
                    _add(extra, "ES063", "high", "explain ALLOCATION_FAILED")
            
                if expected_nodes <= 1:
                    extra = [x for x in extra if x[0] not in {"ES194", "ES196", "ES198"}]
            
                return extra, meta
            
            
            def render_summary(
                run_id: str,
                expected_ips: list[str],
                facts: dict[str, dict[str, Any]],
                signals: list[tuple[str, str, str]],
                meta: dict[str, Any],
                health: dict[str, Any],
            ) -> str:
                lines = [
                    "# ES 7.x 三节点排查摘要",
                    "",
                    f"- run_id: `{run_id}`",
                    f"- expected_nodes: {meta.get('expected_nodes')}",
                    f"- nodes_collected: {meta.get('nodes_collected')}",
                    f"- coverage: `{meta.get('coverage')}`",
                    f"- majority_master: `{meta.get('majority_master') or ('NO_MASTER' if meta.get('no_master') else 'UNKNOWN')}`",
                    "",
                    "## 集群健康",
                    "",
                ]
                if health:
                    lines += [
                        f"- status: `{health.get('status', '')}`",
                        f"- number_of_nodes: {health.get('number_of_nodes', '')}",
                        f"- unassigned_shards: {health.get('unassigned_shards', '')}",
                        f"- delayed_unassigned_shards: {health.get('delayed_unassigned_shards', '')}",
                        f"- pending_tasks: {health.get('number_of_pending_tasks', '')}",
                        "",
                    ]
                else:
                    lines += ["- （无权威 cluster health）", ""]
                lines += [
                    "## 各节点 master 视图",
                    "",
                    "| IP | local_master | 9200 | 9300 | heap% | write_rejected_delta | disk% |",
                    "|----|--------------|------|------|-------|----------------------|-------|",
                ]
                for ip in expected_ips:
                    f = facts.get(ip) or {}
                    http = "ok" if f.get("http_ok") else ("NA" if not f else "fail")
                    tp = f.get("listen_transport")
                    trans = "ok" if tp else ("fail" if tp is False else "NA")
                    lines.append(
                        "| {ip} | {lm} | {http} | {trans} | {heap} | {wr} | {disk} |".format(
                            ip=ip,
                            lm=f.get("local_master") or ("(empty)" if f else "(missing)"),
                            http=http,
                            trans=trans,
                            heap=f.get("heap_pct") if f.get("heap_pct") is not None else "",
                            wr=f.get("write_rejected_delta") if f.get("write_rejected_delta") is not None else "",
                            disk=f.get("disk_used_pct") if f.get("disk_used_pct") is not None else "",
                        )
                    )
                lines += ["", "## Top 信号", "", "| ID | 级别 | 说明 |", "|----|------|------|"]
                if signals:
                    for sid, sev, note in signals:
                        lines.append(f"| {sid} | {sev} | {note} |")
                else:
                    lines.append("| — | — | 无自动信号 |")
                lines += ["", "## 交叉对比结论", ""]
                ids = {s[0] for s in signals}
                bullets = []
                if "ES191" in ids:
                    bullets.append("- **ES191 NO_MASTER**：三台均无 elected master，先看发现/传输/进程，不要解释 unassigned。")
                if "ES190" in ids:
                    bullets.append("- **ES190 NODE_DOWN**：健康节点数少于期望，优先掉节点而不是业务 QPS。")
                if "ES192" in ids:
                    bullets.append("- **ES192 YELLOW_ALLOC_NOT_DOWN**：三台都在集群内，副本未分配是水位/allocation/max_shards。")
                if "ES193" in ids:
                    bullets.append("- **ES193 HEAP_ONE_OUTLIER**：单节点 JVM，不是全集群容量。")
                if "ES194" in ids:
                    bullets.append("- **ES194 HEAP_ALL_SIMILAR**：多节点堆压力。")
                if "ES195" in ids:
                    bullets.append("- **ES195 REJECT_ONE**：单节点线程池拒绝。")
                if "ES196" in ids:
                    bullets.append("- **ES196 REJECT_ALL**：多节点 reject。")
                if "ES197" in ids:
                    bullets.append("- **ES197 FLOOD_ONE**：单节点磁盘 flood / 只读块。")
                if "ES198" in ids:
                    bullets.append("- **ES198 FLOOD_ALL**：集群块。")
                if "ES199" in ids:
                    bullets.append("- **ES199 TRANSPORT_PARTITION**：9200/9300 分叉或 master 视图分裂。")
                if not bullets:
                    if meta.get("coverage") == "ok" and not ids:
                        bullets.append("- 倾向 **ES001 基线正常**，或故障未落入 P0 信号。")
                    else:
                        bullets.append("- 无组合结论；见证据缺口。")
                lines.extend(bullets)
                lines += ["", "## 证据缺口", ""]
                gaps = list(meta.get("evidence_gap") or [])
                if meta.get("no_master"):
                    gaps.append("unassigned explain 不可靠（NO_MASTER）")
                if not gaps:
                    lines.append("- 无")
                else:
                    for g in gaps:
                        lines.append(f"- {g}")
                lines.append("")
                return "\n".join(lines)
            
            
            def cleanse(base: str, run_id: str, expected_ips: list[str], profile: str = "v1") -> dict[str, Any]:
                root = Path(base)
                root.mkdir(parents=True, exist_ok=True)
                facts: dict[str, dict[str, Any]] = {}
                for ip in expected_ips:
                    data = _read_json(root / f"facts.{ip}.json")
                    if data:
                        facts[ip] = data
                    master = _read_json(root / f"master.{ip}.json")
                    if master:
                        facts.setdefault(ip, {})
                        for k in ("local_master", "local_master_ip", "http_ok", "auth_fail", "is_elected"):
                            if k in master and master[k] is not None:
                                facts[ip].setdefault(k, master[k])
            
                raw = _read_signals(root)
                extra, meta = cross_compare(facts, len(expected_ips), expected_ips)
                if profile.endswith("degraded") and meta["coverage"] == "ok":
                    meta["coverage"] = "degraded"
                    meta["evidence_gap"].append("forced_degraded_profile")
                merged = _dedup(raw + extra)
                health = {}
                for ip in expected_ips:
                    h = (facts.get(ip) or {}).get("cluster_health")
                    if isinstance(h, dict) and h:
                        health = h
                        if facts[ip].get("is_elected"):
                            break
            
                kinds = ("precheck", "metrics", "status", "config", "logs", "hostnet")
                found = sum(1 for k in kinds if any(root.glob(f"{k}.*.txt")))
                if found == 0 and meta["coverage"] == "ok":
                    meta["coverage"] = "empty"
                elif found < 3 and meta["coverage"] == "ok":
                    meta["coverage"] = "degraded"
            
                summary = render_summary(run_id, expected_ips, facts, merged, meta, health)
                (root / "summary.md").write_text(summary, encoding="utf-8")
                sig_txt = "".join(f"{a}\t{b}\t{c}\n" for a, b, c in merged)
                (root / "signals.txt").write_text(sig_txt, encoding="utf-8")
                (root / "signals.uniq.tsv").write_text(sig_txt, encoding="utf-8")
            
                cleaned_parts = [
                    f"===== ES_TS cleaned run_id={run_id} profile={profile} =====",
                    f"nodes={','.join(expected_ips)}",
                    f"coverage={meta['coverage']} majority_master={meta.get('majority_master')}",
                    "",
                    "----- SIGNALS -----",
                    sig_txt or "NO_SIGNALS",
                    "",
                ]
                for p in sorted(root.glob("*.txt")):
                    if p.name in {"cleaned.txt", "signals.txt"}:
                        continue
                    body = p.read_text(encoding="utf-8", errors="replace")
                    lines = body.splitlines()
                    keep = [ln for ln in lines if ln.startswith("SIGNAL ") or ln.startswith("CMD_FAIL") or "KEYWORD" in ln]
                    if not keep:
                        keep = lines[-40:]
                    cleaned_parts.append(f"### {p.name} ###")
                    cleaned_parts.extend(keep[:80])
                    cleaned_parts.append("")
                cleaned = "\n".join(cleaned_parts)
                if len(cleaned.encode()) > 64000:
                    cleaned = cleaned.encode()[:64000].decode("utf-8", errors="ignore")
                (root / "cleaned.txt").write_text(cleaned, encoding="utf-8")
                meta_out = {
                    "run_id": run_id,
                    "profile": profile,
                    "coverage_status": meta["coverage"],
                    "nodes_collected": meta["nodes_collected"],
                    "expected_nodes": meta["expected_nodes"],
                    "majority_master": meta.get("majority_master") or "",
                    "no_master": str(bool(meta.get("no_master"))).lower(),
                    "signal_count": len(merged),
                    "kinds_found": found,
                }
                meta_txt = "".join(f"{k}={v}\n" for k, v in meta_out.items())
                (root / "cleaned.meta").write_text(meta_txt, encoding="utf-8")
                return {"meta": meta_out, "signals": merged, "summary": summary}
            
            
            def _cli(argv: list[str]) -> int:
                if len(argv) < 2:
                    print("usage: es_lib.py parse-master|parse-stats|parse-health|merge-facts|cleanse ...", file=sys.stderr)
                    return 2
                cmd = argv[1]
                if cmd == "parse-master":
                    print(json.dumps(parse_cat_master(sys.stdin.read()), ensure_ascii=False))
                    return 0
                if cmd == "parse-stats":
                    print(json.dumps(parse_local_stats(sys.stdin.read()), ensure_ascii=False))
                    return 0
                if cmd == "parse-health":
                    print(json.dumps(parse_cluster_health(sys.stdin.read()), ensure_ascii=False))
                    return 0
                if cmd == "parse-nodes":
                    local_ip = argv[2] if len(argv) > 2 else ""
                    print(json.dumps(parse_cat_nodes(sys.stdin.read(), local_ip), ensure_ascii=False))
                    return 0
                if cmd == "merge-facts":
                    path = argv[2]
                    updates = json.loads(argv[3] if len(argv) > 3 else sys.stdin.read())
                    print(json.dumps(merge_facts(path, updates), ensure_ascii=False))
                    return 0
                if cmd == "cleanse":
                    base, run_id = argv[2], argv[3]
                    ips = argv[4:]
                    profile = os.environ.get("TS_PROFILE", "v1")
                    result = cleanse(base, run_id, ips, profile)
                    print(json.dumps(result["meta"], ensure_ascii=False))
                    return 0
                print("unknown command", cmd, file=sys.stderr)
                return 2
            
            
            if __name__ == "__main__":
                sys.exit(_cli(sys.argv))
            ES_TS_LIB_PY
            # Shared helpers for ES 7.x troubleshooting collectors. Sourced, not executed.
            # Collectors always exit 0. Do not mutate the cluster.
            
            umask 077
            
            json_escape() {
              local s=${1-}
              s=${s//\\/\\\\}
              s=${s//\"/\\\"}
              s=${s//$'\n'/\\n}
              s=${s//$'\r'/\\r}
              s=${s//$'\t'/\\t}
              printf '%s' "$s"
            }
            
            ts_now() { date -u +"%Y-%m-%dT%H:%M:%SZ"; }
            
            resolve_local_ip() {
              local node1=$1 node2=$2 node3=$3
              local local_ips target_ip=""
              local_ips=$(hostname -I 2>/dev/null || true)
              for ip in "$node1" "$node2" "$node3"; do
                [[ " ${local_ips} " == *" ${ip} "* ]] && target_ip=$ip && break
              done
              if [[ -z "$target_ip" ]]; then
                target_ip=$(hostname -I 2>/dev/null | awk '{print $1}')
              fi
              printf '%s' "${target_ip:-unknown}"
            }
            
            artifact_dir_for() {
              local run_id=$1
              local base=${TS_ARTIFACT_DIR:-/tmp/es-troubleshoot}
              printf '%s/%s' "$base" "$run_id"
            }
            
            es_lib_py() {
              local here=${SCRIPT_DIR:-}
              if [[ -n "$here" && -f "${here}/es_lib.py" ]]; then
                printf '%s' "${here}/es_lib.py"
                return 0
              fi
              if [[ -f /tmp/es-ts-lib/es_lib.py ]]; then
                printf '%s' /tmp/es-ts-lib/es_lib.py
                return 0
              fi
              return 1
            }
            
            begin_artifact() {
              local kind=$1 node=$2 run_id=$3
              ARTIFACT_KIND=$kind
              ARTIFACT_NODE=$node
              ARTIFACT_RUN_ID=$run_id
              ARTIFACT_DIR=$(artifact_dir_for "$run_id")
              mkdir -p "$ARTIFACT_DIR"
              ARTIFACT_FILE="${ARTIFACT_DIR}/${kind}.${node}.txt"
              SIGNAL_FILE="${ARTIFACT_DIR}/${kind}.${node}.signals"
              FACTS_FILE="${ARTIFACT_DIR}/facts.${node}.json"
              MASTER_FILE="${ARTIFACT_DIR}/master.${node}.json"
              : > "$ARTIFACT_FILE"
              : > "$SIGNAL_FILE"
              {
                echo "===== ES_TS artifact=${kind} node=${node} ts=$(ts_now) run_id=${run_id} ====="
                echo "hostname=$(hostname 2>/dev/null || echo unknown)"
              } >> "$ARTIFACT_FILE"
            }
            
            emit() {
              printf '%s\n' "$*" >> "$ARTIFACT_FILE"
            }
            
            emit_cmd() {
              local title=$1
              local rc=0
              shift
              emit "----- ${title} -----"
              "$@" >> "$ARTIFACT_FILE" 2>&1
              rc=$?
              if (( rc != 0 )); then
                emit "CMD_FAIL: ${title} rc=${rc}"
                return 1
              fi
              return 0
            }
            
            emit_cmd_timeout() {
              local seconds=$1 title=$2
              shift 2
              emit "----- ${title} (timeout ${seconds}s) -----"
              if command -v timeout >/dev/null 2>&1; then
                if ! timeout "$seconds" "$@" >> "$ARTIFACT_FILE" 2>&1; then
                  emit "CMD_FAIL_OR_TIMEOUT: ${title}"
                  signal ES174 low "timeout ${title}"
                  return 1
                fi
              else
                if ! "$@" >> "$ARTIFACT_FILE" 2>&1; then
                  emit "CMD_FAIL: ${title}"
                  return 1
                fi
              fi
              return 0
            }
            
            signal() {
              printf '%s\t%s\t%s\n' "$1" "$2" "$3" >> "$SIGNAL_FILE"
              emit "SIGNAL ${1} severity=${2} ${3}"
            }
            
            finish_artifact() {
              emit "===== END ES_TS artifact=${ARTIFACT_KIND} node=${ARTIFACT_NODE} ====="
              echo "###ES_TS_ARTIFACT kind=${ARTIFACT_KIND} node=${ARTIFACT_NODE} file=${ARTIFACT_FILE}###"
              cat "$ARTIFACT_FILE"
              echo "###ES_TS_SIGNALS kind=${ARTIFACT_KIND} node=${ARTIFACT_NODE}###"
              cat "$SIGNAL_FILE"
              echo "###END_ES_TS_ARTIFACT###"
            }
            
            es_curl() {
              # es_curl <seconds> <url> [curl extra...]
              local seconds=$1
              shift
              local url=$1
              shift
              local args=(-sS --max-time "$seconds" --connect-timeout 3 -H 'Accept: application/json')
              if [[ -n "${ES_USER:-}" ]]; then
                args+=(-u "${ES_USER}:${ES_PASS:-}")
              fi
              curl "${args[@]}" "$@" "$url" 2>/dev/null
            }
            
            es_base_url() {
              printf 'http://127.0.0.1:%s' "${ES_HTTP_PORT:-9200}"
            }
            
            facts_merge() {
              local json=$1
              local py
              py=$(es_lib_py) || return 0
              python3 "$py" merge-facts "$FACTS_FILE" "$json" >/dev/null 2>&1 || true
            }
            
            record_local_master() {
              local url
              url="$(es_base_url)/_cat/master?h=id,host,ip,node&format=json"
              local body rc=0
              body=$(es_curl 3 "$url" -w '\nHTTP_CODE:%{http_code}\n') || rc=$?
              local code
              code=$(printf '%s\n' "$body" | awk -F: '/HTTP_CODE:/{print $2}' | tail -n1)
              local json
              json=$(printf '%s\n' "$body" | sed '/HTTP_CODE:/d')
              emit "----- local _cat/master http=${code:-na} rc=${rc} -----"
              emit "$json"
            
              local parsed="{}"
              local py
              py=$(es_lib_py) || true
              if [[ -n "$py" ]]; then
                parsed=$(printf '%s' "$json" | python3 "$py" parse-master 2>/dev/null || echo '{}')
              fi
              local http_ok=false auth_fail=false local_master="" local_ip=""
              if [[ "$code" == "401" || "$code" == "403" ]]; then
                auth_fail=true
                signal ES032 high "local HTTP auth failed code=${code}"
              elif [[ "$code" == "200" ]]; then
                http_ok=true
              else
                signal ES032 medium "local _cat/master failed code=${code:-na} rc=${rc}"
              fi
              if [[ "$http_ok" == true ]]; then
                local_master=$(python3 -c 'import json,sys; d=json.loads(sys.argv[1]); print(d.get("local_master",""))' "$parsed" 2>/dev/null || true)
                local_ip=$(python3 -c 'import json,sys; d=json.loads(sys.argv[1]); print(d.get("local_master_ip",""))' "$parsed" 2>/dev/null || true)
              fi
              emit "local_master=${local_master}"
              emit "local_master_ip=${local_ip}"
            
              local nodes_json=""
              nodes_json=$(es_curl 3 "$(es_base_url)/_cat/nodes?h=id,name,ip,master,node.role&format=json" || true)
              emit "----- local _cat/nodes -----"
              emit "$nodes_json"
              local self_elected=false
              if [[ -n "$py" && -n "$nodes_json" ]]; then
                local nodes_parsed
                nodes_parsed=$(printf '%s' "$nodes_json" | python3 "$py" parse-nodes "$ARTIFACT_NODE" 2>/dev/null || echo '{}')
                if python3 -c 'import json,sys; raise SystemExit(0 if json.loads(sys.argv[1]).get("self_elected") else 1)' "$nodes_parsed" 2>/dev/null; then
                  self_elected=true
                fi
              fi
              if [[ "$self_elected" != true && -n "$local_ip" && "$local_ip" == "$ARTIFACT_NODE" ]]; then
                self_elected=true
              fi
              emit "is_elected=${self_elected}"
            
              mkdir -p "$ARTIFACT_DIR"
              python3 - "$MASTER_FILE" "$ARTIFACT_NODE" "$local_master" "$local_ip" "$http_ok" "$auth_fail" "$self_elected" <<'PY' 2>/dev/null || true
            import json,sys
            path, node, lm, lip, http_ok, auth, elected = sys.argv[1:8]
            doc = {
              "node": node,
              "local_master": lm,
              "local_master_ip": lip,
              "http_ok": http_ok == "true",
              "auth_fail": auth == "true",
              "is_elected": elected == "true",
            }
            open(path,"w",encoding="utf-8").write(json.dumps(doc, ensure_ascii=False, indent=2)+"\n")
            PY
              facts_merge "$(python3 -c 'import json,sys; print(json.dumps({"local_master":sys.argv[1],"local_master_ip":sys.argv[2],"http_ok":sys.argv[3]=="true","auth_fail":sys.argv[4]=="true","is_elected":sys.argv[5]=="true","node":sys.argv[6]}))' \
                "$local_master" "$local_ip" "$http_ok" "$auth_fail" "$self_elected" "$ARTIFACT_NODE")"
              if [[ "$self_elected" == true ]]; then
                IS_ELECTED=1
              else
                IS_ELECTED=0
              fi
            }
            
            listen_port() {
              local port=$1
              if command -v ss >/dev/null 2>&1; then
                ss -lnt 2>/dev/null | awk '{print $4}' | grep -q ":${port}$"
                return $?
              fi
              netstat -lnt 2>/dev/null | grep -q ":${port} "
            }
            
            tcp_probe() {
              local host=$1 port=$2
              if timeout 2 bash -c "echo >/dev/tcp/${host}/${port}" 2>/dev/null; then
                return 0
              fi
              if command -v nc >/dev/null 2>&1; then
                nc -z -w 2 "$host" "$port" >/dev/null 2>&1 && return 0
              fi
              return 1
            }
            
            es_process_up() {
              # Character class so pgrep does not match its own argv.
              pgrep -f '[o]rg.elasticsearch.bootstrap.Elasticsearch' >/dev/null 2>&1 && return 0
              pgrep -x elasticsearch >/dev/null 2>&1 && return 0
              return 1
            }
            # L 日志：tail 最近 8000 行 + 关键字映射到 ES ID。不 cat 全文。
            set -uo pipefail
            
            node1=${1:-}
            node2=${2:-}
            node3=${3:-}
            ES_HTTP_PORT=${4:-9200}
            ES_TRANSPORT_PORT=${5:-9300}
            run_id=${6:-manual}
            ES_USER=${7:-${ES_USER:-}}
            ES_PASS=${8:-${ES_PASS:-}}
            log_dir=${9:-}
            window_lines=${10:-8000}
            export ES_HTTP_PORT ES_USER ES_PASS
            
            target_ip=$(resolve_local_ip "$node1" "$node2" "$node3")
            begin_artifact logs "$target_ip" "$run_id"
            emit "collector=logs window=${window_lines}"
            
            if [[ -z "$log_dir" || ! -d "$log_dir" ]]; then
              for alt in /var/log/elasticsearch /opt/elasticsearch/logs /usr/share/elasticsearch/logs; do
                [[ -d "$alt" ]] && log_dir=$alt && break
              done
            fi
            emit "log_dir=${log_dir:-MISSING}"
            if [[ -z "$log_dir" || ! -d "$log_dir" ]]; then
              signal ES171 low "elasticsearch log dir missing"
              finish_artifact
              exit 0
            fi
            
            emit "----- log dir listing -----"
            ls -lah "$log_dir" >> "$ARTIFACT_FILE" 2>&1 || true
            
            logfile=""
            # newest .log excluding gc
            logfile=$(ls -1t "$log_dir"/*.log 2>/dev/null | grep -v gc | head -n1 || true)
            emit "resolved_log=${logfile:-MISSING}"
            if [[ -n "$logfile" ]]; then
              emit "----- tail ${window_lines} ${logfile} keywords -----"
              hits=$(tail -n "$window_lines" "$logfile" 2>/dev/null | grep -Ei \
                'master not discovered|have not received|master_not_discovered_exception|failed to send join request|join validation|circuit_breaking_exception|Data too large|rejected execution|queue capacity|flood stage|exceeded flood-stage|read_only_allow_delete|index read-only|high disk watermark|low disk watermark|OutOfMemoryError|Java heap space|failed to ping|handshake failed|TranslogCorrupted|corrupt' \
                | tail -n 80 || true)
              if [[ -n "$hits" ]]; then
                emit "$hits"
                printf '%s\n' "$hits" | while IFS= read -r line; do
                  case "$line" in
                    *"master not discovered"*|*"master_not_discovered"*|*"have not received"*) signal ES050 medium "log master_not_discovered" ;;
                    *"failed to send join request"*|*"join validation"*) signal ES051 medium "log join failed" ;;
                    *"circuit_breaking_exception"*|*"Data too large"*) signal ES038 high "log circuit breaker" ;;
                    *"rejected execution"*|*"queue capacity"*) signal ES036 medium "log rejected execution" ;;
                    *"flood stage"*|*"exceeded flood-stage"*) signal ES070 high "log flood stage" ;;
                    *"read_only_allow_delete"*|*"index read-only"*) signal ES071 high "log read_only block" ;;
                    *"high disk watermark"*|*"low disk watermark"*) signal ES072 medium "log disk watermark" ;;
                    *"OutOfMemoryError"*|*"Java heap space"*) signal ES034 high "log OOM" ;;
                    *"failed to ping"*|*"handshake failed"*) signal ES091 medium "log transport ping/handshake" ;;
                    *corrupt*|*TranslogCorrupted*) signal ES063 high "log corruption" ;;
                  esac
                done
              else
                emit "KEYWORD_NONE"
              fi
            fi
            
            gc=$(ls -1t "$log_dir"/gc.log* 2>/dev/null | head -n1 || true)
            if [[ -n "$gc" ]]; then
              emit "----- gc.log pause summary ${gc} -----"
              # G1/CMS pause lines; count and max
              python3 - "$gc" <<'PY' >> "$ARTIFACT_FILE" 2>&1 || true
            import re,sys
            path=sys.argv[1]
            pauses=[]
            try:
                # last ~4000 lines
                lines=open(path, errors="replace").read().splitlines()[-4000:]
            except Exception as e:
                print("GC_READ_FAIL", e)
                raise SystemExit(0)
            for ln in lines:
                m=re.search(r"([0-9]+[.,][0-9]+)ms", ln) or re.search(r"pause[ =]+([0-9.]+)", ln, re.I)
                if m:
                    try:
                        pauses.append(float(m.group(1).replace(",", ".")))
                    except ValueError:
                        pass
            print("gc_pause_samples=%d max_ms=%s avg_ms=%s" % (
                len(pauses),
                ("%.1f" % max(pauses)) if pauses else "NA",
                ("%.1f" % (sum(pauses)/len(pauses))) if pauses else "NA",
            ))
            PY
            fi
            
            finish_artifact
            exit 0
        job_ip_list:
          value: "${es_node_ips}"
        job_rolling_config:
          value:
            job_rolling_execute: []
            job_rolling_expression: ''
            job_rolling_mode: 1
        job_script_list_general:
          value: ''
        job_script_list_public:
          value: ''
        job_script_param:
          value: "'${es_node1_ip}' '${es_node2_ip}' '${es_node3_ip}' '${es_http_port}' '${es_transport_port}' '${ts_run_id}' '${es_user}' '${es_pass}' '${es_log_dir}' '${ts_log_window_lines}'"
        job_script_source:
          value: manual
        job_script_timeout:
          value: '120'
        job_script_type:
          value: '1'
        job_success_id:
          value: ''
    auto_retry:
      enable: false
      times: 1
      interval: 0
    ignore_error: true
    can_retry: true
    can_skip: false
    optional: false
    next:
    - es-ts_converge
  - id: es-ts_hostnet
    type: ServiceActivity
    name: 快速执行脚本
    stage_name: 采集主机网络(9200/9300分端口)
    component:
      code: job_fast_execute_script
      version: v1.2
      data:
        biz_cc_id:
          name: 业务
          value: ''
          key: "${biz_cc_id}"
          version: v1.2
          source_tag: job_fast_execute_script.biz_cc_id
        job_account:
          value: root
        job_content:
          value: |
            #!/usr/bin/env bash
            mkdir -p /tmp/es-ts-lib
            cat > /tmp/es-ts-lib/es_lib.py <<'ES_TS_LIB_PY'
            #!/usr/bin/env python3
            """Parse ES 7.x collector JSON and run cleanse cross-compare.
            
            Used by bash collectors and cleanse_artifacts.sh. No HTTP. Diagnose only.
            """
            from __future__ import annotations
            
            import json
            import os
            import sys
            from collections import Counter
            from pathlib import Path
            from typing import Any
            
            
            def _load(text: str) -> Any:
                text = (text or "").strip()
                if not text:
                    return None
                try:
                    return json.loads(text)
                except json.JSONDecodeError:
                    return None
            
            
            def parse_cat_master(text: str) -> dict[str, Any]:
                data = _load(text)
                out = {
                    "http_ok": False,
                    "auth_fail": False,
                    "local_master": "",
                    "local_master_ip": "",
                    "local_master_id": "",
                    "is_elected": False,
                }
                if data is None:
                    return out
                out["http_ok"] = True
                row = None
                if isinstance(data, list) and data:
                    row = data[0] if isinstance(data[0], dict) else None
                elif isinstance(data, dict):
                    row = data
                if not row:
                    return out
                out["local_master"] = str(row.get("node") or row.get("name") or "")
                out["local_master_ip"] = str(row.get("ip") or row.get("host") or "")
                out["local_master_id"] = str(row.get("id") or "")
                return out
            
            
            def parse_cat_nodes(text: str, local_ip: str = "") -> dict[str, Any]:
                data = _load(text)
                out = {"nodes": [], "elected": "", "elected_ip": "", "self_elected": False}
                if not isinstance(data, list):
                    return out
                for row in data:
                    if not isinstance(row, dict):
                        continue
                    name = str(row.get("name") or row.get("node") or "")
                    ip = str(row.get("ip") or "")
                    master = str(row.get("master") or "")
                    roles = str(row.get("node.role") or row.get("nodeRole") or "")
                    out["nodes"].append({"name": name, "ip": ip, "master": master, "roles": roles})
                    if master == "*":
                        out["elected"] = name
                        out["elected_ip"] = ip
                        if local_ip and (ip == local_ip):
                            out["self_elected"] = True
                return out
            
            
            def parse_local_stats(text: str) -> dict[str, Any]:
                data = _load(text)
                out = {
                    "heap_pct": None,
                    "write_rejected": None,
                    "search_rejected": None,
                    "write_pool": "",
                    "breaker_parent_pct": None,
                    "breaker_tripped": 0,
                    "disk_total": None,
                    "disk_free": None,
                    "disk_used_pct": None,
                    "index_total": None,
                    "index_time_ms": None,
                    "query_total": None,
                    "query_time_ms": None,
                    "cpu_percent": None,
                    "gc_young_ms": None,
                    "gc_old_ms": None,
                    "node_name": "",
                }
                if not isinstance(data, dict):
                    return out
                nodes = data.get("nodes") or {}
                if not isinstance(nodes, dict) or not nodes:
                    return out
                n = next(iter(nodes.values()))
                if not isinstance(n, dict):
                    return out
                out["node_name"] = str(n.get("name") or "")
                jvm = n.get("jvm") or {}
                mem = jvm.get("mem") or {}
                if "heap_used_percent" in mem:
                    out["heap_pct"] = int(mem["heap_used_percent"])
                collectors = (jvm.get("gc") or {}).get("collectors") or {}
                young = collectors.get("young") or collectors.get("ParNew") or {}
                old = collectors.get("old") or collectors.get("ConcurrentMarkSweep") or collectors.get("G1 Old Generation") or {}
                if "collection_time_in_millis" in young:
                    out["gc_young_ms"] = int(young["collection_time_in_millis"])
                if "collection_time_in_millis" in old:
                    out["gc_old_ms"] = int(old["collection_time_in_millis"])
                tp = n.get("thread_pool") or {}
                write = tp.get("write") if isinstance(tp.get("write"), dict) else None
                if write is None and isinstance(tp.get("index"), dict):
                    write = tp["index"]
                    out["write_pool"] = "index_legacy"
                else:
                    out["write_pool"] = "write"
                if write:
                    out["write_rejected"] = int(write.get("rejected") or 0)
                search = tp.get("search") if isinstance(tp.get("search"), dict) else {}
                if search:
                    out["search_rejected"] = int(search.get("rejected") or 0)
                breakers = n.get("breakers") or {}
                parent = breakers.get("parent") or {}
                if parent.get("limit_size_in_bytes") and parent.get("estimated_size_in_bytes") is not None:
                    lim = int(parent["limit_size_in_bytes"]) or 1
                    out["breaker_parent_pct"] = int(int(parent["estimated_size_in_bytes"]) * 100 / lim)
                tripped = 0
                for b in breakers.values():
                    if isinstance(b, dict):
                        tripped += int(b.get("tripped") or 0)
                out["breaker_tripped"] = tripped
                fs = (n.get("fs") or {}).get("total") or {}
                if fs.get("total_in_bytes"):
                    total = int(fs["total_in_bytes"])
                    free = int(fs.get("available_in_bytes") or fs.get("free_in_bytes") or 0)
                    out["disk_total"] = total
                    out["disk_free"] = free
                    out["disk_used_pct"] = int((total - free) * 100 / total) if total else None
                idx = (n.get("indices") or {}).get("indexing") or {}
                if "index_total" in idx:
                    out["index_total"] = int(idx["index_total"])
                    out["index_time_ms"] = int(idx.get("index_time_in_millis") or 0)
                search_m = (n.get("indices") or {}).get("search") or {}
                if "query_total" in search_m:
                    out["query_total"] = int(search_m["query_total"])
                    out["query_time_ms"] = int(search_m.get("query_time_in_millis") or 0)
                cpu = (n.get("os") or {}).get("cpu") or {}
                if "percent" in cpu:
                    out["cpu_percent"] = int(cpu["percent"])
                return out
            
            
            def parse_cluster_health(text: str) -> dict[str, Any]:
                data = _load(text)
                if not isinstance(data, dict):
                    return {}
                keys = (
                    "status",
                    "number_of_nodes",
                    "number_of_data_nodes",
                    "active_primary_shards",
                    "active_shards",
                    "relocating_shards",
                    "initializing_shards",
                    "unassigned_shards",
                    "delayed_unassigned_shards",
                    "number_of_pending_tasks",
                    "task_max_waiting_in_queue_millis",
                    "active_shards_percent_as_number",
                    "timed_out",
                )
                out: dict[str, Any] = {}
                for k in keys:
                    if k in data:
                        out[k] = data[k]
                return out
            
            
            def merge_facts(path: str, updates: dict[str, Any]) -> dict[str, Any]:
                p = Path(path)
                cur: dict[str, Any] = {}
                if p.is_file():
                    try:
                        cur = json.loads(p.read_text(encoding="utf-8"))
                    except (OSError, json.JSONDecodeError):
                        cur = {}
                cur.update({k: v for k, v in updates.items() if v is not None})
                p.parent.mkdir(parents=True, exist_ok=True)
                p.write_text(json.dumps(cur, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
                return cur
            
            
            def _read_json(path: Path) -> dict[str, Any] | None:
                if not path.is_file():
                    return None
                try:
                    data = json.loads(path.read_text(encoding="utf-8"))
                except (OSError, json.JSONDecodeError):
                    return None
                return data if isinstance(data, dict) else None
            
            
            def _read_signals(base: Path) -> list[tuple[str, str, str]]:
                rows: list[tuple[str, str, str]] = []
                for p in sorted(base.glob("*.signals")):
                    try:
                        text = p.read_text(encoding="utf-8", errors="replace")
                    except OSError:
                        continue
                    for line in text.splitlines():
                        parts = line.split("\t", 2)
                        if len(parts) >= 3 and parts[0].startswith("ES"):
                            rows.append((parts[0], parts[1], parts[2]))
                return rows
            
            
            def _sev_rank(sev: str) -> int:
                return {"high": 3, "medium": 2, "low": 1, "warning": 2}.get(sev, 0)
            
            
            def _dedup(rows: list[tuple[str, str, str]]) -> list[tuple[str, str, str]]:
                best: dict[str, tuple[str, str, str]] = {}
                order: list[str] = []
                for sid, sev, note in rows:
                    if sid not in best:
                        order.append(sid)
                        best[sid] = (sid, sev, note)
                        continue
                    old = best[sid]
                    if _sev_rank(sev) > _sev_rank(old[1]):
                        best[sid] = (sid, sev, f"{old[2]} | {note}")
                    elif note not in old[2]:
                        best[sid] = (sid, old[1], f"{old[2]} | {note}")
                return [best[k] for k in order]
            
            
            def _add(signals: list[tuple[str, str, str]], sid: str, sev: str, note: str) -> None:
                signals.append((sid, sev, note))
            
            
            def cross_compare(
                facts: dict[str, dict[str, Any]],
                expected_nodes: int,
                expected_ips: list[str],
            ) -> tuple[list[tuple[str, str, str]], dict[str, Any]]:
                extra: list[tuple[str, str, str]] = []
                collected_ips = [ip for ip in expected_ips if ip in facts]
                n_col = len(collected_ips)
                meta: dict[str, Any] = {
                    "nodes_collected": n_col,
                    "expected_nodes": expected_nodes,
                    "majority_master": "",
                    "coverage": "ok",
                    "no_master": False,
                    "evidence_gap": [],
                }
                if n_col < expected_nodes:
                    meta["coverage"] = "degraded"
                    missing = [ip for ip in expected_ips if ip not in facts]
                    meta["evidence_gap"].append("missing_nodes=" + ",".join(missing))
                    _add(extra, "ES172", "high", "nodes missing: " + ",".join(missing))
                    if n_col == 0:
                        meta["coverage"] = "empty"
            
                masters = []
                auth_na = 0
                for ip in collected_ips:
                    f = facts[ip]
                    if f.get("auth_fail"):
                        auth_na += 1
                        continue
                    masters.append((ip, str(f.get("local_master") or "")))
            
                nonempty = [m for _, m in masters if m]
                empty = [ip for ip, m in masters if not m]
                maj = ""
                if nonempty:
                    maj, cnt = Counter(nonempty).most_common(1)[0]
                    if cnt >= 2 or (expected_nodes == 1 and cnt == 1):
                        maj_ok = maj
                    else:
                        maj_ok = maj if cnt == len(nonempty) else ""
                    maj = maj_ok
                meta["majority_master"] = maj
            
                all_collected = n_col == expected_nodes and expected_nodes >= 1
                all_empty = all_collected and not nonempty and auth_na == 0
                if all_empty:
                    _add(extra, "ES050", "high", "all %s nodes have empty local_master" % n_col)
                    _add(extra, "ES191", "high", "NO_MASTER")
                    meta["no_master"] = True
                    meta["majority_master"] = ""
                elif n_col < expected_nodes and nonempty == [] and empty:
                    meta["evidence_gap"].append("NO_MASTER_OBSERVED")
                    _add(extra, "ES173", "medium", "observed nodes have no master but collection incomplete")
                elif maj and empty:
                    _add(extra, "ES051", "high", "majority master=%s disagree/empty on %s" % (maj, ",".join(empty)))
                    _add(extra, "ES199", "high", "master view split")
                elif nonempty and len(set(nonempty)) > 1:
                    _add(extra, "ES051", "high", "local_master values disagree: " + ",".join(sorted(set(nonempty))))
                    _add(extra, "ES199", "high", "master view split")
            
                health = {}
                for ip in collected_ips:
                    h = facts[ip].get("cluster_health")
                    if isinstance(h, dict) and h.get("status"):
                        health = h
                        if maj and (facts[ip].get("is_elected") or facts[ip].get("local_master") == maj):
                            break
            
                nodes_in_health = int(health.get("number_of_nodes") or 0) if health else 0
                status = str(health.get("status") or "")
                unassigned = int(health.get("unassigned_shards") or 0) if health else 0
                delayed = int(health.get("delayed_unassigned_shards") or 0) if health else 0
                pending = int(health.get("number_of_pending_tasks") or 0) if health else 0
                reloc = int(health.get("relocating_shards") or 0) if health else 0
                init = int(health.get("initializing_shards") or 0) if health else 0
            
                if delayed > 0:
                    _add(extra, "ES055", "low", "delayed_unassigned=%s" % delayed)
                if pending >= 10:
                    _add(extra, "ES056", "high", "pending_tasks=%s" % pending)
                elif pending >= 1:
                    _add(extra, "ES056", "medium", "pending_tasks=%s" % pending)
                if reloc or init:
                    _add(extra, "ES057", "medium", "relocating=%s initializing=%s" % (reloc, init))
            
                down_ips = []
                for ip in expected_ips:
                    f = facts.get(ip) or {}
                    proc = f.get("process_up")
                    http = f.get("http_ok")
                    listen = f.get("listen_http")
                    if proc is False or listen is False or http is False:
                        down_ips.append(ip)
                    elif ip not in facts:
                        down_ips.append(ip)
            
                if not meta["no_master"]:
                    if nodes_in_health and nodes_in_health < expected_nodes:
                        missing_n = expected_nodes - nodes_in_health
                        if missing_n >= 2:
                            _add(extra, "ES053", "high", "health nodes=%s expected=%s" % (nodes_in_health, expected_nodes))
                        else:
                            _add(extra, "ES052", "medium", "health nodes=%s expected=%s" % (nodes_in_health, expected_nodes))
                        _add(extra, "ES190", "high", "NODE_DOWN health_nodes=%s down_ips=%s" % (nodes_in_health, ",".join(down_ips) or "unknown"))
                    elif n_col == expected_nodes and nodes_in_health == expected_nodes and status == "yellow" and unassigned > 0:
                        _add(extra, "ES192", "medium", "YELLOW_ALLOC_NOT_DOWN unassigned=%s" % unassigned)
                    if status == "red" and not meta["no_master"] and unassigned > 0:
                        _add(extra, "ES054", "high", "red with unassigned=%s" % unassigned)
            
                if meta["no_master"] and status == "red":
                    _add(extra, "ES053", "high", "red and NO_MASTER")
            
                if expected_nodes <= 1:
                    extra = [(s, v, n + " node_count=1") if s.startswith("ES19") else (s, v, n) for s, v, n in extra]
                    extra = [x for x in extra if not (x[0] in {"ES194", "ES196", "ES198"} and expected_nodes <= 1)]
            
                heaps = [(ip, facts[ip].get("heap_pct")) for ip in collected_ips if isinstance(facts[ip].get("heap_pct"), int)]
                high_heap = [ip for ip, h in heaps if h is not None and h >= 85]
                if len(high_heap) == 1 and len(heaps) >= 2:
                    _add(extra, "ES193", "high", "HEAP_ONE_OUTLIER %s heap=%s" % (high_heap[0], dict(heaps)[high_heap[0]]))
                    _add(extra, "ES034", "high", "%s heap=%s" % (high_heap[0], dict(heaps)[high_heap[0]]))
                elif len(high_heap) >= 2:
                    _add(extra, "ES194", "high", "HEAP_ALL_SIMILAR " + ",".join("%s=%s" % (ip, dict(heaps)[ip]) for ip in high_heap))
            
                rejects = [(ip, int(facts[ip].get("write_rejected_delta") or 0) + int(facts[ip].get("search_rejected_delta") or 0)) for ip in collected_ips]
                rej_pos = [ip for ip, r in rejects if r > 0]
                if len(rej_pos) == 1 and len(rejects) >= 2:
                    _add(extra, "ES195", "medium", "REJECT_ONE %s delta=%s" % (rej_pos[0], dict(rejects)[rej_pos[0]]))
                elif len(rej_pos) >= 2:
                    _add(extra, "ES196", "high", "REJECT_ALL " + ",".join(rej_pos))
            
                floods = [ip for ip in collected_ips if facts[ip].get("flood") or facts[ip].get("read_only_allow_delete")]
                if len(floods) == 1 and n_col >= 2:
                    _add(extra, "ES197", "high", "FLOOD_ONE %s" % floods[0])
                elif len(floods) >= 2:
                    _add(extra, "ES198", "high", "FLOOD_ALL " + ",".join(floods))
            
                for ip in collected_ips:
                    f = facts[ip]
                    if f.get("http_ok") and f.get("listen_http") and f.get("transport_ok") is False:
                        _add(extra, "ES091", "high", "9200 up 9300 down on %s" % ip)
                        _add(extra, "ES199", "high", "TRANSPORT_PARTITION %s" % ip)
                    peers = f.get("peer_transport") or {}
                    if isinstance(peers, dict):
                        for peer, ok in peers.items():
                            if ok is False and (f.get("peer_http") or {}).get(peer) is True:
                                _add(extra, "ES091", "high", "%s http ok transport fail to %s" % (ip, peer))
                                _add(extra, "ES199", "high", "TRANSPORT_PARTITION %s->%s" % (ip, peer))
            
                names = [str(facts[ip].get("cluster_name") or "") for ip in collected_ips if facts[ip].get("cluster_name")]
                if names and len(set(names)) > 1:
                    _add(extra, "ES060", "high", "cluster.name disagree: " + ",".join(sorted(set(names))))
            
                alloc = [str(facts[ip].get("allocation_enable") or "") for ip in collected_ips if facts[ip].get("allocation_enable")]
                if any(a and a != "all" for a in alloc):
                    _add(extra, "ES058", "high", "allocation.enable=" + ",".join(sorted(set(alloc))))
            
                explains = []
                for ip in collected_ips:
                    ex = facts[ip].get("explain_reasons") or []
                    if isinstance(ex, list):
                        explains.extend(str(x) for x in ex)
                joined = " ".join(explains).upper()
                if "NODE_LEFT" in joined or "NODE_RESTART" in joined:
                    _add(extra, "ES052", "medium", "explain NODE_LEFT")
                if "DECIDERS_NO" in joined and ("DISK" in joined or "WATERMARK" in joined):
                    _add(extra, "ES061", "high", "explain DECIDERS_NO disk")
                if "ALLOCATION_FAILED" in joined:
                    _add(extra, "ES063", "high", "explain ALLOCATION_FAILED")
            
                if expected_nodes <= 1:
                    extra = [x for x in extra if x[0] not in {"ES194", "ES196", "ES198"}]
            
                return extra, meta
            
            
            def render_summary(
                run_id: str,
                expected_ips: list[str],
                facts: dict[str, dict[str, Any]],
                signals: list[tuple[str, str, str]],
                meta: dict[str, Any],
                health: dict[str, Any],
            ) -> str:
                lines = [
                    "# ES 7.x 三节点排查摘要",
                    "",
                    f"- run_id: `{run_id}`",
                    f"- expected_nodes: {meta.get('expected_nodes')}",
                    f"- nodes_collected: {meta.get('nodes_collected')}",
                    f"- coverage: `{meta.get('coverage')}`",
                    f"- majority_master: `{meta.get('majority_master') or ('NO_MASTER' if meta.get('no_master') else 'UNKNOWN')}`",
                    "",
                    "## 集群健康",
                    "",
                ]
                if health:
                    lines += [
                        f"- status: `{health.get('status', '')}`",
                        f"- number_of_nodes: {health.get('number_of_nodes', '')}",
                        f"- unassigned_shards: {health.get('unassigned_shards', '')}",
                        f"- delayed_unassigned_shards: {health.get('delayed_unassigned_shards', '')}",
                        f"- pending_tasks: {health.get('number_of_pending_tasks', '')}",
                        "",
                    ]
                else:
                    lines += ["- （无权威 cluster health）", ""]
                lines += [
                    "## 各节点 master 视图",
                    "",
                    "| IP | local_master | 9200 | 9300 | heap% | write_rejected_delta | disk% |",
                    "|----|--------------|------|------|-------|----------------------|-------|",
                ]
                for ip in expected_ips:
                    f = facts.get(ip) or {}
                    http = "ok" if f.get("http_ok") else ("NA" if not f else "fail")
                    tp = f.get("listen_transport")
                    trans = "ok" if tp else ("fail" if tp is False else "NA")
                    lines.append(
                        "| {ip} | {lm} | {http} | {trans} | {heap} | {wr} | {disk} |".format(
                            ip=ip,
                            lm=f.get("local_master") or ("(empty)" if f else "(missing)"),
                            http=http,
                            trans=trans,
                            heap=f.get("heap_pct") if f.get("heap_pct") is not None else "",
                            wr=f.get("write_rejected_delta") if f.get("write_rejected_delta") is not None else "",
                            disk=f.get("disk_used_pct") if f.get("disk_used_pct") is not None else "",
                        )
                    )
                lines += ["", "## Top 信号", "", "| ID | 级别 | 说明 |", "|----|------|------|"]
                if signals:
                    for sid, sev, note in signals:
                        lines.append(f"| {sid} | {sev} | {note} |")
                else:
                    lines.append("| — | — | 无自动信号 |")
                lines += ["", "## 交叉对比结论", ""]
                ids = {s[0] for s in signals}
                bullets = []
                if "ES191" in ids:
                    bullets.append("- **ES191 NO_MASTER**：三台均无 elected master，先看发现/传输/进程，不要解释 unassigned。")
                if "ES190" in ids:
                    bullets.append("- **ES190 NODE_DOWN**：健康节点数少于期望，优先掉节点而不是业务 QPS。")
                if "ES192" in ids:
                    bullets.append("- **ES192 YELLOW_ALLOC_NOT_DOWN**：三台都在集群内，副本未分配是水位/allocation/max_shards。")
                if "ES193" in ids:
                    bullets.append("- **ES193 HEAP_ONE_OUTLIER**：单节点 JVM，不是全集群容量。")
                if "ES194" in ids:
                    bullets.append("- **ES194 HEAP_ALL_SIMILAR**：多节点堆压力。")
                if "ES195" in ids:
                    bullets.append("- **ES195 REJECT_ONE**：单节点线程池拒绝。")
                if "ES196" in ids:
                    bullets.append("- **ES196 REJECT_ALL**：多节点 reject。")
                if "ES197" in ids:
                    bullets.append("- **ES197 FLOOD_ONE**：单节点磁盘 flood / 只读块。")
                if "ES198" in ids:
                    bullets.append("- **ES198 FLOOD_ALL**：集群块。")
                if "ES199" in ids:
                    bullets.append("- **ES199 TRANSPORT_PARTITION**：9200/9300 分叉或 master 视图分裂。")
                if not bullets:
                    if meta.get("coverage") == "ok" and not ids:
                        bullets.append("- 倾向 **ES001 基线正常**，或故障未落入 P0 信号。")
                    else:
                        bullets.append("- 无组合结论；见证据缺口。")
                lines.extend(bullets)
                lines += ["", "## 证据缺口", ""]
                gaps = list(meta.get("evidence_gap") or [])
                if meta.get("no_master"):
                    gaps.append("unassigned explain 不可靠（NO_MASTER）")
                if not gaps:
                    lines.append("- 无")
                else:
                    for g in gaps:
                        lines.append(f"- {g}")
                lines.append("")
                return "\n".join(lines)
            
            
            def cleanse(base: str, run_id: str, expected_ips: list[str], profile: str = "v1") -> dict[str, Any]:
                root = Path(base)
                root.mkdir(parents=True, exist_ok=True)
                facts: dict[str, dict[str, Any]] = {}
                for ip in expected_ips:
                    data = _read_json(root / f"facts.{ip}.json")
                    if data:
                        facts[ip] = data
                    master = _read_json(root / f"master.{ip}.json")
                    if master:
                        facts.setdefault(ip, {})
                        for k in ("local_master", "local_master_ip", "http_ok", "auth_fail", "is_elected"):
                            if k in master and master[k] is not None:
                                facts[ip].setdefault(k, master[k])
            
                raw = _read_signals(root)
                extra, meta = cross_compare(facts, len(expected_ips), expected_ips)
                if profile.endswith("degraded") and meta["coverage"] == "ok":
                    meta["coverage"] = "degraded"
                    meta["evidence_gap"].append("forced_degraded_profile")
                merged = _dedup(raw + extra)
                health = {}
                for ip in expected_ips:
                    h = (facts.get(ip) or {}).get("cluster_health")
                    if isinstance(h, dict) and h:
                        health = h
                        if facts[ip].get("is_elected"):
                            break
            
                kinds = ("precheck", "metrics", "status", "config", "logs", "hostnet")
                found = sum(1 for k in kinds if any(root.glob(f"{k}.*.txt")))
                if found == 0 and meta["coverage"] == "ok":
                    meta["coverage"] = "empty"
                elif found < 3 and meta["coverage"] == "ok":
                    meta["coverage"] = "degraded"
            
                summary = render_summary(run_id, expected_ips, facts, merged, meta, health)
                (root / "summary.md").write_text(summary, encoding="utf-8")
                sig_txt = "".join(f"{a}\t{b}\t{c}\n" for a, b, c in merged)
                (root / "signals.txt").write_text(sig_txt, encoding="utf-8")
                (root / "signals.uniq.tsv").write_text(sig_txt, encoding="utf-8")
            
                cleaned_parts = [
                    f"===== ES_TS cleaned run_id={run_id} profile={profile} =====",
                    f"nodes={','.join(expected_ips)}",
                    f"coverage={meta['coverage']} majority_master={meta.get('majority_master')}",
                    "",
                    "----- SIGNALS -----",
                    sig_txt or "NO_SIGNALS",
                    "",
                ]
                for p in sorted(root.glob("*.txt")):
                    if p.name in {"cleaned.txt", "signals.txt"}:
                        continue
                    body = p.read_text(encoding="utf-8", errors="replace")
                    lines = body.splitlines()
                    keep = [ln for ln in lines if ln.startswith("SIGNAL ") or ln.startswith("CMD_FAIL") or "KEYWORD" in ln]
                    if not keep:
                        keep = lines[-40:]
                    cleaned_parts.append(f"### {p.name} ###")
                    cleaned_parts.extend(keep[:80])
                    cleaned_parts.append("")
                cleaned = "\n".join(cleaned_parts)
                if len(cleaned.encode()) > 64000:
                    cleaned = cleaned.encode()[:64000].decode("utf-8", errors="ignore")
                (root / "cleaned.txt").write_text(cleaned, encoding="utf-8")
                meta_out = {
                    "run_id": run_id,
                    "profile": profile,
                    "coverage_status": meta["coverage"],
                    "nodes_collected": meta["nodes_collected"],
                    "expected_nodes": meta["expected_nodes"],
                    "majority_master": meta.get("majority_master") or "",
                    "no_master": str(bool(meta.get("no_master"))).lower(),
                    "signal_count": len(merged),
                    "kinds_found": found,
                }
                meta_txt = "".join(f"{k}={v}\n" for k, v in meta_out.items())
                (root / "cleaned.meta").write_text(meta_txt, encoding="utf-8")
                return {"meta": meta_out, "signals": merged, "summary": summary}
            
            
            def _cli(argv: list[str]) -> int:
                if len(argv) < 2:
                    print("usage: es_lib.py parse-master|parse-stats|parse-health|merge-facts|cleanse ...", file=sys.stderr)
                    return 2
                cmd = argv[1]
                if cmd == "parse-master":
                    print(json.dumps(parse_cat_master(sys.stdin.read()), ensure_ascii=False))
                    return 0
                if cmd == "parse-stats":
                    print(json.dumps(parse_local_stats(sys.stdin.read()), ensure_ascii=False))
                    return 0
                if cmd == "parse-health":
                    print(json.dumps(parse_cluster_health(sys.stdin.read()), ensure_ascii=False))
                    return 0
                if cmd == "parse-nodes":
                    local_ip = argv[2] if len(argv) > 2 else ""
                    print(json.dumps(parse_cat_nodes(sys.stdin.read(), local_ip), ensure_ascii=False))
                    return 0
                if cmd == "merge-facts":
                    path = argv[2]
                    updates = json.loads(argv[3] if len(argv) > 3 else sys.stdin.read())
                    print(json.dumps(merge_facts(path, updates), ensure_ascii=False))
                    return 0
                if cmd == "cleanse":
                    base, run_id = argv[2], argv[3]
                    ips = argv[4:]
                    profile = os.environ.get("TS_PROFILE", "v1")
                    result = cleanse(base, run_id, ips, profile)
                    print(json.dumps(result["meta"], ensure_ascii=False))
                    return 0
                print("unknown command", cmd, file=sys.stderr)
                return 2
            
            
            if __name__ == "__main__":
                sys.exit(_cli(sys.argv))
            ES_TS_LIB_PY
            # Shared helpers for ES 7.x troubleshooting collectors. Sourced, not executed.
            # Collectors always exit 0. Do not mutate the cluster.
            
            umask 077
            
            json_escape() {
              local s=${1-}
              s=${s//\\/\\\\}
              s=${s//\"/\\\"}
              s=${s//$'\n'/\\n}
              s=${s//$'\r'/\\r}
              s=${s//$'\t'/\\t}
              printf '%s' "$s"
            }
            
            ts_now() { date -u +"%Y-%m-%dT%H:%M:%SZ"; }
            
            resolve_local_ip() {
              local node1=$1 node2=$2 node3=$3
              local local_ips target_ip=""
              local_ips=$(hostname -I 2>/dev/null || true)
              for ip in "$node1" "$node2" "$node3"; do
                [[ " ${local_ips} " == *" ${ip} "* ]] && target_ip=$ip && break
              done
              if [[ -z "$target_ip" ]]; then
                target_ip=$(hostname -I 2>/dev/null | awk '{print $1}')
              fi
              printf '%s' "${target_ip:-unknown}"
            }
            
            artifact_dir_for() {
              local run_id=$1
              local base=${TS_ARTIFACT_DIR:-/tmp/es-troubleshoot}
              printf '%s/%s' "$base" "$run_id"
            }
            
            es_lib_py() {
              local here=${SCRIPT_DIR:-}
              if [[ -n "$here" && -f "${here}/es_lib.py" ]]; then
                printf '%s' "${here}/es_lib.py"
                return 0
              fi
              if [[ -f /tmp/es-ts-lib/es_lib.py ]]; then
                printf '%s' /tmp/es-ts-lib/es_lib.py
                return 0
              fi
              return 1
            }
            
            begin_artifact() {
              local kind=$1 node=$2 run_id=$3
              ARTIFACT_KIND=$kind
              ARTIFACT_NODE=$node
              ARTIFACT_RUN_ID=$run_id
              ARTIFACT_DIR=$(artifact_dir_for "$run_id")
              mkdir -p "$ARTIFACT_DIR"
              ARTIFACT_FILE="${ARTIFACT_DIR}/${kind}.${node}.txt"
              SIGNAL_FILE="${ARTIFACT_DIR}/${kind}.${node}.signals"
              FACTS_FILE="${ARTIFACT_DIR}/facts.${node}.json"
              MASTER_FILE="${ARTIFACT_DIR}/master.${node}.json"
              : > "$ARTIFACT_FILE"
              : > "$SIGNAL_FILE"
              {
                echo "===== ES_TS artifact=${kind} node=${node} ts=$(ts_now) run_id=${run_id} ====="
                echo "hostname=$(hostname 2>/dev/null || echo unknown)"
              } >> "$ARTIFACT_FILE"
            }
            
            emit() {
              printf '%s\n' "$*" >> "$ARTIFACT_FILE"
            }
            
            emit_cmd() {
              local title=$1
              local rc=0
              shift
              emit "----- ${title} -----"
              "$@" >> "$ARTIFACT_FILE" 2>&1
              rc=$?
              if (( rc != 0 )); then
                emit "CMD_FAIL: ${title} rc=${rc}"
                return 1
              fi
              return 0
            }
            
            emit_cmd_timeout() {
              local seconds=$1 title=$2
              shift 2
              emit "----- ${title} (timeout ${seconds}s) -----"
              if command -v timeout >/dev/null 2>&1; then
                if ! timeout "$seconds" "$@" >> "$ARTIFACT_FILE" 2>&1; then
                  emit "CMD_FAIL_OR_TIMEOUT: ${title}"
                  signal ES174 low "timeout ${title}"
                  return 1
                fi
              else
                if ! "$@" >> "$ARTIFACT_FILE" 2>&1; then
                  emit "CMD_FAIL: ${title}"
                  return 1
                fi
              fi
              return 0
            }
            
            signal() {
              printf '%s\t%s\t%s\n' "$1" "$2" "$3" >> "$SIGNAL_FILE"
              emit "SIGNAL ${1} severity=${2} ${3}"
            }
            
            finish_artifact() {
              emit "===== END ES_TS artifact=${ARTIFACT_KIND} node=${ARTIFACT_NODE} ====="
              echo "###ES_TS_ARTIFACT kind=${ARTIFACT_KIND} node=${ARTIFACT_NODE} file=${ARTIFACT_FILE}###"
              cat "$ARTIFACT_FILE"
              echo "###ES_TS_SIGNALS kind=${ARTIFACT_KIND} node=${ARTIFACT_NODE}###"
              cat "$SIGNAL_FILE"
              echo "###END_ES_TS_ARTIFACT###"
            }
            
            es_curl() {
              # es_curl <seconds> <url> [curl extra...]
              local seconds=$1
              shift
              local url=$1
              shift
              local args=(-sS --max-time "$seconds" --connect-timeout 3 -H 'Accept: application/json')
              if [[ -n "${ES_USER:-}" ]]; then
                args+=(-u "${ES_USER}:${ES_PASS:-}")
              fi
              curl "${args[@]}" "$@" "$url" 2>/dev/null
            }
            
            es_base_url() {
              printf 'http://127.0.0.1:%s' "${ES_HTTP_PORT:-9200}"
            }
            
            facts_merge() {
              local json=$1
              local py
              py=$(es_lib_py) || return 0
              python3 "$py" merge-facts "$FACTS_FILE" "$json" >/dev/null 2>&1 || true
            }
            
            record_local_master() {
              local url
              url="$(es_base_url)/_cat/master?h=id,host,ip,node&format=json"
              local body rc=0
              body=$(es_curl 3 "$url" -w '\nHTTP_CODE:%{http_code}\n') || rc=$?
              local code
              code=$(printf '%s\n' "$body" | awk -F: '/HTTP_CODE:/{print $2}' | tail -n1)
              local json
              json=$(printf '%s\n' "$body" | sed '/HTTP_CODE:/d')
              emit "----- local _cat/master http=${code:-na} rc=${rc} -----"
              emit "$json"
            
              local parsed="{}"
              local py
              py=$(es_lib_py) || true
              if [[ -n "$py" ]]; then
                parsed=$(printf '%s' "$json" | python3 "$py" parse-master 2>/dev/null || echo '{}')
              fi
              local http_ok=false auth_fail=false local_master="" local_ip=""
              if [[ "$code" == "401" || "$code" == "403" ]]; then
                auth_fail=true
                signal ES032 high "local HTTP auth failed code=${code}"
              elif [[ "$code" == "200" ]]; then
                http_ok=true
              else
                signal ES032 medium "local _cat/master failed code=${code:-na} rc=${rc}"
              fi
              if [[ "$http_ok" == true ]]; then
                local_master=$(python3 -c 'import json,sys; d=json.loads(sys.argv[1]); print(d.get("local_master",""))' "$parsed" 2>/dev/null || true)
                local_ip=$(python3 -c 'import json,sys; d=json.loads(sys.argv[1]); print(d.get("local_master_ip",""))' "$parsed" 2>/dev/null || true)
              fi
              emit "local_master=${local_master}"
              emit "local_master_ip=${local_ip}"
            
              local nodes_json=""
              nodes_json=$(es_curl 3 "$(es_base_url)/_cat/nodes?h=id,name,ip,master,node.role&format=json" || true)
              emit "----- local _cat/nodes -----"
              emit "$nodes_json"
              local self_elected=false
              if [[ -n "$py" && -n "$nodes_json" ]]; then
                local nodes_parsed
                nodes_parsed=$(printf '%s' "$nodes_json" | python3 "$py" parse-nodes "$ARTIFACT_NODE" 2>/dev/null || echo '{}')
                if python3 -c 'import json,sys; raise SystemExit(0 if json.loads(sys.argv[1]).get("self_elected") else 1)' "$nodes_parsed" 2>/dev/null; then
                  self_elected=true
                fi
              fi
              if [[ "$self_elected" != true && -n "$local_ip" && "$local_ip" == "$ARTIFACT_NODE" ]]; then
                self_elected=true
              fi
              emit "is_elected=${self_elected}"
            
              mkdir -p "$ARTIFACT_DIR"
              python3 - "$MASTER_FILE" "$ARTIFACT_NODE" "$local_master" "$local_ip" "$http_ok" "$auth_fail" "$self_elected" <<'PY' 2>/dev/null || true
            import json,sys
            path, node, lm, lip, http_ok, auth, elected = sys.argv[1:8]
            doc = {
              "node": node,
              "local_master": lm,
              "local_master_ip": lip,
              "http_ok": http_ok == "true",
              "auth_fail": auth == "true",
              "is_elected": elected == "true",
            }
            open(path,"w",encoding="utf-8").write(json.dumps(doc, ensure_ascii=False, indent=2)+"\n")
            PY
              facts_merge "$(python3 -c 'import json,sys; print(json.dumps({"local_master":sys.argv[1],"local_master_ip":sys.argv[2],"http_ok":sys.argv[3]=="true","auth_fail":sys.argv[4]=="true","is_elected":sys.argv[5]=="true","node":sys.argv[6]}))' \
                "$local_master" "$local_ip" "$http_ok" "$auth_fail" "$self_elected" "$ARTIFACT_NODE")"
              if [[ "$self_elected" == true ]]; then
                IS_ELECTED=1
              else
                IS_ELECTED=0
              fi
            }
            
            listen_port() {
              local port=$1
              if command -v ss >/dev/null 2>&1; then
                ss -lnt 2>/dev/null | awk '{print $4}' | grep -q ":${port}$"
                return $?
              fi
              netstat -lnt 2>/dev/null | grep -q ":${port} "
            }
            
            tcp_probe() {
              local host=$1 port=$2
              if timeout 2 bash -c "echo >/dev/tcp/${host}/${port}" 2>/dev/null; then
                return 0
              fi
              if command -v nc >/dev/null 2>&1; then
                nc -z -w 2 "$host" "$port" >/dev/null 2>&1 && return 0
              fi
              return 1
            }
            
            es_process_up() {
              # Character class so pgrep does not match its own argv.
              pgrep -f '[o]rg.elasticsearch.bootstrap.Elasticsearch' >/dev/null 2>&1 && return 0
              pgrep -x elasticsearch >/dev/null 2>&1 && return 0
              return 1
            }
            # H 主机+网络：磁盘/iostat/FD/时钟 + 9200/9300 分端口探测。
            set -uo pipefail
            
            node1=${1:-}
            node2=${2:-}
            node3=${3:-}
            ES_HTTP_PORT=${4:-9200}
            ES_TRANSPORT_PORT=${5:-9300}
            run_id=${6:-manual}
            ES_USER=${7:-${ES_USER:-}}
            ES_PASS=${8:-${ES_PASS:-}}
            data_dir=${9:-}
            export ES_HTTP_PORT ES_USER ES_PASS
            
            target_ip=$(resolve_local_ip "$node1" "$node2" "$node3")
            begin_artifact hostnet "$target_ip" "$run_id"
            emit "collector=hostnet"
            
            if [[ -z "$data_dir" || ! -d "$data_dir" ]]; then
              for alt in /var/lib/elasticsearch /opt/elasticsearch/data; do
                [[ -d "$alt" ]] && data_dir=$alt && break
              done
            fi
            emit "data_dir=${data_dir:-unknown}"
            
            emit_cmd "uptime" uptime || true
            emit_cmd "free -m" free -m || true
            if command -v vmstat >/dev/null 2>&1; then
              emit_cmd_timeout 6 "vmstat 1 3" vmstat 1 3 || true
            fi
            if command -v iostat >/dev/null 2>&1; then
              emit_cmd_timeout 6 "iostat -x 1 3" iostat -x 1 3 || true
            else
              signal ES171 low "iostat missing"
            fi
            
            emit "----- df -----"
            df -h >> "$ARTIFACT_FILE" 2>&1 || true
            df -i >> "$ARTIFACT_FILE" 2>&1 || true
            if [[ -n "$data_dir" && -d "$data_dir" ]]; then
              used=$(df -P "$data_dir" 2>/dev/null | awk 'NR==2{gsub("%","",$5); print $5}')
              inode=$(df -iP "$data_dir" 2>/dev/null | awk 'NR==2{gsub("%","",$5); print $5}')
              emit "data_dir_used_pct=${used:-na} inode_pct=${inode:-na}"
              facts_merge "$(python3 -c 'import json,sys; d={"disk_used_pct": int(sys.argv[1]) if sys.argv[1].isdigit() else None}; print(json.dumps({k:v for k,v in d.items() if v is not None}))' "${used:-}")"
              if [[ "${used:-0}" =~ ^[0-9]+$ ]] && (( used >= 95 )); then
                signal ES015 high "path.data used ${used}%"
                signal ES070 high "disk ${used}% flood likely"
                facts_merge '{"flood": true}'
              elif [[ "${used:-0}" =~ ^[0-9]+$ ]] && (( used >= 90 )); then
                signal ES015 medium "path.data used ${used}%"
                signal ES072 medium "disk ${used}%"
              fi
              if [[ "${inode:-0}" =~ ^[0-9]+$ ]] && (( inode >= 90 )); then
                signal ES016 high "inode used ${inode}%"
              fi
            fi
            
            if [[ -r /proc/loadavg ]]; then
              load=$(awk '{print $1}' /proc/loadavg)
              cores=$(nproc 2>/dev/null || echo 1)
              emit "load1=${load} cores=${cores}"
              awk -v l="$load" -v c="$cores" 'BEGIN{if (c>0 && l+0 > c*0.85) exit 0; exit 1}' && \
                signal ES010 medium "load1=${load} cores=${cores}" || true
            fi
            if [[ -r /proc/meminfo ]]; then
              avail_pct=$(awk '/MemTotal:/{t=$2} /MemAvailable:/{a=$2} END{if(t>0) printf "%d", a*100/t; else print 100}' /proc/meminfo)
              emit "mem_available_pct=${avail_pct}"
              if (( avail_pct <= 15 )); then
                signal ES011 high "memory available ${avail_pct}%"
              fi
              swap_used=$(awk '/SwapTotal:/{t=$2} /SwapFree:/{f=$2} END{print t-f+0}' /proc/meminfo)
              if (( swap_used > 1024*1024 )); then
                signal ES012 medium "swap used ${swap_used} kB"
              fi
            fi
            
            pid=$(pgrep -f 'org.elasticsearch.bootstrap.Elasticsearch' | head -n1 || true)
            if [[ -n "$pid" && -d /proc/$pid/fd ]]; then
              fdn=$(ls /proc/$pid/fd 2>/dev/null | wc -l | tr -d ' ')
              ul=$(awk '/Max open files/{print $4}' /proc/$pid/limits 2>/dev/null | head -n1)
              emit "es_pid=${pid} fd=${fdn} ulimit=${ul:-na}"
              if [[ "${ul:-0}" =~ ^[0-9]+$ && "$ul" -gt 0 && "$fdn" -ge $((ul * 80 / 100)) ]]; then
                signal ES013 high "fd ${fdn}/${ul}"
              fi
            fi
            
            if command -v timedatectl >/dev/null 2>&1; then
              emit_cmd "timedatectl" timedatectl || true
            fi
            if command -v chronyc >/dev/null 2>&1; then
              offset=$(chronyc tracking 2>/dev/null | awk -F: '/Last offset/{print $2}' | awk '{print $1}')
              emit "chrony_last_offset=${offset:-na}"
              python3 -c 'import sys
            s=sys.argv[1].strip().replace("seconds","").strip()
            try:
                v=abs(float(s))
            except Exception:
                raise SystemExit(0)
            if v>=2: raise SystemExit(2)
            ' "${offset:-0}" && true || {
                rc=$?
                if (( rc == 2 )); then
                  signal ES014 medium "clock offset ${offset}"
                fi
              }
            fi
            
            emit "----- listening -----"
            if command -v ss >/dev/null 2>&1; then
              ss -lntp >> "$ARTIFACT_FILE" 2>&1 || true
            else
              netstat -lntp >> "$ARTIFACT_FILE" 2>&1 || true
            fi
            http_l=0 trans_l=0
            listen_port "$ES_HTTP_PORT" && http_l=1
            listen_port "$ES_TRANSPORT_PORT" && trans_l=1
            facts_merge "$(python3 -c 'import json,sys; print(json.dumps({"listen_http": sys.argv[1]=="1", "listen_transport": sys.argv[2]=="1"}))' "$http_l" "$trans_l")"
            if (( http_l == 1 && trans_l == 0 )); then
              signal ES091 high "listen 9200 but not ${ES_TRANSPORT_PORT}"
              facts_merge '{"transport_ok": false}'
            elif (( trans_l == 1 && http_l == 0 )); then
              signal ES092 medium "listen ${ES_TRANSPORT_PORT} but not http"
            fi
            
            emit "----- peer ping/tcp -----"
            peer_http_json="{"
            peer_tp_json="{"
            first=1
            for ip in "$node1" "$node2" "$node3"; do
              [[ -z "$ip" || "$ip" == "$target_ip" ]] && continue
              if ping -c 3 -W 1 "$ip" >> "$ARTIFACT_FILE" 2>&1; then
                emit "PING_OK ${ip}"
              else
                emit "PING_FAIL ${ip}"
                signal ES090 medium "ping fail ${ip}"
              fi
              h=0 t=0
              tcp_probe "$ip" "$ES_HTTP_PORT" && h=1 || emit "TCP_FAIL ${ip}:${ES_HTTP_PORT}"
              tcp_probe "$ip" "$ES_TRANSPORT_PORT" && t=1 || emit "TCP_FAIL ${ip}:${ES_TRANSPORT_PORT}"
              (( h )) && emit "TCP_OK ${ip}:${ES_HTTP_PORT}"
              (( t )) && emit "TCP_OK ${ip}:${ES_TRANSPORT_PORT}"
              if (( h == 1 && t == 0 )); then
                signal ES091 high "9200 ok 9300 fail ${target_ip}->${ip}"
              fi
              if (( first == 0 )); then
                peer_http_json+=", "
                peer_tp_json+=", "
              fi
              first=0
              peer_http_json+="\"${ip}\": $([[ $h -eq 1 ]] && echo true || echo false)"
              peer_tp_json+="\"${ip}\": $([[ $t -eq 1 ]] && echo true || echo false)"
            done
            peer_http_json+="}"
            peer_tp_json+="}"
            facts_merge "{\"peer_http\": ${peer_http_json}, \"peer_transport\": ${peer_tp_json}}"
            
            if command -v nstat >/dev/null 2>&1; then
              emit_cmd "nstat -az TcpRetransSegs" nstat -az TcpRetransSegs || true
            fi
            if command -v iptables >/dev/null 2>&1; then
              if iptables -S 2>/dev/null | grep -q DROP; then
                signal ES094 low "iptables DROP rules present"
              fi
            fi
            
            finish_artifact
            exit 0
        job_ip_list:
          value: "${es_node_ips}"
        job_rolling_config:
          value:
            job_rolling_execute: []
            job_rolling_expression: ''
            job_rolling_mode: 1
        job_script_list_general:
          value: ''
        job_script_list_public:
          value: ''
        job_script_param:
          value: "'${es_node1_ip}' '${es_node2_ip}' '${es_node3_ip}' '${es_http_port}' '${es_transport_port}' '${ts_run_id}' '${es_user}' '${es_pass}' '${es_data_dir}'"
        job_script_source:
          value: manual
        job_script_timeout:
          value: '120'
        job_script_type:
          value: '1'
        job_success_id:
          value: ''
    auto_retry:
      enable: false
      times: 1
      interval: 0
    ignore_error: true
    can_retry: true
    can_skip: false
    optional: false
    next:
    - es-ts_converge
  - id: es-ts_converge
    type: ConvergeGateway
    name: 采集汇聚
    next:
    - es-ts_coverage_gw
  - id: es-ts_coverage_gw
    type: ExclusiveGateway
    name: 采集覆盖判定
    conditions:
    - name: 采集降级
      evaluate: "${coverage_status} in ['empty','degraded']"
      next: es-ts_clean_degraded
    - name: 正常清洗
      evaluate: default
      next: es-ts_clean
    next:
    - es-ts_clean
    - es-ts_clean_degraded
  - id: es-ts_clean
    type: ServiceActivity
    name: 快速执行脚本
    stage_name: 数据清洗与交叉对比(Markdown)
    component:
      code: job_fast_execute_script
      version: v1.2
      data:
        biz_cc_id:
          name: 业务
          value: ''
          key: "${biz_cc_id}"
          version: v1.2
          source_tag: job_fast_execute_script.biz_cc_id
        job_account:
          value: root
        job_content:
          value: |
            #!/usr/bin/env bash
            mkdir -p /tmp/es-ts-lib
            cat > /tmp/es-ts-lib/es_lib.py <<'ES_TS_LIB_PY'
            #!/usr/bin/env python3
            """Parse ES 7.x collector JSON and run cleanse cross-compare.
            
            Used by bash collectors and cleanse_artifacts.sh. No HTTP. Diagnose only.
            """
            from __future__ import annotations
            
            import json
            import os
            import sys
            from collections import Counter
            from pathlib import Path
            from typing import Any
            
            
            def _load(text: str) -> Any:
                text = (text or "").strip()
                if not text:
                    return None
                try:
                    return json.loads(text)
                except json.JSONDecodeError:
                    return None
            
            
            def parse_cat_master(text: str) -> dict[str, Any]:
                data = _load(text)
                out = {
                    "http_ok": False,
                    "auth_fail": False,
                    "local_master": "",
                    "local_master_ip": "",
                    "local_master_id": "",
                    "is_elected": False,
                }
                if data is None:
                    return out
                out["http_ok"] = True
                row = None
                if isinstance(data, list) and data:
                    row = data[0] if isinstance(data[0], dict) else None
                elif isinstance(data, dict):
                    row = data
                if not row:
                    return out
                out["local_master"] = str(row.get("node") or row.get("name") or "")
                out["local_master_ip"] = str(row.get("ip") or row.get("host") or "")
                out["local_master_id"] = str(row.get("id") or "")
                return out
            
            
            def parse_cat_nodes(text: str, local_ip: str = "") -> dict[str, Any]:
                data = _load(text)
                out = {"nodes": [], "elected": "", "elected_ip": "", "self_elected": False}
                if not isinstance(data, list):
                    return out
                for row in data:
                    if not isinstance(row, dict):
                        continue
                    name = str(row.get("name") or row.get("node") or "")
                    ip = str(row.get("ip") or "")
                    master = str(row.get("master") or "")
                    roles = str(row.get("node.role") or row.get("nodeRole") or "")
                    out["nodes"].append({"name": name, "ip": ip, "master": master, "roles": roles})
                    if master == "*":
                        out["elected"] = name
                        out["elected_ip"] = ip
                        if local_ip and (ip == local_ip):
                            out["self_elected"] = True
                return out
            
            
            def parse_local_stats(text: str) -> dict[str, Any]:
                data = _load(text)
                out = {
                    "heap_pct": None,
                    "write_rejected": None,
                    "search_rejected": None,
                    "write_pool": "",
                    "breaker_parent_pct": None,
                    "breaker_tripped": 0,
                    "disk_total": None,
                    "disk_free": None,
                    "disk_used_pct": None,
                    "index_total": None,
                    "index_time_ms": None,
                    "query_total": None,
                    "query_time_ms": None,
                    "cpu_percent": None,
                    "gc_young_ms": None,
                    "gc_old_ms": None,
                    "node_name": "",
                }
                if not isinstance(data, dict):
                    return out
                nodes = data.get("nodes") or {}
                if not isinstance(nodes, dict) or not nodes:
                    return out
                n = next(iter(nodes.values()))
                if not isinstance(n, dict):
                    return out
                out["node_name"] = str(n.get("name") or "")
                jvm = n.get("jvm") or {}
                mem = jvm.get("mem") or {}
                if "heap_used_percent" in mem:
                    out["heap_pct"] = int(mem["heap_used_percent"])
                collectors = (jvm.get("gc") or {}).get("collectors") or {}
                young = collectors.get("young") or collectors.get("ParNew") or {}
                old = collectors.get("old") or collectors.get("ConcurrentMarkSweep") or collectors.get("G1 Old Generation") or {}
                if "collection_time_in_millis" in young:
                    out["gc_young_ms"] = int(young["collection_time_in_millis"])
                if "collection_time_in_millis" in old:
                    out["gc_old_ms"] = int(old["collection_time_in_millis"])
                tp = n.get("thread_pool") or {}
                write = tp.get("write") if isinstance(tp.get("write"), dict) else None
                if write is None and isinstance(tp.get("index"), dict):
                    write = tp["index"]
                    out["write_pool"] = "index_legacy"
                else:
                    out["write_pool"] = "write"
                if write:
                    out["write_rejected"] = int(write.get("rejected") or 0)
                search = tp.get("search") if isinstance(tp.get("search"), dict) else {}
                if search:
                    out["search_rejected"] = int(search.get("rejected") or 0)
                breakers = n.get("breakers") or {}
                parent = breakers.get("parent") or {}
                if parent.get("limit_size_in_bytes") and parent.get("estimated_size_in_bytes") is not None:
                    lim = int(parent["limit_size_in_bytes"]) or 1
                    out["breaker_parent_pct"] = int(int(parent["estimated_size_in_bytes"]) * 100 / lim)
                tripped = 0
                for b in breakers.values():
                    if isinstance(b, dict):
                        tripped += int(b.get("tripped") or 0)
                out["breaker_tripped"] = tripped
                fs = (n.get("fs") or {}).get("total") or {}
                if fs.get("total_in_bytes"):
                    total = int(fs["total_in_bytes"])
                    free = int(fs.get("available_in_bytes") or fs.get("free_in_bytes") or 0)
                    out["disk_total"] = total
                    out["disk_free"] = free
                    out["disk_used_pct"] = int((total - free) * 100 / total) if total else None
                idx = (n.get("indices") or {}).get("indexing") or {}
                if "index_total" in idx:
                    out["index_total"] = int(idx["index_total"])
                    out["index_time_ms"] = int(idx.get("index_time_in_millis") or 0)
                search_m = (n.get("indices") or {}).get("search") or {}
                if "query_total" in search_m:
                    out["query_total"] = int(search_m["query_total"])
                    out["query_time_ms"] = int(search_m.get("query_time_in_millis") or 0)
                cpu = (n.get("os") or {}).get("cpu") or {}
                if "percent" in cpu:
                    out["cpu_percent"] = int(cpu["percent"])
                return out
            
            
            def parse_cluster_health(text: str) -> dict[str, Any]:
                data = _load(text)
                if not isinstance(data, dict):
                    return {}
                keys = (
                    "status",
                    "number_of_nodes",
                    "number_of_data_nodes",
                    "active_primary_shards",
                    "active_shards",
                    "relocating_shards",
                    "initializing_shards",
                    "unassigned_shards",
                    "delayed_unassigned_shards",
                    "number_of_pending_tasks",
                    "task_max_waiting_in_queue_millis",
                    "active_shards_percent_as_number",
                    "timed_out",
                )
                out: dict[str, Any] = {}
                for k in keys:
                    if k in data:
                        out[k] = data[k]
                return out
            
            
            def merge_facts(path: str, updates: dict[str, Any]) -> dict[str, Any]:
                p = Path(path)
                cur: dict[str, Any] = {}
                if p.is_file():
                    try:
                        cur = json.loads(p.read_text(encoding="utf-8"))
                    except (OSError, json.JSONDecodeError):
                        cur = {}
                cur.update({k: v for k, v in updates.items() if v is not None})
                p.parent.mkdir(parents=True, exist_ok=True)
                p.write_text(json.dumps(cur, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
                return cur
            
            
            def _read_json(path: Path) -> dict[str, Any] | None:
                if not path.is_file():
                    return None
                try:
                    data = json.loads(path.read_text(encoding="utf-8"))
                except (OSError, json.JSONDecodeError):
                    return None
                return data if isinstance(data, dict) else None
            
            
            def _read_signals(base: Path) -> list[tuple[str, str, str]]:
                rows: list[tuple[str, str, str]] = []
                for p in sorted(base.glob("*.signals")):
                    try:
                        text = p.read_text(encoding="utf-8", errors="replace")
                    except OSError:
                        continue
                    for line in text.splitlines():
                        parts = line.split("\t", 2)
                        if len(parts) >= 3 and parts[0].startswith("ES"):
                            rows.append((parts[0], parts[1], parts[2]))
                return rows
            
            
            def _sev_rank(sev: str) -> int:
                return {"high": 3, "medium": 2, "low": 1, "warning": 2}.get(sev, 0)
            
            
            def _dedup(rows: list[tuple[str, str, str]]) -> list[tuple[str, str, str]]:
                best: dict[str, tuple[str, str, str]] = {}
                order: list[str] = []
                for sid, sev, note in rows:
                    if sid not in best:
                        order.append(sid)
                        best[sid] = (sid, sev, note)
                        continue
                    old = best[sid]
                    if _sev_rank(sev) > _sev_rank(old[1]):
                        best[sid] = (sid, sev, f"{old[2]} | {note}")
                    elif note not in old[2]:
                        best[sid] = (sid, old[1], f"{old[2]} | {note}")
                return [best[k] for k in order]
            
            
            def _add(signals: list[tuple[str, str, str]], sid: str, sev: str, note: str) -> None:
                signals.append((sid, sev, note))
            
            
            def cross_compare(
                facts: dict[str, dict[str, Any]],
                expected_nodes: int,
                expected_ips: list[str],
            ) -> tuple[list[tuple[str, str, str]], dict[str, Any]]:
                extra: list[tuple[str, str, str]] = []
                collected_ips = [ip for ip in expected_ips if ip in facts]
                n_col = len(collected_ips)
                meta: dict[str, Any] = {
                    "nodes_collected": n_col,
                    "expected_nodes": expected_nodes,
                    "majority_master": "",
                    "coverage": "ok",
                    "no_master": False,
                    "evidence_gap": [],
                }
                if n_col < expected_nodes:
                    meta["coverage"] = "degraded"
                    missing = [ip for ip in expected_ips if ip not in facts]
                    meta["evidence_gap"].append("missing_nodes=" + ",".join(missing))
                    _add(extra, "ES172", "high", "nodes missing: " + ",".join(missing))
                    if n_col == 0:
                        meta["coverage"] = "empty"
            
                masters = []
                auth_na = 0
                for ip in collected_ips:
                    f = facts[ip]
                    if f.get("auth_fail"):
                        auth_na += 1
                        continue
                    masters.append((ip, str(f.get("local_master") or "")))
            
                nonempty = [m for _, m in masters if m]
                empty = [ip for ip, m in masters if not m]
                maj = ""
                if nonempty:
                    maj, cnt = Counter(nonempty).most_common(1)[0]
                    if cnt >= 2 or (expected_nodes == 1 and cnt == 1):
                        maj_ok = maj
                    else:
                        maj_ok = maj if cnt == len(nonempty) else ""
                    maj = maj_ok
                meta["majority_master"] = maj
            
                all_collected = n_col == expected_nodes and expected_nodes >= 1
                all_empty = all_collected and not nonempty and auth_na == 0
                if all_empty:
                    _add(extra, "ES050", "high", "all %s nodes have empty local_master" % n_col)
                    _add(extra, "ES191", "high", "NO_MASTER")
                    meta["no_master"] = True
                    meta["majority_master"] = ""
                elif n_col < expected_nodes and nonempty == [] and empty:
                    meta["evidence_gap"].append("NO_MASTER_OBSERVED")
                    _add(extra, "ES173", "medium", "observed nodes have no master but collection incomplete")
                elif maj and empty:
                    _add(extra, "ES051", "high", "majority master=%s disagree/empty on %s" % (maj, ",".join(empty)))
                    _add(extra, "ES199", "high", "master view split")
                elif nonempty and len(set(nonempty)) > 1:
                    _add(extra, "ES051", "high", "local_master values disagree: " + ",".join(sorted(set(nonempty))))
                    _add(extra, "ES199", "high", "master view split")
            
                health = {}
                for ip in collected_ips:
                    h = facts[ip].get("cluster_health")
                    if isinstance(h, dict) and h.get("status"):
                        health = h
                        if maj and (facts[ip].get("is_elected") or facts[ip].get("local_master") == maj):
                            break
            
                nodes_in_health = int(health.get("number_of_nodes") or 0) if health else 0
                status = str(health.get("status") or "")
                unassigned = int(health.get("unassigned_shards") or 0) if health else 0
                delayed = int(health.get("delayed_unassigned_shards") or 0) if health else 0
                pending = int(health.get("number_of_pending_tasks") or 0) if health else 0
                reloc = int(health.get("relocating_shards") or 0) if health else 0
                init = int(health.get("initializing_shards") or 0) if health else 0
            
                if delayed > 0:
                    _add(extra, "ES055", "low", "delayed_unassigned=%s" % delayed)
                if pending >= 10:
                    _add(extra, "ES056", "high", "pending_tasks=%s" % pending)
                elif pending >= 1:
                    _add(extra, "ES056", "medium", "pending_tasks=%s" % pending)
                if reloc or init:
                    _add(extra, "ES057", "medium", "relocating=%s initializing=%s" % (reloc, init))
            
                down_ips = []
                for ip in expected_ips:
                    f = facts.get(ip) or {}
                    proc = f.get("process_up")
                    http = f.get("http_ok")
                    listen = f.get("listen_http")
                    if proc is False or listen is False or http is False:
                        down_ips.append(ip)
                    elif ip not in facts:
                        down_ips.append(ip)
            
                if not meta["no_master"]:
                    if nodes_in_health and nodes_in_health < expected_nodes:
                        missing_n = expected_nodes - nodes_in_health
                        if missing_n >= 2:
                            _add(extra, "ES053", "high", "health nodes=%s expected=%s" % (nodes_in_health, expected_nodes))
                        else:
                            _add(extra, "ES052", "medium", "health nodes=%s expected=%s" % (nodes_in_health, expected_nodes))
                        _add(extra, "ES190", "high", "NODE_DOWN health_nodes=%s down_ips=%s" % (nodes_in_health, ",".join(down_ips) or "unknown"))
                    elif n_col == expected_nodes and nodes_in_health == expected_nodes and status == "yellow" and unassigned > 0:
                        _add(extra, "ES192", "medium", "YELLOW_ALLOC_NOT_DOWN unassigned=%s" % unassigned)
                    if status == "red" and not meta["no_master"] and unassigned > 0:
                        _add(extra, "ES054", "high", "red with unassigned=%s" % unassigned)
            
                if meta["no_master"] and status == "red":
                    _add(extra, "ES053", "high", "red and NO_MASTER")
            
                if expected_nodes <= 1:
                    extra = [(s, v, n + " node_count=1") if s.startswith("ES19") else (s, v, n) for s, v, n in extra]
                    extra = [x for x in extra if not (x[0] in {"ES194", "ES196", "ES198"} and expected_nodes <= 1)]
            
                heaps = [(ip, facts[ip].get("heap_pct")) for ip in collected_ips if isinstance(facts[ip].get("heap_pct"), int)]
                high_heap = [ip for ip, h in heaps if h is not None and h >= 85]
                if len(high_heap) == 1 and len(heaps) >= 2:
                    _add(extra, "ES193", "high", "HEAP_ONE_OUTLIER %s heap=%s" % (high_heap[0], dict(heaps)[high_heap[0]]))
                    _add(extra, "ES034", "high", "%s heap=%s" % (high_heap[0], dict(heaps)[high_heap[0]]))
                elif len(high_heap) >= 2:
                    _add(extra, "ES194", "high", "HEAP_ALL_SIMILAR " + ",".join("%s=%s" % (ip, dict(heaps)[ip]) for ip in high_heap))
            
                rejects = [(ip, int(facts[ip].get("write_rejected_delta") or 0) + int(facts[ip].get("search_rejected_delta") or 0)) for ip in collected_ips]
                rej_pos = [ip for ip, r in rejects if r > 0]
                if len(rej_pos) == 1 and len(rejects) >= 2:
                    _add(extra, "ES195", "medium", "REJECT_ONE %s delta=%s" % (rej_pos[0], dict(rejects)[rej_pos[0]]))
                elif len(rej_pos) >= 2:
                    _add(extra, "ES196", "high", "REJECT_ALL " + ",".join(rej_pos))
            
                floods = [ip for ip in collected_ips if facts[ip].get("flood") or facts[ip].get("read_only_allow_delete")]
                if len(floods) == 1 and n_col >= 2:
                    _add(extra, "ES197", "high", "FLOOD_ONE %s" % floods[0])
                elif len(floods) >= 2:
                    _add(extra, "ES198", "high", "FLOOD_ALL " + ",".join(floods))
            
                for ip in collected_ips:
                    f = facts[ip]
                    if f.get("http_ok") and f.get("listen_http") and f.get("transport_ok") is False:
                        _add(extra, "ES091", "high", "9200 up 9300 down on %s" % ip)
                        _add(extra, "ES199", "high", "TRANSPORT_PARTITION %s" % ip)
                    peers = f.get("peer_transport") or {}
                    if isinstance(peers, dict):
                        for peer, ok in peers.items():
                            if ok is False and (f.get("peer_http") or {}).get(peer) is True:
                                _add(extra, "ES091", "high", "%s http ok transport fail to %s" % (ip, peer))
                                _add(extra, "ES199", "high", "TRANSPORT_PARTITION %s->%s" % (ip, peer))
            
                names = [str(facts[ip].get("cluster_name") or "") for ip in collected_ips if facts[ip].get("cluster_name")]
                if names and len(set(names)) > 1:
                    _add(extra, "ES060", "high", "cluster.name disagree: " + ",".join(sorted(set(names))))
            
                alloc = [str(facts[ip].get("allocation_enable") or "") for ip in collected_ips if facts[ip].get("allocation_enable")]
                if any(a and a != "all" for a in alloc):
                    _add(extra, "ES058", "high", "allocation.enable=" + ",".join(sorted(set(alloc))))
            
                explains = []
                for ip in collected_ips:
                    ex = facts[ip].get("explain_reasons") or []
                    if isinstance(ex, list):
                        explains.extend(str(x) for x in ex)
                joined = " ".join(explains).upper()
                if "NODE_LEFT" in joined or "NODE_RESTART" in joined:
                    _add(extra, "ES052", "medium", "explain NODE_LEFT")
                if "DECIDERS_NO" in joined and ("DISK" in joined or "WATERMARK" in joined):
                    _add(extra, "ES061", "high", "explain DECIDERS_NO disk")
                if "ALLOCATION_FAILED" in joined:
                    _add(extra, "ES063", "high", "explain ALLOCATION_FAILED")
            
                if expected_nodes <= 1:
                    extra = [x for x in extra if x[0] not in {"ES194", "ES196", "ES198"}]
            
                return extra, meta
            
            
            def render_summary(
                run_id: str,
                expected_ips: list[str],
                facts: dict[str, dict[str, Any]],
                signals: list[tuple[str, str, str]],
                meta: dict[str, Any],
                health: dict[str, Any],
            ) -> str:
                lines = [
                    "# ES 7.x 三节点排查摘要",
                    "",
                    f"- run_id: `{run_id}`",
                    f"- expected_nodes: {meta.get('expected_nodes')}",
                    f"- nodes_collected: {meta.get('nodes_collected')}",
                    f"- coverage: `{meta.get('coverage')}`",
                    f"- majority_master: `{meta.get('majority_master') or ('NO_MASTER' if meta.get('no_master') else 'UNKNOWN')}`",
                    "",
                    "## 集群健康",
                    "",
                ]
                if health:
                    lines += [
                        f"- status: `{health.get('status', '')}`",
                        f"- number_of_nodes: {health.get('number_of_nodes', '')}",
                        f"- unassigned_shards: {health.get('unassigned_shards', '')}",
                        f"- delayed_unassigned_shards: {health.get('delayed_unassigned_shards', '')}",
                        f"- pending_tasks: {health.get('number_of_pending_tasks', '')}",
                        "",
                    ]
                else:
                    lines += ["- （无权威 cluster health）", ""]
                lines += [
                    "## 各节点 master 视图",
                    "",
                    "| IP | local_master | 9200 | 9300 | heap% | write_rejected_delta | disk% |",
                    "|----|--------------|------|------|-------|----------------------|-------|",
                ]
                for ip in expected_ips:
                    f = facts.get(ip) or {}
                    http = "ok" if f.get("http_ok") else ("NA" if not f else "fail")
                    tp = f.get("listen_transport")
                    trans = "ok" if tp else ("fail" if tp is False else "NA")
                    lines.append(
                        "| {ip} | {lm} | {http} | {trans} | {heap} | {wr} | {disk} |".format(
                            ip=ip,
                            lm=f.get("local_master") or ("(empty)" if f else "(missing)"),
                            http=http,
                            trans=trans,
                            heap=f.get("heap_pct") if f.get("heap_pct") is not None else "",
                            wr=f.get("write_rejected_delta") if f.get("write_rejected_delta") is not None else "",
                            disk=f.get("disk_used_pct") if f.get("disk_used_pct") is not None else "",
                        )
                    )
                lines += ["", "## Top 信号", "", "| ID | 级别 | 说明 |", "|----|------|------|"]
                if signals:
                    for sid, sev, note in signals:
                        lines.append(f"| {sid} | {sev} | {note} |")
                else:
                    lines.append("| — | — | 无自动信号 |")
                lines += ["", "## 交叉对比结论", ""]
                ids = {s[0] for s in signals}
                bullets = []
                if "ES191" in ids:
                    bullets.append("- **ES191 NO_MASTER**：三台均无 elected master，先看发现/传输/进程，不要解释 unassigned。")
                if "ES190" in ids:
                    bullets.append("- **ES190 NODE_DOWN**：健康节点数少于期望，优先掉节点而不是业务 QPS。")
                if "ES192" in ids:
                    bullets.append("- **ES192 YELLOW_ALLOC_NOT_DOWN**：三台都在集群内，副本未分配是水位/allocation/max_shards。")
                if "ES193" in ids:
                    bullets.append("- **ES193 HEAP_ONE_OUTLIER**：单节点 JVM，不是全集群容量。")
                if "ES194" in ids:
                    bullets.append("- **ES194 HEAP_ALL_SIMILAR**：多节点堆压力。")
                if "ES195" in ids:
                    bullets.append("- **ES195 REJECT_ONE**：单节点线程池拒绝。")
                if "ES196" in ids:
                    bullets.append("- **ES196 REJECT_ALL**：多节点 reject。")
                if "ES197" in ids:
                    bullets.append("- **ES197 FLOOD_ONE**：单节点磁盘 flood / 只读块。")
                if "ES198" in ids:
                    bullets.append("- **ES198 FLOOD_ALL**：集群块。")
                if "ES199" in ids:
                    bullets.append("- **ES199 TRANSPORT_PARTITION**：9200/9300 分叉或 master 视图分裂。")
                if not bullets:
                    if meta.get("coverage") == "ok" and not ids:
                        bullets.append("- 倾向 **ES001 基线正常**，或故障未落入 P0 信号。")
                    else:
                        bullets.append("- 无组合结论；见证据缺口。")
                lines.extend(bullets)
                lines += ["", "## 证据缺口", ""]
                gaps = list(meta.get("evidence_gap") or [])
                if meta.get("no_master"):
                    gaps.append("unassigned explain 不可靠（NO_MASTER）")
                if not gaps:
                    lines.append("- 无")
                else:
                    for g in gaps:
                        lines.append(f"- {g}")
                lines.append("")
                return "\n".join(lines)
            
            
            def cleanse(base: str, run_id: str, expected_ips: list[str], profile: str = "v1") -> dict[str, Any]:
                root = Path(base)
                root.mkdir(parents=True, exist_ok=True)
                facts: dict[str, dict[str, Any]] = {}
                for ip in expected_ips:
                    data = _read_json(root / f"facts.{ip}.json")
                    if data:
                        facts[ip] = data
                    master = _read_json(root / f"master.{ip}.json")
                    if master:
                        facts.setdefault(ip, {})
                        for k in ("local_master", "local_master_ip", "http_ok", "auth_fail", "is_elected"):
                            if k in master and master[k] is not None:
                                facts[ip].setdefault(k, master[k])
            
                raw = _read_signals(root)
                extra, meta = cross_compare(facts, len(expected_ips), expected_ips)
                if profile.endswith("degraded") and meta["coverage"] == "ok":
                    meta["coverage"] = "degraded"
                    meta["evidence_gap"].append("forced_degraded_profile")
                merged = _dedup(raw + extra)
                health = {}
                for ip in expected_ips:
                    h = (facts.get(ip) or {}).get("cluster_health")
                    if isinstance(h, dict) and h:
                        health = h
                        if facts[ip].get("is_elected"):
                            break
            
                kinds = ("precheck", "metrics", "status", "config", "logs", "hostnet")
                found = sum(1 for k in kinds if any(root.glob(f"{k}.*.txt")))
                if found == 0 and meta["coverage"] == "ok":
                    meta["coverage"] = "empty"
                elif found < 3 and meta["coverage"] == "ok":
                    meta["coverage"] = "degraded"
            
                summary = render_summary(run_id, expected_ips, facts, merged, meta, health)
                (root / "summary.md").write_text(summary, encoding="utf-8")
                sig_txt = "".join(f"{a}\t{b}\t{c}\n" for a, b, c in merged)
                (root / "signals.txt").write_text(sig_txt, encoding="utf-8")
                (root / "signals.uniq.tsv").write_text(sig_txt, encoding="utf-8")
            
                cleaned_parts = [
                    f"===== ES_TS cleaned run_id={run_id} profile={profile} =====",
                    f"nodes={','.join(expected_ips)}",
                    f"coverage={meta['coverage']} majority_master={meta.get('majority_master')}",
                    "",
                    "----- SIGNALS -----",
                    sig_txt or "NO_SIGNALS",
                    "",
                ]
                for p in sorted(root.glob("*.txt")):
                    if p.name in {"cleaned.txt", "signals.txt"}:
                        continue
                    body = p.read_text(encoding="utf-8", errors="replace")
                    lines = body.splitlines()
                    keep = [ln for ln in lines if ln.startswith("SIGNAL ") or ln.startswith("CMD_FAIL") or "KEYWORD" in ln]
                    if not keep:
                        keep = lines[-40:]
                    cleaned_parts.append(f"### {p.name} ###")
                    cleaned_parts.extend(keep[:80])
                    cleaned_parts.append("")
                cleaned = "\n".join(cleaned_parts)
                if len(cleaned.encode()) > 64000:
                    cleaned = cleaned.encode()[:64000].decode("utf-8", errors="ignore")
                (root / "cleaned.txt").write_text(cleaned, encoding="utf-8")
                meta_out = {
                    "run_id": run_id,
                    "profile": profile,
                    "coverage_status": meta["coverage"],
                    "nodes_collected": meta["nodes_collected"],
                    "expected_nodes": meta["expected_nodes"],
                    "majority_master": meta.get("majority_master") or "",
                    "no_master": str(bool(meta.get("no_master"))).lower(),
                    "signal_count": len(merged),
                    "kinds_found": found,
                }
                meta_txt = "".join(f"{k}={v}\n" for k, v in meta_out.items())
                (root / "cleaned.meta").write_text(meta_txt, encoding="utf-8")
                return {"meta": meta_out, "signals": merged, "summary": summary}
            
            
            def _cli(argv: list[str]) -> int:
                if len(argv) < 2:
                    print("usage: es_lib.py parse-master|parse-stats|parse-health|merge-facts|cleanse ...", file=sys.stderr)
                    return 2
                cmd = argv[1]
                if cmd == "parse-master":
                    print(json.dumps(parse_cat_master(sys.stdin.read()), ensure_ascii=False))
                    return 0
                if cmd == "parse-stats":
                    print(json.dumps(parse_local_stats(sys.stdin.read()), ensure_ascii=False))
                    return 0
                if cmd == "parse-health":
                    print(json.dumps(parse_cluster_health(sys.stdin.read()), ensure_ascii=False))
                    return 0
                if cmd == "parse-nodes":
                    local_ip = argv[2] if len(argv) > 2 else ""
                    print(json.dumps(parse_cat_nodes(sys.stdin.read(), local_ip), ensure_ascii=False))
                    return 0
                if cmd == "merge-facts":
                    path = argv[2]
                    updates = json.loads(argv[3] if len(argv) > 3 else sys.stdin.read())
                    print(json.dumps(merge_facts(path, updates), ensure_ascii=False))
                    return 0
                if cmd == "cleanse":
                    base, run_id = argv[2], argv[3]
                    ips = argv[4:]
                    profile = os.environ.get("TS_PROFILE", "v1")
                    result = cleanse(base, run_id, ips, profile)
                    print(json.dumps(result["meta"], ensure_ascii=False))
                    return 0
                print("unknown command", cmd, file=sys.stderr)
                return 2
            
            
            if __name__ == "__main__":
                sys.exit(_cli(sys.argv))
            ES_TS_LIB_PY
            # Shared helpers for ES 7.x troubleshooting collectors. Sourced, not executed.
            # Collectors always exit 0. Do not mutate the cluster.
            
            umask 077
            
            json_escape() {
              local s=${1-}
              s=${s//\\/\\\\}
              s=${s//\"/\\\"}
              s=${s//$'\n'/\\n}
              s=${s//$'\r'/\\r}
              s=${s//$'\t'/\\t}
              printf '%s' "$s"
            }
            
            ts_now() { date -u +"%Y-%m-%dT%H:%M:%SZ"; }
            
            resolve_local_ip() {
              local node1=$1 node2=$2 node3=$3
              local local_ips target_ip=""
              local_ips=$(hostname -I 2>/dev/null || true)
              for ip in "$node1" "$node2" "$node3"; do
                [[ " ${local_ips} " == *" ${ip} "* ]] && target_ip=$ip && break
              done
              if [[ -z "$target_ip" ]]; then
                target_ip=$(hostname -I 2>/dev/null | awk '{print $1}')
              fi
              printf '%s' "${target_ip:-unknown}"
            }
            
            artifact_dir_for() {
              local run_id=$1
              local base=${TS_ARTIFACT_DIR:-/tmp/es-troubleshoot}
              printf '%s/%s' "$base" "$run_id"
            }
            
            es_lib_py() {
              local here=${SCRIPT_DIR:-}
              if [[ -n "$here" && -f "${here}/es_lib.py" ]]; then
                printf '%s' "${here}/es_lib.py"
                return 0
              fi
              if [[ -f /tmp/es-ts-lib/es_lib.py ]]; then
                printf '%s' /tmp/es-ts-lib/es_lib.py
                return 0
              fi
              return 1
            }
            
            begin_artifact() {
              local kind=$1 node=$2 run_id=$3
              ARTIFACT_KIND=$kind
              ARTIFACT_NODE=$node
              ARTIFACT_RUN_ID=$run_id
              ARTIFACT_DIR=$(artifact_dir_for "$run_id")
              mkdir -p "$ARTIFACT_DIR"
              ARTIFACT_FILE="${ARTIFACT_DIR}/${kind}.${node}.txt"
              SIGNAL_FILE="${ARTIFACT_DIR}/${kind}.${node}.signals"
              FACTS_FILE="${ARTIFACT_DIR}/facts.${node}.json"
              MASTER_FILE="${ARTIFACT_DIR}/master.${node}.json"
              : > "$ARTIFACT_FILE"
              : > "$SIGNAL_FILE"
              {
                echo "===== ES_TS artifact=${kind} node=${node} ts=$(ts_now) run_id=${run_id} ====="
                echo "hostname=$(hostname 2>/dev/null || echo unknown)"
              } >> "$ARTIFACT_FILE"
            }
            
            emit() {
              printf '%s\n' "$*" >> "$ARTIFACT_FILE"
            }
            
            emit_cmd() {
              local title=$1
              local rc=0
              shift
              emit "----- ${title} -----"
              "$@" >> "$ARTIFACT_FILE" 2>&1
              rc=$?
              if (( rc != 0 )); then
                emit "CMD_FAIL: ${title} rc=${rc}"
                return 1
              fi
              return 0
            }
            
            emit_cmd_timeout() {
              local seconds=$1 title=$2
              shift 2
              emit "----- ${title} (timeout ${seconds}s) -----"
              if command -v timeout >/dev/null 2>&1; then
                if ! timeout "$seconds" "$@" >> "$ARTIFACT_FILE" 2>&1; then
                  emit "CMD_FAIL_OR_TIMEOUT: ${title}"
                  signal ES174 low "timeout ${title}"
                  return 1
                fi
              else
                if ! "$@" >> "$ARTIFACT_FILE" 2>&1; then
                  emit "CMD_FAIL: ${title}"
                  return 1
                fi
              fi
              return 0
            }
            
            signal() {
              printf '%s\t%s\t%s\n' "$1" "$2" "$3" >> "$SIGNAL_FILE"
              emit "SIGNAL ${1} severity=${2} ${3}"
            }
            
            finish_artifact() {
              emit "===== END ES_TS artifact=${ARTIFACT_KIND} node=${ARTIFACT_NODE} ====="
              echo "###ES_TS_ARTIFACT kind=${ARTIFACT_KIND} node=${ARTIFACT_NODE} file=${ARTIFACT_FILE}###"
              cat "$ARTIFACT_FILE"
              echo "###ES_TS_SIGNALS kind=${ARTIFACT_KIND} node=${ARTIFACT_NODE}###"
              cat "$SIGNAL_FILE"
              echo "###END_ES_TS_ARTIFACT###"
            }
            
            es_curl() {
              # es_curl <seconds> <url> [curl extra...]
              local seconds=$1
              shift
              local url=$1
              shift
              local args=(-sS --max-time "$seconds" --connect-timeout 3 -H 'Accept: application/json')
              if [[ -n "${ES_USER:-}" ]]; then
                args+=(-u "${ES_USER}:${ES_PASS:-}")
              fi
              curl "${args[@]}" "$@" "$url" 2>/dev/null
            }
            
            es_base_url() {
              printf 'http://127.0.0.1:%s' "${ES_HTTP_PORT:-9200}"
            }
            
            facts_merge() {
              local json=$1
              local py
              py=$(es_lib_py) || return 0
              python3 "$py" merge-facts "$FACTS_FILE" "$json" >/dev/null 2>&1 || true
            }
            
            record_local_master() {
              local url
              url="$(es_base_url)/_cat/master?h=id,host,ip,node&format=json"
              local body rc=0
              body=$(es_curl 3 "$url" -w '\nHTTP_CODE:%{http_code}\n') || rc=$?
              local code
              code=$(printf '%s\n' "$body" | awk -F: '/HTTP_CODE:/{print $2}' | tail -n1)
              local json
              json=$(printf '%s\n' "$body" | sed '/HTTP_CODE:/d')
              emit "----- local _cat/master http=${code:-na} rc=${rc} -----"
              emit "$json"
            
              local parsed="{}"
              local py
              py=$(es_lib_py) || true
              if [[ -n "$py" ]]; then
                parsed=$(printf '%s' "$json" | python3 "$py" parse-master 2>/dev/null || echo '{}')
              fi
              local http_ok=false auth_fail=false local_master="" local_ip=""
              if [[ "$code" == "401" || "$code" == "403" ]]; then
                auth_fail=true
                signal ES032 high "local HTTP auth failed code=${code}"
              elif [[ "$code" == "200" ]]; then
                http_ok=true
              else
                signal ES032 medium "local _cat/master failed code=${code:-na} rc=${rc}"
              fi
              if [[ "$http_ok" == true ]]; then
                local_master=$(python3 -c 'import json,sys; d=json.loads(sys.argv[1]); print(d.get("local_master",""))' "$parsed" 2>/dev/null || true)
                local_ip=$(python3 -c 'import json,sys; d=json.loads(sys.argv[1]); print(d.get("local_master_ip",""))' "$parsed" 2>/dev/null || true)
              fi
              emit "local_master=${local_master}"
              emit "local_master_ip=${local_ip}"
            
              local nodes_json=""
              nodes_json=$(es_curl 3 "$(es_base_url)/_cat/nodes?h=id,name,ip,master,node.role&format=json" || true)
              emit "----- local _cat/nodes -----"
              emit "$nodes_json"
              local self_elected=false
              if [[ -n "$py" && -n "$nodes_json" ]]; then
                local nodes_parsed
                nodes_parsed=$(printf '%s' "$nodes_json" | python3 "$py" parse-nodes "$ARTIFACT_NODE" 2>/dev/null || echo '{}')
                if python3 -c 'import json,sys; raise SystemExit(0 if json.loads(sys.argv[1]).get("self_elected") else 1)' "$nodes_parsed" 2>/dev/null; then
                  self_elected=true
                fi
              fi
              if [[ "$self_elected" != true && -n "$local_ip" && "$local_ip" == "$ARTIFACT_NODE" ]]; then
                self_elected=true
              fi
              emit "is_elected=${self_elected}"
            
              mkdir -p "$ARTIFACT_DIR"
              python3 - "$MASTER_FILE" "$ARTIFACT_NODE" "$local_master" "$local_ip" "$http_ok" "$auth_fail" "$self_elected" <<'PY' 2>/dev/null || true
            import json,sys
            path, node, lm, lip, http_ok, auth, elected = sys.argv[1:8]
            doc = {
              "node": node,
              "local_master": lm,
              "local_master_ip": lip,
              "http_ok": http_ok == "true",
              "auth_fail": auth == "true",
              "is_elected": elected == "true",
            }
            open(path,"w",encoding="utf-8").write(json.dumps(doc, ensure_ascii=False, indent=2)+"\n")
            PY
              facts_merge "$(python3 -c 'import json,sys; print(json.dumps({"local_master":sys.argv[1],"local_master_ip":sys.argv[2],"http_ok":sys.argv[3]=="true","auth_fail":sys.argv[4]=="true","is_elected":sys.argv[5]=="true","node":sys.argv[6]}))' \
                "$local_master" "$local_ip" "$http_ok" "$auth_fail" "$self_elected" "$ARTIFACT_NODE")"
              if [[ "$self_elected" == true ]]; then
                IS_ELECTED=1
              else
                IS_ELECTED=0
              fi
            }
            
            listen_port() {
              local port=$1
              if command -v ss >/dev/null 2>&1; then
                ss -lnt 2>/dev/null | awk '{print $4}' | grep -q ":${port}$"
                return $?
              fi
              netstat -lnt 2>/dev/null | grep -q ":${port} "
            }
            
            tcp_probe() {
              local host=$1 port=$2
              if timeout 2 bash -c "echo >/dev/tcp/${host}/${port}" 2>/dev/null; then
                return 0
              fi
              if command -v nc >/dev/null 2>&1; then
                nc -z -w 2 "$host" "$port" >/dev/null 2>&1 && return 0
              fi
              return 1
            }
            
            es_process_up() {
              # Character class so pgrep does not match its own argv.
              pgrep -f '[o]rg.elasticsearch.bootstrap.Elasticsearch' >/dev/null 2>&1 && return 0
              pgrep -x elasticsearch >/dev/null 2>&1 && return 0
              return 1
            }
            # 数据清洗：三台交叉认 master、ALL/ONE 组合信号、写出 summary.md。禁止调模型。
            set -uo pipefail
            
            node1=${1:-}
            node2=${2:-}
            node3=${3:-}
            _http=${4:-9200}
            _transport=${5:-9300}
            run_id=${6:-manual}
            profile=${7:-v1}
            ES_USER=${8:-${ES_USER:-}}
            ES_PASS=${9:-${ES_PASS:-}}
            
            target_ip=$(resolve_local_ip "$node1" "$node2" "$node3")
            base=$(artifact_dir_for "$run_id")
            mkdir -p "$base"
            
            py=$(es_lib_py) || {
              echo "es_lib.py missing" >&2
              echo "###ES_TS_CLEANSED run_id=${run_id} coverage=empty signals=0###"
              echo "# ES 7.x 三节点排查摘要"
              echo
              echo "- es_lib.py missing on $(hostname)"
              echo "###END_ES_TS_CLEANSED###"
              exit 0
            }
            
            export TS_PROFILE=$profile
            python3 "$py" cleanse "$base" "$run_id" "$node1" "$node2" "$node3" >"${base}/cleanse.meta.json" 2>"${base}/cleanse.err" || true
            
            coverage=unknown
            if [[ -f "${base}/cleaned.meta" ]]; then
              coverage=$(awk -F= '$1=="coverage_status"{print $2}' "${base}/cleaned.meta")
            fi
            sig_n=0
            if [[ -f "${base}/signals.txt" ]]; then
              sig_n=$(grep -c '^ES' "${base}/signals.txt" 2>/dev/null || echo 0)
            fi
            
            echo "###ES_TS_CLEANSED run_id=${run_id} coverage=${coverage} signals=${sig_n} node=${target_ip}###"
            if [[ -f "${base}/summary.md" ]]; then
              cat "${base}/summary.md"
            else
              echo "# ES 7.x 三节点排查摘要"
              echo
              echo "- cleanse failed to write summary.md"
              echo "- stderr: $(head -c 500 "${base}/cleanse.err" 2>/dev/null || true)"
            fi
            echo "###END_ES_TS_CLEANSED###"
            exit 0
        job_ip_list:
          value: "${es_node1_ip}"
        job_rolling_config:
          value:
            job_rolling_execute: []
            job_rolling_expression: ''
            job_rolling_mode: 1
        job_script_list_general:
          value: ''
        job_script_list_public:
          value: ''
        job_script_param:
          value: "'${es_node1_ip}' '${es_node2_ip}' '${es_node3_ip}' '${es_http_port}' '${es_transport_port}' '${ts_run_id}' 'v2' '${es_user}' '${es_pass}'"
        job_script_source:
          value: manual
        job_script_timeout:
          value: '60'
        job_script_type:
          value: '1'
        job_success_id:
          value: ''
    auto_retry:
      enable: false
      times: 1
      interval: 0
    ignore_error: true
    can_retry: true
    can_skip: false
    optional: false
    next:
    - es-ts_ai
  - id: es-ts_clean_degraded
    type: ServiceActivity
    name: 快速执行脚本
    stage_name: 降级清洗(Markdown)
    component:
      code: job_fast_execute_script
      version: v1.2
      data:
        biz_cc_id:
          name: 业务
          value: ''
          key: "${biz_cc_id}"
          version: v1.2
          source_tag: job_fast_execute_script.biz_cc_id
        job_account:
          value: root
        job_content:
          value: |
            #!/usr/bin/env bash
            mkdir -p /tmp/es-ts-lib
            cat > /tmp/es-ts-lib/es_lib.py <<'ES_TS_LIB_PY'
            #!/usr/bin/env python3
            """Parse ES 7.x collector JSON and run cleanse cross-compare.
            
            Used by bash collectors and cleanse_artifacts.sh. No HTTP. Diagnose only.
            """
            from __future__ import annotations
            
            import json
            import os
            import sys
            from collections import Counter
            from pathlib import Path
            from typing import Any
            
            
            def _load(text: str) -> Any:
                text = (text or "").strip()
                if not text:
                    return None
                try:
                    return json.loads(text)
                except json.JSONDecodeError:
                    return None
            
            
            def parse_cat_master(text: str) -> dict[str, Any]:
                data = _load(text)
                out = {
                    "http_ok": False,
                    "auth_fail": False,
                    "local_master": "",
                    "local_master_ip": "",
                    "local_master_id": "",
                    "is_elected": False,
                }
                if data is None:
                    return out
                out["http_ok"] = True
                row = None
                if isinstance(data, list) and data:
                    row = data[0] if isinstance(data[0], dict) else None
                elif isinstance(data, dict):
                    row = data
                if not row:
                    return out
                out["local_master"] = str(row.get("node") or row.get("name") or "")
                out["local_master_ip"] = str(row.get("ip") or row.get("host") or "")
                out["local_master_id"] = str(row.get("id") or "")
                return out
            
            
            def parse_cat_nodes(text: str, local_ip: str = "") -> dict[str, Any]:
                data = _load(text)
                out = {"nodes": [], "elected": "", "elected_ip": "", "self_elected": False}
                if not isinstance(data, list):
                    return out
                for row in data:
                    if not isinstance(row, dict):
                        continue
                    name = str(row.get("name") or row.get("node") or "")
                    ip = str(row.get("ip") or "")
                    master = str(row.get("master") or "")
                    roles = str(row.get("node.role") or row.get("nodeRole") or "")
                    out["nodes"].append({"name": name, "ip": ip, "master": master, "roles": roles})
                    if master == "*":
                        out["elected"] = name
                        out["elected_ip"] = ip
                        if local_ip and (ip == local_ip):
                            out["self_elected"] = True
                return out
            
            
            def parse_local_stats(text: str) -> dict[str, Any]:
                data = _load(text)
                out = {
                    "heap_pct": None,
                    "write_rejected": None,
                    "search_rejected": None,
                    "write_pool": "",
                    "breaker_parent_pct": None,
                    "breaker_tripped": 0,
                    "disk_total": None,
                    "disk_free": None,
                    "disk_used_pct": None,
                    "index_total": None,
                    "index_time_ms": None,
                    "query_total": None,
                    "query_time_ms": None,
                    "cpu_percent": None,
                    "gc_young_ms": None,
                    "gc_old_ms": None,
                    "node_name": "",
                }
                if not isinstance(data, dict):
                    return out
                nodes = data.get("nodes") or {}
                if not isinstance(nodes, dict) or not nodes:
                    return out
                n = next(iter(nodes.values()))
                if not isinstance(n, dict):
                    return out
                out["node_name"] = str(n.get("name") or "")
                jvm = n.get("jvm") or {}
                mem = jvm.get("mem") or {}
                if "heap_used_percent" in mem:
                    out["heap_pct"] = int(mem["heap_used_percent"])
                collectors = (jvm.get("gc") or {}).get("collectors") or {}
                young = collectors.get("young") or collectors.get("ParNew") or {}
                old = collectors.get("old") or collectors.get("ConcurrentMarkSweep") or collectors.get("G1 Old Generation") or {}
                if "collection_time_in_millis" in young:
                    out["gc_young_ms"] = int(young["collection_time_in_millis"])
                if "collection_time_in_millis" in old:
                    out["gc_old_ms"] = int(old["collection_time_in_millis"])
                tp = n.get("thread_pool") or {}
                write = tp.get("write") if isinstance(tp.get("write"), dict) else None
                if write is None and isinstance(tp.get("index"), dict):
                    write = tp["index"]
                    out["write_pool"] = "index_legacy"
                else:
                    out["write_pool"] = "write"
                if write:
                    out["write_rejected"] = int(write.get("rejected") or 0)
                search = tp.get("search") if isinstance(tp.get("search"), dict) else {}
                if search:
                    out["search_rejected"] = int(search.get("rejected") or 0)
                breakers = n.get("breakers") or {}
                parent = breakers.get("parent") or {}
                if parent.get("limit_size_in_bytes") and parent.get("estimated_size_in_bytes") is not None:
                    lim = int(parent["limit_size_in_bytes"]) or 1
                    out["breaker_parent_pct"] = int(int(parent["estimated_size_in_bytes"]) * 100 / lim)
                tripped = 0
                for b in breakers.values():
                    if isinstance(b, dict):
                        tripped += int(b.get("tripped") or 0)
                out["breaker_tripped"] = tripped
                fs = (n.get("fs") or {}).get("total") or {}
                if fs.get("total_in_bytes"):
                    total = int(fs["total_in_bytes"])
                    free = int(fs.get("available_in_bytes") or fs.get("free_in_bytes") or 0)
                    out["disk_total"] = total
                    out["disk_free"] = free
                    out["disk_used_pct"] = int((total - free) * 100 / total) if total else None
                idx = (n.get("indices") or {}).get("indexing") or {}
                if "index_total" in idx:
                    out["index_total"] = int(idx["index_total"])
                    out["index_time_ms"] = int(idx.get("index_time_in_millis") or 0)
                search_m = (n.get("indices") or {}).get("search") or {}
                if "query_total" in search_m:
                    out["query_total"] = int(search_m["query_total"])
                    out["query_time_ms"] = int(search_m.get("query_time_in_millis") or 0)
                cpu = (n.get("os") or {}).get("cpu") or {}
                if "percent" in cpu:
                    out["cpu_percent"] = int(cpu["percent"])
                return out
            
            
            def parse_cluster_health(text: str) -> dict[str, Any]:
                data = _load(text)
                if not isinstance(data, dict):
                    return {}
                keys = (
                    "status",
                    "number_of_nodes",
                    "number_of_data_nodes",
                    "active_primary_shards",
                    "active_shards",
                    "relocating_shards",
                    "initializing_shards",
                    "unassigned_shards",
                    "delayed_unassigned_shards",
                    "number_of_pending_tasks",
                    "task_max_waiting_in_queue_millis",
                    "active_shards_percent_as_number",
                    "timed_out",
                )
                out: dict[str, Any] = {}
                for k in keys:
                    if k in data:
                        out[k] = data[k]
                return out
            
            
            def merge_facts(path: str, updates: dict[str, Any]) -> dict[str, Any]:
                p = Path(path)
                cur: dict[str, Any] = {}
                if p.is_file():
                    try:
                        cur = json.loads(p.read_text(encoding="utf-8"))
                    except (OSError, json.JSONDecodeError):
                        cur = {}
                cur.update({k: v for k, v in updates.items() if v is not None})
                p.parent.mkdir(parents=True, exist_ok=True)
                p.write_text(json.dumps(cur, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
                return cur
            
            
            def _read_json(path: Path) -> dict[str, Any] | None:
                if not path.is_file():
                    return None
                try:
                    data = json.loads(path.read_text(encoding="utf-8"))
                except (OSError, json.JSONDecodeError):
                    return None
                return data if isinstance(data, dict) else None
            
            
            def _read_signals(base: Path) -> list[tuple[str, str, str]]:
                rows: list[tuple[str, str, str]] = []
                for p in sorted(base.glob("*.signals")):
                    try:
                        text = p.read_text(encoding="utf-8", errors="replace")
                    except OSError:
                        continue
                    for line in text.splitlines():
                        parts = line.split("\t", 2)
                        if len(parts) >= 3 and parts[0].startswith("ES"):
                            rows.append((parts[0], parts[1], parts[2]))
                return rows
            
            
            def _sev_rank(sev: str) -> int:
                return {"high": 3, "medium": 2, "low": 1, "warning": 2}.get(sev, 0)
            
            
            def _dedup(rows: list[tuple[str, str, str]]) -> list[tuple[str, str, str]]:
                best: dict[str, tuple[str, str, str]] = {}
                order: list[str] = []
                for sid, sev, note in rows:
                    if sid not in best:
                        order.append(sid)
                        best[sid] = (sid, sev, note)
                        continue
                    old = best[sid]
                    if _sev_rank(sev) > _sev_rank(old[1]):
                        best[sid] = (sid, sev, f"{old[2]} | {note}")
                    elif note not in old[2]:
                        best[sid] = (sid, old[1], f"{old[2]} | {note}")
                return [best[k] for k in order]
            
            
            def _add(signals: list[tuple[str, str, str]], sid: str, sev: str, note: str) -> None:
                signals.append((sid, sev, note))
            
            
            def cross_compare(
                facts: dict[str, dict[str, Any]],
                expected_nodes: int,
                expected_ips: list[str],
            ) -> tuple[list[tuple[str, str, str]], dict[str, Any]]:
                extra: list[tuple[str, str, str]] = []
                collected_ips = [ip for ip in expected_ips if ip in facts]
                n_col = len(collected_ips)
                meta: dict[str, Any] = {
                    "nodes_collected": n_col,
                    "expected_nodes": expected_nodes,
                    "majority_master": "",
                    "coverage": "ok",
                    "no_master": False,
                    "evidence_gap": [],
                }
                if n_col < expected_nodes:
                    meta["coverage"] = "degraded"
                    missing = [ip for ip in expected_ips if ip not in facts]
                    meta["evidence_gap"].append("missing_nodes=" + ",".join(missing))
                    _add(extra, "ES172", "high", "nodes missing: " + ",".join(missing))
                    if n_col == 0:
                        meta["coverage"] = "empty"
            
                masters = []
                auth_na = 0
                for ip in collected_ips:
                    f = facts[ip]
                    if f.get("auth_fail"):
                        auth_na += 1
                        continue
                    masters.append((ip, str(f.get("local_master") or "")))
            
                nonempty = [m for _, m in masters if m]
                empty = [ip for ip, m in masters if not m]
                maj = ""
                if nonempty:
                    maj, cnt = Counter(nonempty).most_common(1)[0]
                    if cnt >= 2 or (expected_nodes == 1 and cnt == 1):
                        maj_ok = maj
                    else:
                        maj_ok = maj if cnt == len(nonempty) else ""
                    maj = maj_ok
                meta["majority_master"] = maj
            
                all_collected = n_col == expected_nodes and expected_nodes >= 1
                all_empty = all_collected and not nonempty and auth_na == 0
                if all_empty:
                    _add(extra, "ES050", "high", "all %s nodes have empty local_master" % n_col)
                    _add(extra, "ES191", "high", "NO_MASTER")
                    meta["no_master"] = True
                    meta["majority_master"] = ""
                elif n_col < expected_nodes and nonempty == [] and empty:
                    meta["evidence_gap"].append("NO_MASTER_OBSERVED")
                    _add(extra, "ES173", "medium", "observed nodes have no master but collection incomplete")
                elif maj and empty:
                    _add(extra, "ES051", "high", "majority master=%s disagree/empty on %s" % (maj, ",".join(empty)))
                    _add(extra, "ES199", "high", "master view split")
                elif nonempty and len(set(nonempty)) > 1:
                    _add(extra, "ES051", "high", "local_master values disagree: " + ",".join(sorted(set(nonempty))))
                    _add(extra, "ES199", "high", "master view split")
            
                health = {}
                for ip in collected_ips:
                    h = facts[ip].get("cluster_health")
                    if isinstance(h, dict) and h.get("status"):
                        health = h
                        if maj and (facts[ip].get("is_elected") or facts[ip].get("local_master") == maj):
                            break
            
                nodes_in_health = int(health.get("number_of_nodes") or 0) if health else 0
                status = str(health.get("status") or "")
                unassigned = int(health.get("unassigned_shards") or 0) if health else 0
                delayed = int(health.get("delayed_unassigned_shards") or 0) if health else 0
                pending = int(health.get("number_of_pending_tasks") or 0) if health else 0
                reloc = int(health.get("relocating_shards") or 0) if health else 0
                init = int(health.get("initializing_shards") or 0) if health else 0
            
                if delayed > 0:
                    _add(extra, "ES055", "low", "delayed_unassigned=%s" % delayed)
                if pending >= 10:
                    _add(extra, "ES056", "high", "pending_tasks=%s" % pending)
                elif pending >= 1:
                    _add(extra, "ES056", "medium", "pending_tasks=%s" % pending)
                if reloc or init:
                    _add(extra, "ES057", "medium", "relocating=%s initializing=%s" % (reloc, init))
            
                down_ips = []
                for ip in expected_ips:
                    f = facts.get(ip) or {}
                    proc = f.get("process_up")
                    http = f.get("http_ok")
                    listen = f.get("listen_http")
                    if proc is False or listen is False or http is False:
                        down_ips.append(ip)
                    elif ip not in facts:
                        down_ips.append(ip)
            
                if not meta["no_master"]:
                    if nodes_in_health and nodes_in_health < expected_nodes:
                        missing_n = expected_nodes - nodes_in_health
                        if missing_n >= 2:
                            _add(extra, "ES053", "high", "health nodes=%s expected=%s" % (nodes_in_health, expected_nodes))
                        else:
                            _add(extra, "ES052", "medium", "health nodes=%s expected=%s" % (nodes_in_health, expected_nodes))
                        _add(extra, "ES190", "high", "NODE_DOWN health_nodes=%s down_ips=%s" % (nodes_in_health, ",".join(down_ips) or "unknown"))
                    elif n_col == expected_nodes and nodes_in_health == expected_nodes and status == "yellow" and unassigned > 0:
                        _add(extra, "ES192", "medium", "YELLOW_ALLOC_NOT_DOWN unassigned=%s" % unassigned)
                    if status == "red" and not meta["no_master"] and unassigned > 0:
                        _add(extra, "ES054", "high", "red with unassigned=%s" % unassigned)
            
                if meta["no_master"] and status == "red":
                    _add(extra, "ES053", "high", "red and NO_MASTER")
            
                if expected_nodes <= 1:
                    extra = [(s, v, n + " node_count=1") if s.startswith("ES19") else (s, v, n) for s, v, n in extra]
                    extra = [x for x in extra if not (x[0] in {"ES194", "ES196", "ES198"} and expected_nodes <= 1)]
            
                heaps = [(ip, facts[ip].get("heap_pct")) for ip in collected_ips if isinstance(facts[ip].get("heap_pct"), int)]
                high_heap = [ip for ip, h in heaps if h is not None and h >= 85]
                if len(high_heap) == 1 and len(heaps) >= 2:
                    _add(extra, "ES193", "high", "HEAP_ONE_OUTLIER %s heap=%s" % (high_heap[0], dict(heaps)[high_heap[0]]))
                    _add(extra, "ES034", "high", "%s heap=%s" % (high_heap[0], dict(heaps)[high_heap[0]]))
                elif len(high_heap) >= 2:
                    _add(extra, "ES194", "high", "HEAP_ALL_SIMILAR " + ",".join("%s=%s" % (ip, dict(heaps)[ip]) for ip in high_heap))
            
                rejects = [(ip, int(facts[ip].get("write_rejected_delta") or 0) + int(facts[ip].get("search_rejected_delta") or 0)) for ip in collected_ips]
                rej_pos = [ip for ip, r in rejects if r > 0]
                if len(rej_pos) == 1 and len(rejects) >= 2:
                    _add(extra, "ES195", "medium", "REJECT_ONE %s delta=%s" % (rej_pos[0], dict(rejects)[rej_pos[0]]))
                elif len(rej_pos) >= 2:
                    _add(extra, "ES196", "high", "REJECT_ALL " + ",".join(rej_pos))
            
                floods = [ip for ip in collected_ips if facts[ip].get("flood") or facts[ip].get("read_only_allow_delete")]
                if len(floods) == 1 and n_col >= 2:
                    _add(extra, "ES197", "high", "FLOOD_ONE %s" % floods[0])
                elif len(floods) >= 2:
                    _add(extra, "ES198", "high", "FLOOD_ALL " + ",".join(floods))
            
                for ip in collected_ips:
                    f = facts[ip]
                    if f.get("http_ok") and f.get("listen_http") and f.get("transport_ok") is False:
                        _add(extra, "ES091", "high", "9200 up 9300 down on %s" % ip)
                        _add(extra, "ES199", "high", "TRANSPORT_PARTITION %s" % ip)
                    peers = f.get("peer_transport") or {}
                    if isinstance(peers, dict):
                        for peer, ok in peers.items():
                            if ok is False and (f.get("peer_http") or {}).get(peer) is True:
                                _add(extra, "ES091", "high", "%s http ok transport fail to %s" % (ip, peer))
                                _add(extra, "ES199", "high", "TRANSPORT_PARTITION %s->%s" % (ip, peer))
            
                names = [str(facts[ip].get("cluster_name") or "") for ip in collected_ips if facts[ip].get("cluster_name")]
                if names and len(set(names)) > 1:
                    _add(extra, "ES060", "high", "cluster.name disagree: " + ",".join(sorted(set(names))))
            
                alloc = [str(facts[ip].get("allocation_enable") or "") for ip in collected_ips if facts[ip].get("allocation_enable")]
                if any(a and a != "all" for a in alloc):
                    _add(extra, "ES058", "high", "allocation.enable=" + ",".join(sorted(set(alloc))))
            
                explains = []
                for ip in collected_ips:
                    ex = facts[ip].get("explain_reasons") or []
                    if isinstance(ex, list):
                        explains.extend(str(x) for x in ex)
                joined = " ".join(explains).upper()
                if "NODE_LEFT" in joined or "NODE_RESTART" in joined:
                    _add(extra, "ES052", "medium", "explain NODE_LEFT")
                if "DECIDERS_NO" in joined and ("DISK" in joined or "WATERMARK" in joined):
                    _add(extra, "ES061", "high", "explain DECIDERS_NO disk")
                if "ALLOCATION_FAILED" in joined:
                    _add(extra, "ES063", "high", "explain ALLOCATION_FAILED")
            
                if expected_nodes <= 1:
                    extra = [x for x in extra if x[0] not in {"ES194", "ES196", "ES198"}]
            
                return extra, meta
            
            
            def render_summary(
                run_id: str,
                expected_ips: list[str],
                facts: dict[str, dict[str, Any]],
                signals: list[tuple[str, str, str]],
                meta: dict[str, Any],
                health: dict[str, Any],
            ) -> str:
                lines = [
                    "# ES 7.x 三节点排查摘要",
                    "",
                    f"- run_id: `{run_id}`",
                    f"- expected_nodes: {meta.get('expected_nodes')}",
                    f"- nodes_collected: {meta.get('nodes_collected')}",
                    f"- coverage: `{meta.get('coverage')}`",
                    f"- majority_master: `{meta.get('majority_master') or ('NO_MASTER' if meta.get('no_master') else 'UNKNOWN')}`",
                    "",
                    "## 集群健康",
                    "",
                ]
                if health:
                    lines += [
                        f"- status: `{health.get('status', '')}`",
                        f"- number_of_nodes: {health.get('number_of_nodes', '')}",
                        f"- unassigned_shards: {health.get('unassigned_shards', '')}",
                        f"- delayed_unassigned_shards: {health.get('delayed_unassigned_shards', '')}",
                        f"- pending_tasks: {health.get('number_of_pending_tasks', '')}",
                        "",
                    ]
                else:
                    lines += ["- （无权威 cluster health）", ""]
                lines += [
                    "## 各节点 master 视图",
                    "",
                    "| IP | local_master | 9200 | 9300 | heap% | write_rejected_delta | disk% |",
                    "|----|--------------|------|------|-------|----------------------|-------|",
                ]
                for ip in expected_ips:
                    f = facts.get(ip) or {}
                    http = "ok" if f.get("http_ok") else ("NA" if not f else "fail")
                    tp = f.get("listen_transport")
                    trans = "ok" if tp else ("fail" if tp is False else "NA")
                    lines.append(
                        "| {ip} | {lm} | {http} | {trans} | {heap} | {wr} | {disk} |".format(
                            ip=ip,
                            lm=f.get("local_master") or ("(empty)" if f else "(missing)"),
                            http=http,
                            trans=trans,
                            heap=f.get("heap_pct") if f.get("heap_pct") is not None else "",
                            wr=f.get("write_rejected_delta") if f.get("write_rejected_delta") is not None else "",
                            disk=f.get("disk_used_pct") if f.get("disk_used_pct") is not None else "",
                        )
                    )
                lines += ["", "## Top 信号", "", "| ID | 级别 | 说明 |", "|----|------|------|"]
                if signals:
                    for sid, sev, note in signals:
                        lines.append(f"| {sid} | {sev} | {note} |")
                else:
                    lines.append("| — | — | 无自动信号 |")
                lines += ["", "## 交叉对比结论", ""]
                ids = {s[0] for s in signals}
                bullets = []
                if "ES191" in ids:
                    bullets.append("- **ES191 NO_MASTER**：三台均无 elected master，先看发现/传输/进程，不要解释 unassigned。")
                if "ES190" in ids:
                    bullets.append("- **ES190 NODE_DOWN**：健康节点数少于期望，优先掉节点而不是业务 QPS。")
                if "ES192" in ids:
                    bullets.append("- **ES192 YELLOW_ALLOC_NOT_DOWN**：三台都在集群内，副本未分配是水位/allocation/max_shards。")
                if "ES193" in ids:
                    bullets.append("- **ES193 HEAP_ONE_OUTLIER**：单节点 JVM，不是全集群容量。")
                if "ES194" in ids:
                    bullets.append("- **ES194 HEAP_ALL_SIMILAR**：多节点堆压力。")
                if "ES195" in ids:
                    bullets.append("- **ES195 REJECT_ONE**：单节点线程池拒绝。")
                if "ES196" in ids:
                    bullets.append("- **ES196 REJECT_ALL**：多节点 reject。")
                if "ES197" in ids:
                    bullets.append("- **ES197 FLOOD_ONE**：单节点磁盘 flood / 只读块。")
                if "ES198" in ids:
                    bullets.append("- **ES198 FLOOD_ALL**：集群块。")
                if "ES199" in ids:
                    bullets.append("- **ES199 TRANSPORT_PARTITION**：9200/9300 分叉或 master 视图分裂。")
                if not bullets:
                    if meta.get("coverage") == "ok" and not ids:
                        bullets.append("- 倾向 **ES001 基线正常**，或故障未落入 P0 信号。")
                    else:
                        bullets.append("- 无组合结论；见证据缺口。")
                lines.extend(bullets)
                lines += ["", "## 证据缺口", ""]
                gaps = list(meta.get("evidence_gap") or [])
                if meta.get("no_master"):
                    gaps.append("unassigned explain 不可靠（NO_MASTER）")
                if not gaps:
                    lines.append("- 无")
                else:
                    for g in gaps:
                        lines.append(f"- {g}")
                lines.append("")
                return "\n".join(lines)
            
            
            def cleanse(base: str, run_id: str, expected_ips: list[str], profile: str = "v1") -> dict[str, Any]:
                root = Path(base)
                root.mkdir(parents=True, exist_ok=True)
                facts: dict[str, dict[str, Any]] = {}
                for ip in expected_ips:
                    data = _read_json(root / f"facts.{ip}.json")
                    if data:
                        facts[ip] = data
                    master = _read_json(root / f"master.{ip}.json")
                    if master:
                        facts.setdefault(ip, {})
                        for k in ("local_master", "local_master_ip", "http_ok", "auth_fail", "is_elected"):
                            if k in master and master[k] is not None:
                                facts[ip].setdefault(k, master[k])
            
                raw = _read_signals(root)
                extra, meta = cross_compare(facts, len(expected_ips), expected_ips)
                if profile.endswith("degraded") and meta["coverage"] == "ok":
                    meta["coverage"] = "degraded"
                    meta["evidence_gap"].append("forced_degraded_profile")
                merged = _dedup(raw + extra)
                health = {}
                for ip in expected_ips:
                    h = (facts.get(ip) or {}).get("cluster_health")
                    if isinstance(h, dict) and h:
                        health = h
                        if facts[ip].get("is_elected"):
                            break
            
                kinds = ("precheck", "metrics", "status", "config", "logs", "hostnet")
                found = sum(1 for k in kinds if any(root.glob(f"{k}.*.txt")))
                if found == 0 and meta["coverage"] == "ok":
                    meta["coverage"] = "empty"
                elif found < 3 and meta["coverage"] == "ok":
                    meta["coverage"] = "degraded"
            
                summary = render_summary(run_id, expected_ips, facts, merged, meta, health)
                (root / "summary.md").write_text(summary, encoding="utf-8")
                sig_txt = "".join(f"{a}\t{b}\t{c}\n" for a, b, c in merged)
                (root / "signals.txt").write_text(sig_txt, encoding="utf-8")
                (root / "signals.uniq.tsv").write_text(sig_txt, encoding="utf-8")
            
                cleaned_parts = [
                    f"===== ES_TS cleaned run_id={run_id} profile={profile} =====",
                    f"nodes={','.join(expected_ips)}",
                    f"coverage={meta['coverage']} majority_master={meta.get('majority_master')}",
                    "",
                    "----- SIGNALS -----",
                    sig_txt or "NO_SIGNALS",
                    "",
                ]
                for p in sorted(root.glob("*.txt")):
                    if p.name in {"cleaned.txt", "signals.txt"}:
                        continue
                    body = p.read_text(encoding="utf-8", errors="replace")
                    lines = body.splitlines()
                    keep = [ln for ln in lines if ln.startswith("SIGNAL ") or ln.startswith("CMD_FAIL") or "KEYWORD" in ln]
                    if not keep:
                        keep = lines[-40:]
                    cleaned_parts.append(f"### {p.name} ###")
                    cleaned_parts.extend(keep[:80])
                    cleaned_parts.append("")
                cleaned = "\n".join(cleaned_parts)
                if len(cleaned.encode()) > 64000:
                    cleaned = cleaned.encode()[:64000].decode("utf-8", errors="ignore")
                (root / "cleaned.txt").write_text(cleaned, encoding="utf-8")
                meta_out = {
                    "run_id": run_id,
                    "profile": profile,
                    "coverage_status": meta["coverage"],
                    "nodes_collected": meta["nodes_collected"],
                    "expected_nodes": meta["expected_nodes"],
                    "majority_master": meta.get("majority_master") or "",
                    "no_master": str(bool(meta.get("no_master"))).lower(),
                    "signal_count": len(merged),
                    "kinds_found": found,
                }
                meta_txt = "".join(f"{k}={v}\n" for k, v in meta_out.items())
                (root / "cleaned.meta").write_text(meta_txt, encoding="utf-8")
                return {"meta": meta_out, "signals": merged, "summary": summary}
            
            
            def _cli(argv: list[str]) -> int:
                if len(argv) < 2:
                    print("usage: es_lib.py parse-master|parse-stats|parse-health|merge-facts|cleanse ...", file=sys.stderr)
                    return 2
                cmd = argv[1]
                if cmd == "parse-master":
                    print(json.dumps(parse_cat_master(sys.stdin.read()), ensure_ascii=False))
                    return 0
                if cmd == "parse-stats":
                    print(json.dumps(parse_local_stats(sys.stdin.read()), ensure_ascii=False))
                    return 0
                if cmd == "parse-health":
                    print(json.dumps(parse_cluster_health(sys.stdin.read()), ensure_ascii=False))
                    return 0
                if cmd == "parse-nodes":
                    local_ip = argv[2] if len(argv) > 2 else ""
                    print(json.dumps(parse_cat_nodes(sys.stdin.read(), local_ip), ensure_ascii=False))
                    return 0
                if cmd == "merge-facts":
                    path = argv[2]
                    updates = json.loads(argv[3] if len(argv) > 3 else sys.stdin.read())
                    print(json.dumps(merge_facts(path, updates), ensure_ascii=False))
                    return 0
                if cmd == "cleanse":
                    base, run_id = argv[2], argv[3]
                    ips = argv[4:]
                    profile = os.environ.get("TS_PROFILE", "v1")
                    result = cleanse(base, run_id, ips, profile)
                    print(json.dumps(result["meta"], ensure_ascii=False))
                    return 0
                print("unknown command", cmd, file=sys.stderr)
                return 2
            
            
            if __name__ == "__main__":
                sys.exit(_cli(sys.argv))
            ES_TS_LIB_PY
            # Shared helpers for ES 7.x troubleshooting collectors. Sourced, not executed.
            # Collectors always exit 0. Do not mutate the cluster.
            
            umask 077
            
            json_escape() {
              local s=${1-}
              s=${s//\\/\\\\}
              s=${s//\"/\\\"}
              s=${s//$'\n'/\\n}
              s=${s//$'\r'/\\r}
              s=${s//$'\t'/\\t}
              printf '%s' "$s"
            }
            
            ts_now() { date -u +"%Y-%m-%dT%H:%M:%SZ"; }
            
            resolve_local_ip() {
              local node1=$1 node2=$2 node3=$3
              local local_ips target_ip=""
              local_ips=$(hostname -I 2>/dev/null || true)
              for ip in "$node1" "$node2" "$node3"; do
                [[ " ${local_ips} " == *" ${ip} "* ]] && target_ip=$ip && break
              done
              if [[ -z "$target_ip" ]]; then
                target_ip=$(hostname -I 2>/dev/null | awk '{print $1}')
              fi
              printf '%s' "${target_ip:-unknown}"
            }
            
            artifact_dir_for() {
              local run_id=$1
              local base=${TS_ARTIFACT_DIR:-/tmp/es-troubleshoot}
              printf '%s/%s' "$base" "$run_id"
            }
            
            es_lib_py() {
              local here=${SCRIPT_DIR:-}
              if [[ -n "$here" && -f "${here}/es_lib.py" ]]; then
                printf '%s' "${here}/es_lib.py"
                return 0
              fi
              if [[ -f /tmp/es-ts-lib/es_lib.py ]]; then
                printf '%s' /tmp/es-ts-lib/es_lib.py
                return 0
              fi
              return 1
            }
            
            begin_artifact() {
              local kind=$1 node=$2 run_id=$3
              ARTIFACT_KIND=$kind
              ARTIFACT_NODE=$node
              ARTIFACT_RUN_ID=$run_id
              ARTIFACT_DIR=$(artifact_dir_for "$run_id")
              mkdir -p "$ARTIFACT_DIR"
              ARTIFACT_FILE="${ARTIFACT_DIR}/${kind}.${node}.txt"
              SIGNAL_FILE="${ARTIFACT_DIR}/${kind}.${node}.signals"
              FACTS_FILE="${ARTIFACT_DIR}/facts.${node}.json"
              MASTER_FILE="${ARTIFACT_DIR}/master.${node}.json"
              : > "$ARTIFACT_FILE"
              : > "$SIGNAL_FILE"
              {
                echo "===== ES_TS artifact=${kind} node=${node} ts=$(ts_now) run_id=${run_id} ====="
                echo "hostname=$(hostname 2>/dev/null || echo unknown)"
              } >> "$ARTIFACT_FILE"
            }
            
            emit() {
              printf '%s\n' "$*" >> "$ARTIFACT_FILE"
            }
            
            emit_cmd() {
              local title=$1
              local rc=0
              shift
              emit "----- ${title} -----"
              "$@" >> "$ARTIFACT_FILE" 2>&1
              rc=$?
              if (( rc != 0 )); then
                emit "CMD_FAIL: ${title} rc=${rc}"
                return 1
              fi
              return 0
            }
            
            emit_cmd_timeout() {
              local seconds=$1 title=$2
              shift 2
              emit "----- ${title} (timeout ${seconds}s) -----"
              if command -v timeout >/dev/null 2>&1; then
                if ! timeout "$seconds" "$@" >> "$ARTIFACT_FILE" 2>&1; then
                  emit "CMD_FAIL_OR_TIMEOUT: ${title}"
                  signal ES174 low "timeout ${title}"
                  return 1
                fi
              else
                if ! "$@" >> "$ARTIFACT_FILE" 2>&1; then
                  emit "CMD_FAIL: ${title}"
                  return 1
                fi
              fi
              return 0
            }
            
            signal() {
              printf '%s\t%s\t%s\n' "$1" "$2" "$3" >> "$SIGNAL_FILE"
              emit "SIGNAL ${1} severity=${2} ${3}"
            }
            
            finish_artifact() {
              emit "===== END ES_TS artifact=${ARTIFACT_KIND} node=${ARTIFACT_NODE} ====="
              echo "###ES_TS_ARTIFACT kind=${ARTIFACT_KIND} node=${ARTIFACT_NODE} file=${ARTIFACT_FILE}###"
              cat "$ARTIFACT_FILE"
              echo "###ES_TS_SIGNALS kind=${ARTIFACT_KIND} node=${ARTIFACT_NODE}###"
              cat "$SIGNAL_FILE"
              echo "###END_ES_TS_ARTIFACT###"
            }
            
            es_curl() {
              # es_curl <seconds> <url> [curl extra...]
              local seconds=$1
              shift
              local url=$1
              shift
              local args=(-sS --max-time "$seconds" --connect-timeout 3 -H 'Accept: application/json')
              if [[ -n "${ES_USER:-}" ]]; then
                args+=(-u "${ES_USER}:${ES_PASS:-}")
              fi
              curl "${args[@]}" "$@" "$url" 2>/dev/null
            }
            
            es_base_url() {
              printf 'http://127.0.0.1:%s' "${ES_HTTP_PORT:-9200}"
            }
            
            facts_merge() {
              local json=$1
              local py
              py=$(es_lib_py) || return 0
              python3 "$py" merge-facts "$FACTS_FILE" "$json" >/dev/null 2>&1 || true
            }
            
            record_local_master() {
              local url
              url="$(es_base_url)/_cat/master?h=id,host,ip,node&format=json"
              local body rc=0
              body=$(es_curl 3 "$url" -w '\nHTTP_CODE:%{http_code}\n') || rc=$?
              local code
              code=$(printf '%s\n' "$body" | awk -F: '/HTTP_CODE:/{print $2}' | tail -n1)
              local json
              json=$(printf '%s\n' "$body" | sed '/HTTP_CODE:/d')
              emit "----- local _cat/master http=${code:-na} rc=${rc} -----"
              emit "$json"
            
              local parsed="{}"
              local py
              py=$(es_lib_py) || true
              if [[ -n "$py" ]]; then
                parsed=$(printf '%s' "$json" | python3 "$py" parse-master 2>/dev/null || echo '{}')
              fi
              local http_ok=false auth_fail=false local_master="" local_ip=""
              if [[ "$code" == "401" || "$code" == "403" ]]; then
                auth_fail=true
                signal ES032 high "local HTTP auth failed code=${code}"
              elif [[ "$code" == "200" ]]; then
                http_ok=true
              else
                signal ES032 medium "local _cat/master failed code=${code:-na} rc=${rc}"
              fi
              if [[ "$http_ok" == true ]]; then
                local_master=$(python3 -c 'import json,sys; d=json.loads(sys.argv[1]); print(d.get("local_master",""))' "$parsed" 2>/dev/null || true)
                local_ip=$(python3 -c 'import json,sys; d=json.loads(sys.argv[1]); print(d.get("local_master_ip",""))' "$parsed" 2>/dev/null || true)
              fi
              emit "local_master=${local_master}"
              emit "local_master_ip=${local_ip}"
            
              local nodes_json=""
              nodes_json=$(es_curl 3 "$(es_base_url)/_cat/nodes?h=id,name,ip,master,node.role&format=json" || true)
              emit "----- local _cat/nodes -----"
              emit "$nodes_json"
              local self_elected=false
              if [[ -n "$py" && -n "$nodes_json" ]]; then
                local nodes_parsed
                nodes_parsed=$(printf '%s' "$nodes_json" | python3 "$py" parse-nodes "$ARTIFACT_NODE" 2>/dev/null || echo '{}')
                if python3 -c 'import json,sys; raise SystemExit(0 if json.loads(sys.argv[1]).get("self_elected") else 1)' "$nodes_parsed" 2>/dev/null; then
                  self_elected=true
                fi
              fi
              if [[ "$self_elected" != true && -n "$local_ip" && "$local_ip" == "$ARTIFACT_NODE" ]]; then
                self_elected=true
              fi
              emit "is_elected=${self_elected}"
            
              mkdir -p "$ARTIFACT_DIR"
              python3 - "$MASTER_FILE" "$ARTIFACT_NODE" "$local_master" "$local_ip" "$http_ok" "$auth_fail" "$self_elected" <<'PY' 2>/dev/null || true
            import json,sys
            path, node, lm, lip, http_ok, auth, elected = sys.argv[1:8]
            doc = {
              "node": node,
              "local_master": lm,
              "local_master_ip": lip,
              "http_ok": http_ok == "true",
              "auth_fail": auth == "true",
              "is_elected": elected == "true",
            }
            open(path,"w",encoding="utf-8").write(json.dumps(doc, ensure_ascii=False, indent=2)+"\n")
            PY
              facts_merge "$(python3 -c 'import json,sys; print(json.dumps({"local_master":sys.argv[1],"local_master_ip":sys.argv[2],"http_ok":sys.argv[3]=="true","auth_fail":sys.argv[4]=="true","is_elected":sys.argv[5]=="true","node":sys.argv[6]}))' \
                "$local_master" "$local_ip" "$http_ok" "$auth_fail" "$self_elected" "$ARTIFACT_NODE")"
              if [[ "$self_elected" == true ]]; then
                IS_ELECTED=1
              else
                IS_ELECTED=0
              fi
            }
            
            listen_port() {
              local port=$1
              if command -v ss >/dev/null 2>&1; then
                ss -lnt 2>/dev/null | awk '{print $4}' | grep -q ":${port}$"
                return $?
              fi
              netstat -lnt 2>/dev/null | grep -q ":${port} "
            }
            
            tcp_probe() {
              local host=$1 port=$2
              if timeout 2 bash -c "echo >/dev/tcp/${host}/${port}" 2>/dev/null; then
                return 0
              fi
              if command -v nc >/dev/null 2>&1; then
                nc -z -w 2 "$host" "$port" >/dev/null 2>&1 && return 0
              fi
              return 1
            }
            
            es_process_up() {
              # Character class so pgrep does not match its own argv.
              pgrep -f '[o]rg.elasticsearch.bootstrap.Elasticsearch' >/dev/null 2>&1 && return 0
              pgrep -x elasticsearch >/dev/null 2>&1 && return 0
              return 1
            }
            # 数据清洗：三台交叉认 master、ALL/ONE 组合信号、写出 summary.md。禁止调模型。
            set -uo pipefail
            
            node1=${1:-}
            node2=${2:-}
            node3=${3:-}
            _http=${4:-9200}
            _transport=${5:-9300}
            run_id=${6:-manual}
            profile=${7:-v1}
            ES_USER=${8:-${ES_USER:-}}
            ES_PASS=${9:-${ES_PASS:-}}
            
            target_ip=$(resolve_local_ip "$node1" "$node2" "$node3")
            base=$(artifact_dir_for "$run_id")
            mkdir -p "$base"
            
            py=$(es_lib_py) || {
              echo "es_lib.py missing" >&2
              echo "###ES_TS_CLEANSED run_id=${run_id} coverage=empty signals=0###"
              echo "# ES 7.x 三节点排查摘要"
              echo
              echo "- es_lib.py missing on $(hostname)"
              echo "###END_ES_TS_CLEANSED###"
              exit 0
            }
            
            export TS_PROFILE=$profile
            python3 "$py" cleanse "$base" "$run_id" "$node1" "$node2" "$node3" >"${base}/cleanse.meta.json" 2>"${base}/cleanse.err" || true
            
            coverage=unknown
            if [[ -f "${base}/cleaned.meta" ]]; then
              coverage=$(awk -F= '$1=="coverage_status"{print $2}' "${base}/cleaned.meta")
            fi
            sig_n=0
            if [[ -f "${base}/signals.txt" ]]; then
              sig_n=$(grep -c '^ES' "${base}/signals.txt" 2>/dev/null || echo 0)
            fi
            
            echo "###ES_TS_CLEANSED run_id=${run_id} coverage=${coverage} signals=${sig_n} node=${target_ip}###"
            if [[ -f "${base}/summary.md" ]]; then
              cat "${base}/summary.md"
            else
              echo "# ES 7.x 三节点排查摘要"
              echo
              echo "- cleanse failed to write summary.md"
              echo "- stderr: $(head -c 500 "${base}/cleanse.err" 2>/dev/null || true)"
            fi
            echo "###END_ES_TS_CLEANSED###"
            exit 0
        job_ip_list:
          value: "${es_node1_ip}"
        job_rolling_config:
          value:
            job_rolling_execute: []
            job_rolling_expression: ''
            job_rolling_mode: 1
        job_script_list_general:
          value: ''
        job_script_list_public:
          value: ''
        job_script_param:
          value: "'${es_node1_ip}' '${es_node2_ip}' '${es_node3_ip}' '${es_http_port}' '${es_transport_port}' '${ts_run_id}' 'v2-degraded' '${es_user}' '${es_pass}'"
        job_script_source:
          value: manual
        job_script_timeout:
          value: '60'
        job_script_type:
          value: '1'
        job_success_id:
          value: ''
    auto_retry:
      enable: false
      times: 1
      interval: 0
    ignore_error: true
    can_retry: true
    can_skip: false
    optional: false
    next:
    - es-ts_ai
  - id: es-ts_ai
    type: ServiceActivity
    name: 快速执行脚本
    stage_name: AI诊断分析(失败则本节点失败)
    component:
      code: job_fast_execute_script
      version: v1.2
      data:
        biz_cc_id:
          name: 业务
          value: ''
          key: "${biz_cc_id}"
          version: v1.2
          source_tag: job_fast_execute_script.biz_cc_id
        job_account:
          value: root
        job_content:
          value: |
            #!/usr/bin/env bash
            mkdir -p /tmp/es-ts-lib
            cat > /tmp/es-ts-lib/es_lib.py <<'ES_TS_LIB_PY'
            #!/usr/bin/env python3
            """Parse ES 7.x collector JSON and run cleanse cross-compare.
            
            Used by bash collectors and cleanse_artifacts.sh. No HTTP. Diagnose only.
            """
            from __future__ import annotations
            
            import json
            import os
            import sys
            from collections import Counter
            from pathlib import Path
            from typing import Any
            
            
            def _load(text: str) -> Any:
                text = (text or "").strip()
                if not text:
                    return None
                try:
                    return json.loads(text)
                except json.JSONDecodeError:
                    return None
            
            
            def parse_cat_master(text: str) -> dict[str, Any]:
                data = _load(text)
                out = {
                    "http_ok": False,
                    "auth_fail": False,
                    "local_master": "",
                    "local_master_ip": "",
                    "local_master_id": "",
                    "is_elected": False,
                }
                if data is None:
                    return out
                out["http_ok"] = True
                row = None
                if isinstance(data, list) and data:
                    row = data[0] if isinstance(data[0], dict) else None
                elif isinstance(data, dict):
                    row = data
                if not row:
                    return out
                out["local_master"] = str(row.get("node") or row.get("name") or "")
                out["local_master_ip"] = str(row.get("ip") or row.get("host") or "")
                out["local_master_id"] = str(row.get("id") or "")
                return out
            
            
            def parse_cat_nodes(text: str, local_ip: str = "") -> dict[str, Any]:
                data = _load(text)
                out = {"nodes": [], "elected": "", "elected_ip": "", "self_elected": False}
                if not isinstance(data, list):
                    return out
                for row in data:
                    if not isinstance(row, dict):
                        continue
                    name = str(row.get("name") or row.get("node") or "")
                    ip = str(row.get("ip") or "")
                    master = str(row.get("master") or "")
                    roles = str(row.get("node.role") or row.get("nodeRole") or "")
                    out["nodes"].append({"name": name, "ip": ip, "master": master, "roles": roles})
                    if master == "*":
                        out["elected"] = name
                        out["elected_ip"] = ip
                        if local_ip and (ip == local_ip):
                            out["self_elected"] = True
                return out
            
            
            def parse_local_stats(text: str) -> dict[str, Any]:
                data = _load(text)
                out = {
                    "heap_pct": None,
                    "write_rejected": None,
                    "search_rejected": None,
                    "write_pool": "",
                    "breaker_parent_pct": None,
                    "breaker_tripped": 0,
                    "disk_total": None,
                    "disk_free": None,
                    "disk_used_pct": None,
                    "index_total": None,
                    "index_time_ms": None,
                    "query_total": None,
                    "query_time_ms": None,
                    "cpu_percent": None,
                    "gc_young_ms": None,
                    "gc_old_ms": None,
                    "node_name": "",
                }
                if not isinstance(data, dict):
                    return out
                nodes = data.get("nodes") or {}
                if not isinstance(nodes, dict) or not nodes:
                    return out
                n = next(iter(nodes.values()))
                if not isinstance(n, dict):
                    return out
                out["node_name"] = str(n.get("name") or "")
                jvm = n.get("jvm") or {}
                mem = jvm.get("mem") or {}
                if "heap_used_percent" in mem:
                    out["heap_pct"] = int(mem["heap_used_percent"])
                collectors = (jvm.get("gc") or {}).get("collectors") or {}
                young = collectors.get("young") or collectors.get("ParNew") or {}
                old = collectors.get("old") or collectors.get("ConcurrentMarkSweep") or collectors.get("G1 Old Generation") or {}
                if "collection_time_in_millis" in young:
                    out["gc_young_ms"] = int(young["collection_time_in_millis"])
                if "collection_time_in_millis" in old:
                    out["gc_old_ms"] = int(old["collection_time_in_millis"])
                tp = n.get("thread_pool") or {}
                write = tp.get("write") if isinstance(tp.get("write"), dict) else None
                if write is None and isinstance(tp.get("index"), dict):
                    write = tp["index"]
                    out["write_pool"] = "index_legacy"
                else:
                    out["write_pool"] = "write"
                if write:
                    out["write_rejected"] = int(write.get("rejected") or 0)
                search = tp.get("search") if isinstance(tp.get("search"), dict) else {}
                if search:
                    out["search_rejected"] = int(search.get("rejected") or 0)
                breakers = n.get("breakers") or {}
                parent = breakers.get("parent") or {}
                if parent.get("limit_size_in_bytes") and parent.get("estimated_size_in_bytes") is not None:
                    lim = int(parent["limit_size_in_bytes"]) or 1
                    out["breaker_parent_pct"] = int(int(parent["estimated_size_in_bytes"]) * 100 / lim)
                tripped = 0
                for b in breakers.values():
                    if isinstance(b, dict):
                        tripped += int(b.get("tripped") or 0)
                out["breaker_tripped"] = tripped
                fs = (n.get("fs") or {}).get("total") or {}
                if fs.get("total_in_bytes"):
                    total = int(fs["total_in_bytes"])
                    free = int(fs.get("available_in_bytes") or fs.get("free_in_bytes") or 0)
                    out["disk_total"] = total
                    out["disk_free"] = free
                    out["disk_used_pct"] = int((total - free) * 100 / total) if total else None
                idx = (n.get("indices") or {}).get("indexing") or {}
                if "index_total" in idx:
                    out["index_total"] = int(idx["index_total"])
                    out["index_time_ms"] = int(idx.get("index_time_in_millis") or 0)
                search_m = (n.get("indices") or {}).get("search") or {}
                if "query_total" in search_m:
                    out["query_total"] = int(search_m["query_total"])
                    out["query_time_ms"] = int(search_m.get("query_time_in_millis") or 0)
                cpu = (n.get("os") or {}).get("cpu") or {}
                if "percent" in cpu:
                    out["cpu_percent"] = int(cpu["percent"])
                return out
            
            
            def parse_cluster_health(text: str) -> dict[str, Any]:
                data = _load(text)
                if not isinstance(data, dict):
                    return {}
                keys = (
                    "status",
                    "number_of_nodes",
                    "number_of_data_nodes",
                    "active_primary_shards",
                    "active_shards",
                    "relocating_shards",
                    "initializing_shards",
                    "unassigned_shards",
                    "delayed_unassigned_shards",
                    "number_of_pending_tasks",
                    "task_max_waiting_in_queue_millis",
                    "active_shards_percent_as_number",
                    "timed_out",
                )
                out: dict[str, Any] = {}
                for k in keys:
                    if k in data:
                        out[k] = data[k]
                return out
            
            
            def merge_facts(path: str, updates: dict[str, Any]) -> dict[str, Any]:
                p = Path(path)
                cur: dict[str, Any] = {}
                if p.is_file():
                    try:
                        cur = json.loads(p.read_text(encoding="utf-8"))
                    except (OSError, json.JSONDecodeError):
                        cur = {}
                cur.update({k: v for k, v in updates.items() if v is not None})
                p.parent.mkdir(parents=True, exist_ok=True)
                p.write_text(json.dumps(cur, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
                return cur
            
            
            def _read_json(path: Path) -> dict[str, Any] | None:
                if not path.is_file():
                    return None
                try:
                    data = json.loads(path.read_text(encoding="utf-8"))
                except (OSError, json.JSONDecodeError):
                    return None
                return data if isinstance(data, dict) else None
            
            
            def _read_signals(base: Path) -> list[tuple[str, str, str]]:
                rows: list[tuple[str, str, str]] = []
                for p in sorted(base.glob("*.signals")):
                    try:
                        text = p.read_text(encoding="utf-8", errors="replace")
                    except OSError:
                        continue
                    for line in text.splitlines():
                        parts = line.split("\t", 2)
                        if len(parts) >= 3 and parts[0].startswith("ES"):
                            rows.append((parts[0], parts[1], parts[2]))
                return rows
            
            
            def _sev_rank(sev: str) -> int:
                return {"high": 3, "medium": 2, "low": 1, "warning": 2}.get(sev, 0)
            
            
            def _dedup(rows: list[tuple[str, str, str]]) -> list[tuple[str, str, str]]:
                best: dict[str, tuple[str, str, str]] = {}
                order: list[str] = []
                for sid, sev, note in rows:
                    if sid not in best:
                        order.append(sid)
                        best[sid] = (sid, sev, note)
                        continue
                    old = best[sid]
                    if _sev_rank(sev) > _sev_rank(old[1]):
                        best[sid] = (sid, sev, f"{old[2]} | {note}")
                    elif note not in old[2]:
                        best[sid] = (sid, old[1], f"{old[2]} | {note}")
                return [best[k] for k in order]
            
            
            def _add(signals: list[tuple[str, str, str]], sid: str, sev: str, note: str) -> None:
                signals.append((sid, sev, note))
            
            
            def cross_compare(
                facts: dict[str, dict[str, Any]],
                expected_nodes: int,
                expected_ips: list[str],
            ) -> tuple[list[tuple[str, str, str]], dict[str, Any]]:
                extra: list[tuple[str, str, str]] = []
                collected_ips = [ip for ip in expected_ips if ip in facts]
                n_col = len(collected_ips)
                meta: dict[str, Any] = {
                    "nodes_collected": n_col,
                    "expected_nodes": expected_nodes,
                    "majority_master": "",
                    "coverage": "ok",
                    "no_master": False,
                    "evidence_gap": [],
                }
                if n_col < expected_nodes:
                    meta["coverage"] = "degraded"
                    missing = [ip for ip in expected_ips if ip not in facts]
                    meta["evidence_gap"].append("missing_nodes=" + ",".join(missing))
                    _add(extra, "ES172", "high", "nodes missing: " + ",".join(missing))
                    if n_col == 0:
                        meta["coverage"] = "empty"
            
                masters = []
                auth_na = 0
                for ip in collected_ips:
                    f = facts[ip]
                    if f.get("auth_fail"):
                        auth_na += 1
                        continue
                    masters.append((ip, str(f.get("local_master") or "")))
            
                nonempty = [m for _, m in masters if m]
                empty = [ip for ip, m in masters if not m]
                maj = ""
                if nonempty:
                    maj, cnt = Counter(nonempty).most_common(1)[0]
                    if cnt >= 2 or (expected_nodes == 1 and cnt == 1):
                        maj_ok = maj
                    else:
                        maj_ok = maj if cnt == len(nonempty) else ""
                    maj = maj_ok
                meta["majority_master"] = maj
            
                all_collected = n_col == expected_nodes and expected_nodes >= 1
                all_empty = all_collected and not nonempty and auth_na == 0
                if all_empty:
                    _add(extra, "ES050", "high", "all %s nodes have empty local_master" % n_col)
                    _add(extra, "ES191", "high", "NO_MASTER")
                    meta["no_master"] = True
                    meta["majority_master"] = ""
                elif n_col < expected_nodes and nonempty == [] and empty:
                    meta["evidence_gap"].append("NO_MASTER_OBSERVED")
                    _add(extra, "ES173", "medium", "observed nodes have no master but collection incomplete")
                elif maj and empty:
                    _add(extra, "ES051", "high", "majority master=%s disagree/empty on %s" % (maj, ",".join(empty)))
                    _add(extra, "ES199", "high", "master view split")
                elif nonempty and len(set(nonempty)) > 1:
                    _add(extra, "ES051", "high", "local_master values disagree: " + ",".join(sorted(set(nonempty))))
                    _add(extra, "ES199", "high", "master view split")
            
                health = {}
                for ip in collected_ips:
                    h = facts[ip].get("cluster_health")
                    if isinstance(h, dict) and h.get("status"):
                        health = h
                        if maj and (facts[ip].get("is_elected") or facts[ip].get("local_master") == maj):
                            break
            
                nodes_in_health = int(health.get("number_of_nodes") or 0) if health else 0
                status = str(health.get("status") or "")
                unassigned = int(health.get("unassigned_shards") or 0) if health else 0
                delayed = int(health.get("delayed_unassigned_shards") or 0) if health else 0
                pending = int(health.get("number_of_pending_tasks") or 0) if health else 0
                reloc = int(health.get("relocating_shards") or 0) if health else 0
                init = int(health.get("initializing_shards") or 0) if health else 0
            
                if delayed > 0:
                    _add(extra, "ES055", "low", "delayed_unassigned=%s" % delayed)
                if pending >= 10:
                    _add(extra, "ES056", "high", "pending_tasks=%s" % pending)
                elif pending >= 1:
                    _add(extra, "ES056", "medium", "pending_tasks=%s" % pending)
                if reloc or init:
                    _add(extra, "ES057", "medium", "relocating=%s initializing=%s" % (reloc, init))
            
                down_ips = []
                for ip in expected_ips:
                    f = facts.get(ip) or {}
                    proc = f.get("process_up")
                    http = f.get("http_ok")
                    listen = f.get("listen_http")
                    if proc is False or listen is False or http is False:
                        down_ips.append(ip)
                    elif ip not in facts:
                        down_ips.append(ip)
            
                if not meta["no_master"]:
                    if nodes_in_health and nodes_in_health < expected_nodes:
                        missing_n = expected_nodes - nodes_in_health
                        if missing_n >= 2:
                            _add(extra, "ES053", "high", "health nodes=%s expected=%s" % (nodes_in_health, expected_nodes))
                        else:
                            _add(extra, "ES052", "medium", "health nodes=%s expected=%s" % (nodes_in_health, expected_nodes))
                        _add(extra, "ES190", "high", "NODE_DOWN health_nodes=%s down_ips=%s" % (nodes_in_health, ",".join(down_ips) or "unknown"))
                    elif n_col == expected_nodes and nodes_in_health == expected_nodes and status == "yellow" and unassigned > 0:
                        _add(extra, "ES192", "medium", "YELLOW_ALLOC_NOT_DOWN unassigned=%s" % unassigned)
                    if status == "red" and not meta["no_master"] and unassigned > 0:
                        _add(extra, "ES054", "high", "red with unassigned=%s" % unassigned)
            
                if meta["no_master"] and status == "red":
                    _add(extra, "ES053", "high", "red and NO_MASTER")
            
                if expected_nodes <= 1:
                    extra = [(s, v, n + " node_count=1") if s.startswith("ES19") else (s, v, n) for s, v, n in extra]
                    extra = [x for x in extra if not (x[0] in {"ES194", "ES196", "ES198"} and expected_nodes <= 1)]
            
                heaps = [(ip, facts[ip].get("heap_pct")) for ip in collected_ips if isinstance(facts[ip].get("heap_pct"), int)]
                high_heap = [ip for ip, h in heaps if h is not None and h >= 85]
                if len(high_heap) == 1 and len(heaps) >= 2:
                    _add(extra, "ES193", "high", "HEAP_ONE_OUTLIER %s heap=%s" % (high_heap[0], dict(heaps)[high_heap[0]]))
                    _add(extra, "ES034", "high", "%s heap=%s" % (high_heap[0], dict(heaps)[high_heap[0]]))
                elif len(high_heap) >= 2:
                    _add(extra, "ES194", "high", "HEAP_ALL_SIMILAR " + ",".join("%s=%s" % (ip, dict(heaps)[ip]) for ip in high_heap))
            
                rejects = [(ip, int(facts[ip].get("write_rejected_delta") or 0) + int(facts[ip].get("search_rejected_delta") or 0)) for ip in collected_ips]
                rej_pos = [ip for ip, r in rejects if r > 0]
                if len(rej_pos) == 1 and len(rejects) >= 2:
                    _add(extra, "ES195", "medium", "REJECT_ONE %s delta=%s" % (rej_pos[0], dict(rejects)[rej_pos[0]]))
                elif len(rej_pos) >= 2:
                    _add(extra, "ES196", "high", "REJECT_ALL " + ",".join(rej_pos))
            
                floods = [ip for ip in collected_ips if facts[ip].get("flood") or facts[ip].get("read_only_allow_delete")]
                if len(floods) == 1 and n_col >= 2:
                    _add(extra, "ES197", "high", "FLOOD_ONE %s" % floods[0])
                elif len(floods) >= 2:
                    _add(extra, "ES198", "high", "FLOOD_ALL " + ",".join(floods))
            
                for ip in collected_ips:
                    f = facts[ip]
                    if f.get("http_ok") and f.get("listen_http") and f.get("transport_ok") is False:
                        _add(extra, "ES091", "high", "9200 up 9300 down on %s" % ip)
                        _add(extra, "ES199", "high", "TRANSPORT_PARTITION %s" % ip)
                    peers = f.get("peer_transport") or {}
                    if isinstance(peers, dict):
                        for peer, ok in peers.items():
                            if ok is False and (f.get("peer_http") or {}).get(peer) is True:
                                _add(extra, "ES091", "high", "%s http ok transport fail to %s" % (ip, peer))
                                _add(extra, "ES199", "high", "TRANSPORT_PARTITION %s->%s" % (ip, peer))
            
                names = [str(facts[ip].get("cluster_name") or "") for ip in collected_ips if facts[ip].get("cluster_name")]
                if names and len(set(names)) > 1:
                    _add(extra, "ES060", "high", "cluster.name disagree: " + ",".join(sorted(set(names))))
            
                alloc = [str(facts[ip].get("allocation_enable") or "") for ip in collected_ips if facts[ip].get("allocation_enable")]
                if any(a and a != "all" for a in alloc):
                    _add(extra, "ES058", "high", "allocation.enable=" + ",".join(sorted(set(alloc))))
            
                explains = []
                for ip in collected_ips:
                    ex = facts[ip].get("explain_reasons") or []
                    if isinstance(ex, list):
                        explains.extend(str(x) for x in ex)
                joined = " ".join(explains).upper()
                if "NODE_LEFT" in joined or "NODE_RESTART" in joined:
                    _add(extra, "ES052", "medium", "explain NODE_LEFT")
                if "DECIDERS_NO" in joined and ("DISK" in joined or "WATERMARK" in joined):
                    _add(extra, "ES061", "high", "explain DECIDERS_NO disk")
                if "ALLOCATION_FAILED" in joined:
                    _add(extra, "ES063", "high", "explain ALLOCATION_FAILED")
            
                if expected_nodes <= 1:
                    extra = [x for x in extra if x[0] not in {"ES194", "ES196", "ES198"}]
            
                return extra, meta
            
            
            def render_summary(
                run_id: str,
                expected_ips: list[str],
                facts: dict[str, dict[str, Any]],
                signals: list[tuple[str, str, str]],
                meta: dict[str, Any],
                health: dict[str, Any],
            ) -> str:
                lines = [
                    "# ES 7.x 三节点排查摘要",
                    "",
                    f"- run_id: `{run_id}`",
                    f"- expected_nodes: {meta.get('expected_nodes')}",
                    f"- nodes_collected: {meta.get('nodes_collected')}",
                    f"- coverage: `{meta.get('coverage')}`",
                    f"- majority_master: `{meta.get('majority_master') or ('NO_MASTER' if meta.get('no_master') else 'UNKNOWN')}`",
                    "",
                    "## 集群健康",
                    "",
                ]
                if health:
                    lines += [
                        f"- status: `{health.get('status', '')}`",
                        f"- number_of_nodes: {health.get('number_of_nodes', '')}",
                        f"- unassigned_shards: {health.get('unassigned_shards', '')}",
                        f"- delayed_unassigned_shards: {health.get('delayed_unassigned_shards', '')}",
                        f"- pending_tasks: {health.get('number_of_pending_tasks', '')}",
                        "",
                    ]
                else:
                    lines += ["- （无权威 cluster health）", ""]
                lines += [
                    "## 各节点 master 视图",
                    "",
                    "| IP | local_master | 9200 | 9300 | heap% | write_rejected_delta | disk% |",
                    "|----|--------------|------|------|-------|----------------------|-------|",
                ]
                for ip in expected_ips:
                    f = facts.get(ip) or {}
                    http = "ok" if f.get("http_ok") else ("NA" if not f else "fail")
                    tp = f.get("listen_transport")
                    trans = "ok" if tp else ("fail" if tp is False else "NA")
                    lines.append(
                        "| {ip} | {lm} | {http} | {trans} | {heap} | {wr} | {disk} |".format(
                            ip=ip,
                            lm=f.get("local_master") or ("(empty)" if f else "(missing)"),
                            http=http,
                            trans=trans,
                            heap=f.get("heap_pct") if f.get("heap_pct") is not None else "",
                            wr=f.get("write_rejected_delta") if f.get("write_rejected_delta") is not None else "",
                            disk=f.get("disk_used_pct") if f.get("disk_used_pct") is not None else "",
                        )
                    )
                lines += ["", "## Top 信号", "", "| ID | 级别 | 说明 |", "|----|------|------|"]
                if signals:
                    for sid, sev, note in signals:
                        lines.append(f"| {sid} | {sev} | {note} |")
                else:
                    lines.append("| — | — | 无自动信号 |")
                lines += ["", "## 交叉对比结论", ""]
                ids = {s[0] for s in signals}
                bullets = []
                if "ES191" in ids:
                    bullets.append("- **ES191 NO_MASTER**：三台均无 elected master，先看发现/传输/进程，不要解释 unassigned。")
                if "ES190" in ids:
                    bullets.append("- **ES190 NODE_DOWN**：健康节点数少于期望，优先掉节点而不是业务 QPS。")
                if "ES192" in ids:
                    bullets.append("- **ES192 YELLOW_ALLOC_NOT_DOWN**：三台都在集群内，副本未分配是水位/allocation/max_shards。")
                if "ES193" in ids:
                    bullets.append("- **ES193 HEAP_ONE_OUTLIER**：单节点 JVM，不是全集群容量。")
                if "ES194" in ids:
                    bullets.append("- **ES194 HEAP_ALL_SIMILAR**：多节点堆压力。")
                if "ES195" in ids:
                    bullets.append("- **ES195 REJECT_ONE**：单节点线程池拒绝。")
                if "ES196" in ids:
                    bullets.append("- **ES196 REJECT_ALL**：多节点 reject。")
                if "ES197" in ids:
                    bullets.append("- **ES197 FLOOD_ONE**：单节点磁盘 flood / 只读块。")
                if "ES198" in ids:
                    bullets.append("- **ES198 FLOOD_ALL**：集群块。")
                if "ES199" in ids:
                    bullets.append("- **ES199 TRANSPORT_PARTITION**：9200/9300 分叉或 master 视图分裂。")
                if not bullets:
                    if meta.get("coverage") == "ok" and not ids:
                        bullets.append("- 倾向 **ES001 基线正常**，或故障未落入 P0 信号。")
                    else:
                        bullets.append("- 无组合结论；见证据缺口。")
                lines.extend(bullets)
                lines += ["", "## 证据缺口", ""]
                gaps = list(meta.get("evidence_gap") or [])
                if meta.get("no_master"):
                    gaps.append("unassigned explain 不可靠（NO_MASTER）")
                if not gaps:
                    lines.append("- 无")
                else:
                    for g in gaps:
                        lines.append(f"- {g}")
                lines.append("")
                return "\n".join(lines)
            
            
            def cleanse(base: str, run_id: str, expected_ips: list[str], profile: str = "v1") -> dict[str, Any]:
                root = Path(base)
                root.mkdir(parents=True, exist_ok=True)
                facts: dict[str, dict[str, Any]] = {}
                for ip in expected_ips:
                    data = _read_json(root / f"facts.{ip}.json")
                    if data:
                        facts[ip] = data
                    master = _read_json(root / f"master.{ip}.json")
                    if master:
                        facts.setdefault(ip, {})
                        for k in ("local_master", "local_master_ip", "http_ok", "auth_fail", "is_elected"):
                            if k in master and master[k] is not None:
                                facts[ip].setdefault(k, master[k])
            
                raw = _read_signals(root)
                extra, meta = cross_compare(facts, len(expected_ips), expected_ips)
                if profile.endswith("degraded") and meta["coverage"] == "ok":
                    meta["coverage"] = "degraded"
                    meta["evidence_gap"].append("forced_degraded_profile")
                merged = _dedup(raw + extra)
                health = {}
                for ip in expected_ips:
                    h = (facts.get(ip) or {}).get("cluster_health")
                    if isinstance(h, dict) and h:
                        health = h
                        if facts[ip].get("is_elected"):
                            break
            
                kinds = ("precheck", "metrics", "status", "config", "logs", "hostnet")
                found = sum(1 for k in kinds if any(root.glob(f"{k}.*.txt")))
                if found == 0 and meta["coverage"] == "ok":
                    meta["coverage"] = "empty"
                elif found < 3 and meta["coverage"] == "ok":
                    meta["coverage"] = "degraded"
            
                summary = render_summary(run_id, expected_ips, facts, merged, meta, health)
                (root / "summary.md").write_text(summary, encoding="utf-8")
                sig_txt = "".join(f"{a}\t{b}\t{c}\n" for a, b, c in merged)
                (root / "signals.txt").write_text(sig_txt, encoding="utf-8")
                (root / "signals.uniq.tsv").write_text(sig_txt, encoding="utf-8")
            
                cleaned_parts = [
                    f"===== ES_TS cleaned run_id={run_id} profile={profile} =====",
                    f"nodes={','.join(expected_ips)}",
                    f"coverage={meta['coverage']} majority_master={meta.get('majority_master')}",
                    "",
                    "----- SIGNALS -----",
                    sig_txt or "NO_SIGNALS",
                    "",
                ]
                for p in sorted(root.glob("*.txt")):
                    if p.name in {"cleaned.txt", "signals.txt"}:
                        continue
                    body = p.read_text(encoding="utf-8", errors="replace")
                    lines = body.splitlines()
                    keep = [ln for ln in lines if ln.startswith("SIGNAL ") or ln.startswith("CMD_FAIL") or "KEYWORD" in ln]
                    if not keep:
                        keep = lines[-40:]
                    cleaned_parts.append(f"### {p.name} ###")
                    cleaned_parts.extend(keep[:80])
                    cleaned_parts.append("")
                cleaned = "\n".join(cleaned_parts)
                if len(cleaned.encode()) > 64000:
                    cleaned = cleaned.encode()[:64000].decode("utf-8", errors="ignore")
                (root / "cleaned.txt").write_text(cleaned, encoding="utf-8")
                meta_out = {
                    "run_id": run_id,
                    "profile": profile,
                    "coverage_status": meta["coverage"],
                    "nodes_collected": meta["nodes_collected"],
                    "expected_nodes": meta["expected_nodes"],
                    "majority_master": meta.get("majority_master") or "",
                    "no_master": str(bool(meta.get("no_master"))).lower(),
                    "signal_count": len(merged),
                    "kinds_found": found,
                }
                meta_txt = "".join(f"{k}={v}\n" for k, v in meta_out.items())
                (root / "cleaned.meta").write_text(meta_txt, encoding="utf-8")
                return {"meta": meta_out, "signals": merged, "summary": summary}
            
            
            def _cli(argv: list[str]) -> int:
                if len(argv) < 2:
                    print("usage: es_lib.py parse-master|parse-stats|parse-health|merge-facts|cleanse ...", file=sys.stderr)
                    return 2
                cmd = argv[1]
                if cmd == "parse-master":
                    print(json.dumps(parse_cat_master(sys.stdin.read()), ensure_ascii=False))
                    return 0
                if cmd == "parse-stats":
                    print(json.dumps(parse_local_stats(sys.stdin.read()), ensure_ascii=False))
                    return 0
                if cmd == "parse-health":
                    print(json.dumps(parse_cluster_health(sys.stdin.read()), ensure_ascii=False))
                    return 0
                if cmd == "parse-nodes":
                    local_ip = argv[2] if len(argv) > 2 else ""
                    print(json.dumps(parse_cat_nodes(sys.stdin.read(), local_ip), ensure_ascii=False))
                    return 0
                if cmd == "merge-facts":
                    path = argv[2]
                    updates = json.loads(argv[3] if len(argv) > 3 else sys.stdin.read())
                    print(json.dumps(merge_facts(path, updates), ensure_ascii=False))
                    return 0
                if cmd == "cleanse":
                    base, run_id = argv[2], argv[3]
                    ips = argv[4:]
                    profile = os.environ.get("TS_PROFILE", "v1")
                    result = cleanse(base, run_id, ips, profile)
                    print(json.dumps(result["meta"], ensure_ascii=False))
                    return 0
                print("unknown command", cmd, file=sys.stderr)
                return 2
            
            
            if __name__ == "__main__":
                sys.exit(_cli(sys.argv))
            ES_TS_LIB_PY
            # Shared helpers for ES 7.x troubleshooting collectors. Sourced, not executed.
            # Collectors always exit 0. Do not mutate the cluster.
            
            umask 077
            
            json_escape() {
              local s=${1-}
              s=${s//\\/\\\\}
              s=${s//\"/\\\"}
              s=${s//$'\n'/\\n}
              s=${s//$'\r'/\\r}
              s=${s//$'\t'/\\t}
              printf '%s' "$s"
            }
            
            ts_now() { date -u +"%Y-%m-%dT%H:%M:%SZ"; }
            
            resolve_local_ip() {
              local node1=$1 node2=$2 node3=$3
              local local_ips target_ip=""
              local_ips=$(hostname -I 2>/dev/null || true)
              for ip in "$node1" "$node2" "$node3"; do
                [[ " ${local_ips} " == *" ${ip} "* ]] && target_ip=$ip && break
              done
              if [[ -z "$target_ip" ]]; then
                target_ip=$(hostname -I 2>/dev/null | awk '{print $1}')
              fi
              printf '%s' "${target_ip:-unknown}"
            }
            
            artifact_dir_for() {
              local run_id=$1
              local base=${TS_ARTIFACT_DIR:-/tmp/es-troubleshoot}
              printf '%s/%s' "$base" "$run_id"
            }
            
            es_lib_py() {
              local here=${SCRIPT_DIR:-}
              if [[ -n "$here" && -f "${here}/es_lib.py" ]]; then
                printf '%s' "${here}/es_lib.py"
                return 0
              fi
              if [[ -f /tmp/es-ts-lib/es_lib.py ]]; then
                printf '%s' /tmp/es-ts-lib/es_lib.py
                return 0
              fi
              return 1
            }
            
            begin_artifact() {
              local kind=$1 node=$2 run_id=$3
              ARTIFACT_KIND=$kind
              ARTIFACT_NODE=$node
              ARTIFACT_RUN_ID=$run_id
              ARTIFACT_DIR=$(artifact_dir_for "$run_id")
              mkdir -p "$ARTIFACT_DIR"
              ARTIFACT_FILE="${ARTIFACT_DIR}/${kind}.${node}.txt"
              SIGNAL_FILE="${ARTIFACT_DIR}/${kind}.${node}.signals"
              FACTS_FILE="${ARTIFACT_DIR}/facts.${node}.json"
              MASTER_FILE="${ARTIFACT_DIR}/master.${node}.json"
              : > "$ARTIFACT_FILE"
              : > "$SIGNAL_FILE"
              {
                echo "===== ES_TS artifact=${kind} node=${node} ts=$(ts_now) run_id=${run_id} ====="
                echo "hostname=$(hostname 2>/dev/null || echo unknown)"
              } >> "$ARTIFACT_FILE"
            }
            
            emit() {
              printf '%s\n' "$*" >> "$ARTIFACT_FILE"
            }
            
            emit_cmd() {
              local title=$1
              local rc=0
              shift
              emit "----- ${title} -----"
              "$@" >> "$ARTIFACT_FILE" 2>&1
              rc=$?
              if (( rc != 0 )); then
                emit "CMD_FAIL: ${title} rc=${rc}"
                return 1
              fi
              return 0
            }
            
            emit_cmd_timeout() {
              local seconds=$1 title=$2
              shift 2
              emit "----- ${title} (timeout ${seconds}s) -----"
              if command -v timeout >/dev/null 2>&1; then
                if ! timeout "$seconds" "$@" >> "$ARTIFACT_FILE" 2>&1; then
                  emit "CMD_FAIL_OR_TIMEOUT: ${title}"
                  signal ES174 low "timeout ${title}"
                  return 1
                fi
              else
                if ! "$@" >> "$ARTIFACT_FILE" 2>&1; then
                  emit "CMD_FAIL: ${title}"
                  return 1
                fi
              fi
              return 0
            }
            
            signal() {
              printf '%s\t%s\t%s\n' "$1" "$2" "$3" >> "$SIGNAL_FILE"
              emit "SIGNAL ${1} severity=${2} ${3}"
            }
            
            finish_artifact() {
              emit "===== END ES_TS artifact=${ARTIFACT_KIND} node=${ARTIFACT_NODE} ====="
              echo "###ES_TS_ARTIFACT kind=${ARTIFACT_KIND} node=${ARTIFACT_NODE} file=${ARTIFACT_FILE}###"
              cat "$ARTIFACT_FILE"
              echo "###ES_TS_SIGNALS kind=${ARTIFACT_KIND} node=${ARTIFACT_NODE}###"
              cat "$SIGNAL_FILE"
              echo "###END_ES_TS_ARTIFACT###"
            }
            
            es_curl() {
              # es_curl <seconds> <url> [curl extra...]
              local seconds=$1
              shift
              local url=$1
              shift
              local args=(-sS --max-time "$seconds" --connect-timeout 3 -H 'Accept: application/json')
              if [[ -n "${ES_USER:-}" ]]; then
                args+=(-u "${ES_USER}:${ES_PASS:-}")
              fi
              curl "${args[@]}" "$@" "$url" 2>/dev/null
            }
            
            es_base_url() {
              printf 'http://127.0.0.1:%s' "${ES_HTTP_PORT:-9200}"
            }
            
            facts_merge() {
              local json=$1
              local py
              py=$(es_lib_py) || return 0
              python3 "$py" merge-facts "$FACTS_FILE" "$json" >/dev/null 2>&1 || true
            }
            
            record_local_master() {
              local url
              url="$(es_base_url)/_cat/master?h=id,host,ip,node&format=json"
              local body rc=0
              body=$(es_curl 3 "$url" -w '\nHTTP_CODE:%{http_code}\n') || rc=$?
              local code
              code=$(printf '%s\n' "$body" | awk -F: '/HTTP_CODE:/{print $2}' | tail -n1)
              local json
              json=$(printf '%s\n' "$body" | sed '/HTTP_CODE:/d')
              emit "----- local _cat/master http=${code:-na} rc=${rc} -----"
              emit "$json"
            
              local parsed="{}"
              local py
              py=$(es_lib_py) || true
              if [[ -n "$py" ]]; then
                parsed=$(printf '%s' "$json" | python3 "$py" parse-master 2>/dev/null || echo '{}')
              fi
              local http_ok=false auth_fail=false local_master="" local_ip=""
              if [[ "$code" == "401" || "$code" == "403" ]]; then
                auth_fail=true
                signal ES032 high "local HTTP auth failed code=${code}"
              elif [[ "$code" == "200" ]]; then
                http_ok=true
              else
                signal ES032 medium "local _cat/master failed code=${code:-na} rc=${rc}"
              fi
              if [[ "$http_ok" == true ]]; then
                local_master=$(python3 -c 'import json,sys; d=json.loads(sys.argv[1]); print(d.get("local_master",""))' "$parsed" 2>/dev/null || true)
                local_ip=$(python3 -c 'import json,sys; d=json.loads(sys.argv[1]); print(d.get("local_master_ip",""))' "$parsed" 2>/dev/null || true)
              fi
              emit "local_master=${local_master}"
              emit "local_master_ip=${local_ip}"
            
              local nodes_json=""
              nodes_json=$(es_curl 3 "$(es_base_url)/_cat/nodes?h=id,name,ip,master,node.role&format=json" || true)
              emit "----- local _cat/nodes -----"
              emit "$nodes_json"
              local self_elected=false
              if [[ -n "$py" && -n "$nodes_json" ]]; then
                local nodes_parsed
                nodes_parsed=$(printf '%s' "$nodes_json" | python3 "$py" parse-nodes "$ARTIFACT_NODE" 2>/dev/null || echo '{}')
                if python3 -c 'import json,sys; raise SystemExit(0 if json.loads(sys.argv[1]).get("self_elected") else 1)' "$nodes_parsed" 2>/dev/null; then
                  self_elected=true
                fi
              fi
              if [[ "$self_elected" != true && -n "$local_ip" && "$local_ip" == "$ARTIFACT_NODE" ]]; then
                self_elected=true
              fi
              emit "is_elected=${self_elected}"
            
              mkdir -p "$ARTIFACT_DIR"
              python3 - "$MASTER_FILE" "$ARTIFACT_NODE" "$local_master" "$local_ip" "$http_ok" "$auth_fail" "$self_elected" <<'PY' 2>/dev/null || true
            import json,sys
            path, node, lm, lip, http_ok, auth, elected = sys.argv[1:8]
            doc = {
              "node": node,
              "local_master": lm,
              "local_master_ip": lip,
              "http_ok": http_ok == "true",
              "auth_fail": auth == "true",
              "is_elected": elected == "true",
            }
            open(path,"w",encoding="utf-8").write(json.dumps(doc, ensure_ascii=False, indent=2)+"\n")
            PY
              facts_merge "$(python3 -c 'import json,sys; print(json.dumps({"local_master":sys.argv[1],"local_master_ip":sys.argv[2],"http_ok":sys.argv[3]=="true","auth_fail":sys.argv[4]=="true","is_elected":sys.argv[5]=="true","node":sys.argv[6]}))' \
                "$local_master" "$local_ip" "$http_ok" "$auth_fail" "$self_elected" "$ARTIFACT_NODE")"
              if [[ "$self_elected" == true ]]; then
                IS_ELECTED=1
              else
                IS_ELECTED=0
              fi
            }
            
            listen_port() {
              local port=$1
              if command -v ss >/dev/null 2>&1; then
                ss -lnt 2>/dev/null | awk '{print $4}' | grep -q ":${port}$"
                return $?
              fi
              netstat -lnt 2>/dev/null | grep -q ":${port} "
            }
            
            tcp_probe() {
              local host=$1 port=$2
              if timeout 2 bash -c "echo >/dev/tcp/${host}/${port}" 2>/dev/null; then
                return 0
              fi
              if command -v nc >/dev/null 2>&1; then
                nc -z -w 2 "$host" "$port" >/dev/null 2>&1 && return 0
              fi
              return 1
            }
            
            es_process_up() {
              # Character class so pgrep does not match its own argv.
              pgrep -f '[o]rg.elasticsearch.bootstrap.Elasticsearch' >/dev/null 2>&1 && return 0
              pgrep -x elasticsearch >/dev/null 2>&1 && return 0
              return 1
            }
            # AI 诊断：最后一节点。端点空、HTTP 失败、超时、空响应 → 本节点非 0 退出。
            # 清洗产物必须已经存在；失败不影响 summary.md。
            set -uo pipefail
            
            node1=${1:-}
            node2=${2:-}
            node3=${3:-}
            _http=${4:-9200}
            _transport=${5:-9300}
            run_id=${6:-manual}
            profile=${7:-v1}
            ai_endpoint=${8:-${ES_AI_ENDPOINT:-}}
            ES_USER=${9:-${ES_USER:-}}
            ES_PASS=${10:-${ES_PASS:-}}
            
            base=$(artifact_dir_for "$run_id")
            mkdir -p "$base"
            prompt="${base}/ai_prompt.md"
            diagnosis="${base}/ai_diagnosis.md"
            summary="${base}/summary.md"
            cleaned="${base}/cleaned.txt"
            signals="${base}/signals.txt"
            meta="${base}/cleaned.meta"
            
            coverage=unknown
            if [[ -f "$meta" ]]; then
              coverage=$(awk -F= '$1=="coverage_status"{print $2}' "$meta")
            fi
            
            catalog_hint() {
              cat <<'EOF'
            将根因映射到下列 ES 场景 ID（可多选，按置信度）。禁止编造未出现的指标。
            禁止在未满足「三台都采到且都无 master」时写集群没有 master。
            ES001 基线
            ES010 CPU ES011 内存 ES012 swap ES013 FD ES014 时钟 ES015 磁盘满 ES016 inode ES017 磁盘延迟 ES018 iowait
            ES030 进程不在 ES031 9200未监听 ES032 本地HTTP失败 ES033 fatal ES034 heap/OOM ES035 GC ES036 write reject ES037 search reject ES038 breaker ES039 反复重启
            ES050 三台均无主 ES051 master视图不一致 ES052 掉1节点 ES053 掉≥2/红无主 ES054 主分片未分配 ES055 delayed ES056 pending tasks ES057 relocating卡住 ES058 allocation.enable ES059 max_shards ES060 cluster.name ES061 DECIDERS_NO disk ES062 DECIDERS_NO filter ES063 ALLOCATION_FAILED
            ES070 flood-stage ES071 read_only_allow_delete ES072 high watermark ES073 path.data权限
            ES090 ping失败 ES091 9200通9300不通 ES092 9300通9200不通 ES093 重传 ES094 防火墙
            ES110 zen.minimum_master_nodes残留 ES111 seed_hosts不全 ES112 Xms≠Xmx ES113 watermark过激 ES114 端口不一致
            ES170 预检失败 ES171 工具缺失 ES172 节点不可达 ES173 部分采集失败 ES174 命令超时
            ES190 NODE_DOWN_ONE ES191 NO_MASTER ES192 YELLOW_ALLOC_NOT_DOWN ES193 HEAP_ONE_OUTLIER ES194 HEAP_ALL_SIMILAR ES195 REJECT_ONE ES196 REJECT_ALL ES197 FLOOD_ONE ES198 FLOOD_ALL ES199 TRANSPORT_PARTITION
            EOF
            }
            
            {
              echo "# Elasticsearch 7.x 三节点排障 AI Prompt"
              echo
              echo "你是资深 Elasticsearch SRE。集群为 **7.x 三节点全角色**，默认副本 1，HTTP 9200 / transport 9300。"
              echo "本流程 **只诊断、不变更**：不要建议脚本去 reroute、取消块、重启、等待选举。"
              echo "输出 Markdown："
              echo
              echo "## 根因假设（按置信度）"
              echo "## 关键证据"
              echo "## 影响面（集群可用性 / 写入 / 查询 / 数据风险）"
              echo "## 立即止损（不自动执行）"
              echo "## 验证步骤"
              echo "## 证据缺口（5 分钟未做项）"
              echo
              echo "硬约束：有 ES191 先打选举/发现/传输；有 ES192 禁止写成节点掉了；有 ES193/195/197 禁止写成全集群；有 ES199 必须提 9300。"
              echo
              catalog_hint
              echo
              echo "## 清洗摘要"
              echo
              if [[ -f "$summary" ]]; then
                cat "$summary"
              else
                echo "（无 summary.md，清洗节点可能失败）"
              fi
              echo
              echo "## 去重信号"
              echo
              if [[ -s "$signals" ]]; then
                cat "$signals"
              else
                echo "NO_SIGNALS"
              fi
              echo
              echo "## 清洗正文（截断）"
              echo
              echo '```'
              if [[ -f "$cleaned" ]]; then
                head -c 32000 "$cleaned"
              else
                echo "CLEANED_MISSING"
              fi
              echo
              echo '```'
            } > "$prompt"
            
            fail_ai() {
              local reason=$1
              {
                echo "# ES 排障 AI 节点失败"
                echo
                echo "- run_id: \`${run_id}\`"
                echo "- profile: \`${profile}\`"
                echo "- coverage: \`${coverage}\`"
                echo "- reason: \`${reason}\`"
                echo
                echo "清洗节点 \`summary.md\` 仍可展示。本节点按设计失败。"
                echo
                echo "prompt: \`${prompt}\`"
              } > "$diagnosis"
              echo "###ES_TS_AI_DIAGNOSIS run_id=${run_id} ai=fail reason=${reason}###" >&2
              cat "$diagnosis" >&2
              echo "###END_ES_TS_AI_DIAGNOSIS###" >&2
              echo "$reason" >&2
              exit 1
            }
            
            if [[ -z "$ai_endpoint" ]]; then
              fail_ai "ai_endpoint_empty"
            fi
            if ! command -v curl >/dev/null 2>&1; then
              fail_ai "curl_missing"
            fi
            if [[ ! -f "$summary" ]]; then
              fail_ai "summary_missing"
            fi
            
            payload="${base}/ai_request.json"
            python3 - "$prompt" "$payload" <<'PY' || fail_ai "payload_build_failed"
            import json, sys, pathlib
            prompt = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace")
            pathlib.Path(sys.argv[2]).write_text(json.dumps({
                "model": "es-sre",
                "messages": [
                    {"role": "system", "content": "You are an Elasticsearch SRE. Reply in Chinese markdown. Diagnose only; do not mutate the cluster."},
                    {"role": "user", "content": prompt[:180000]},
                ],
            }, ensure_ascii=False), encoding="utf-8")
            PY
            
            if ! curl -fsS -m 45 -H 'Content-Type: application/json' -d @"$payload" "$ai_endpoint" \
                > "${base}/ai_raw.json" 2>"${base}/ai_curl.err"; then
              fail_ai "http_error"
            fi
            
            if [[ ! -s "${base}/ai_raw.json" ]]; then
              fail_ai "empty_response"
            fi
            
            python3 - "${base}/ai_raw.json" "$diagnosis" "$run_id" "$profile" "$coverage" <<'PY' || fail_ai "parse_failed"
            import json, sys, pathlib
            raw_path, out_path, run_id, profile, coverage = sys.argv[1:6]
            raw = pathlib.Path(raw_path).read_text(encoding="utf-8", errors="replace")
            text = raw
            try:
                data = json.loads(raw)
                if isinstance(data, dict):
                    if "choices" in data:
                        text = data["choices"][0]["message"]["content"]
                    elif "content" in data:
                        text = data["content"]
                    elif "output" in data:
                        text = data["output"]
            except Exception:
                pass
            text = str(text).strip()
            if not text:
                raise SystemExit(2)
            body = "\n".join([
                "# ES 排障诊断输出",
                "",
                f"- run_id: `{run_id}`",
                f"- profile: `{profile}`",
                f"- coverage: `{coverage}`",
                f"- ai_endpoint_status: `ok`",
                "",
                text,
                "",
            ])
            pathlib.Path(out_path).write_text(body, encoding="utf-8")
            PY
            
            echo "###ES_TS_AI_DIAGNOSIS run_id=${run_id} ai=ok###"
            cat "$diagnosis"
            echo "###END_ES_TS_AI_DIAGNOSIS###"
            exit 0
        job_ip_list:
          value: "${es_node1_ip}"
        job_rolling_config:
          value:
            job_rolling_execute: []
            job_rolling_expression: ''
            job_rolling_mode: 1
        job_script_list_general:
          value: ''
        job_script_list_public:
          value: ''
        job_script_param:
          value: "'${es_node1_ip}' '${es_node2_ip}' '${es_node3_ip}' '${es_http_port}' '${es_transport_port}' '${ts_run_id}' 'v2' '${es_ai_endpoint}' '${es_user}' '${es_pass}'"
        job_script_source:
          value: manual
        job_script_timeout:
          value: '60'
        job_script_type:
          value: '1'
        job_success_id:
          value: ''
    auto_retry:
      enable: false
      times: 1
      interval: 0
    ignore_error: false
    can_retry: true
    can_skip: false
    optional: false
    next:
    - es-ts_end
  - id: es-ts_end
    type: EmptyEndEvent
  constants:
    "${es_node1_ip}":
      name: ES节点1 IP
      value: 10.10.26.144
      type: input
      validation: ^[0-9.]+$
    "${es_node2_ip}":
      name: ES节点2 IP
      value: 10.10.26.145
      type: input
      validation: ^[0-9.]+$
    "${es_node3_ip}":
      name: ES节点3 IP
      value: 10.10.26.146
      type: input
      validation: ^[0-9.]+$
    "${es_node_ips}":
      name: ES三节点IP列表
      value: 10.10.26.144,10.10.26.145,10.10.26.146
      type: input
      validation: ^[0-9.,]+$
    "${es_http_port}":
      name: HTTP端口
      value: 9200
      type: input
      validation: ^[0-9]+$
    "${es_transport_port}":
      name: Transport端口
      value: 9300
      type: input
      validation: ^[0-9]+$
    "${es_data_dir}":
      name: path.data
      value: /var/lib/elasticsearch
      type: input
      validation: ^/.+
    "${es_log_dir}":
      name: 日志目录
      value: /var/log/elasticsearch
      type: input
      validation: ^/.+
    "${es_user}":
      name: 可选basic用户(可空)
      value: 
      type: input
      validation: .*
    "${es_pass}":
      name: 可选basic密码(可空,勿提交Git)
      value: 
      type: input
      validation: .*
    "${ts_run_id}":
      name: 排障流水号
      value: manual
      type: input
      validation: ^[A-Za-z0-9._-]+$
    "${ts_log_window_lines}":
      name: 日志抽取行数
      value: 8000
      type: input
      validation: ^[0-9]+$
    "${ts_profile}":
      name: 流程版本
      value: v2
      type: input
      validation: ^(v1|v2|v2-degraded)$
    "${es_ai_endpoint}":
      name: AI诊断HTTP端点(必填,失败则AI节点失败)
      value: 
      type: input
      validation: .*
    "${ts_artifact_dir}":
      name: 采集产物目录
      value: /tmp/es-troubleshoot
      type: input
      validation: ^/.+
