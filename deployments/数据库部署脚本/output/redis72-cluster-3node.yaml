# Redis 7.2 Cluster 三主（3 节点）二进制部署流程
# 部署方式：各节点执行 shell 脚本；从 Redis 官方开源地址下载源码包编译安装
# 拓扑：172.30.0.11 / .12 / .13 各为一个 master shard（--cluster-replicas 0）
# 默认密码：Redis@1314
# 定位：自动化测试用标准集群（不要求 HA）

apiVersion: dbauto/v1
kind: RedisClusterDeployment
metadata:
  name: redis72-cluster-3node
  redis_version: "7.2.16"
  topology: redis-cluster
  deploy_mode: binary

parameters:
  redis_password:
    description: Redis 集群认证密码（requirepass / masterauth）
    default: "Redis@1314"
  redis_port:
    description: Redis 服务端口
    default: 6379
  cluster_bus_port:
    description: Cluster 总线端口（服务端口 + 10000）
    default: 16379
  cluster_node_timeout_ms:
    description: 集群节点超时（毫秒）
    default: 15000
  cluster_replicas:
    description: 每个 master 的 replica 数；三主零从填 0
    default: 0
  install_prefix:
    description: 二进制安装目录
    default: "/opt/redis/7.2.16"
  wait_timeout_sec:
    description: 等待各节点就绪超时（秒）
    default: 120

packages:
  redis:
    version: "7.2.16"
    format: tarball-source
    tarball_url: https://download.redis.io/releases/redis-7.2.16.tar.gz
    tarball_sha256: 960a8ec15e34ff40e57ff16837b26b33bd81f2da6d24497bb63de532a323a18e
    hash_index_url: https://github.com/redis/redis-hashes
    github_release_url: https://github.com/redis/redis/releases/tag/7.2.16
    github_source_tarball: https://github.com/redis/redis/archive/refs/tags/7.2.16.tar.gz
    stable_tarball_url: https://download.redis.io/redis-stable.tar.gz
    install_method: compile
    install_prefix: "{{ params.install_prefix }}"
    build_deps:
      - gcc
      - make
      - tcl
      - wget
      - curl
      - tar

hosts:
  - ip: 172.30.0.11
    role: cluster-node
    node_id: node-11
  - ip: 172.30.0.12
    role: cluster-node
    node_id: node-12
  - ip: 172.30.0.13
    role: cluster-node
    node_id: node-13

scripts_dir: deployments/数据库部署脚本/scripts/redis72-cluster-3node

phases:
  - name: 环境预检
    run_on: all
    script: "{{ scripts_dir }}/01-precheck.sh"
    env:
      REDIS_PORT: "{{ params.redis_port }}"
      CLUSTER_BUS_PORT: "{{ params.cluster_bus_port }}"

  - name: 内核参数
    run_on: all
    script: "{{ scripts_dir }}/02-sysctl.sh"

  - name: 防火墙放行
    description: 本机放行 6379/16379（firewalld 或 ufw）
    run_on: all
    script: "{{ scripts_dir }}/03-network-firewall.sh"
    env:
      REDIS_PORT: "{{ params.redis_port }}"
      CLUSTER_BUS_PORT: "{{ params.cluster_bus_port }}"

  - name: 下载编译安装二进制
    run_on: all
    script: "{{ scripts_dir }}/04-install-binary.sh"
    env:
      REDIS_VERSION: "{{ packages.redis.version }}"
      REDIS_TARBALL_URL: "{{ packages.redis.tarball_url }}"
      REDIS_TARBALL_SHA256: "{{ packages.redis.tarball_sha256 }}"
      INSTALL_PREFIX: "{{ params.install_prefix }}"

  - name: 生成配置与 systemd
    run_on: all
    script: "{{ scripts_dir }}/05-configure.sh"
    env:
      REDIS_VERSION: "{{ packages.redis.version }}"
      INSTALL_PREFIX: "{{ params.install_prefix }}"
      REDIS_PASSWORD: "{{ params.redis_password }}"
      REDIS_PORT: "{{ params.redis_port }}"
      CLUSTER_BUS_PORT: "{{ params.cluster_bus_port }}"
      CLUSTER_NODE_TIMEOUT_MS: "{{ params.cluster_node_timeout_ms }}"
      NODE_IP: "{{ host.ip }}"

  - name: 启动 redis-server
    run_on: all
    script: "{{ scripts_dir }}/06-start.sh"

  - name: 等待全部节点就绪
    description: 从 11 检查三节点 6379/16379 连通与 PING
    run_on: 172.30.0.11
    script: "{{ scripts_dir }}/07-wait-nodes.sh"
    env:
      REDIS_VERSION: "{{ packages.redis.version }}"
      INSTALL_PREFIX: "{{ params.install_prefix }}"
      REDIS_PASSWORD: "{{ params.redis_password }}"
      REDIS_PORT: "{{ params.redis_port }}"
      CLUSTER_BUS_PORT: "{{ params.cluster_bus_port }}"
      WAIT_TIMEOUT_SEC: "{{ params.wait_timeout_sec }}"
      NODE1: 172.30.0.11
      NODE2: 172.30.0.12
      NODE3: 172.30.0.13

  - name: 创建三主集群
    run_on: 172.30.0.11
    script: "{{ scripts_dir }}/08-cluster-create.sh"
    env:
      REDIS_VERSION: "{{ packages.redis.version }}"
      INSTALL_PREFIX: "{{ params.install_prefix }}"
      REDIS_PASSWORD: "{{ params.redis_password }}"
      REDIS_PORT: "{{ params.redis_port }}"
      CLUSTER_REPLICAS: "{{ params.cluster_replicas }}"
      NODE1: 172.30.0.11
      NODE2: 172.30.0.12
      NODE3: 172.30.0.13

  - name: 部署验收
    run_on: all
    script: "{{ scripts_dir }}/09-verify.sh"
    env:
      REDIS_VERSION: "{{ packages.redis.version }}"
      INSTALL_PREFIX: "{{ params.install_prefix }}"
      REDIS_PASSWORD: "{{ params.redis_password }}"
      REDIS_PORT: "{{ params.redis_port }}"
      NODE1: 172.30.0.11

# 手工部署顺序（三台 01-06，11 上 07-08，三台 09）：
# export REDIS_PASSWORD='Redis@1314'
# bash 01-precheck.sh && bash 02-sysctl.sh && bash 03-network-firewall.sh
# bash 04-install-binary.sh && bash 05-configure.sh && bash 06-start.sh
# # 172.30.0.11：
# bash 07-wait-nodes.sh && bash 08-cluster-create.sh
# # 三台：
# bash 09-verify.sh
