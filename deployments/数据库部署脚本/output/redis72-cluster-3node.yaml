# Redis 7.2 Cluster 三主（3 节点）二进制部署流程
# 部署方式：各节点执行 shell 脚本；从 Redis 官方开源地址下载源码包编译安装
# 拓扑：172.30.0.11 / .12 / .13 各为一个 master shard（--cluster-replicas 0）
# 默认密码：Redis@1314

apiVersion: dbauto/v1
kind: RedisClusterDeployment
metadata:
  name: redis72-cluster-3node
  redis_version: "7.2.16"
  topology: redis-cluster
  deploy_mode: binary

parameters:
  redis_password:
    description: Redis 集群认证密码（requirepass / masterauth）
    default: "Redis@1314"
  redis_port:
    description: Redis 服务端口
    default: 6379
  cluster_bus_port:
    description: Cluster 总线端口（服务端口 + 10000）
    default: 16379
  cluster_node_timeout_ms:
    description: 集群节点超时（毫秒）
    default: 15000
  cluster_replicas:
    description: 每个 master 的 replica 数；三主零从填 0
    default: 0
  install_prefix:
    description: 二进制安装目录
    default: "/opt/redis/7.2.16"

# 官方开源部署包地址（Redis 官方仅发布源码 tar.gz，各节点下载后本地 make install）
packages:
  redis:
    version: "7.2.16"
    format: tarball-source
    tarball_url: https://download.redis.io/releases/redis-7.2.16.tar.gz
    tarball_sha256: 960a8ec15e34ff40e57ff16837b26b33bd81f2da6d24497bb63de532a323a18e
    hash_index_url: https://github.com/redis/redis-hashes
    github_release_url: https://github.com/redis/redis/releases/tag/7.2.16
    github_source_tarball: https://github.com/redis/redis/archive/refs/tags/7.2.16.tar.gz
    stable_tarball_url: https://download.redis.io/redis-stable.tar.gz
    install_method: compile
    install_prefix: "{{ params.install_prefix }}"
    build_deps:
      - gcc
      - make
      - tcl
      - wget
      - curl
      - tar

hosts:
  - ip: 172.30.0.11
    role: cluster-node
    node_id: node-11
  - ip: 172.30.0.12
    role: cluster-node
    node_id: node-12
  - ip: 172.30.0.13
    role: cluster-node
    node_id: node-13

# 脚本目录（随 YAML 一起下发到各节点后执行）
scripts_dir: deployments/数据库部署脚本/scripts/redis72-cluster-3node

phases:
  - name: 环境预检
    run_on: all
    script: "{{ scripts_dir }}/01-precheck.sh"
    env:
      REDIS_PORT: "{{ params.redis_port }}"
      CLUSTER_BUS_PORT: "{{ params.cluster_bus_port }}"

  - name: 下载编译安装二进制
    description: >
      从 packages.redis.tarball_url 下载官方 tar.gz，
      校验 SHA256 后在各节点编译安装到 install_prefix。
    run_on: all
    script: "{{ scripts_dir }}/02-install-binary.sh"
    env:
      REDIS_VERSION: "{{ packages.redis.version }}"
      REDIS_TARBALL_URL: "{{ packages.redis.tarball_url }}"
      REDIS_TARBALL_SHA256: "{{ packages.redis.tarball_sha256 }}"
      INSTALL_PREFIX: "{{ params.install_prefix }}"

  - name: 生成配置与 systemd
    run_on: all
    script: "{{ scripts_dir }}/03-configure.sh"
    env:
      REDIS_VERSION: "{{ packages.redis.version }}"
      INSTALL_PREFIX: "{{ params.install_prefix }}"
      REDIS_PASSWORD: "{{ params.redis_password }}"
      REDIS_PORT: "{{ params.redis_port }}"
      CLUSTER_BUS_PORT: "{{ params.cluster_bus_port }}"
      CLUSTER_NODE_TIMEOUT_MS: "{{ params.cluster_node_timeout_ms }}"
      NODE_IP: "{{ host.ip }}"

  - name: 启动 redis-server
    run_on: all
    script: "{{ scripts_dir }}/04-start.sh"

  - name: 创建三主集群
    description: 仅在 172.30.0.11 执行 redis-cli --cluster create
    run_on: 172.30.0.11
    script: "{{ scripts_dir }}/05-cluster-create.sh"
    env:
      REDIS_VERSION: "{{ packages.redis.version }}"
      INSTALL_PREFIX: "{{ params.install_prefix }}"
      REDIS_PASSWORD: "{{ params.redis_password }}"
      REDIS_PORT: "{{ params.redis_port }}"
      CLUSTER_REPLICAS: "{{ params.cluster_replicas }}"
      NODE1: 172.30.0.11
      NODE2: 172.30.0.12
      NODE3: 172.30.0.13

  - name: 部署验收
    run_on: all
    script: "{{ scripts_dir }}/06-verify.sh"
    env:
      REDIS_VERSION: "{{ packages.redis.version }}"
      INSTALL_PREFIX: "{{ params.install_prefix }}"
      REDIS_PASSWORD: "{{ params.redis_password }}"
      REDIS_PORT: "{{ params.redis_port }}"

# 手工部署示例（三台分别执行 01-04，11 上再跑 05，最后三台跑 06）：
# export REDIS_PASSWORD='Redis@1314'
# bash 01-precheck.sh && bash 02-install-binary.sh && bash 03-configure.sh && bash 04-start.sh
# # 仅在 172.30.0.11：
# bash 05-cluster-create.sh
# # 三台：
# bash 06-verify.sh
