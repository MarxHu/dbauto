---
schema_version: v1
meta:
  name: Kafka KRaft三节点高可用部署
  id: kafka38-kraft
  description: 二进制安装Apache Kafka 3.8.1 KRaft三节点（broker+controller合一），副本因子3，min.insync.replicas=2；经本地模拟验证。
spec:
  nodes:
  - id: kafka38-kraft_node1
    type: EmptyStartEvent
    next:
    - kafka38-kraft_node2
  - id: kafka38-kraft_node2
    type: ServiceActivity
    name: 快速执行脚本
    stage_name: 环境预检
    component:
      code: job_fast_execute_script
      version: v1.2
      data:
        biz_cc_id:
          name: 业务
          value: ''
          key: "${biz_cc_id}"
          version: v1.2
          source_tag: job_fast_execute_script.biz_cc_id
        job_account:
          value: root
        job_content:
          value: |
            #!/bin/bash
            set -Eeuo pipefail
            umask 077
            node1=$1; node2=$2; node3=$3
            error() { echo "[ERROR][环境预检][$target_ip] $*" >&2; exit 1; }
            info() { echo "[INFO][环境预检][$target_ip] $*"; }
            local_ips=$(hostname -I 2>/dev/null) || error "无法读取本机IP"
            target_ip=""
            for ip in "$node1" "$node2" "$node3"; do
              [[ " $local_ips " == *" $ip "* ]] && target_ip=$ip && break
            done
            [[ -n "$target_ip" ]] || error "本机IP不在节点列表中: ${node1},${node2},${node3}"
            kafka_port="9092"
            controller_port="9093"
            nofile_min="65535"
            java_min_major="17"
            replication_factor=$4
            min_insync_replicas=$5
            required_commands="java curl tar sha512sum ss pgrep systemctl hostname"
            [[ $(id -u) -eq 0 ]] || error "必须由root作业账户执行"
            valid_ip() {
              local ip=$1 part
              [[ "$ip" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]] || return 1
              IFS=. read -r -a parts <<<"$ip"
              for part in "${parts[@]}"; do ((part >= 0 && part <= 255)) || return 1; done
            }
            for ip in "$node1" "$node2" "$node3"; do valid_ip "$ip" || error "节点IP非法: $ip"; done
            [[ "$node1" != "$node2" && "$node1" != "$node3" && "$node2" != "$node3" ]] || error "三节点IP必须互不相同"
            (( replication_factor >= 1 && replication_factor <= 3 )) || error "replication.factor=$replication_factor 应为1-3"
            (( min_insync_replicas >= 1 && min_insync_replicas < replication_factor )) || error "min.insync.replicas=$min_insync_replicas 必须 < replication.factor=$replication_factor"
            java_major=$(java -version 2>&1 | awk -F '[".]' '/version/ {print $2; exit}')
            [[ -n "$java_major" && "$java_major" -ge "$java_min_major" ]] || error "Java版本不满足 >= $java_min_major"
            read -r -a commands <<<"$required_commands"
            missing_commands=()
            for command in "${commands[@]}"; do command -v "$command" >/dev/null 2>&1 || missing_commands+=("$command"); done
            ((${#missing_commands[@]} == 0)) || error "缺少必需命令: ${missing_commands[*]}"
            for port in "$kafka_port" "$controller_port"; do
              ss -lnt | awk '{print $4}' | grep -q ":${port}$" && error "端口 ${port} 已被占用"
            done
            current_nofile=$(ulimit -n)
            (( current_nofile >= nofile_min )) || error "ulimit -n=${current_nofile}，需要 >= ${nofile_min}"
            pgrep -f 'kafka\.Kafka' >/dev/null 2>&1 && error "已存在 kafka 进程，请先清理"
            info "环境预检通过"
        job_ip_list:
          value: "${kafka_node_ips}"
        job_rolling_config:
          value:
            job_rolling_execute: []
            job_rolling_expression: ''
            job_rolling_mode: 1
        job_script_list_general:
          value: ''
        job_script_list_public:
          value: ''
        job_script_param:
          value: "'${kafka_node1_ip}' '${kafka_node2_ip}' '${kafka_node3_ip}' '${kafka_replication_factor}' '${kafka_min_insync_replicas}'"
        job_script_source:
          value: manual
        job_script_timeout:
          value: '1800'
        job_script_type:
          value: '1'
        job_success_id:
          value: ''
    auto_retry:
      enable: false
      times: 1
      interval: 0
    ignore_error: false
    can_retry: true
    can_skip: false
    optional: false
    next:
    - kafka38-kraft_node3
  - id: kafka38-kraft_node3
    type: ServiceActivity
    name: 快速执行脚本
    stage_name: 内核参数
    component:
      code: job_fast_execute_script
      version: v1.2
      data:
        biz_cc_id:
          name: 业务
          value: ''
          key: "${biz_cc_id}"
          version: v1.2
          source_tag: job_fast_execute_script.biz_cc_id
        job_account:
          value: root
        job_content:
          value: |
            #!/bin/bash
            set -Eeuo pipefail
            umask 077
            node1=$1; node2=$2; node3=$3
            error() { echo "[ERROR][内核参数][$target_ip] $*" >&2; exit 1; }
            info() { echo "[INFO][内核参数][$target_ip] $*"; }
            local_ips=$(hostname -I 2>/dev/null) || error "无法读取本机IP"
            target_ip=""
            for ip in "$node1" "$node2" "$node3"; do
              [[ " $local_ips " == *" $ip "* ]] && target_ip=$ip && break
            done
            [[ -n "$target_ip" ]] || error "本机IP不在节点列表中: ${node1},${node2},${node3}"
            mkdir -p /etc/sysctl.d
            cat > /etc/sysctl.d/99-kafka.conf <<'EOF'
            vm.max_map_count = 262144
            vm.swappiness = 1
            fs.file-max = 1000000
            EOF
            sysctl --system >/dev/null 2>&1 || sysctl -p /etc/sysctl.d/99-kafka.conf >/dev/null
            current=$(sysctl -n vm.max_map_count 2>/dev/null || echo 0)
            (( current >= 262144 )) || error "vm.max_map_count=${current}，需要 >= 262144"
            info "sysctl 配置完成"
        job_ip_list:
          value: "${kafka_node_ips}"
        job_rolling_config:
          value:
            job_rolling_execute: []
            job_rolling_expression: ''
            job_rolling_mode: 1
        job_script_list_general:
          value: ''
        job_script_list_public:
          value: ''
        job_script_param:
          value: "'${kafka_node1_ip}' '${kafka_node2_ip}' '${kafka_node3_ip}'"
        job_script_source:
          value: manual
        job_script_timeout:
          value: '600'
        job_script_type:
          value: '1'
        job_success_id:
          value: ''
    auto_retry:
      enable: false
      times: 1
      interval: 0
    ignore_error: false
    can_retry: true
    can_skip: false
    optional: false
    next:
    - kafka38-kraft_node4
  - id: kafka38-kraft_node4
    type: ServiceActivity
    name: 快速执行脚本
    stage_name: 防火墙放行
    component:
      code: job_fast_execute_script
      version: v1.2
      data:
        biz_cc_id:
          name: 业务
          value: ''
          key: "${biz_cc_id}"
          version: v1.2
          source_tag: job_fast_execute_script.biz_cc_id
        job_account:
          value: root
        job_content:
          value: |
            #!/bin/bash
            set -Eeuo pipefail
            umask 077
            node1=$1; node2=$2; node3=$3
            error() { echo "[ERROR][防火墙放行][$target_ip] $*" >&2; exit 1; }
            info() { echo "[INFO][防火墙放行][$target_ip] $*"; }
            local_ips=$(hostname -I 2>/dev/null) || error "无法读取本机IP"
            target_ip=""
            for ip in "$node1" "$node2" "$node3"; do
              [[ " $local_ips " == *" $ip "* ]] && target_ip=$ip && break
            done
            [[ -n "$target_ip" ]] || error "本机IP不在节点列表中: ${node1},${node2},${node3}"
            kafka_port=$4
            controller_port=$5
            open_firewall_port() {
              local port=$1
              if command -v firewall-cmd >/dev/null 2>&1 && systemctl is-active --quiet firewalld; then
                firewall-cmd --permanent --add-port="${port}/tcp" >/dev/null
                firewall-cmd --reload >/dev/null
                info "firewalld 已放行 ${port}/tcp"
              elif command -v ufw >/dev/null 2>&1 && ufw status | grep -qi active; then
                ufw allow "${port}/tcp" >/dev/null
                info "ufw 已放行 ${port}/tcp"
              else
                info "未检测到 active 的 firewalld/ufw，跳过本地防火墙配置"
              fi
            }
            open_firewall_port "$kafka_port"
            open_firewall_port "$controller_port"
            info "本机防火墙配置完成"
        job_ip_list:
          value: "${kafka_node_ips}"
        job_rolling_config:
          value:
            job_rolling_execute: []
            job_rolling_expression: ''
            job_rolling_mode: 1
        job_script_list_general:
          value: ''
        job_script_list_public:
          value: ''
        job_script_param:
          value: "'${kafka_node1_ip}' '${kafka_node2_ip}' '${kafka_node3_ip}' '${kafka_port}' '${kafka_controller_port}'"
        job_script_source:
          value: manual
        job_script_timeout:
          value: '600'
        job_script_type:
          value: '1'
        job_success_id:
          value: ''
    auto_retry:
      enable: false
      times: 1
      interval: 0
    ignore_error: false
    can_retry: true
    can_skip: false
    optional: false
    next:
    - kafka38-kraft_node5
  - id: kafka38-kraft_node5
    type: ServiceActivity
    name: 快速执行脚本
    stage_name: 下载解压安装
    component:
      code: job_fast_execute_script
      version: v1.2
      data:
        biz_cc_id:
          name: 业务
          value: ''
          key: "${biz_cc_id}"
          version: v1.2
          source_tag: job_fast_execute_script.biz_cc_id
        job_account:
          value: root
        job_content:
          value: |
            #!/bin/bash
            set -Eeuo pipefail
            umask 077
            node1=$1; node2=$2; node3=$3
            error() { echo "[ERROR][下载解压安装][$target_ip] $*" >&2; exit 1; }
            info() { echo "[INFO][下载解压安装][$target_ip] $*"; }
            local_ips=$(hostname -I 2>/dev/null) || error "无法读取本机IP"
            target_ip=""
            for ip in "$node1" "$node2" "$node3"; do
              [[ " $local_ips " == *" $ip "* ]] && target_ip=$ip && break
            done
            [[ -n "$target_ip" ]] || error "本机IP不在节点列表中: ${node1},${node2},${node3}"
            kafka_version=$4
            scala_version=$5
            tarball_url=$6
            tarball_sha512=$7
            install_prefix=$8
            work_dir="/tmp/kafka-install"
            if [[ -x "${install_prefix}/bin/kafka-server-start.sh" ]]; then
              info "已安装 ${install_prefix}/bin/kafka-server-start.sh，跳过"
              exit 0
            fi
            mkdir -p "$work_dir" "$(dirname "$install_prefix")"
            cd "$work_dir"
            tarball="kafka_${scala_version}-${kafka_version}.tgz"
            if [[ ! -f "$tarball" ]]; then
              info "下载 ${tarball_url}"
              curl -fsSL "$tarball_url" -o "$tarball"
            fi
            [[ -n "$tarball_sha512" ]] || error "未配置 tar.gz SHA512"
            tarball_sha512=$(echo "${tarball_sha512}" | tr '[:upper:]' '[:lower:]')
            echo "${tarball_sha512}  ${tarball}" | sha512sum -c -
            rm -rf "kafka_${scala_version}-${kafka_version}"
            tar -xzf "$tarball"
            src_dir="kafka_${scala_version}-${kafka_version}"
            [[ -d "$src_dir" ]] || error "解压后目录不存在: $src_dir"
            rm -rf "$install_prefix"
            mv "$src_dir" "$install_prefix"
            [[ -x "${install_prefix}/bin/kafka-server-start.sh" ]] || error "install 后缺少 kafka-server-start.sh"
            [[ -x "${install_prefix}/bin/kafka-storage.sh" ]] || error "install 后缺少 kafka-storage.sh"
            info "二进制安装完成: ${install_prefix}"
        job_ip_list:
          value: "${kafka_node_ips}"
        job_rolling_config:
          value:
            job_rolling_execute: []
            job_rolling_expression: ''
            job_rolling_mode: 1
        job_script_list_general:
          value: ''
        job_script_list_public:
          value: ''
        job_script_param:
          value: "'${kafka_node1_ip}' '${kafka_node2_ip}' '${kafka_node3_ip}' '${kafka_version}' '${kafka_scala_version}' '${kafka_tarball_url}' '${kafka_tarball_sha512}' '${kafka_install_prefix}'"
        job_script_source:
          value: manual
        job_script_timeout:
          value: '3600'
        job_script_type:
          value: '1'
        job_success_id:
          value: ''
    auto_retry:
      enable: false
      times: 1
      interval: 0
    ignore_error: false
    can_retry: true
    can_skip: false
    optional: false
    next:
    - kafka38-kraft_node6
  - id: kafka38-kraft_node6
    type: ServiceActivity
    name: 快速执行脚本
    stage_name: 生成配置与systemd
    component:
      code: job_fast_execute_script
      version: v1.2
      data:
        biz_cc_id:
          name: 业务
          value: ''
          key: "${biz_cc_id}"
          version: v1.2
          source_tag: job_fast_execute_script.biz_cc_id
        job_account:
          value: root
        job_content:
          value: |
            #!/bin/bash
            set -Eeuo pipefail
            umask 077
            node1=$1; node2=$2; node3=$3
            error() { echo "[ERROR][生成配置与systemd][$target_ip] $*" >&2; exit 1; }
            info() { echo "[INFO][生成配置与systemd][$target_ip] $*"; }
            local_ips=$(hostname -I 2>/dev/null) || error "无法读取本机IP"
            target_ip=""
            for ip in "$node1" "$node2" "$node3"; do
              [[ " $local_ips " == *" $ip "* ]] && target_ip=$ip && break
            done
            [[ -n "$target_ip" ]] || error "本机IP不在节点列表中: ${node1},${node2},${node3}"
            kafka_version=$4
            install_prefix=$5
            kafka_port=$6
            controller_port=$7
            replication_factor=$8
            min_insync_replicas=$9
            kafka_heap_opts=${10}
            conf_dir="/etc/kafka"
            data_dir="/var/lib/kafka/data"
            log_dir="/var/log/kafka"
            node_id=""
            case "$target_ip" in
              "$node1") node_id=1 ;;
              "$node2") node_id=2 ;;
              "$node3") node_id=3 ;;
              *) error "本机IP不在节点列表中" ;;
            esac
            voters="1@${node1}:${controller_port},2@${node2}:${controller_port},3@${node3}:${controller_port}"
            mkdir -p "$conf_dir" "$data_dir" "$log_dir"
            cat > "${conf_dir}/server.properties" <<EOF
            process.roles=broker,controller
            node.id=${node_id}
            controller.quorum.voters=${voters}
            listeners=PLAINTEXT://${target_ip}:${kafka_port},CONTROLLER://${target_ip}:${controller_port}
            advertised.listeners=PLAINTEXT://${target_ip}:${kafka_port}
            listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
            inter.broker.listener.name=PLAINTEXT
            controller.listener.names=CONTROLLER
            num.network.threads=8
            num.io.threads=8
            socket.send.buffer.bytes=102400
            socket.receive.buffer.bytes=102400
            socket.request.max.bytes=104857600
            log.dirs=${data_dir}
            num.partitions=3
            num.recovery.threads.per.data.dir=1
            offsets.topic.replication.factor=${replication_factor}
            transaction.state.log.replication.factor=${replication_factor}
            transaction.state.log.min.isr=${min_insync_replicas}
            default.replication.factor=${replication_factor}
            min.insync.replicas=${min_insync_replicas}
            log.retention.hours=168
            log.segment.bytes=1073741824
            log.retention.check.interval.ms=300000
            group.initial.rebalance.delay.ms=0
            auto.create.topics.enable=false
            delete.topic.enable=true
            EOF
            cat > /etc/systemd/system/kafka.service <<EOF
            [Unit]
            Description=Apache Kafka ${kafka_version} KRaft Node
            After=network-online.target
            Wants=network-online.target
            [Service]
            Type=simple
            User=root
            Group=root
            Environment=LOG_DIR=${log_dir}
            Environment=KAFKA_HEAP_OPTS=${kafka_heap_opts}
            ExecStart=${install_prefix}/bin/kafka-server-start.sh ${conf_dir}/server.properties
            ExecStop=/bin/kill -TERM \$MAINPID
            Restart=always
            RestartSec=5
            LimitNOFILE=65535
            TimeoutStartSec=180
            [Install]
            WantedBy=multi-user.target
            EOF
            systemctl daemon-reload
            systemctl enable kafka
            info "配置写入 ${conf_dir}/server.properties (node.id=${node_id})"
        job_ip_list:
          value: "${kafka_node_ips}"
        job_rolling_config:
          value:
            job_rolling_execute: []
            job_rolling_expression: ''
            job_rolling_mode: 1
        job_script_list_general:
          value: ''
        job_script_list_public:
          value: ''
        job_script_param:
          value: "'${kafka_node1_ip}' '${kafka_node2_ip}' '${kafka_node3_ip}' '${kafka_version}' '${kafka_install_prefix}' '${kafka_port}' '${kafka_controller_port}' '${kafka_replication_factor}' '${kafka_min_insync_replicas}' '${kafka_heap_opts}'"
        job_script_source:
          value: manual
        job_script_timeout:
          value: '600'
        job_script_type:
          value: '1'
        job_success_id:
          value: ''
    auto_retry:
      enable: false
      times: 1
      interval: 0
    ignore_error: false
    can_retry: true
    can_skip: false
    optional: false
    next:
    - kafka38-kraft_node7
  - id: kafka38-kraft_node7
    type: ServiceActivity
    name: 快速执行脚本
    stage_name: KRaft存储格式化
    component:
      code: job_fast_execute_script
      version: v1.2
      data:
        biz_cc_id:
          name: 业务
          value: ''
          key: "${biz_cc_id}"
          version: v1.2
          source_tag: job_fast_execute_script.biz_cc_id
        job_account:
          value: root
        job_content:
          value: |
            #!/bin/bash
            set -Eeuo pipefail
            umask 077
            node1=$1; node2=$2; node3=$3
            error() { echo "[ERROR][KRaft存储格式化][$target_ip] $*" >&2; exit 1; }
            info() { echo "[INFO][KRaft存储格式化][$target_ip] $*"; }
            local_ips=$(hostname -I 2>/dev/null) || error "无法读取本机IP"
            target_ip=""
            for ip in "$node1" "$node2" "$node3"; do
              [[ " $local_ips " == *" $ip "* ]] && target_ip=$ip && break
            done
            [[ -n "$target_ip" ]] || error "本机IP不在节点列表中: ${node1},${node2},${node3}"
            install_prefix=$4
            cluster_id=$5
            conf_dir="/etc/kafka"
            storage_sh="${install_prefix}/bin/kafka-storage.sh"
            [[ -x "$storage_sh" ]] || error "缺少 kafka-storage.sh"
            [[ -f "${conf_dir}/server.properties" ]] || error "缺少 ${conf_dir}/server.properties"
            data_dir=$(grep -E '^log\.dirs=' "${conf_dir}/server.properties" | cut -d= -f2- | tr -d ' ')
            [[ -n "$data_dir" ]] || error "server.properties 缺少 log.dirs"
            if [[ -f "${data_dir}/meta.properties" ]]; then
              info "存储已格式化，跳过"
              exit 0
            fi
            "$storage_sh" format -t "$cluster_id" -c "${conf_dir}/server.properties" --ignore-formatted
            [[ -f "${data_dir}/meta.properties" ]] || error "格式化后缺少 meta.properties"
            info "KRaft 存储格式化完成"
        job_ip_list:
          value: "${kafka_node_ips}"
        job_rolling_config:
          value:
            job_rolling_execute: []
            job_rolling_expression: ''
            job_rolling_mode: 1
        job_script_list_general:
          value: ''
        job_script_list_public:
          value: ''
        job_script_param:
          value: "'${kafka_node1_ip}' '${kafka_node2_ip}' '${kafka_node3_ip}' '${kafka_install_prefix}' '${kafka_cluster_id}'"
        job_script_source:
          value: manual
        job_script_timeout:
          value: '600'
        job_script_type:
          value: '1'
        job_success_id:
          value: ''
    auto_retry:
      enable: false
      times: 1
      interval: 0
    ignore_error: false
    can_retry: true
    can_skip: false
    optional: false
    next:
    - kafka38-kraft_node8
  - id: kafka38-kraft_node8
    type: ServiceActivity
    name: 快速执行脚本
    stage_name: 启动kafka
    component:
      code: job_fast_execute_script
      version: v1.2
      data:
        biz_cc_id:
          name: 业务
          value: ''
          key: "${biz_cc_id}"
          version: v1.2
          source_tag: job_fast_execute_script.biz_cc_id
        job_account:
          value: root
        job_content:
          value: |
            #!/bin/bash
            set -Eeuo pipefail
            umask 077
            node1=$1; node2=$2; node3=$3
            error() { echo "[ERROR][启动kafka][$target_ip] $*" >&2; exit 1; }
            info() { echo "[INFO][启动kafka][$target_ip] $*"; }
            local_ips=$(hostname -I 2>/dev/null) || error "无法读取本机IP"
            target_ip=""
            for ip in "$node1" "$node2" "$node3"; do
              [[ " $local_ips " == *" $ip "* ]] && target_ip=$ip && break
            done
            [[ -n "$target_ip" ]] || error "本机IP不在节点列表中: ${node1},${node2},${node3}"
            systemctl restart kafka
            sleep 5
            systemctl is-active --quiet kafka || error "kafka.service 未 active"
            info "kafka.service active"
        job_ip_list:
          value: "${kafka_node_ips}"
        job_rolling_config:
          value:
            job_rolling_execute: []
            job_rolling_expression: ''
            job_rolling_mode: 1
        job_script_list_general:
          value: ''
        job_script_list_public:
          value: ''
        job_script_param:
          value: "'${kafka_node1_ip}' '${kafka_node2_ip}' '${kafka_node3_ip}'"
        job_script_source:
          value: manual
        job_script_timeout:
          value: '600'
        job_script_type:
          value: '1'
        job_success_id:
          value: ''
    auto_retry:
      enable: false
      times: 1
      interval: 0
    ignore_error: false
    can_retry: true
    can_skip: false
    optional: false
    next:
    - kafka38-kraft_node9
  - id: kafka38-kraft_node9
    type: ServiceActivity
    name: 快速执行脚本
    stage_name: 等待全部节点就绪
    component:
      code: job_fast_execute_script
      version: v1.2
      data:
        biz_cc_id:
          name: 业务
          value: ''
          key: "${biz_cc_id}"
          version: v1.2
          source_tag: job_fast_execute_script.biz_cc_id
        job_account:
          value: root
        job_content:
          value: |
            #!/bin/bash
            set -Eeuo pipefail
            umask 077
            node1=$1; node2=$2; node3=$3
            install_prefix=$4
            kafka_port=$5
            controller_port=$6
            wait_timeout_sec=$7
            kafka_broker_api="${install_prefix}/bin/kafka-broker-api-versions.sh"
            error() { echo "[ERROR][等待全部节点就绪] $*" >&2; exit 1; }
            info() { echo "[INFO][等待全部节点就绪] $*"; }
            [[ -x "$kafka_broker_api" ]] || error "缺少 $kafka_broker_api"
            wait_port() {
              local host=$1 port=$2
              local deadline=$((SECONDS + wait_timeout_sec))
              while (( SECONDS < deadline )); do
                timeout 3 bash -c "echo >/dev/tcp/${host}/${port}" 2>/dev/null && { info "${host}:${port} 端口可达"; return 0; }
                sleep 2
              done
              error "等待 ${host}:${port} 超时 (${wait_timeout_sec}s)"
            }
            wait_broker_api() {
              local host=$1
              local bootstrap="${host}:${kafka_port}"
              local deadline=$((SECONDS + wait_timeout_sec))
              while (( SECONDS < deadline )); do
                "$kafka_broker_api" --bootstrap-server "$bootstrap" >/dev/null 2>&1 && { info "${bootstrap} Broker API 就绪"; return 0; }
                sleep 3
              done
              error "等待 ${bootstrap} Broker API 超时 (${wait_timeout_sec}s)"
            }
            for node in "$node1" "$node2" "$node3"; do
              wait_port "$node" "$kafka_port"
              wait_port "$node" "$controller_port"
            done
            for node in "$node1" "$node2" "$node3"; do
              wait_broker_api "$node"
            done
            info "全部节点已就绪"
        job_ip_list:
          value: "${kafka_node1_ip}"
        job_rolling_config:
          value:
            job_rolling_execute: []
            job_rolling_expression: ''
            job_rolling_mode: 1
        job_script_list_general:
          value: ''
        job_script_list_public:
          value: ''
        job_script_param:
          value: "'${kafka_node1_ip}' '${kafka_node2_ip}' '${kafka_node3_ip}' '${kafka_install_prefix}' '${kafka_port}' '${kafka_controller_port}' '${kafka_wait_timeout_sec}'"
        job_script_source:
          value: manual
        job_script_timeout:
          value: '1800'
        job_script_type:
          value: '1'
        job_success_id:
          value: ''
    auto_retry:
      enable: false
      times: 1
      interval: 0
    ignore_error: false
    can_retry: true
    can_skip: false
    optional: false
    next:
    - kafka38-kraft_node10
  - id: kafka38-kraft_node10
    type: ServiceActivity
    name: 快速执行脚本
    stage_name: 创建验收Topic
    component:
      code: job_fast_execute_script
      version: v1.2
      data:
        biz_cc_id:
          name: 业务
          value: ''
          key: "${biz_cc_id}"
          version: v1.2
          source_tag: job_fast_execute_script.biz_cc_id
        job_account:
          value: root
        job_content:
          value: |
            #!/bin/bash
            set -Eeuo pipefail
            umask 077
            node1=$1
            install_prefix=$2
            kafka_port=$3
            topic_name=$4
            replication_factor=$5
            partitions=$6
            kafka_topics="${install_prefix}/bin/kafka-topics.sh"
            bootstrap="${node1}:${kafka_port}"
            error() { echo "[ERROR][创建验收Topic] $*" >&2; exit 1; }
            info() { echo "[INFO][创建验收Topic] $*"; }
            if "$kafka_topics" --bootstrap-server "$bootstrap" --list 2>/dev/null | grep -qx "$topic_name"; then
              info "Topic ${topic_name} 已存在，跳过"
              exit 0
            fi
            "$kafka_topics" --bootstrap-server "$bootstrap"   --create --topic "$topic_name"   --partitions "$partitions"   --replication-factor "$replication_factor"   --if-not-exists
            info "Topic ${topic_name} 创建完成"
        job_ip_list:
          value: "${kafka_node1_ip}"
        job_rolling_config:
          value:
            job_rolling_execute: []
            job_rolling_expression: ''
            job_rolling_mode: 1
        job_script_list_general:
          value: ''
        job_script_list_public:
          value: ''
        job_script_param:
          value: "'${kafka_node1_ip}' '${kafka_install_prefix}' '${kafka_port}' '${kafka_verify_topic}' '${kafka_replication_factor}' '${kafka_partitions}'"
        job_script_source:
          value: manual
        job_script_timeout:
          value: '1800'
        job_script_type:
          value: '1'
        job_success_id:
          value: ''
    auto_retry:
      enable: false
      times: 1
      interval: 0
    ignore_error: false
    can_retry: false
    can_skip: false
    optional: false
    next:
