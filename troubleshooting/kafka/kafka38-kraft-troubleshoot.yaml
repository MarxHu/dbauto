  - id: kafka-ts_logs
    type: ServiceActivity
    name: 快速执行脚本
    stage_name: 过滤日志
    component:
      code: job_fast_execute_script
      version: v1.2
      data:
        biz_cc_id:
          name: 业务
          value: ''
          key: "${biz_cc_id}"
          version: v1.2
          source_tag: job_fast_execute_script.biz_cc_id
        job_account:
          value: root
        job_content:
          value: |
            #!/usr/bin/env bash
            # Shared helpers for Kafka troubleshooting collectors. Sourced, not executed.
            # Collectors must not abort the SOPS flow: they always exit 0 and write artifacts.
            
            umask 077
            
            json_escape() {
              local s=${1-}
              s=${s//\\/\\\\}
              s=${s//\"/\\\"}
              s=${s//$'\n'/\\n}
              s=${s//$'\r'/\\r}
              s=${s//$'\t'/\\t}
              printf '%s' "$s"
            }
            
            ts_now() { date -u +"%Y-%m-%dT%H:%M:%SZ"; }
            
            resolve_local_ip() {
              local node1=$1 node2=$2 node3=$3
              local local_ips target_ip=""
              local_ips=$(hostname -I 2>/dev/null || true)
              for ip in "$node1" "$node2" "$node3"; do
                [[ " ${local_ips} " == *" ${ip} "* ]] && target_ip=$ip && break
              done
              if [[ -z "$target_ip" ]]; then
                target_ip=$(hostname -I 2>/dev/null | awk '{print $1}')
              fi
              printf '%s' "${target_ip:-unknown}"
            }
            
            artifact_dir_for() {
              local run_id=$1
              local base=${TS_ARTIFACT_DIR:-/tmp/kafka-troubleshoot}
              printf '%s/%s' "$base" "$run_id"
            }
            
            begin_artifact() {
              local kind=$1 node=$2 run_id=$3
              ARTIFACT_KIND=$kind
              ARTIFACT_NODE=$node
              ARTIFACT_RUN_ID=$run_id
              ARTIFACT_DIR=$(artifact_dir_for "$run_id")
              mkdir -p "$ARTIFACT_DIR"
              ARTIFACT_FILE="${ARTIFACT_DIR}/${kind}.${node}.txt"
              SIGNAL_FILE="${ARTIFACT_DIR}/${kind}.${node}.signals"
              : > "$ARTIFACT_FILE"
              : > "$SIGNAL_FILE"
              {
                echo "===== KAFKA_TS artifact=${kind} node=${node} ts=$(ts_now) run_id=${run_id} ====="
                echo "hostname=$(hostname 2>/dev/null || echo unknown)"
              } >> "$ARTIFACT_FILE"
            }
            
            emit() {
              printf '%s\n' "$*" >> "$ARTIFACT_FILE"
            }
            
            emit_cmd() {
              local title=$1
              shift
              emit "----- ${title} -----"
              if ! "$@" >> "$ARTIFACT_FILE" 2>&1; then
                emit "CMD_FAIL: ${title} rc=$?"
                return 1
              fi
              return 0
            }
            
            emit_cmd_timeout() {
              local seconds=$1 title=$2
              shift 2
              emit "----- ${title} (timeout ${seconds}s) -----"
              if command -v timeout >/dev/null 2>&1; then
                if ! timeout "$seconds" "$@" >> "$ARTIFACT_FILE" 2>&1; then
                  emit "CMD_FAIL_OR_TIMEOUT: ${title}"
                  return 1
                fi
              else
                if ! "$@" >> "$ARTIFACT_FILE" 2>&1; then
                  emit "CMD_FAIL: ${title}"
                  return 1
                fi
              fi
              return 0
            }
            
            signal() {
              # signal <id> <severity> <note>
              printf '%s\t%s\t%s\n' "$1" "$2" "$3" >> "$SIGNAL_FILE"
              emit "SIGNAL ${1} severity=${2} ${3}"
            }
            
            finish_artifact() {
              emit "===== END KAFKA_TS artifact=${ARTIFACT_KIND} node=${ARTIFACT_NODE} ====="
              echo "###KAFKA_TS_ARTIFACT kind=${ARTIFACT_KIND} node=${ARTIFACT_NODE} file=${ARTIFACT_FILE}###"
              cat "$ARTIFACT_FILE"
              echo "###KAFKA_TS_SIGNALS kind=${ARTIFACT_KIND} node=${ARTIFACT_NODE}###"
              cat "$SIGNAL_FILE"
              echo "###END_KAFKA_TS_ARTIFACT###"
            }
            
            kafka_bin() {
              local name=$1
              local prefix=${KAFKA_INSTALL_PREFIX:-/opt/kafka/3.8.1}
              if [[ -x "${prefix}/bin/${name}" ]]; then
                printf '%s' "${prefix}/bin/${name}"
                return 0
              fi
              if command -v "$name" >/dev/null 2>&1; then
                command -v "$name"
                return 0
              fi
              return 1
            }
            # K3 过滤日志：server/controller/state-change/request/cleaner，按关键字与时间窗抽取
            set -uo pipefail
            
            node1=${1:-}
            node2=${2:-}
            node3=${3:-}
            KAFKA_INSTALL_PREFIX=${4:-/opt/kafka/3.8.1}
            _kafka_port=${5:-9092}
            _controller_port=${6:-9093}
            run_id=${7:-manual}
            log_dir=${8:-/var/log/kafka}
            window_lines=${9:-800}
            
            target_ip=$(resolve_local_ip "$node1" "$node2" "$node3")
            begin_artifact logs "$target_ip" "$run_id"
            
            emit "collector=logs"
            emit "log_dir=${log_dir} window_lines=${window_lines}"
            
            if [[ ! -d "$log_dir" ]]; then
              for alt in "${KAFKA_INSTALL_PREFIX}/logs" /opt/kafka/logs /var/log/kafka; do
                [[ -d "$alt" ]] && log_dir=$alt && break
              done
            fi
            emit "resolved_log_dir=${log_dir}"
            
            if [[ ! -d "$log_dir" ]]; then
              signal KF118 medium "kafka log dir missing"
              emit "LOG_DIR_MISSING"
              finish_artifact
              exit 0
            fi
            
            emit "----- log dir listing -----"
            ls -lah "$log_dir" >> "$ARTIFACT_FILE" 2>&1 || true
            
            files=(
              server.log
              controller.log
              state-change.log
              kafka-request.log
              log-cleaner.log
              kafka-authorizer.log
              kafkaServer.out
            )
            
            keyword_map() {
              local line=$1
              case "$line" in
                *OutOfMemoryError*|*"Java heap space"*) echo KF017 high ;;
                *"GC overhead"*|*Humongous*|*"Full GC"*) echo KF018 medium ;;
                *"Too many open files"*) echo KF011 high ;;
                *"No space left"*|*"disk is full"*|*"Insufficient disk"*) echo KF083 high ;;
                *"Permission denied"*|*"Read-only file system"*) echo KF084 high ;;
                *UnderReplicated*|*"shrinking ISR"*) echo KF036 high ;;
                *OfflinePartition*|*"going offline"*) echo KF037 high ;;
                *NotEnoughReplicas*) echo KF053 high ;;
                *NotLeaderOrFollower*|*NotLeaderForPartition*) echo KF038 medium ;;
                *LEADER_NOT_AVAILABLE*|*LeaderNotAvailable*) echo KF038 high ;;
                *UNKNOWN_TOPIC_OR_PARTITION*) echo KF050 medium ;;
                *RECORD_TOO_LARGE*|*RecordTooLargeException*) echo KF055 high ;;
                *Disconnect*|*"Timed out waiting for a node"*) echo KF071 medium ;;
                *UnknownHostException*|*"Name or service not known"*) echo KF013 high ;;
                *"Failed to become"*controller*|*"Resigning"*controller*) echo KF025 medium ;;
                *Corrupt*|*Checksum*|*InvalidRecordException*) echo KF087 high ;;
                *fsync*|*"Flushing"*slow*) echo KF093 medium ;;
                *Rebalance*|*PreparingRebalance*|*"member has left"*) echo KF061 medium ;;
                *OffsetOutOfRange*|*"offset out of range"*) echo KF063 medium ;;
                *SASL*|*"Authentication failed"*) echo KF094 medium ;;
                *Unauthorized*|*"not authorized"*) echo KF095 medium ;;
                *Throttl*) echo KF099 medium ;;
                *"Cluster ID"*|*clusterId*) echo KF028 medium ;;
                *"Duplicate broker registration"*) echo KF029 medium ;;
                *) echo "" ;;
              esac
            }
            
            scan_file() {
              local f=$1
              local path="${log_dir}/${f}"
              if [[ ! -f "$path" ]]; then
                emit "LOG_ABSENT ${f}"
                return 0
              fi
              emit "----- ${f} size=$(wc -c < "$path" | tr -d ' ') mtime=$(date -r "$path" -u +"%Y-%m-%dT%H:%M:%SZ" 2>/dev/null || echo unknown) -----"
              emit "----- ${f} ERROR/WARN/FATAL tail -----"
              grep -E "ERROR|WARN|FATAL|Exception|OutOfMemory|UnderReplicated|Offline|NotEnoughReplicas|Timeout|Disconnect" "$path" \
                | tail -n "$window_lines" >> "$ARTIFACT_FILE" 2>/dev/null || emit "NO_MATCH ${f}"
            
              local hits
              hits=$(grep -E "ERROR|FATAL|OutOfMemory|UnderReplicated|OfflinePartition|NotEnoughReplicas|No space left|Too many open files" "$path" 2>/dev/null | tail -n 80 || true)
              while IFS= read -r line; do
                [[ -z "$line" ]] && continue
                mapped=$(keyword_map "$line")
                if [[ -n "$mapped" ]]; then
                  # shellcheck disable=SC2086
                  signal $mapped "${f}: ${line:0:180}"
                fi
              done <<<"$hits"
            }
            
            for f in "${files[@]}"; do
              scan_file "$f"
            done
            
            # rotated logs
            emit "----- recent rotated logs -----"
            ls -1t "$log_dir" | head -40 >> "$ARTIFACT_FILE" || true
            
            finish_artifact
            exit 0
        job_ip_list:
          value: "${kafka_node_ips}"
        job_rolling_config:
          value:
            job_rolling_execute: []
            job_rolling_expression: ''
            job_rolling_mode: 1
        job_script_list_general:
          value: ''
        job_script_list_public:
          value: ''
        job_script_param:
          value: "'${kafka_node1_ip}' '${kafka_node2_ip}' '${kafka_node3_ip}' '${kafka_install_prefix}' '${kafka_port}' '${kafka_controller_port}' '${ts_run_id}' '${kafka_log_dir}' '${ts_log_window_lines}'"
        job_script_source:
          value: manual
        job_script_timeout:
          value: '600'
        job_script_type:
          value: '1'
        job_success_id:
          value: ''
    auto_retry:
      enable: false
      times: 1
      interval: 0
    ignore_error: true
    can_retry: true
    can_skip: false
    optional: false
    next:
    - kafka-ts_converge
  - id: kafka-ts_host
    type: ServiceActivity
    name: 快速执行脚本
    stage_name: 采集主机资源
    component:
      code: job_fast_execute_script
      version: v1.2
      data:
        biz_cc_id:
          name: 业务
          value: ''
          key: "${biz_cc_id}"
          version: v1.2
          source_tag: job_fast_execute_script.biz_cc_id
        job_account:
          value: root
        job_content:
          value: |
            #!/usr/bin/env bash
            # Shared helpers for Kafka troubleshooting collectors. Sourced, not executed.
            # Collectors must not abort the SOPS flow: they always exit 0 and write artifacts.
            
            umask 077
            
            json_escape() {
              local s=${1-}
              s=${s//\\/\\\\}
              s=${s//\"/\\\"}
              s=${s//$'\n'/\\n}
              s=${s//$'\r'/\\r}
              s=${s//$'\t'/\\t}
              printf '%s' "$s"
            }
            
            ts_now() { date -u +"%Y-%m-%dT%H:%M:%SZ"; }
            
            resolve_local_ip() {
              local node1=$1 node2=$2 node3=$3
              local local_ips target_ip=""
              local_ips=$(hostname -I 2>/dev/null || true)
              for ip in "$node1" "$node2" "$node3"; do
                [[ " ${local_ips} " == *" ${ip} "* ]] && target_ip=$ip && break
              done
              if [[ -z "$target_ip" ]]; then
                target_ip=$(hostname -I 2>/dev/null | awk '{print $1}')
              fi
              printf '%s' "${target_ip:-unknown}"
            }
            
            artifact_dir_for() {
              local run_id=$1
              local base=${TS_ARTIFACT_DIR:-/tmp/kafka-troubleshoot}
              printf '%s/%s' "$base" "$run_id"
            }
            
            begin_artifact() {
              local kind=$1 node=$2 run_id=$3
              ARTIFACT_KIND=$kind
              ARTIFACT_NODE=$node
              ARTIFACT_RUN_ID=$run_id
              ARTIFACT_DIR=$(artifact_dir_for "$run_id")
              mkdir -p "$ARTIFACT_DIR"
              ARTIFACT_FILE="${ARTIFACT_DIR}/${kind}.${node}.txt"
              SIGNAL_FILE="${ARTIFACT_DIR}/${kind}.${node}.signals"
              : > "$ARTIFACT_FILE"
              : > "$SIGNAL_FILE"
              {
                echo "===== KAFKA_TS artifact=${kind} node=${node} ts=$(ts_now) run_id=${run_id} ====="
                echo "hostname=$(hostname 2>/dev/null || echo unknown)"
              } >> "$ARTIFACT_FILE"
            }
            
            emit() {
              printf '%s\n' "$*" >> "$ARTIFACT_FILE"
            }
            
            emit_cmd() {
              local title=$1
              shift
              emit "----- ${title} -----"
              if ! "$@" >> "$ARTIFACT_FILE" 2>&1; then
                emit "CMD_FAIL: ${title} rc=$?"
                return 1
              fi
              return 0
            }
            
            emit_cmd_timeout() {
              local seconds=$1 title=$2
              shift 2
              emit "----- ${title} (timeout ${seconds}s) -----"
              if command -v timeout >/dev/null 2>&1; then
                if ! timeout "$seconds" "$@" >> "$ARTIFACT_FILE" 2>&1; then
                  emit "CMD_FAIL_OR_TIMEOUT: ${title}"
                  return 1
                fi
              else
                if ! "$@" >> "$ARTIFACT_FILE" 2>&1; then
                  emit "CMD_FAIL: ${title}"
                  return 1
                fi
              fi
              return 0
            }
            
            signal() {
              # signal <id> <severity> <note>
              printf '%s\t%s\t%s\n' "$1" "$2" "$3" >> "$SIGNAL_FILE"
              emit "SIGNAL ${1} severity=${2} ${3}"
            }
            
            finish_artifact() {
              emit "===== END KAFKA_TS artifact=${ARTIFACT_KIND} node=${ARTIFACT_NODE} ====="
              echo "###KAFKA_TS_ARTIFACT kind=${ARTIFACT_KIND} node=${ARTIFACT_NODE} file=${ARTIFACT_FILE}###"
              cat "$ARTIFACT_FILE"
              echo "###KAFKA_TS_SIGNALS kind=${ARTIFACT_KIND} node=${ARTIFACT_NODE}###"
              cat "$SIGNAL_FILE"
              echo "###END_KAFKA_TS_ARTIFACT###"
            }
            
            kafka_bin() {
              local name=$1
              local prefix=${KAFKA_INSTALL_PREFIX:-/opt/kafka/3.8.1}
              if [[ -x "${prefix}/bin/${name}" ]]; then
                printf '%s' "${prefix}/bin/${name}"
                return 0
              fi
              if command -v "$name" >/dev/null 2>&1; then
                command -v "$name"
                return 0
              fi
              return 1
            }
            # K4 主机资源：CPU/内存/磁盘/FD/inode/JVM GC/时钟/负载
            set -uo pipefail
            
            node1=${1:-}
            node2=${2:-}
            node3=${3:-}
            KAFKA_INSTALL_PREFIX=${4:-/opt/kafka/3.8.1}
            _kafka_port=${5:-9092}
            _controller_port=${6:-9093}
            run_id=${7:-manual}
            data_dir=${8:-/var/lib/kafka/data}
            
            target_ip=$(resolve_local_ip "$node1" "$node2" "$node3")
            begin_artifact host "$target_ip" "$run_id"
            
            emit "collector=host"
            emit "data_dir=${data_dir}"
            emit "uname=$(uname -a 2>/dev/null || true)"
            emit "nproc=$(nproc 2>/dev/null || echo unknown)"
            
            emit_cmd "uptime" uptime || true
            emit_cmd "free -h" free -h || true
            emit_cmd "vmstat 1 5" vmstat 1 5 || true
            
            if command -v top >/dev/null 2>&1; then
              emit_cmd "top snapshot" top -b -n 1 | head -25 || true
            fi
            
            emit "----- cpu /mem from /proc -----"
            if [[ -r /proc/loadavg ]]; then
              load=$(awk '{print $1}' /proc/loadavg)
              emit "load1=${load}"
              cores=$(nproc 2>/dev/null || echo 1)
              awk -v l="$load" -v c="$cores" 'BEGIN{if (c>0 && l+0 > c*0.85) exit 0; exit 1}' && \
                signal KF002 medium "load1=${load} cores=${cores}" || true
            fi
            
            if [[ -r /proc/meminfo ]]; then
              awk '/MemTotal|MemAvailable|SwapTotal|SwapFree|Cached|Buffers/' /proc/meminfo >> "$ARTIFACT_FILE"
              avail_pct=$(awk '/MemTotal:/{t=$2} /MemAvailable:/{a=$2} END{if(t>0) printf "%d", a*100/t; else print 100}' /proc/meminfo)
              emit "mem_available_pct=${avail_pct}"
              if (( avail_pct <= 15 )); then
                signal KF004 high "memory available ${avail_pct}%"
              fi
              swap_used=$(awk '/SwapTotal:/{t=$2} /SwapFree:/{f=$2} END{print t-f}' /proc/meminfo)
              if (( swap_used > 1024*1024 )); then
                signal KF009 medium "swap used ${swap_used} kB"
              fi
            fi
            
            emit "----- disk -----"
            df -h >> "$ARTIFACT_FILE" 2>&1 || true
            df -i >> "$ARTIFACT_FILE" 2>&1 || true
            if [[ -d "$data_dir" ]]; then
              emit "----- df data_dir ${data_dir} -----"
              df -h "$data_dir" >> "$ARTIFACT_FILE" 2>&1 || true
              used=$(df -P "$data_dir" | awk 'NR==2{gsub("%","",$5); print $5}')
              if [[ "${used:-0}" =~ ^[0-9]+$ ]] && (( used >= 90 )); then
                signal KF083 high "log.dirs ${data_dir} used ${used}%"
              elif [[ "${used:-0}" =~ ^[0-9]+$ ]] && (( used >= 80 )); then
                signal KF083 medium "log.dirs ${data_dir} used ${used}%"
              fi
              inode_used=$(df -iP "$data_dir" 2>/dev/null | awk 'NR==2{gsub("%","",$5); print $5}')
              if [[ "${inode_used:-0}" =~ ^[0-9]+$ ]] && (( inode_used >= 90 )); then
                signal KF012 high "inode used ${inode_used}% on ${data_dir}"
              fi
            else
              emit "DATA_DIR_MISSING ${data_dir}"
            fi
            
            if command -v iostat >/dev/null 2>&1; then
              emit_cmd "iostat -x 1 3" iostat -x 1 3 || true
              if iostat -x 1 3 2>/dev/null | awk 'NF>10 && $1 !~ /Device|Linux/ && $(NF-1)+0 > 90 {exit 0} END{exit 1}'; then
                signal KF085 medium "disk util high from iostat"
              fi
            else
              emit "IOSTAT_MISSING"
              signal KF118 low "iostat missing (degraded host IO view)"
            fi
            
            emit "----- ulimit / fd -----"
            emit "ulimit_n=$(ulimit -n 2>/dev/null || echo unknown)"
            nofile=$(ulimit -n 2>/dev/null || echo 0)
            if [[ "$nofile" =~ ^[0-9]+$ ]] && (( nofile < 65535 )); then
              signal KF014 medium "ulimit -n=${nofile} < 65535"
            fi
            
            pid=$(pgrep -f 'kafka\.Kafka' | head -1 || true)
            if [[ -n "$pid" ]]; then
              emit "KAFKA_PID=${pid}"
              if [[ -d "/proc/${pid}/fd" ]]; then
                fd_count=$(ls "/proc/${pid}/fd" 2>/dev/null | wc -l | tr -d ' ')
                emit "kafka_fd_count=${fd_count}"
                if (( fd_count > 20000 )); then
                  signal KF022 medium "kafka fd count ${fd_count}"
                fi
              fi
              if [[ -r "/proc/${pid}/status" ]]; then
                awk '/VmRSS|VmSize|Threads|FDSize/' "/proc/${pid}/status" >> "$ARTIFACT_FILE"
                threads=$(awk '/Threads:/{print $2}' "/proc/${pid}/status")
                emit "kafka_threads=${threads}"
              fi
              if command -v jstat >/dev/null 2>&1; then
                emit_cmd "jstat -gc ${pid}" jstat -gc "$pid" || true
                emit_cmd "jstat -gccapacity ${pid}" jstat -gccapacity "$pid" || true
              elif command -v jcmd >/dev/null 2>&1; then
                emit_cmd_timeout 10 "jcmd GC.heap_info" jcmd "$pid" GC.heap_info || true
              else
                emit "JSTAT_JCMD_MISSING"
                signal KF119 low "jstat/jcmd missing"
              fi
              if [[ -r /proc/meminfo ]] && grep -q 'OOM' /var/log/messages 2>/dev/null; then
                signal KF005 medium "host messages mention OOM"
              fi
              dmesg -T 2>/dev/null | grep -iE 'oom|killed process' | tail -5 >> "$ARTIFACT_FILE" || true
            else
              signal KF015 high "kafka process absent on host snapshot"
            fi
            
            emit "----- clock -----"
            date -u +"%Y-%m-%dT%H:%M:%SZ" >> "$ARTIFACT_FILE"
            if command -v timedatectl >/dev/null 2>&1; then
              timedatectl >> "$ARTIFACT_FILE" 2>&1 || true
              if timedatectl 2>/dev/null | grep -qi 'NTP service: inactive\|synchronized: no'; then
                signal KF010 medium "time not synchronized"
              fi
            fi
            if command -v ntpq >/dev/null 2>&1; then
              ntpq -p >> "$ARTIFACT_FILE" 2>&1 || true
            fi
            
            emit "----- sysctl highlights -----"
            sysctl vm.max_map_count vm.swappiness fs.file-max net.core.somaxconn 2>/dev/null >> "$ARTIFACT_FILE" || true
            
            finish_artifact
            exit 0
        job_ip_list:
          value: "${kafka_node_ips}"
        job_rolling_config:
          value:
            job_rolling_execute: []
            job_rolling_expression: ''
            job_rolling_mode: 1
        job_script_list_general:
          value: ''
        job_script_list_public:
          value: ''
        job_script_param:
          value: "'${kafka_node1_ip}' '${kafka_node2_ip}' '${kafka_node3_ip}' '${kafka_install_prefix}' '${kafka_port}' '${kafka_controller_port}' '${ts_run_id}' '${kafka_data_dir}'"
        job_script_source:
          value: manual
        job_script_timeout:
          value: '600'
        job_script_type:
          value: '1'
        job_success_id:
          value: ''
    auto_retry:
      enable: false
      times: 1
      interval: 0
    ignore_error: true
    can_retry: true
    can_skip: false
    optional: false
    next:
    - kafka-ts_converge
