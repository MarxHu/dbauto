        job_content:
          value: |
            #!/usr/bin/env bash
            # Shared helpers for Kafka troubleshooting collectors. Sourced, not executed.
            # Collectors must not abort the SOPS flow: they always exit 0 and write artifacts.
            
            umask 077
            
            json_escape() {
              local s=${1-}
              s=${s//\\/\\\\}
              s=${s//\"/\\\"}
              s=${s//$'\n'/\\n}
              s=${s//$'\r'/\\r}
              s=${s//$'\t'/\\t}
              printf '%s' "$s"
            }
            
            ts_now() { date -u +"%Y-%m-%dT%H:%M:%SZ"; }
            
            resolve_local_ip() {
              local node1=$1 node2=$2 node3=$3
              local local_ips target_ip=""
              local_ips=$(hostname -I 2>/dev/null || true)
              for ip in "$node1" "$node2" "$node3"; do
                [[ " ${local_ips} " == *" ${ip} "* ]] && target_ip=$ip && break
              done
              if [[ -z "$target_ip" ]]; then
                target_ip=$(hostname -I 2>/dev/null | awk '{print $1}')
              fi
              printf '%s' "${target_ip:-unknown}"
            }
            
            artifact_dir_for() {
              local run_id=$1
              local base=${TS_ARTIFACT_DIR:-/tmp/kafka-troubleshoot}
              printf '%s/%s' "$base" "$run_id"
            }
            
            begin_artifact() {
              local kind=$1 node=$2 run_id=$3
              ARTIFACT_KIND=$kind
              ARTIFACT_NODE=$node
              ARTIFACT_RUN_ID=$run_id
              ARTIFACT_DIR=$(artifact_dir_for "$run_id")
              mkdir -p "$ARTIFACT_DIR"
              ARTIFACT_FILE="${ARTIFACT_DIR}/${kind}.${node}.txt"
              SIGNAL_FILE="${ARTIFACT_DIR}/${kind}.${node}.signals"
              : > "$ARTIFACT_FILE"
              : > "$SIGNAL_FILE"
              {
                echo "===== KAFKA_TS artifact=${kind} node=${node} ts=$(ts_now) run_id=${run_id} ====="
                echo "hostname=$(hostname 2>/dev/null || echo unknown)"
              } >> "$ARTIFACT_FILE"
            }
            
            emit() {
              printf '%s\n' "$*" >> "$ARTIFACT_FILE"
            }
            
            emit_cmd() {
              local title=$1
              shift
              emit "----- ${title} -----"
              if ! "$@" >> "$ARTIFACT_FILE" 2>&1; then
                emit "CMD_FAIL: ${title} rc=$?"
                return 1
              fi
              return 0
            }
            
            emit_cmd_timeout() {
              local seconds=$1 title=$2
              shift 2
              emit "----- ${title} (timeout ${seconds}s) -----"
              if command -v timeout >/dev/null 2>&1; then
                if ! timeout "$seconds" "$@" >> "$ARTIFACT_FILE" 2>&1; then
                  emit "CMD_FAIL_OR_TIMEOUT: ${title}"
                  return 1
                fi
              else
                if ! "$@" >> "$ARTIFACT_FILE" 2>&1; then
                  emit "CMD_FAIL: ${title}"
                  return 1
                fi
              fi
              return 0
            }
            
            signal() {
              # signal <id> <severity> <note>
              printf '%s\t%s\t%s\n' "$1" "$2" "$3" >> "$SIGNAL_FILE"
              emit "SIGNAL ${1} severity=${2} ${3}"
            }
            
            finish_artifact() {
              emit "===== END KAFKA_TS artifact=${ARTIFACT_KIND} node=${ARTIFACT_NODE} ====="
              echo "###KAFKA_TS_ARTIFACT kind=${ARTIFACT_KIND} node=${ARTIFACT_NODE} file=${ARTIFACT_FILE}###"
              cat "$ARTIFACT_FILE"
              echo "###KAFKA_TS_SIGNALS kind=${ARTIFACT_KIND} node=${ARTIFACT_NODE}###"
              cat "$SIGNAL_FILE"
              echo "###END_KAFKA_TS_ARTIFACT###"
            }
            
            kafka_bin() {
              local name=$1
              local prefix=${KAFKA_INSTALL_PREFIX:-/opt/kafka/3.8.1}
              if [[ -x "${prefix}/bin/${name}" ]]; then
                printf '%s' "${prefix}/bin/${name}"
                return 0
              fi
              if command -v "$name" >/dev/null 2>&1; then
                command -v "$name"
                return 0
              fi
              return 1
            }
            # K5 主机网络：监听、对等连通、丢包/qdisc、连接数、防火墙、advertised 可达性
            set -uo pipefail
            
            node1=${1:-}
            node2=${2:-}
            node3=${3:-}
            KAFKA_INSTALL_PREFIX=${4:-/opt/kafka/3.8.1}
            kafka_port=${5:-9092}
            controller_port=${6:-9093}
            run_id=${7:-manual}
            
            target_ip=$(resolve_local_ip "$node1" "$node2" "$node3")
            begin_artifact network "$target_ip" "$run_id"
            
            emit "collector=network"
            emit "ports broker=${kafka_port} controller=${controller_port}"
            
            emit "----- ip / routes -----"
            ip -4 addr >> "$ARTIFACT_FILE" 2>&1 || ifconfig >> "$ARTIFACT_FILE" 2>&1 || true
            ip route >> "$ARTIFACT_FILE" 2>&1 || true
            
            emit "----- listening sockets -----"
            if command -v ss >/dev/null 2>&1; then
              ss -lntp >> "$ARTIFACT_FILE" 2>&1 || true
              ss -s >> "$ARTIFACT_FILE" 2>&1 || true
              if ! ss -lnt | awk '{print $4}' | grep -q ":${kafka_port}$"; then
                signal KF071 high "broker port ${kafka_port} not listening"
                signal KF015 medium "broker may be down (no ${kafka_port})"
              fi
              if ! ss -lnt | awk '{print $4}' | grep -q ":${controller_port}$"; then
                signal KF072 high "controller port ${controller_port} not listening"
                signal KF025 medium "controller listener down"
              fi
              conn9092=$(ss -tn state established "( dport = :${kafka_port} or sport = :${kafka_port} )" 2>/dev/null | wc -l | tr -d ' ')
              emit "established_9092_lines=${conn9092}"
              tw=$(ss -tn state time-wait 2>/dev/null | wc -l | tr -d ' ')
              emit "time_wait_lines=${tw}"
              if (( tw > 5000 )); then
                signal KF081 medium "time-wait connections ${tw}"
              fi
            else
              netstat -lntp >> "$ARTIFACT_FILE" 2>&1 || true
              signal KF118 low "ss missing"
            fi
            
            tcp_probe() {
              local host=$1 port=$2
              if timeout 3 bash -c "echo >/dev/tcp/${host}/${port}" 2>/dev/null; then
                emit "TCP_OK ${host}:${port}"
                return 0
              fi
              emit "TCP_FAIL ${host}:${port}"
              return 1
            }
            
            emit "----- peer connectivity -----"
            peer_fail=0
            ctrl_fail=0
            for ip in "$node1" "$node2" "$node3"; do
              [[ -z "$ip" ]] && continue
              if ping -c 2 -W 2 "$ip" >> "$ARTIFACT_FILE" 2>&1; then
                emit "PING_OK ${ip}"
              else
                emit "PING_FAIL ${ip}"
                signal KF073 medium "icmp fail to ${ip}"
              fi
              tcp_probe "$ip" "$kafka_port" || { peer_fail=$((peer_fail + 1)); signal KF071 medium "tcp ${ip}:${kafka_port} fail"; }
              tcp_probe "$ip" "$controller_port" || { ctrl_fail=$((ctrl_fail + 1)); signal KF072 medium "tcp ${ip}:${controller_port} fail"; }
            done
            if (( peer_fail >= 2 )); then
              signal KF073 high "multiple broker port connectivity failures"
            fi
            if (( ctrl_fail >= 2 )); then
              signal KF026 high "multiple controller port connectivity failures"
            fi
            
            emit "----- tc qdisc -----"
            if command -v tc >/dev/null 2>&1; then
              for dev in $(ls /sys/class/net 2>/dev/null | grep -v '^lo$' || echo eth0); do
                emit "dev=${dev}"
                tc qdisc show dev "$dev" >> "$ARTIFACT_FILE" 2>&1 || true
                if tc qdisc show dev "$dev" 2>/dev/null | grep -Eq 'netem|tbf|htb'; then
                  signal KF075 medium "tc qdisc netem/tbf/htb active on ${dev}"
                  signal KF076 medium "possible injected delay/loss/rate-limit on ${dev}"
                fi
              done
            else
              emit "TC_MISSING"
            fi
            
            emit "----- iptables / nft / firewall -----"
            if command -v iptables >/dev/null 2>&1; then
              iptables -S | head -80 >> "$ARTIFACT_FILE" 2>&1 || true
              if iptables -S 2>/dev/null | grep -E 'DROP|REJECT' | grep -E "${kafka_port}|${controller_port}|10\\.10\\.26" >/dev/null; then
                signal KF079 medium "iptables DROP/REJECT related to kafka ports or lab net"
              fi
            fi
            if command -v nft >/dev/null 2>&1; then
              nft list ruleset 2>/dev/null | head -60 >> "$ARTIFACT_FILE" || true
            fi
            if command -v firewall-cmd >/dev/null 2>&1; then
              firewall-cmd --list-all >> "$ARTIFACT_FILE" 2>&1 || true
            fi
            
            emit "----- dns / hosts -----"
            cat /etc/resolv.conf >> "$ARTIFACT_FILE" 2>&1 || true
            grep -E 'kafka|10.10.26' /etc/hosts >> "$ARTIFACT_FILE" 2>&1 || true
            for ip in "$node1" "$node2" "$node3"; do
              getent hosts "$ip" >> "$ARTIFACT_FILE" 2>&1 || true
            done
            
            conf=/etc/kafka/server.properties
            if [[ -f "$conf" ]]; then
              advertised=$(awk -F= '$1=="advertised.listeners"{print $2}' "$conf")
              emit "advertised.listeners=${advertised}"
              if [[ -n "$advertised" ]]; then
                echo "$advertised" | tr ',;' '\n' | while IFS= read -r spec; do
                  hostport=${spec##*://}
                  host=${hostport%%:*}
                  port=${hostport##*:}
                  [[ "$host" == "$hostport" ]] && continue
                  tcp_probe "$host" "$port" || signal KF078 high "advertised endpoint unreachable ${host}:${port}"
                done
              fi
            fi
            
            emit "----- conntrack / somaxconn -----"
            sysctl net.core.somaxconn net.ipv4.tcp_tw_reuse net.ipv4.ip_local_port_range 2>/dev/null >> "$ARTIFACT_FILE" || true
            if [[ -r /proc/sys/net/netfilter/nf_conntrack_count ]]; then
              emit "nf_conntrack_count=$(cat /proc/sys/net/netfilter/nf_conntrack_count)"
            fi
            
            finish_artifact
            exit 0
        job_ip_list:
          value: "${kafka_node_ips}"
        job_rolling_config:
          value:
            job_rolling_execute: []
            job_rolling_expression: ''
            job_rolling_mode: 1
        job_script_list_general:
          value: ''
        job_script_list_public:
          value: ''
        job_script_param:
          value: "'${kafka_node1_ip}' '${kafka_node2_ip}' '${kafka_node3_ip}' '${kafka_install_prefix}' '${kafka_port}' '${kafka_controller_port}' '${ts_run_id}'"
        job_script_source:
          value: manual
        job_script_timeout:
          value: '600'
        job_script_type:
          value: '1'
        job_success_id:
          value: ''
    auto_retry:
      enable: false
      times: 1
      interval: 0
    ignore_error: true
    can_retry: true
    can_skip: false
    optional: false
    next:
    - kafka-ts_converge
  - id: kafka-ts_converge
    type: ConvergeGateway
    name: 采集汇聚
    next:
    - kafka-ts_clean
  - id: kafka-ts_clean
    type: ServiceActivity
    name: 快速执行脚本
    stage_name: 数据清洗
    component:
      code: job_fast_execute_script
      version: v1.2
      data:
        biz_cc_id:
          name: 业务
          value: ''
          key: "${biz_cc_id}"
          version: v1.2
          source_tag: job_fast_execute_script.biz_cc_id
        job_account:
          value: root
        job_content:
          value: |
            #!/usr/bin/env bash
            # Shared helpers for Kafka troubleshooting collectors. Sourced, not executed.
            # Collectors must not abort the SOPS flow: they always exit 0 and write artifacts.
            
