---
schema_version: v1
meta:
  name: Kafka KRaft三节点排障（五路采集-清洗-AI）
  id: kafka38-kraft-troubleshoot
  description: >
    参考 Redis 排障 Bot：并行采集监控指标、配置、过滤日志、主机资源、网络，
    汇聚清洗后交给 AI 诊断节点。采集节点 ignore_error，保证故障中仍能进入清洗/AI。
    适用拓扑：KRaft 3.8.1 三节点 broker+controller 合一，RF=3，min.isr=2。
spec:
  nodes:
  - id: kafka-ts_start
    type: EmptyStartEvent
    next:
    - kafka-ts_parallel
  - id: kafka-ts_parallel
    type: ParallelGateway
    name: 五路并行采集
    next:
    - kafka-ts_metrics
    - kafka-ts_config
    - kafka-ts_logs
    - kafka-ts_host
    - kafka-ts_network
  - id: kafka-ts_metrics
    type: ServiceActivity
    name: 快速执行脚本
    stage_name: 采集监控指标
    component:
      code: job_fast_execute_script
      version: v1.2
      data:
        biz_cc_id:
          name: 业务
          value: ''
          key: "${biz_cc_id}"
          version: v1.2
          source_tag: job_fast_execute_script.biz_cc_id
        job_account:
          value: root
        job_content:
          value: |
            #!/usr/bin/env bash
            # Shared helpers for Kafka troubleshooting collectors. Sourced, not executed.
            # Collectors must not abort the SOPS flow: they always exit 0 and write artifacts.
            
            umask 077
            
            json_escape() {
              local s=${1-}
              s=${s//\\/\\\\}
              s=${s//\"/\\\"}
              s=${s//$'\n'/\\n}
              s=${s//$'\r'/\\r}
              s=${s//$'\t'/\\t}
              printf '%s' "$s"
            }
            
            ts_now() { date -u +"%Y-%m-%dT%H:%M:%SZ"; }
            
            resolve_local_ip() {
              local node1=$1 node2=$2 node3=$3
              local local_ips target_ip=""
              local_ips=$(hostname -I 2>/dev/null || true)
              for ip in "$node1" "$node2" "$node3"; do
                [[ " ${local_ips} " == *" ${ip} "* ]] && target_ip=$ip && break
              done
              if [[ -z "$target_ip" ]]; then
                target_ip=$(hostname -I 2>/dev/null | awk '{print $1}')
              fi
              printf '%s' "${target_ip:-unknown}"
            }
            
            artifact_dir_for() {
              local run_id=$1
              local base=${TS_ARTIFACT_DIR:-/tmp/kafka-troubleshoot}
              printf '%s/%s' "$base" "$run_id"
            }
            
            begin_artifact() {
              local kind=$1 node=$2 run_id=$3
              ARTIFACT_KIND=$kind
              ARTIFACT_NODE=$node
              ARTIFACT_RUN_ID=$run_id
              ARTIFACT_DIR=$(artifact_dir_for "$run_id")
              mkdir -p "$ARTIFACT_DIR"
              ARTIFACT_FILE="${ARTIFACT_DIR}/${kind}.${node}.txt"
              SIGNAL_FILE="${ARTIFACT_DIR}/${kind}.${node}.signals"
              : > "$ARTIFACT_FILE"
              : > "$SIGNAL_FILE"
              {
                echo "===== KAFKA_TS artifact=${kind} node=${node} ts=$(ts_now) run_id=${run_id} ====="
                echo "hostname=$(hostname 2>/dev/null || echo unknown)"
              } >> "$ARTIFACT_FILE"
            }
            
            emit() {
              printf '%s\n' "$*" >> "$ARTIFACT_FILE"
            }
            
            emit_cmd() {
              local title=$1
              shift
              emit "----- ${title} -----"
              if ! "$@" >> "$ARTIFACT_FILE" 2>&1; then
                emit "CMD_FAIL: ${title} rc=$?"
                return 1
              fi
              return 0
            }
            
            emit_cmd_timeout() {
              local seconds=$1 title=$2
              shift 2
              emit "----- ${title} (timeout ${seconds}s) -----"
              if command -v timeout >/dev/null 2>&1; then
                if ! timeout "$seconds" "$@" >> "$ARTIFACT_FILE" 2>&1; then
                  emit "CMD_FAIL_OR_TIMEOUT: ${title}"
                  return 1
                fi
              else
                if ! "$@" >> "$ARTIFACT_FILE" 2>&1; then
                  emit "CMD_FAIL: ${title}"
                  return 1
                fi
              fi
              return 0
            }
            
            signal() {
              # signal <id> <severity> <note>
              printf '%s\t%s\t%s\n' "$1" "$2" "$3" >> "$SIGNAL_FILE"
              emit "SIGNAL ${1} severity=${2} ${3}"
            }
            
            finish_artifact() {
              emit "===== END KAFKA_TS artifact=${ARTIFACT_KIND} node=${ARTIFACT_NODE} ====="
              echo "###KAFKA_TS_ARTIFACT kind=${ARTIFACT_KIND} node=${ARTIFACT_NODE} file=${ARTIFACT_FILE}###"
              cat "$ARTIFACT_FILE"
              echo "###KAFKA_TS_SIGNALS kind=${ARTIFACT_KIND} node=${ARTIFACT_NODE}###"
              cat "$SIGNAL_FILE"
              echo "###END_KAFKA_TS_ARTIFACT###"
            }
            
            kafka_bin() {
              local name=$1
              local prefix=${KAFKA_INSTALL_PREFIX:-/opt/kafka/3.8.1}
              if [[ -x "${prefix}/bin/${name}" ]]; then
                printf '%s' "${prefix}/bin/${name}"
                return 0
              fi
              if command -v "$name" >/dev/null 2>&1; then
                command -v "$name"
                return 0
              fi
              return 1
            }
            # K1 集群监控指标：Broker API、Topic/URP/Offline、KRaft quorum、消费组、log.dirs、产消探针
            set -uo pipefail
            
            node1=${1:-}
            node2=${2:-}
            node3=${3:-}
            KAFKA_INSTALL_PREFIX=${4:-/opt/kafka/3.8.1}
            kafka_port=${5:-9092}
            controller_port=${6:-9093}
            run_id=${7:-manual}
            topic_hint=${8:-deploy-verify}
            
            target_ip=$(resolve_local_ip "$node1" "$node2" "$node3")
            begin_artifact metrics "$target_ip" "$run_id"
            
            emit "collector=metrics"
            emit "kafka_port=${kafka_port} controller_port=${controller_port}"
            emit "install_prefix=${KAFKA_INSTALL_PREFIX}"
            
            bootstrap="${node1}:${kafka_port},${node2}:${kafka_port},${node3}:${kafka_port}"
            local_bs="${target_ip}:${kafka_port}"
            emit "bootstrap=${bootstrap}"
            emit "local_bootstrap=${local_bs}"
            
            api_bin=$(kafka_bin kafka-broker-api-versions.sh || true)
            topics_bin=$(kafka_bin kafka-topics.sh || true)
            groups_bin=$(kafka_bin kafka-consumer-groups.sh || true)
            logdirs_bin=$(kafka_bin kafka-log-dirs.sh || true)
            quorum_bin=$(kafka_bin kafka-metadata-quorum.sh || true)
            producer_bin=$(kafka_bin kafka-console-producer.sh || true)
            consumer_bin=$(kafka_bin kafka-console-consumer.sh || true)
            configs_bin=$(kafka_bin kafka-configs.sh || true)
            
            if [[ -z "$api_bin" ]]; then
              signal KF024 high "kafka-broker-api-versions.sh missing"
              emit "ERROR missing Kafka CLI under ${KAFKA_INSTALL_PREFIX}"
              finish_artifact
              exit 0
            fi
            
            local_api_ok=0
            if emit_cmd_timeout 15 "broker-api-versions local" "$api_bin" --bootstrap-server "$local_bs"; then
              local_api_ok=1
            else
              signal KF015 high "local broker API unreachable ${local_bs}"
              signal KF038 medium "Leader/API may be unavailable on ${target_ip}"
            fi
            
            cluster_api_ok=0
            if emit_cmd_timeout 20 "broker-api-versions cluster" "$api_bin" --bootstrap-server "$bootstrap"; then
              cluster_api_ok=1
            else
              signal KF026 high "cluster bootstrap API failed"
            fi
            
            if [[ -n "$quorum_bin" ]]; then
              if emit_cmd_timeout 20 "metadata-quorum status" "$quorum_bin" --bootstrap-server "$bootstrap" describe --status; then
                :
              else
                signal KF025 high "metadata quorum status failed"
              fi
              emit_cmd_timeout 20 "metadata-quorum replication" "$quorum_bin" --bootstrap-server "$bootstrap" describe --replication || \
                signal KF025 medium "metadata quorum replication failed"
            
              if grep -Eqi 'CurrentVoters|Observer|Lag|LeaderId' "$ARTIFACT_FILE"; then
                if grep -Eqi 'Lag:[1-9]|Unknown|ERROR' "$ARTIFACT_FILE"; then
                  signal KF025 medium "quorum lag or voter anomaly in status output"
                fi
              fi
            else
              signal KF119 low "kafka-metadata-quorum.sh missing"
            fi
            
            if [[ -n "$topics_bin" ]]; then
              emit_cmd_timeout 30 "topics list" "$topics_bin" --bootstrap-server "$bootstrap" --list || \
                signal KF015 high "topics --list failed"
            
              emit_cmd_timeout 45 "topics describe all" "$topics_bin" --bootstrap-server "$bootstrap" --describe || \
                signal KF036 medium "topics --describe failed"
            
              urp_out=$(mktemp)
              if timeout 30 "$topics_bin" --bootstrap-server "$bootstrap" --describe --under-replicated-partitions >"$urp_out" 2>&1; then
                emit "----- under-replicated-partitions -----"
                cat "$urp_out" >> "$ARTIFACT_FILE"
                if grep -q "Topic:" "$urp_out"; then
                  signal KF036 high "under-replicated partitions present"
                  signal KF039 medium "ISR shrink likely"
                else
                  emit "URP_NONE"
                fi
              else
                emit "URP_QUERY_FAIL"
                cat "$urp_out" >> "$ARTIFACT_FILE" || true
              fi
              rm -f "$urp_out"
            
              off_out=$(mktemp)
              if timeout 30 "$topics_bin" --bootstrap-server "$bootstrap" --describe --unavailable-partitions >"$off_out" 2>&1; then
                emit "----- unavailable-partitions -----"
                cat "$off_out" >> "$ARTIFACT_FILE"
                if grep -q "Topic:" "$off_out"; then
                  signal KF037 high "unavailable/offline partitions present"
                  signal KF046 high "partitions without leader"
                else
                  emit "OFFLINE_NONE"
                fi
              else
                emit "OFFLINE_QUERY_FAIL"
                cat "$off_out" >> "$ARTIFACT_FILE" || true
              fi
              rm -f "$off_out"
            
              if [[ -n "$topic_hint" ]]; then
                emit_cmd_timeout 20 "topic describe ${topic_hint}" "$topics_bin" --bootstrap-server "$bootstrap" --describe --topic "$topic_hint" || \
                  signal KF050 medium "hint topic ${topic_hint} describe failed"
              fi
            else
              signal KF118 medium "kafka-topics.sh missing"
            fi
            
            if [[ -n "$groups_bin" ]]; then
              if emit_cmd_timeout 40 "consumer-groups list" "$groups_bin" --bootstrap-server "$bootstrap" --list; then
                groups=$(timeout 20 "$groups_bin" --bootstrap-server "$bootstrap" --list 2>/dev/null | head -50 || true)
                if [[ -n "$groups" ]]; then
                  while IFS= read -r g; do
                    [[ -z "$g" ]] && continue
                    emit_cmd_timeout 25 "consumer-group ${g}" "$groups_bin" --bootstrap-server "$bootstrap" --describe --group "$g" || true
                  done <<<"$groups"
                  if grep -Eqi 'LAG|STATE' "$ARTIFACT_FILE"; then
                    if grep -Eqi 'Empty|Dead|PreparingRebalance|CompletingRebalance' "$ARTIFACT_FILE"; then
                      signal KF061 medium "consumer group rebalance or empty/dead state"
                    fi
                    if awk 'tolower($0) ~ /lag/ && $NF ~ /^[0-9]+$/ && $NF+0 > 1000 {found=1} END{exit !found}' "$ARTIFACT_FILE" 2>/dev/null; then
                      signal KF062 medium "consumer lag observed"
                    fi
                  fi
                else
                  emit "CONSUMER_GROUPS_NONE"
                fi
              else
                signal KF064 medium "consumer group coordinator query failed"
              fi
            fi
            
            if [[ -n "$logdirs_bin" ]]; then
              brokers="${node1}:${kafka_port} ${node2}:${kafka_port} ${node3}:${kafka_port}"
              emit_cmd_timeout 40 "log-dirs describe" "$logdirs_bin" --bootstrap-server "$bootstrap" --describe --broker-list "$brokers" || \
                signal KF083 medium "log-dirs describe failed"
            fi
            
            if [[ -n "$configs_bin" ]]; then
              for bid in 1 2 3; do
                emit_cmd_timeout 20 "broker ${bid} configs" "$configs_bin" --bootstrap-server "$bootstrap" \
                  --entity-type brokers --entity-name "$bid" --describe --all || true
              done
            fi
            
            # Produce/consume probe (best-effort, ignore failure)
            probe_topic="ts-probe-${run_id}"
            if [[ -n "$topics_bin" && -n "$producer_bin" && "$cluster_api_ok" -eq 1 ]]; then
              timeout 20 "$topics_bin" --bootstrap-server "$bootstrap" --create --topic "$probe_topic" \
                --partitions 1 --replication-factor 3 --if-not-exists >/dev/null 2>&1 || true
              msg="probe-$(date +%s)"
              if printf '%s\n' "$msg" | timeout 15 "$producer_bin" --bootstrap-server "$bootstrap" --topic "$probe_topic" \
                  --request-timeout-ms 10000 >/dev/null 2>&1; then
                emit "PRODUCE_PROBE_OK topic=${probe_topic}"
              else
                emit "PRODUCE_PROBE_FAIL topic=${probe_topic}"
                signal KF052 high "produce probe failed"
                signal KF053 medium "possible NotEnoughReplicas / ISR issue"
              fi
              if [[ -n "$consumer_bin" ]]; then
                got=$(timeout 20 "$consumer_bin" --bootstrap-server "$bootstrap" --topic "$probe_topic" \
                  --from-beginning --max-messages 1 --timeout-ms 12000 2>/dev/null | tail -n1 || true)
                if [[ -n "$got" ]]; then
                  emit "CONSUME_PROBE_OK got=${got}"
                else
                  emit "CONSUME_PROBE_FAIL"
                  signal KF038 medium "consume probe got no message"
                fi
              fi
            fi
            
            if [[ "$local_api_ok" -eq 0 && "$cluster_api_ok" -eq 0 ]]; then
              signal KF026 high "both local and cluster API down"
            fi
            
            finish_artifact
            exit 0
        job_ip_list:
          value: "${kafka_node_ips}"
        job_rolling_config:
          value:
            job_rolling_execute: []
            job_rolling_expression: ''
            job_rolling_mode: 1
        job_script_list_general:
          value: ''
        job_script_list_public:
          value: ''
        job_script_param:
          value: "'${kafka_node1_ip}' '${kafka_node2_ip}' '${kafka_node3_ip}' '${kafka_install_prefix}' '${kafka_port}' '${kafka_controller_port}' '${ts_run_id}' '${kafka_verify_topic}'"
        job_script_source:
          value: manual
        job_script_timeout:
          value: '600'
        job_script_type:
          value: '1'
        job_success_id:
          value: ''
    auto_retry:
      enable: false
      times: 1
      interval: 0
    ignore_error: true
    can_retry: true
    can_skip: false
    optional: false
    next:
    - kafka-ts_converge
  - id: kafka-ts_config
    type: ServiceActivity
    name: 快速执行脚本
    stage_name: 采集配置信息
    component:
      code: job_fast_execute_script
      version: v1.2
      data:
        biz_cc_id:
          name: 业务
          value: ''
          key: "${biz_cc_id}"
          version: v1.2
          source_tag: job_fast_execute_script.biz_cc_id
        job_account:
          value: root
        job_content:
          value: |
            #!/usr/bin/env bash
            # Shared helpers for Kafka troubleshooting collectors. Sourced, not executed.
            # Collectors must not abort the SOPS flow: they always exit 0 and write artifacts.
            
            umask 077
            
            json_escape() {
              local s=${1-}
              s=${s//\\/\\\\}
              s=${s//\"/\\\"}
              s=${s//$'\n'/\\n}
              s=${s//$'\r'/\\r}
              s=${s//$'\t'/\\t}
              printf '%s' "$s"
            }
            
            ts_now() { date -u +"%Y-%m-%dT%H:%M:%SZ"; }
            
            resolve_local_ip() {
              local node1=$1 node2=$2 node3=$3
              local local_ips target_ip=""
              local_ips=$(hostname -I 2>/dev/null || true)
              for ip in "$node1" "$node2" "$node3"; do
                [[ " ${local_ips} " == *" ${ip} "* ]] && target_ip=$ip && break
              done
              if [[ -z "$target_ip" ]]; then
                target_ip=$(hostname -I 2>/dev/null | awk '{print $1}')
              fi
              printf '%s' "${target_ip:-unknown}"
            }
            
            artifact_dir_for() {
              local run_id=$1
              local base=${TS_ARTIFACT_DIR:-/tmp/kafka-troubleshoot}
              printf '%s/%s' "$base" "$run_id"
            }
            
            begin_artifact() {
              local kind=$1 node=$2 run_id=$3
              ARTIFACT_KIND=$kind
              ARTIFACT_NODE=$node
              ARTIFACT_RUN_ID=$run_id
              ARTIFACT_DIR=$(artifact_dir_for "$run_id")
              mkdir -p "$ARTIFACT_DIR"
              ARTIFACT_FILE="${ARTIFACT_DIR}/${kind}.${node}.txt"
              SIGNAL_FILE="${ARTIFACT_DIR}/${kind}.${node}.signals"
              : > "$ARTIFACT_FILE"
              : > "$SIGNAL_FILE"
              {
                echo "===== KAFKA_TS artifact=${kind} node=${node} ts=$(ts_now) run_id=${run_id} ====="
                echo "hostname=$(hostname 2>/dev/null || echo unknown)"
              } >> "$ARTIFACT_FILE"
            }
            
            emit() {
              printf '%s\n' "$*" >> "$ARTIFACT_FILE"
            }
            
            emit_cmd() {
              local title=$1
              shift
              emit "----- ${title} -----"
              if ! "$@" >> "$ARTIFACT_FILE" 2>&1; then
                emit "CMD_FAIL: ${title} rc=$?"
                return 1
              fi
              return 0
            }
            
            emit_cmd_timeout() {
              local seconds=$1 title=$2
              shift 2
              emit "----- ${title} (timeout ${seconds}s) -----"
              if command -v timeout >/dev/null 2>&1; then
                if ! timeout "$seconds" "$@" >> "$ARTIFACT_FILE" 2>&1; then
                  emit "CMD_FAIL_OR_TIMEOUT: ${title}"
                  return 1
                fi
              else
                if ! "$@" >> "$ARTIFACT_FILE" 2>&1; then
                  emit "CMD_FAIL: ${title}"
                  return 1
                fi
              fi
              return 0
            }
            
            signal() {
              # signal <id> <severity> <note>
              printf '%s\t%s\t%s\n' "$1" "$2" "$3" >> "$SIGNAL_FILE"
              emit "SIGNAL ${1} severity=${2} ${3}"
            }
            
            finish_artifact() {
              emit "===== END KAFKA_TS artifact=${ARTIFACT_KIND} node=${ARTIFACT_NODE} ====="
              echo "###KAFKA_TS_ARTIFACT kind=${ARTIFACT_KIND} node=${ARTIFACT_NODE} file=${ARTIFACT_FILE}###"
              cat "$ARTIFACT_FILE"
              echo "###KAFKA_TS_SIGNALS kind=${ARTIFACT_KIND} node=${ARTIFACT_NODE}###"
              cat "$SIGNAL_FILE"
              echo "###END_KAFKA_TS_ARTIFACT###"
            }
            
            kafka_bin() {
              local name=$1
              local prefix=${KAFKA_INSTALL_PREFIX:-/opt/kafka/3.8.1}
              if [[ -x "${prefix}/bin/${name}" ]]; then
                printf '%s' "${prefix}/bin/${name}"
                return 0
              fi
              if command -v "$name" >/dev/null 2>&1; then
                command -v "$name"
                return 0
              fi
              return 1
            }
            # K2 配置信息：server.properties、systemd、JVM 环境、Topic 配置、角色/监听
            set -uo pipefail
            
            node1=${1:-}
            node2=${2:-}
            node3=${3:-}
            KAFKA_INSTALL_PREFIX=${4:-/opt/kafka/3.8.1}
            kafka_port=${5:-9092}
            controller_port=${6:-9093}
            run_id=${7:-manual}
            conf_file=${8:-/etc/kafka/server.properties}
            
            target_ip=$(resolve_local_ip "$node1" "$node2" "$node3")
            begin_artifact config "$target_ip" "$run_id"
            
            emit "collector=config"
            emit "conf_file=${conf_file}"
            emit "install_prefix=${KAFKA_INSTALL_PREFIX}"
            
            if [[ -f "$conf_file" ]]; then
              emit "----- ${conf_file} -----"
              cat "$conf_file" >> "$ARTIFACT_FILE" 2>&1 || emit "READ_FAIL ${conf_file}"
            else
              signal KF024 high "server.properties missing ${conf_file}"
              emit "CONF_MISSING ${conf_file}"
              # try common locations
              for alt in /opt/kafka/3.8.1/config/server.properties /opt/kafka/config/kraft/server.properties; do
                if [[ -f "$alt" ]]; then
                  emit "----- fallback ${alt} -----"
                  cat "$alt" >> "$ARTIFACT_FILE"
                  conf_file=$alt
                  break
                fi
              done
            fi
            
            if [[ -f "$conf_file" ]]; then
              getp() { awk -F= -v k="$1" '$1==k {print $2; exit}' "$conf_file"; }
              roles=$(getp process.roles)
              node_id=$(getp node.id)
              voters=$(getp controller.quorum.voters)
              listeners=$(getp listeners)
              advertised=$(getp advertised.listeners)
              log_dirs=$(getp log.dirs)
              rf=$(getp default.replication.factor)
              min_isr=$(getp min.insync.replicas)
              auto_create=$(getp auto.create.topics.enable)
              unclean=$(getp unclean.leader.election.enable)
              offsets_rf=$(getp offsets.topic.replication.factor)
            
              emit "PARSED process.roles=${roles}"
              emit "PARSED node.id=${node_id}"
              emit "PARSED controller.quorum.voters=${voters}"
              emit "PARSED listeners=${listeners}"
              emit "PARSED advertised.listeners=${advertised}"
              emit "PARSED log.dirs=${log_dirs}"
              emit "PARSED default.replication.factor=${rf}"
              emit "PARSED min.insync.replicas=${min_isr}"
              emit "PARSED auto.create.topics.enable=${auto_create}"
              emit "PARSED unclean.leader.election.enable=${unclean}"
              emit "PARSED offsets.topic.replication.factor=${offsets_rf}"
            
              if [[ -n "$min_isr" && -n "$rf" ]]; then
                if (( min_isr >= rf )); then
                  signal KF101 high "min.insync.replicas=${min_isr} >= replication.factor=${rf}"
                fi
              fi
              if [[ "$rf" == "1" || "$offsets_rf" == "1" ]]; then
                signal KF102 medium "replication.factor=1 HA degraded"
              fi
              if [[ "$unclean" == "true" ]]; then
                signal KF106 high "unclean.leader.election.enable=true"
                signal KF045 medium "unclean leader election allowed"
              fi
              if [[ "$auto_create" == "false" ]]; then
                emit "NOTE auto.create.topics.enable=false"
              fi
              if [[ -n "$advertised" && "$advertised" != *"$target_ip"* && "$advertised" != *localhost* ]]; then
                signal KF078 medium "advertised.listeners may not contain local ip ${target_ip}: ${advertised}"
              fi
              if [[ -n "$listeners" && "$listeners" != *"${kafka_port}"* ]]; then
                signal KF109 high "listeners missing broker port ${kafka_port}"
              fi
              if [[ -n "$listeners" && "$listeners" != *"${controller_port}"* ]]; then
                signal KF109 high "listeners missing controller port ${controller_port}"
              fi
              if [[ -n "$voters" ]]; then
                for ip in "$node1" "$node2" "$node3"; do
                  if [[ "$voters" != *"$ip"* ]]; then
                    signal KF033 high "voter list missing ${ip}: ${voters}"
                  fi
                done
              fi
            fi
            
            emit "----- systemd kafka.service -----"
            if [[ -f /etc/systemd/system/kafka.service ]]; then
              cat /etc/systemd/system/kafka.service >> "$ARTIFACT_FILE"
            else
              emit "UNIT_MISSING /etc/systemd/system/kafka.service"
            fi
            if command -v systemctl >/dev/null 2>&1; then
              emit_cmd "systemctl is-active kafka" systemctl is-active kafka || signal KF015 medium "kafka.service not active"
              emit_cmd "systemctl show kafka" systemctl show kafka -p ActiveState -p SubState -p Result -p NRestarts -p Environment -p ExecStart -p Restart || true
            fi
            
            emit "----- JVM / env -----"
            env | grep -E '^(KAFKA_|LOG_DIR|JAVA_|JMX_)' | sort >> "$ARTIFACT_FILE" || true
            if command -v java >/dev/null 2>&1; then
              java -version >> "$ARTIFACT_FILE" 2>&1 || true
            else
              signal KF024 high "java missing"
            fi
            
            pid=$(pgrep -f 'kafka\.Kafka' | head -1 || true)
            if [[ -n "$pid" ]]; then
              emit "KAFKA_PID=${pid}"
              tr '\0' ' ' < "/proc/${pid}/cmdline" >> "$ARTIFACT_FILE" 2>/dev/null || true
              emit ""
              if [[ -r "/proc/${pid}/limits" ]]; then
                emit "----- /proc/${pid}/limits -----"
